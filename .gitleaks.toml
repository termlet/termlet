title = "termlet gitleaks 配置"

[extend]
useDefault = true

# 导入私钥的输入框里提示格式的占位文字（“-----BEGIN OPENSSH PRIVATE KEY----- 或 …”，三种语言连着三行），
# 不是私钥；连在一起时会被 private-key 规则当成一把私钥
[[allowlists]]
description = "文案中私钥格式的占位文字"
paths = ['''termlet-desktop[/\\]locales[/\\]keys\.yml$''']

# MCP 的 HTTP 令牌（设置的「AI 与自动化」中生成，见 termlet-core 的 cli::http::token）：本机的是 termlet_mcp_、
# 局域网的是 termlet_mcp_lan_，加 52 个小写 base32 字符。用户误把写着令牌的 AI 工具配置提交进仓库时认出来
[[rules]]
id = "termlet-mcp-token"
description = "Termlet MCP HTTP token (local or LAN)"
regex = '''\btermlet_mcp_(?:lan_)?[a-z2-7]{52}\b'''
keywords = ["termlet_mcp_"]
