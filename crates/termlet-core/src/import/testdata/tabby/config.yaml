version: 7
profiles:
  - type: ssh
    name: 堡垒机
    id: ssh:custom:bastion:11111111-1111-4111-8111-111111111111
    group: 6b7f0c1e-0000-4000-8000-000000000001
    icon: fas fa-server
    options:
      host: bastion.example.com
      port: 2222
      user: jump
      privateKeys:
        - file://C:\Users\me\.ssh\bastion
  - type: ssh
    name: 订单服务
    id: ssh:custom:order:22222222-2222-4222-8222-222222222222
    group: 6b7f0c1e-0000-4000-8000-000000000002
    options:
      host: 10.0.1.10
      jumpHost: ssh:custom:bastion:11111111-1111-4111-8111-111111111111
      privateKeys:
        - file:///C:/Users/me/.ssh/id_ed25519
        - file://C:\Users\me\.ssh\id_rsa
  - type: ssh
    name: 数据库
    id: ssh:custom:db:33333333-3333-4333-8333-333333333333
    group: 6b7f0c1e-0000-4000-8000-000000000001
    options:
      host: db.internal
      port: 22
      auth: publicKey
      privateKeys:
        - vault://ssh-key/id_db
      socksProxyHost: 127.0.0.1
      socksProxyPort: 1080
  - type: ssh
    name: 失效跳板
    id: ssh:custom:broken:44444444-4444-4444-8444-444444444444
    group: 6b7f0c1e-0000-4000-8000-0000000000ff
    options:
      host: 10.0.3.3
      user: u
      jumpHost: ssh:custom:missing:55555555-5555-4555-8555-555555555555
  - type: ssh
    name: 没有地址
    id: ssh:custom:nohost:66666666-6666-4666-8666-666666666666
    options:
      user: root
  - type: local
    name: PowerShell
    id: local:custom:powershell:77777777-7777-4777-8777-777777777777
    options:
      command: powershell.exe
  - type: serial
    name: 串口
    id: serial:custom:com1:88888888-8888-4888-8888-888888888888
    options:
      port: COM1
      baudrate: 115200
  - type: telnet
    name: 交换机
    id: telnet:custom:switch:99999999-9999-4999-8999-999999999999
    options:
      host: 10.0.0.70
      port: 23
  - type: split-layout
    name: 布局
    id: split-layout:custom:layout:aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
    options:
      recoveryToken: {}
groups:
  - id: 6b7f0c1e-0000-4000-8000-000000000001
    name: 生产
    defaults:
      ssh:
        options:
          user: deploy
  - id: 6b7f0c1e-0000-4000-8000-000000000002
    name: Web
    parentGroupId: 6b7f0c1e-0000-4000-8000-000000000001
profileDefaults:
  ssh:
    options:
      user: admin
      port: "2200"
hotkeys:
  new-tab:
    - Ctrl-Shift-T
terminal:
  fontSize: 14
