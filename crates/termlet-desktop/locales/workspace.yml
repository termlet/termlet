_version: 2
workspace.section:
  zh-CN: 工作区
  en: Workspaces
  zh-TW: 工作區
  ja: ワークスペース
  ko: 작업 영역
workspace.open:
  zh-CN: 打开
  en: Open
  zh-TW: 開啟
  ja: 開く
  ko: 열기
workspace.open_hint:
  zh-CN: 双击打开工作区中的全部会话
  en: Double-click to open every session in the workspace
  zh-TW: 按兩下開啟工作區中的全部工作階段
  ja: ダブルクリックでワークスペース内のすべてのセッションを開きます
  ko: 더블클릭하면 작업 영역의 모든 세션을 엽니다
workspace.panes:
  zh-CN: "%{count} 个窗格"
  en: "%{count} panes"
  zh-TW: "%{count} 個窗格"
  ja: "%{count} 個のペイン"
  ko: 창 %{count}개
workspace.rename:
  zh-CN: 重命名…
  en: Rename…
  zh-TW: 重新命名…
  ja: 名前の変更…
  ko: 이름 바꾸기…
workspace.delete:
  zh-CN: 删除
  en: Delete
  zh-TW: 刪除
  ja: 削除
  ko: 삭제
workspace.save_title:
  zh-CN: 保存为工作区
  en: Save as Workspace
  zh-TW: 儲存為工作區
  ja: ワークスペースとして保存
  ko: 작업 영역으로 저장
workspace.rename_title:
  zh-CN: 重命名工作区
  en: Rename Workspace
  zh-TW: 重新命名工作區
  ja: ワークスペースの名前の変更
  ko: 작업 영역 이름 바꾸기
workspace.name_placeholder:
  zh-CN: 工作区的名称
  en: Workspace name
  zh-TW: 工作區的名稱
  ja: ワークスペースの名前
  ko: 작업 영역 이름
workspace.saved:
  zh-CN: 已保存工作区“%{name}”，可在侧边栏的主机列表上方打开
  en: Saved the workspace “%{name}”. Open it from the top of the host list in the sidebar.
  zh-TW: 已儲存工作區「%{name}」，可在側邊欄的主機清單上方開啟
  ja: ワークスペース「%{name}」を保存しました。サイドバーのホスト一覧の上から開けます
  ko: "'%{name}' 작업 영역을 저장했습니다. 사이드바의 호스트 목록 위에서 열 수 있습니다"
workspace.nothing:
  zh-CN: 没有可以保存的终端（快速连接的终端不保存）。
  en: There's no terminal to save. Quick-connect terminals aren't saved.
  zh-TW: 沒有可以儲存的終端機（快速連線的終端機不儲存）。
  ja: 保存できるターミナルがありません（クイック接続のターミナルは保存されません）。
  ko: 저장할 수 있는 터미널이 없습니다(빠른 연결 터미널은 저장되지 않습니다).
workspace.too_large:
  zh-CN: 工作区最多 %{panes} 个窗格、%{depth} 层分屏。
  en: A workspace can have at most %{panes} panes nested %{depth} levels deep.
  zh-TW: 工作區最多 %{panes} 個窗格、%{depth} 層分割畫面。
  ja: ワークスペースのペインは最大 %{panes} 個、分割は最大 %{depth} 階層です。
  ko: 작업 영역은 창을 최대 %{panes}개, 분할을 최대 %{depth}단계까지 가질 수 있습니다.
workspace.too_many:
  zh-CN: 最多保存 %{max} 个工作区，请先删除一些。
  en: You can save at most %{max} workspaces. Delete some first.
  zh-TW: 最多儲存 %{max} 個工作區，請先刪除一些。
  ja: 保存できるワークスペースは最大 %{max} 個です。先にいくつか削除してください。
  ko: 작업 영역은 최대 %{max}개까지 저장할 수 있습니다. 먼저 일부를 삭제하세요.
workspace.hosts_gone:
  zh-CN: 工作区中的主机都已删除。
  en: All hosts in this workspace have been deleted.
  zh-TW: 工作區中的主機都已刪除。
  ja: ワークスペース内のホストはすべて削除されています。
  ko: 작업 영역의 호스트가 모두 삭제되었습니다.
workspace.delete_title:
  zh-CN: 确定删除工作区“%{name}”吗？
  en: Delete the workspace “%{name}”?
  zh-TW: 確定要刪除工作區「%{name}」嗎？
  ja: ワークスペース「%{name}」を削除しますか？
  ko: "'%{name}' 작업 영역을 삭제하시겠습니까?"
workspace.delete_description:
  zh-CN: 不影响其中的主机。
  en: The hosts in it aren't affected.
  zh-TW: 不影響其中的主機。
  ja: 含まれているホストには影響しません。
  ko: 포함된 호스트에는 영향을 주지 않습니다.
panel.menu.save_workspace:
  zh-CN: 保存为工作区…
  en: Save as Workspace…
  zh-TW: 儲存為工作區…
  ja: ワークスペースとして保存…
  ko: 작업 영역으로 저장…
workspace.host_tools:
  zh-CN: 主机工具
  en: Host tools
  zh-TW: 主機工具
  ja: ホストツール
  ko: 호스트 도구
