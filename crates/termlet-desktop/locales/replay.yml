  ko: "녹화 파일에 저장된 터미널 색 구성표를 사용합니다. 끄면 현재 터미널 색 구성표를 사용합니다"
replay.recorded_colors_menu:
  zh-CN: "使用录制时的配色"
  en: "Use Recorded Colors"
  zh-TW: "使用錄製時的配色"
  ja: "録画時の配色を使う"
  ko: "녹화 시 색 구성표 사용"
replay.reveal:
  zh-CN: "在文件夹中显示"
  en: "Show in Folder"
  zh-TW: "在資料夾中顯示"
  ja: "フォルダーに表示"
  ko: "폴더에서 보기"
replay.skipped_lines:
  zh-CN: "有 %{count} 行无法识别，已跳过（录制可能异常结束）"
  en: "%{count} unreadable lines were skipped (the recording may have ended abnormally)"
  zh-TW: "有 %{count} 行無法辨識，已略過（錄製可能異常結束）"
  ja: "読み取れない %{count} 行をスキップしました（録画が異常終了した可能性があります）"
  ko: "읽을 수 없는 %{count}줄을 건너뛰었습니다(녹화가 비정상적으로 끝났을 수 있습니다)"
replay.open_failed:
  zh-CN: "无法打开录制文件 %{name}：%{error}"
  en: "Couldn't open the recording %{name}: %{error}"
  zh-TW: "無法開啟錄製檔 %{name}：%{error}"
  ja: "録画ファイル %{name} を開けませんでした：%{error}"
  ko: "녹화 파일 %{name}을(를) 열지 못했습니다: %{error}"
replay.error.read:
  zh-CN: "读取失败（%{error}）"
  en: "the file couldn't be read (%{error})"
  zh-TW: "讀取失敗（%{error}）"
  ja: "読み込みに失敗しました（%{error}）"
  ko: "읽지 못했습니다(%{error})"
replay.error.not_cast:
  zh-CN: "不是 asciicast 录制文件"
  en: "it isn't an asciicast recording"
  zh-TW: "不是 asciicast 錄製檔"
  ja: "asciicast の録画ファイルではありません"
  ko: "asciicast 녹화 파일이 아닙니다"
replay.error.version:
  zh-CN: "不支持 asciicast 版本 %{version}（支持 v1、v2、v3）"
  en: "asciicast version %{version} is not supported (v1, v2 and v3 are)"
  zh-TW: "不支援 asciicast 版本 %{version}（支援 v1、v2、v3）"
  ja: "asciicast のバージョン %{version} には対応していません（v1、v2、v3 に対応）"
  ko: "asciicast 버전 %{version}은(는) 지원하지 않습니다(v1, v2, v3 지원)"
replay.error.too_large:
  zh-CN: "文件超过 %{size}MB"
  en: "the file is larger than %{size} MB"
  zh-TW: "檔案超過 %{size}MB"
  ja: "ファイルが %{size} MB を超えています"
  ko: "파일이 %{size} MB를 넘습니다"
