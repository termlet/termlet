monitor.tip.disk:
  zh-CN: 最满的磁盘 %{mount}：已用 %{used} / %{total}（%{percent}%）
  en: "Fullest disk %{mount}: %{used} / %{total} used (%{percent}%)"
  zh-TW: 最滿的磁碟 %{mount}：已用 %{used} / %{total}（%{percent}%）
  ja: 最も使用率の高いディスク %{mount}：%{used} / %{total} 使用（%{percent}%）
  ko: "가장 많이 찬 디스크 %{mount}: %{used} / %{total} 사용(%{percent}%)"
monitor.tip.net:
  zh-CN: 下载 %{rx}，上传 %{tx}
  en: Download %{rx}, upload %{tx}
  zh-TW: 下載 %{rx}，上傳 %{tx}
  ja: ダウンロード %{rx}、アップロード %{tx}
  ko: 다운로드 %{rx}, 업로드 %{tx}
monitor.tip.net_note:
  zh-CN: 不含 veth、网桥等虚拟网卡；旁边的小柱是最近 30 秒
  en: Virtual interfaces such as veth and bridges aren't counted; the small bars show the last 30 seconds
  zh-TW: 不含 veth、橋接器等虛擬網路介面；旁邊的小長條是最近 30 秒
  ja: veth やブリッジなどの仮想ネットワークインターフェイスは含みません。横の小さなバーは直近 30 秒です
  ko: veth, 브리지 등 가상 네트워크 인터페이스는 포함하지 않습니다. 옆의 작은 막대는 최근 30초입니다
