  ja: ネットワーク遅延 %{ms} ms、非常に高い
  ko: 네트워크 지연 시간 %{ms} ms, 매우 높음
monitor.latency_unknown:
  zh-CN: 还没有测到网络延迟
  en: Network latency not measured yet
  zh-TW: 尚未測得網路延遲
  ja: ネットワーク遅延はまだ測定されていません
  ko: 네트워크 지연 시간을 아직 측정하지 못했습니다
monitor.single_channel:
  zh-CN: 单通道连接，不显示资源
  en: Single-channel connection; resources aren't shown
  zh-TW: 單一通道連線，不顯示資源
  ja: シングルチャネル接続のため、リソースは表示されません
  ko: 단일 채널 연결이므로 리소스를 표시하지 않습니다
monitor.loading:
