  ja: CPU 使用率 %{value}%、1 コア
  ko: CPU 사용률 %{value}%, 1코어
monitor.tip.cpu_unknown:
  zh-CN: CPU 使用率要等下一次采样，%{cores} 核
  en: CPU usage appears after the next sample, %{cores} cores
  zh-TW: CPU 使用率要等下一次取樣，%{cores} 核心
  ja: CPU 使用率は次回のサンプリング後に表示されます、%{cores} コア
  ko: CPU 사용률은 다음 샘플링 후에 표시됩니다, %{cores}코어
monitor.tip.cpu_unknown_one_core:
