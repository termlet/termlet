  ko: 네트워크 지연 시간 %{ms} ms, 양호
monitor.latency_warning:
  zh-CN: 网络延迟 %{ms} ms，偏高
  en: Network latency %{ms} ms, high
  zh-TW: 網路延遲 %{ms} ms，偏高
  ja: ネットワーク遅延 %{ms} ms、やや高め
  ko: 네트워크 지연 시간 %{ms} ms, 다소 높음
monitor.latency_poor:
  zh-CN: 网络延迟 %{ms} ms，很高
