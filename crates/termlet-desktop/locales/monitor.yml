monitor.tip.cpu_wait:
  zh-CN: 等待 I/O（iowait）%{iowait}%，被虚拟化平台占用（steal）%{steal}%
  en: Waiting for I/O (iowait) %{iowait}%, taken by the hypervisor (steal) %{steal}%
  zh-TW: 等待 I/O（iowait）%{iowait}%，被虛擬化平台佔用（steal）%{steal}%
  ja: I/O 待ち（iowait）%{iowait}%、仮想化基盤による使用（steal）%{steal}%
  ko: I/O 대기(iowait) %{iowait}%, 하이퍼바이저 점유(steal) %{steal}%
monitor.tip.memory:
  zh-CN: 内存已用 %{used} / %{total}（%{percent}%）
  en: Memory used %{used} / %{total} (%{percent}%)
  zh-TW: 記憶體已用 %{used} / %{total}（%{percent}%）
