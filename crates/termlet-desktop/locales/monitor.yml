monitor.tip.cpu:
  zh-CN: CPU 使用率 %{value}%，%{cores} 核
  en: CPU usage %{value}% on %{cores} cores
  zh-TW: CPU 使用率 %{value}%，%{cores} 核心
  ja: CPU 使用率 %{value}%、%{cores} コア
  ko: CPU 사용률 %{value}%, %{cores}코어
