  ja: 送信先のターミナルがありません。
  ko: 보낼 터미널이 없습니다.
snippets.multiline_insert:
  zh-CN: 多行命令不能只写入：终端没有开启括号粘贴，中间的换行会让前几行立即执行。可以改为发送（执行）。
  en: A multi-line command can't be inserted without running because the terminal hasn't turned on bracketed paste, so the line breaks would run the first lines right away. Send it to run instead.
  zh-TW: 多行指令不能只寫入：終端機沒有開啟括號貼上，中間的換行會讓前幾行立即執行。可以改為傳送（執行）。
  ja: 複数行のコマンドは入力のみにできません。ターミナルでブラケットペーストモードが有効になっていないため、途中の改行で最初の数行がすぐに実行されてしまいます。代わりに送信（実行）してください。
  ko: 여러 줄 명령은 입력만 할 수 없습니다. 터미널에서 브래킷 붙여넣기 모드가 켜져 있지 않아 중간의 줄 바꿈 때문에 앞의 몇 줄이 바로 실행됩니다. 대신 보내기(실행)를 사용하세요.
