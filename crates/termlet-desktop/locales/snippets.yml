  zh-CN: 还没有记录。在终端中执行命令后会出现在这里（以空格开头的命令不记录）。
  en: Nothing recorded yet. Commands you run in the terminal appear here; commands that start with a space aren't recorded.
  zh-TW: 還沒有記錄。在終端機中執行指令後會出現在這裡（以空格開頭的指令不會記錄）。
  ja: まだ記録はありません。ターミナルで実行したコマンドがここに表示されます（スペースで始まるコマンドは記録されません）。
  ko: 아직 기록이 없습니다. 터미널에서 실행한 명령이 여기에 표시됩니다(공백으로 시작하는 명령은 기록하지 않습니다).
