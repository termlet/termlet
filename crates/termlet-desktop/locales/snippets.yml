snippets.picker_hint:
  zh-CN: 在终端中按 %{key} 搜索并发送快捷命令与命令历史；命令历史在主机的右键菜单中管理。
  en: Press %{key} in a terminal to search and send snippets and command history. Manage a host's history from its context menu.
  zh-TW: 在終端機中按 %{key} 搜尋並傳送快速指令與指令歷史記錄；指令歷史記錄在主機的右鍵選單中管理。
  ja: ターミナルで %{key} を押すと、スニペットとコマンド履歴を検索して送信できます。コマンド履歴はホストのコンテキストメニューで管理します。
  ko: 터미널에서 %{key}을(를) 누르면 스니펫과 명령 기록을 검색해 보낼 수 있습니다. 명령 기록은 호스트의 컨텍스트 메뉴에서 관리합니다.
