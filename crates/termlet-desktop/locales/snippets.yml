history.not_this_host:
  zh-CN: 当前终端连接的不是这台主机：可以查看、删除或保存为快捷命令；要写入终端，请先切换到这台主机的终端。
  en: The current terminal isn't connected to this host. You can view, delete or save entries as snippets; to insert one, switch to a terminal on this host first.
  zh-TW: 目前的終端機連線的不是這台主機：可以檢視、刪除或儲存為快速指令；要寫入終端機，請先切換到這台主機的終端機。
  ja: 現在のターミナルはこのホストに接続されていません。表示、削除、スニペットとしての保存はできます。ターミナルに入力するには、先にこのホストのターミナルに切り替えてください。
  ko: 현재 터미널은 이 호스트에 연결되어 있지 않습니다. 보기, 삭제, 스니펫으로 저장은 할 수 있습니다. 터미널에 입력하려면 먼저 이 호스트의 터미널로 전환하세요.
