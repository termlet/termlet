snippets.params_hint:
  zh-CN: 可以用 {{名称}} 或 {{名称:默认值}} 作为参数，发送前填写（名称由文字、数字、下划线组成，中间可以有空格、点、连字符；{{.Names}} 这类 Go 模板等其他写法原样发送）。
  en: Use {{name}} or {{name:default}} as parameters to fill in before sending. Names are letters, digits and underscores, optionally joined by spaces, dots or hyphens; other forms such as Go templates like {{.Names}} are sent as they are.
  zh-TW: 可以用 {{名稱}} 或 {{名稱:預設值}} 作為參數，傳送前填寫（名稱由文字、數字、底線組成，中間可以有空格、點、連字號；{{.Names}} 這類 Go 範本等其他寫法會原樣傳送）。
  ja: "{{名前}} または {{名前:デフォルト値}} をパラメーターとして使うと、送信前に入力できます（名前は文字、数字、アンダースコアで構成し、間にスペース、ドット、ハイフンを含められます。{{.Names}} のような Go テンプレートなど、ほかの書き方はそのまま送信されます）。"
  ko: "{{이름}} 또는 {{이름:기본값}}을 매개변수로 쓰면 보내기 전에 입력할 수 있습니다. 이름은 문자, 숫자, 밑줄로 이루어지며 중간에 공백, 점, 하이픈을 넣을 수 있습니다. {{.Names}} 같은 Go 템플릿 등 다른 형식은 그대로 보냅니다."
