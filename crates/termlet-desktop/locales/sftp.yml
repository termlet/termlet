  en: The server has no SFTP and no scp command, so file management can't open. Enable the SFTP subsystem in sshd on the server (Subsystem sftp) or install scp.
  zh-TW: 伺服器沒有開啟 SFTP，也沒有 scp 指令，無法開啟檔案管理。請在伺服器的 sshd 中開啟 SFTP 子系統（Subsystem sftp），或者安裝 scp。
  ja: サーバーで SFTP が有効になっておらず、scp コマンドもないため、ファイル管理を開けません。サーバーの sshd で SFTP サブシステム（Subsystem sftp）を有効にするか、scp をインストールしてください。
  ko: 서버에서 SFTP가 켜져 있지 않고 scp 명령도 없어 파일 관리를 열 수 없습니다. 서버의 sshd에서 SFTP 서브시스템(Subsystem sftp)을 켜거나 scp를 설치하세요.
sftp.error.no_sftp_exec_refused:
  zh-CN: 服务器没有开启 SFTP，也不允许另开通道执行命令（堡垒机或 ForceCommand 的限制），不能改用 SCP。
  en: The server has no SFTP and doesn't allow running commands on another channel (a bastion host or ForceCommand), so SCP can't be used instead.
  zh-TW: 伺服器沒有開啟 SFTP，也不允許另開通道執行指令（堡壘主機或 ForceCommand 的限制），無法改用 SCP。
  ja: サーバーで SFTP が有効になっておらず、別のチャネルでのコマンド実行も許可されていない（要塞ホストまたは ForceCommand による制限）ため、SCP に切り替えられません。
  ko: 서버에서 SFTP가 켜져 있지 않고 다른 채널에서 명령을 실행하는 것도 허용하지 않아(배스천 호스트 또는 ForceCommand의 제한) SCP로 전환할 수 없습니다.
sftp.error.no_sftp_no_shell:
  zh-CN: 服务器没有开启 SFTP，也没有可用的 sh 与 ls，不能改用 SCP。
  en: The server has no SFTP and no usable sh and ls, so SCP can't be used instead.
  zh-TW: 伺服器沒有開啟 SFTP，也沒有可用的 sh 與 ls，無法改用 SCP。
  ja: サーバーで SFTP が有効になっておらず、使える sh と ls もないため、SCP に切り替えられません。
  ko: 서버에서 SFTP가 켜져 있지 않고 사용할 수 있는 sh와 ls도 없어 SCP로 전환할 수 없습니다.
sftp.error.no_sftp_single_channel:
  zh-CN: 服务器没有开启 SFTP。这台主机设置了“只用一个通道”，不能改用 SCP（SCP 模式的每个操作都要另开通道）。
  en: The server has no SFTP. This host is set to use a single channel, so SCP can't be used instead (each SCP operation needs its own channel).
  zh-TW: 伺服器沒有開啟 SFTP。這台主機設定了「只用一個通道」，無法改用 SCP（SCP 模式的每個操作都要另開通道）。
  ja: サーバーで SFTP が有効になっていません。このホストは「チャネルを 1 つだけ使用」に設定されているため、SCP に切り替えられません（SCP モードでは操作ごとに別のチャネルが必要です）。
  ko: 서버에서 SFTP가 켜져 있지 않습니다. 이 호스트는 '채널 하나만 사용'으로 설정되어 있어 SCP로 전환할 수 없습니다(SCP 모드에서는 작업마다 별도의 채널이 필요함).
sftp.error.scp_unsupported:
  zh-CN: SCP 模式（服务器没有开启 SFTP）不支持这个操作。
  en: SCP mode (the server has no SFTP) doesn't support this.
  zh-TW: SCP 模式（伺服器沒有開啟 SFTP）不支援這個操作。
  ja: SCP モード（サーバーで SFTP が有効になっていない場合）ではこの操作はできません。
  ko: SCP 모드(서버에서 SFTP가 꺼져 있음)에서는 이 작업을 지원하지 않습니다.
sftp.scp_badge:
  zh-CN: SCP
  en: SCP
  zh-TW: SCP
  ja: SCP
  ko: SCP
sftp.scp_hint:
  zh-CN: 服务器没有开启 SFTP，改用 SCP：传输中断后只能从头重传，不能修改权限
  en: "The server has no SFTP, so SCP is used: interrupted transfers start over, and permissions can't be changed"
  zh-TW: 伺服器沒有開啟 SFTP，改用 SCP：傳輸中斷後只能從頭重傳，無法變更權限
  ja: サーバーで SFTP が有効になっていないため、SCP を使用しています。転送が中断すると最初からやり直しになり、権限は変更できません
  ko: 서버에서 SFTP가 켜져 있지 않아 SCP를 사용합니다. 전송이 중단되면 처음부터 다시 전송해야 하며 권한은 변경할 수 없습니다
sftp.scp_notice:
  zh-CN: SCP 模式：服务器没有开启 SFTP，浏览用 ls、传输用 scp。传输中断后只能从头重传，不能修改权限。
  en: "SCP mode: the server has no SFTP, so browsing uses ls and transfers use scp. Interrupted transfers start over, and permissions can't be changed."
  zh-TW: SCP 模式：伺服器沒有開啟 SFTP，瀏覽使用 ls、傳輸使用 scp。傳輸中斷後只能從頭重傳，無法變更權限。
  ja: SCP モード：サーバーで SFTP が有効になっていないため、閲覧には ls、転送には scp を使用します。転送が中断すると最初からやり直しになり、権限は変更できません。
  ko: "SCP 모드: 서버에서 SFTP가 켜져 있지 않아 탐색에는 ls, 전송에는 scp를 사용합니다. 전송이 중단되면 처음부터 다시 전송해야 하며 권한은 변경할 수 없습니다."
sftp.permissions_scp:
  zh-CN: 权限…（SCP 模式不支持）
  en: Permissions… (unavailable in SCP mode)
  zh-TW: 權限…（SCP 模式不支援）
  ja: 権限…（SCP モードでは使用不可）
  ko: 권한…(SCP 모드에서는 사용할 수 없음)
sftp.editor.open:
  zh-CN: "在 %{editor} 中打开"
  en: "Open in %{editor}"
  zh-TW: "在 %{editor} 中開啟"
  ja: "%{editor} で開く"
  ko: "%{editor}에서 열기"
sftp.editor.unsupported:
  zh-CN: 这个连接不能在编辑器中打开。
  en: This connection can't be opened in an editor.
  zh-TW: 這個連線無法在編輯器中開啟。
  ja: この接続はエディターで開けません。
  ko: 이 연결은 편집기에서 열 수 없습니다.
sftp.editor.confirm_title:
  zh-CN: "在 %{editor} 中打开远程目录"
  en: "Open remote folder in %{editor}"
  zh-TW: "在 %{editor} 中開啟遠端目錄"
  ja: "%{editor} でリモートディレクトリを開く"
  ko: "%{editor}에서 원격 디렉터리 열기"
sftp.editor.no_alias:
  zh-CN: "~/.ssh/config 中没有这台主机。%{editor} 用它自己的 ssh 连接，将直接连到 %{host}。"
  en: "This host isn't in ~/.ssh/config. %{editor} connects with its own ssh and will connect to %{host} directly."
  zh-TW: "~/.ssh/config 中沒有這台主機。%{editor} 用它自己的 ssh 連線，將直接連到 %{host}。"
  ja: "~/.ssh/config にこのホストがありません。%{editor} は独自の ssh で接続するため、%{host} に直接接続します。"
  ko: "~/.ssh/config에 이 호스트가 없습니다. %{editor}은(는) 자체 ssh로 연결하므로 %{host}에 직접 연결합니다."
sftp.editor.obstacles:
  zh-CN: 直接连接可能不成功：
  en: "Connecting directly may fail:"
  zh-TW: 直接連線可能不會成功：
  ja: 直接接続すると失敗する可能性があります：
  ko: "직접 연결하면 실패할 수 있습니다:"
sftp.editor.obstacle.jump:
  zh-CN: "要经跳板机 %{hosts} 才能连到这台主机。下面的条目用 ProxyJump 经过它，跳板机的登录方式也要能被编辑器的 ssh 使用。"
  en: "This host is reached through the jump host %{hosts}. The entry below goes through it with ProxyJump; the editor's ssh must also be able to log in to the jump host."
  zh-TW: "要經跳板機 %{hosts} 才能連到這台主機。下面的項目用 ProxyJump 經過它，跳板機的登入方式也要能被編輯器的 ssh 使用。"
  ja: "このホストには踏み台ホスト %{hosts} を経由して接続します。下のエントリは ProxyJump で経由します。踏み台ホストにもエディターの ssh でログインできる必要があります。"
  ko: "이 호스트는 점프 호스트 %{hosts}을(를) 거쳐 연결합니다. 아래 항목은 ProxyJump로 이를 거치며, 편집기의 ssh로 점프 호스트에도 로그인할 수 있어야 합니다."
sftp.editor.obstacle.proxy:
  zh-CN: 要经代理连接：OpenSSH 没有对应的设置，编辑器会直接连接服务器，可能连不上。
  en: This host is reached through a proxy. OpenSSH has no matching setting, so the editor connects to the server directly and may fail.
  zh-TW: 要經代理連線：OpenSSH 沒有對應的設定，編輯器會直接連線伺服器，可能連不上。
  ja: プロキシ経由で接続します。OpenSSH には対応する設定がないため、エディターはサーバーに直接接続し、接続できない可能性があります。
  ko: 프록시를 거쳐 연결합니다. OpenSSH에는 해당하는 설정이 없어 편집기가 서버에 직접 연결하므로 연결하지 못할 수 있습니다.
sftp.editor.obstacle.proxy_command:
  zh-CN: 要经代理命令连接：命令中可能有令牌，Termlet 不把它写入配置，需要时请自己在条目中加上 ProxyCommand。
  en: This host is reached through a proxy command. The command may contain tokens, so Termlet doesn't write it to the config; add ProxyCommand to the entry yourself if needed.
  zh-TW: 要經代理命令連線：命令中可能有權杖，Termlet 不把它寫入設定，需要時請自己在項目中加上 ProxyCommand。
  ja: プロキシコマンド経由で接続します。コマンドにトークンが含まれている可能性があるため、Termlet は設定に書き込みません。必要に応じてエントリに ProxyCommand を追加してください。
  ko: 프록시 명령을 거쳐 연결합니다. 명령에 토큰이 포함되어 있을 수 있어 Termlet은 설정에 쓰지 않습니다. 필요하면 항목에 ProxyCommand를 직접 추가하세요.
sftp.editor.obstacle.stored_key:
  zh-CN: 私钥保存在 Termlet 中，编辑器的 ssh 用不了它：可以把私钥加入 ssh-agent，或者导出为文件后在条目中加上 IdentityFile。
  en: The private key is stored in Termlet, which the editor's ssh can't use. Add the key to ssh-agent, or export it to a file and add IdentityFile to the entry.
  zh-TW: 私密金鑰儲存在 Termlet 中，編輯器的 ssh 無法使用：可以把私密金鑰加入 ssh-agent，或者匯出為檔案後在項目中加上 IdentityFile。
  ja: 秘密鍵は Termlet に保存されているため、エディターの ssh では使えません。秘密鍵を ssh-agent に追加するか、ファイルにエクスポートしてエントリに IdentityFile を追加してください。
  ko: 개인 키가 Termlet에 저장되어 있어 편집기의 ssh에서 사용할 수 없습니다. 개인 키를 ssh-agent에 추가하거나 파일로 내보낸 뒤 항목에 IdentityFile을 추가하세요.
sftp.editor.obstacle.key_file:
  zh-CN: "登录用的私钥文件 %{path} 不在 ssh 默认查找的位置，直接连接时不会用它。下面的条目中带有 IdentityFile。"
  en: "The private key file %{path} isn't where ssh looks by default, so a direct connection won't use it. The entry below includes IdentityFile."
  zh-TW: "登入用的私密金鑰檔案 %{path} 不在 ssh 預設尋找的位置，直接連線時不會使用。下面的項目中帶有 IdentityFile。"
  ja: "ログインに使う秘密鍵ファイル %{path} は ssh がデフォルトで探す場所にないため、直接接続では使われません。下のエントリには IdentityFile が含まれます。"
  ko: "로그인에 쓰는 개인 키 파일 %{path}은(는) ssh가 기본으로 찾는 위치에 없어 직접 연결할 때 사용되지 않습니다. 아래 항목에는 IdentityFile이 포함됩니다."
sftp.editor.obstacle.port:
  zh-CN: "端口是 %{port}：%{editor} 的文档只说明了在 ~/.ssh/config 中设置端口，直接连接时可能连到 22 端口。"
  en: "The port is %{port}. %{editor}'s documentation only covers setting the port in ~/.ssh/config, so a direct connection may use port 22."
  zh-TW: "連接埠是 %{port}：%{editor} 的文件只說明了在 ~/.ssh/config 中設定連接埠，直接連線時可能連到 22 連接埠。"
  ja: "ポートは %{port} です。%{editor} のドキュメントには ~/.ssh/config でポートを設定する方法しか記載されていないため、直接接続するとポート 22 に接続する可能性があります。"
  ko: "포트가 %{port}입니다. %{editor} 문서에는 ~/.ssh/config에서 포트를 설정하는 방법만 나와 있어 직접 연결하면 22번 포트로 연결될 수 있습니다."
sftp.editor.entry:
  zh-CN: "可以把下面的条目追加到 %{path}，之后编辑器按其中的设置连接："
  en: "You can append the entry below to %{path}; the editor then connects with its settings:"
  zh-TW: "可以把下面的項目附加到 %{path}，之後編輯器依其中的設定連線："
  ja: "次のエントリを %{path} に追加できます。以後、エディターはその設定で接続します："
  ko: "아래 항목을 %{path}에 추가할 수 있으며, 이후 편집기는 그 설정으로 연결합니다:"
sftp.editor.entry_hint:
  zh-CN: 只追加到文件末尾，写之前备份原文件；不写入密码与保存在 Termlet 中的私钥。
  en: It's only appended to the end of the file, after the original file is backed up. Passwords and private keys stored in Termlet aren't written.
  zh-TW: 只附加到檔案結尾，寫入前備份原檔案；不寫入密碼與儲存在 Termlet 中的私密金鑰。
  ja: ファイルの末尾に追加するだけで、書き込む前に元のファイルをバックアップします。パスワードと Termlet に保存された秘密鍵は書き込みません。
  ko: 파일 끝에만 추가하며, 쓰기 전에 원래 파일을 백업합니다. 비밀번호와 Termlet에 저장된 개인 키는 쓰지 않습니다.
sftp.editor.open_direct:
  zh-CN: 直接打开
  en: Open directly
  zh-TW: 直接開啟
  ja: 直接開く
  ko: 직접 열기
sftp.editor.write_and_open:
  zh-CN: 写入配置并打开
  en: Add to config and open
  zh-TW: 寫入設定並開啟
  ja: 設定に追加して開く
  ko: 설정에 추가하고 열기
sftp.editor.written:
  zh-CN: "已把 %{alias} 追加到 %{path}，原文件备份为 %{backup}。"
  en: "Added %{alias} to %{path}. The original file was backed up as %{backup}."
  zh-TW: "已把 %{alias} 附加到 %{path}，原檔案備份為 %{backup}。"
  ja: "%{alias} を %{path} に追加しました。元のファイルは %{backup} としてバックアップしました。"
  ko: "%{alias}을(를) %{path}에 추가했습니다. 원래 파일은 %{backup}(으)로 백업했습니다."
sftp.editor.created:
  zh-CN: "已新建 %{path} 并写入 %{alias}。"
  en: "Created %{path} with %{alias}."
  zh-TW: "已新增 %{path} 並寫入 %{alias}。"
  ja: "%{path} を作成し、%{alias} を書き込みました。"
  ko: "%{path}을(를) 만들고 %{alias}을(를) 썼습니다."
sftp.editor.write_failed:
  zh-CN: "写入 %{path} 失败：%{error}"
  en: "Couldn't write %{path}: %{error}"
  zh-TW: "寫入 %{path} 失敗：%{error}"
  ja: "%{path} に書き込めませんでした：%{error}"
  ko: "%{path}에 쓰지 못했습니다: %{error}"
