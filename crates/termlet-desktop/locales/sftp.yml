  zh-CN: 这一栏太窄，暂时没有显示：%{columns}
  en: "Too narrow to show: %{columns}"
  zh-TW: 這一欄太窄，暫時沒有顯示：%{columns}
  ja: 列の幅が足りないため、一時的に非表示：%{columns}
  ko: "열이 너무 좁아 잠시 표시하지 않음: %{columns}"
