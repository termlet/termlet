  ko: 8진수
sftp.perm.recursive:
  zh-CN: 同时修改其中的文件与子目录
  en: Also change the files and subfolders inside
  zh-TW: 同時變更其中的檔案與子目錄
  ja: 中のファイルとサブフォルダーも変更
  ko: 안에 있는 파일과 하위 폴더도 변경
sftp.perm.recursive_hint:
  zh-CN: 目录在有读权限的位置加上执行权限，否则无法进入
  en: Folders also get execute wherever they have read, so they can still be opened
  zh-TW: 目錄在有讀取權限的位置加上執行權限，否則無法進入
  ja: フォルダーには、読み取り権限のある箇所に実行権限も付けます（付けないと開けません）
  ko: 폴더는 읽기 권한이 있는 곳에 실행 권한도 추가합니다(없으면 열 수 없음)
sftp.perm.mixed_hint:
  zh-CN: 横线表示所选项各不相同：不改动时各项保持原来的设置
  en: A dash means the selected items differ. Leave it as is to keep each item's own setting.
  zh-TW: 橫線表示所選項目各不相同：不改動時各項目保持原來的設定
  ja: 横線は選択した項目ごとに設定が異なることを示します。変更しなければ、各項目は元の設定のままです
  ko: 가로선은 선택한 항목마다 설정이 다르다는 뜻입니다. 변경하지 않으면 각 항목은 원래 설정을 유지합니다
sftp.perm.mixed_recursive:
  zh-CN: 同时修改其中的文件与子目录时，它们会统一设为这里的权限：请先把显示为横线的权限勾选或取消
  en: Everything inside will get exactly these permissions. Check or clear the dashed ones first.
  zh-TW: 同時變更其中的檔案與子目錄時，它們會統一設為這裡的權限：請先把顯示為橫線的權限勾選或取消勾選
  ja: 中のファイルとサブフォルダーも変更する場合、すべてここでの権限に統一されます。先に横線で表示されている権限をオンまたはオフにしてください
  ko: 안에 있는 파일과 하위 폴더도 변경하면 모두 여기의 권한으로 통일됩니다. 먼저 가로선으로 표시된 권한을 선택하거나 선택 해제하세요
sftp.perm.mixed_link:
  zh-CN: 所选项中有符号链接（修改的是它指向的文件，原来的权限无从得知）：请先把显示为横线的权限勾选或取消
  en: The selection includes symbolic links (their targets are changed and their current permissions are unknown). Check or clear the dashed ones first.
  zh-TW: 所選項目中有符號連結（變更的是它指向的檔案，原來的權限無從得知）：請先把顯示為橫線的權限勾選或取消勾選
  ja: 選択した項目にシンボリックリンクが含まれています（変更されるのはリンク先のファイルで、元の権限はわかりません）。先に横線で表示されている権限をオンまたはオフにしてください
  ko: 선택한 항목에 심볼릭 링크가 있습니다(링크가 가리키는 파일이 변경되며 원래 권한은 알 수 없음). 먼저 가로선으로 표시된 권한을 선택하거나 선택 해제하세요
sftp.perm.partial:
  zh-CN: 已修改 %{done} 项（共 %{total} 项）的权限，之后出错：%{error}。列表已刷新为现在的权限
  en: "Changed %{done} of %{total} items, then failed: %{error}. The list now shows the current permissions."
  zh-TW: 已變更 %{done} 項（共 %{total} 項）的權限，之後出錯：%{error}。清單已更新為目前的權限
  ja: "%{total} 項目のうち %{done} 項目の権限を変更した後、エラーが発生しました：%{error}。一覧を現在の権限で更新しました"
  ko: "%{total}개 항목 중 %{done}개의 권한을 변경한 뒤 오류가 발생했습니다: %{error}. 목록을 현재 권한으로 새로 고쳤습니다"
sftp.error.not_found:
  zh-CN: 服务器上不存在 %{path}
  en: "%{path} doesn't exist on the server"
  zh-TW: 伺服器上不存在 %{path}
  ja: サーバー上に %{path} は存在しません
  ko: 서버에 %{path}이(가) 없습니다
sftp.error.local_not_found:
  zh-CN: 本机不存在 %{path}
  en: "%{path} doesn't exist on this computer"
  zh-TW: 本機不存在 %{path}
  ja: このコンピューターに %{path} は存在しません
  ko: 이 컴퓨터에 %{path}이(가) 없습니다
sftp.error.permission:
  zh-CN: 没有权限访问服务器上的 %{path}
  en: "No permission to access %{path} on the server"
  zh-TW: 沒有權限存取伺服器上的 %{path}
  ja: サーバー上の %{path} にアクセスする権限がありません
  ko: 서버의 %{path}에 접근할 권한이 없습니다
sftp.error.local_permission:
  zh-CN: 没有权限访问本机的 %{path}
  en: "No permission to access %{path} on this computer"
  zh-TW: 沒有權限存取本機的 %{path}
  ja: このコンピューターの %{path} にアクセスする権限がありません
  ko: 이 컴퓨터의 %{path}에 접근할 권한이 없습니다
sftp.error.exists:
  zh-CN: 服务器上已有同名的文件或目录：%{path}
  en: "A file or folder with that name already exists on the server: %{path}"
  zh-TW: 伺服器上已有同名的檔案或目錄：%{path}
  ja: サーバー上に同じ名前のファイルまたはディレクトリがあります：%{path}
  ko: "서버에 같은 이름의 파일이나 디렉터리가 이미 있습니다: %{path}"
sftp.error.local_exists:
  zh-CN: 本机已有同名的文件或文件夹：%{path}
  en: "A file or folder with that name already exists on this computer: %{path}"
  zh-TW: 本機已有同名的檔案或資料夾：%{path}
  ja: このコンピューターに同じ名前のファイルまたはフォルダーがあります：%{path}
  ko: "이 컴퓨터에 같은 이름의 파일이나 폴더가 이미 있습니다: %{path}"
sftp.error.no_space:
  zh-CN: 服务器上的空间不足（%{path}）
  en: "The server is out of space (%{path})"
  zh-TW: 伺服器上的空間不足（%{path}）
  ja: サーバーの空き容量が不足しています（%{path}）
  ko: 서버의 공간이 부족합니다(%{path})
sftp.error.local_no_space:
  zh-CN: 本机的磁盘空间不足（%{path}）
  en: "This computer is out of disk space (%{path})"
  zh-TW: 本機的磁碟空間不足（%{path}）
  ja: このコンピューターのディスクの空き容量が不足しています（%{path}）
  ko: 이 컴퓨터의 디스크 공간이 부족합니다(%{path})
sftp.error.busy:
  zh-CN: "%{path} 正被其他程序使用"
  en: "%{path} is in use by another program"
  zh-TW: "%{path} 正被其他程式使用"
  ja: "%{path} は他のプログラムで使用中です"
  ko: "%{path}을(를) 다른 프로그램에서 사용 중입니다"
sftp.error.disconnected:
  zh-CN: SFTP 连接已断开
  en: The SFTP connection was lost
  zh-TW: SFTP 連線已中斷
  ja: SFTP 接続が切断されました
  ko: SFTP 연결이 끊어졌습니다
sftp.error.unavailable:
  zh-CN: 服务器上无法使用 SFTP：%{reason}
  en: "SFTP isn't available on the server: %{reason}"
  zh-TW: 伺服器上無法使用 SFTP：%{reason}
  ja: サーバーで SFTP を使用できません：%{reason}
  ko: "서버에서 SFTP를 사용할 수 없습니다: %{reason}"
sftp.error.single_channel:
  zh-CN: 这台主机只用一个通道（堡垒机），不能与终端共用连接打开文件管理
  en: This host uses a single channel (bastion), so file management can't share the terminal's connection
  zh-TW: 這台主機只用一個通道（堡壘主機），無法與終端機共用連線來開啟檔案管理
  ja: このホストはチャネルを 1 つだけ使用する（要塞ホスト）ため、ターミナルと接続を共有してファイル管理を開くことはできません
  ko: 이 호스트는 채널 하나만 사용하므로(배스천 호스트) 터미널과 연결을 공유해 파일 관리를 열 수 없습니다
sftp.error.too_large:
  zh-CN: 文件超过 5 MB，不能在线编辑
  en: The file is larger than 5 MB and can't be edited online
  zh-TW: 檔案超過 5 MB，無法線上編輯
  ja: ファイルが 5 MB を超えているため、オンラインで編集できません
  ko: 파일이 5 MB를 넘어 온라인으로 편집할 수 없습니다
sftp.error.not_text:
  zh-CN: 不是 UTF-8 文本文件，不能在线编辑
  en: This isn't a UTF-8 text file and can't be edited online
  zh-TW: 不是 UTF-8 文字檔，無法線上編輯
  ja: UTF-8 のテキストファイルではないため、オンラインで編集できません
  ko: UTF-8 텍스트 파일이 아니어서 온라인으로 편집할 수 없습니다
sftp.error.changed:
  zh-CN: 远程文件在打开后已被修改
  en: The remote file was changed after it was opened
  zh-TW: 遠端檔案在開啟後已被修改
  ja: リモートのファイルは開いた後に変更されました
  ko: 원격 파일이 연 뒤에 수정되었습니다
sftp.error.deleted:
  zh-CN: 远程文件在打开后已被删除
  en: The remote file was deleted after it was opened
  zh-TW: 遠端檔案在開啟後已被刪除
  ja: リモートのファイルは開いた後に削除されました
  ko: 원격 파일이 연 뒤에 삭제되었습니다
sftp.error.replace_failed:
  zh-CN: 替换 %{path} 失败，原文件已改名为 %{backup}，没能改回
  en: "Replacing %{path} failed. The original was renamed to %{backup} and couldn't be restored."
  zh-TW: 取代 %{path} 失敗，原檔案已重新命名為 %{backup}，未能改回
  ja: "%{path} を置き換えられませんでした。元のファイルは %{backup} に名前が変更され、元に戻せませんでした"
  ko: "%{path}을(를) 바꾸지 못했습니다. 원래 파일의 이름이 %{backup}(으)로 바뀌었으며 되돌리지 못했습니다"
sftp.error.replace_failed_kept:
  zh-CN: 替换 %{path} 失败，原文件已改名为 %{backup}，没能改回；新内容保存在 %{kept}
  en: "Replacing %{path} failed. The original was renamed to %{backup} and couldn't be restored; the new content is in %{kept}."
  zh-TW: 取代 %{path} 失敗，原檔案已重新命名為 %{backup}，未能改回；新內容儲存在 %{kept}
  ja: "%{path} を置き換えられませんでした。元のファイルは %{backup} に名前が変更され、元に戻せませんでした。新しい内容は %{kept} に保存されています"
  ko: "%{path}을(를) 바꾸지 못했습니다. 원래 파일의 이름이 %{backup}(으)로 바뀌었으며 되돌리지 못했습니다. 새 내용은 %{kept}에 저장되어 있습니다"
sftp.error.failed:
  zh-CN: 服务器上的 %{path}：%{message}
  en: "%{path} on the server: %{message}"
  zh-TW: 伺服器上的 %{path}：%{message}
  ja: サーバー上の %{path}：%{message}
  ko: "서버의 %{path}: %{message}"
sftp.error.local_failed:
  zh-CN: 本机的 %{path}：%{message}
  en: "%{path} on this computer: %{message}"
  zh-TW: 本機的 %{path}：%{message}
  ja: このコンピューターの %{path}：%{message}
  ko: "이 컴퓨터의 %{path}: %{message}"
sftp.error.canceled:
  zh-CN: 已取消
  en: Canceled
  zh-TW: 已取消
  ja: キャンセルしました
  ko: 취소됨
sftp.error.session_closed:
  zh-CN: SFTP 会话已关闭
  en: The SFTP session is closed
  zh-TW: SFTP 工作階段已關閉
  ja: SFTP セッションは閉じられています
  ko: SFTP 세션이 닫혔습니다
sftp.error.transfer_not_found:
  zh-CN: 这个传输任务已不存在
  en: This transfer no longer exists
  zh-TW: 這個傳輸工作已不存在
  ja: この転送はもう存在しません
  ko: 이 전송 작업은 더 이상 없습니다
sftp.error.remove_root:
  zh-CN: 不能删除根目录或初始目录
  en: The root folder and the home folder can't be deleted
  zh-TW: 無法刪除根目錄或初始目錄
  ja: ルートディレクトリや初期ディレクトリは削除できません
  ko: 루트 디렉터리나 초기 디렉터리는 삭제할 수 없습니다
sftp.error.invalid_mode:
  zh-CN: 权限必须在 0–7777 之间
  en: Permissions must be between 0 and 7777
  zh-TW: 權限必須在 0–7777 之間
  ja: 権限は 0～7777 の範囲で指定してください
  ko: 권한은 0~7777 사이여야 합니다
sftp.error.no_paths:
  zh-CN: 没有选择文件
  en: No files selected
  zh-TW: 沒有選取檔案
  ja: ファイルが選択されていません
  ko: 선택한 파일이 없습니다
sftp.error.invalid_path:
  zh-CN: 路径无效
  en: Invalid path
  zh-TW: 路徑無效
  ja: パスが無効です
  ko: 경로가 잘못되었습니다
sftp.error.invalid_name:
  zh-CN: 名称无效
  en: Invalid name
  zh-TW: 名稱無效
  ja: 名前が無効です
  ko: 이름이 잘못되었습니다
sftp.error.not_regular_file:
  zh-CN: 不是普通文件
  en: Not a regular file
  zh-TW: 不是一般檔案
  ja: 通常のファイルではありません
  ko: 일반 파일이 아닙니다
sftp.error.not_directory:
  zh-CN: 不是目录
  en: Not a folder
  zh-TW: 不是目錄
  ja: ディレクトリではありません
  ko: 디렉터리가 아닙니다
sftp.error.not_resumable:
  zh-CN: 只能继续失败的传输
  en: Only failed transfers can be resumed
  zh-TW: 只能繼續失敗的傳輸
  ja: 再開できるのは失敗した転送だけです
  ko: 실패한 전송만 이어서 할 수 있습니다
sftp.error.other_host:
  zh-CN: 只能在同一台主机的会话上继续
  en: A transfer can only be resumed on a session to the same host
  zh-TW: 只能在同一台主機的工作階段上繼續
  ja: 再開できるのは同じホストのセッション上だけです
  ko: 같은 호스트의 세션에서만 이어서 할 수 있습니다
sftp.error.no_unique_name:
  zh-CN: 找不到不重名的名称
  en: Couldn't find a name that isn't taken
  zh-TW: 找不到不重複的名稱
  ja: 重複しない名前が見つかりませんでした
  ko: 중복되지 않는 이름을 찾지 못했습니다
sftp.error.unencodable:
  zh-CN: 内容中有所选编码不能表示的字符
  en: The content has characters the chosen encoding can't represent
  zh-TW: 內容中有所選編碼無法表示的字元
  ja: 選択したエンコードで表せない文字が内容に含まれています
  ko: 선택한 인코딩으로 표현할 수 없는 문자가 내용에 있습니다
sftp.error.unencodable_name:
  zh-CN: 名称中有服务器的文件名编码（主机设置）不能表示的字符
  en: The name has characters the server's file name encoding (in the host settings) can't represent
  zh-TW: 名稱中有伺服器的檔名編碼（主機設定）無法表示的字元
  ja: サーバーのファイル名のエンコード（ホストの設定）で表せない文字が名前に含まれています
  ko: 서버의 파일 이름 인코딩(호스트 설정)으로 표현할 수 없는 문자가 이름에 있습니다
sftp.error.trash_unsupported:
  zh-CN: 这个系统不支持移到回收站
  en: Moving to the Recycle Bin isn't supported on this system
  zh-TW: 這個系統不支援移到資源回收筒
  ja: このシステムではごみ箱への移動に対応していません
