  zh-TW: "同步位置中已有同步檔案，同步密碼正確。"
  ja: 同期先には同期ファイルがあり、同期パスワードは正しいです。
  ko: 동기화 위치에 동기화 파일이 이미 있으며 동기화 비밀번호가 올바릅니다.
