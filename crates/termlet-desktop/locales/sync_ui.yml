  zh-TW: "外觀設定"
  ja: 外観の設定
  ko: 모양 설정
sync_ui.settings_group.terminal:
  zh-CN: "终端设置"
  en: "Terminal settings"
  zh-TW: "終端機設定"
  ja: ターミナルの設定
  ko: 터미널 설정
sync_ui.settings_group.highlight:
  zh-CN: "关键词高亮"
  en: "Keyword highlighting"
  zh-TW: "關鍵字醒目提示"
  ja: キーワードの強調表示
  ko: 키워드 강조 표시
sync_ui.settings_group.connection:
  zh-CN: "连接设置"
  en: "Connection settings"
  zh-TW: "連線設定"
  ja: 接続の設定
  ko: 연결 설정
sync_ui.settings_group.guard:
  zh-CN: "危险命令规则"
  en: "Dangerous command rules"
  zh-TW: "危險指令規則"
  ja: 危険なコマンドのルール
  ko: 위험한 명령 규칙
sync_ui.settings_group.keybindings:
  zh-CN: "快捷键"
  en: "Shortcuts"
  zh-TW: "快速鍵"
  ja: キーボードショートカット
  ko: 바로 가기 키
sync_ui.error.not_configured:
  zh-CN: "还没有设置同步，或保险库重置后需要重新设置。"
  en: "Sync is not set up, or it needs to be set up again after the vault was reset."
  zh-TW: "還沒有設定同步，或保險庫重設後需要重新設定。"
  ja: 同期が設定されていないか、保管庫のリセット後に設定し直す必要があります。
  ko: 동기화가 설정되어 있지 않거나, 보관함을 초기화한 뒤 다시 설정해야 합니다.
sync_ui.error.vault_locked:
  zh-CN: "保险库已锁定，解锁后才能同步。"
  en: "The vault is locked. Unlock it to sync."
  zh-TW: "保險庫已鎖定，解鎖後才能同步。"
  ja: 保管庫がロックされています。ロックを解除すると同期できます。
  ko: 보관함이 잠겨 있습니다. 잠금을 해제해야 동기화할 수 있습니다.
sync_ui.error.path_not_absolute:
  zh-CN: "请填写同步文件夹的完整路径。"
  en: "Enter the full path of the sync folder."
  zh-TW: "請填寫同步資料夾的完整路徑。"
  ja: 同期フォルダーのフルパスを入力してください。
  ko: 동기화 폴더의 전체 경로를 입력하세요.
sync_ui.error.url_invalid:
  zh-CN: "WebDAV 地址不正确，应以 https:// 或 http:// 开头。"
  en: "The WebDAV address is not valid. It should start with https:// or http://."
  zh-TW: "WebDAV 位址不正確，應以 https:// 或 http:// 開頭。"
  ja: WebDAV のアドレスが正しくありません。https:// または http:// で始まる必要があります。
  ko: WebDAV 주소가 올바르지 않습니다. https:// 또는 http://로 시작해야 합니다.
sync_ui.error.url_has_credentials:
  zh-CN: "WebDAV 地址中不能带账号密码，请分别填在用户名与密码中。"
  en: "The WebDAV address cannot contain the account. Enter it under User name and Password instead."
  zh-TW: "WebDAV 位址中不能帶帳號密碼，請分別填在使用者名稱與密碼中。"
  ja: WebDAV のアドレスにアカウントやパスワードを含めることはできません。ユーザー名とパスワードの欄にそれぞれ入力してください。
  ko: WebDAV 주소에는 계정이나 비밀번호를 넣을 수 없습니다. 사용자 이름과 비밀번호 칸에 각각 입력하세요.
sync_ui.error.password_too_short:
  zh-CN: "同步密码至少 %{min} 个字符。"
  en: "The sync password needs at least %{min} characters."
  zh-TW: "同步密碼至少 %{min} 個字元。"
  ja: 同期パスワードは %{min} 文字以上にしてください。
  ko: 동기화 비밀번호는 %{min}자 이상이어야 합니다.
sync_ui.error.device_name_too_long:
  zh-CN: "本机名称最多 %{max} 个字符。"
  en: "The computer name can have at most %{max} characters."
  zh-TW: "本機名稱最多 %{max} 個字元。"
  ja: このコンピューターの名前は %{max} 文字以内にしてください。
  ko: 이 컴퓨터의 이름은 %{max}자 이하여야 합니다.
sync_ui.error.interval_out_of_range:
  zh-CN: "自动同步的间隔应在 %{min} 到 %{max} 分钟之间。"
  en: "The automatic sync interval must be between %{min} and %{max} minutes."
  zh-TW: "自動同步的間隔應在 %{min} 到 %{max} 分鐘之間。"
  ja: 自動同期の間隔は %{min}～%{max} 分の範囲で指定してください。
  ko: 자동 동기화 간격은 %{min}~%{max}분 사이여야 합니다.
sync_ui.error.conflict_not_found:
  zh-CN: "这条冲突已经处理过，或重启后不能再改用另一边。"
  en: "This conflict was already handled, or the other side is no longer available after a restart."
  zh-TW: "這項衝突已經處理過，或重新啟動後不能再改用另一邊。"
  ja: この競合はすでに処理されたか、再起動後のためもう一方に切り替えられません。
  ko: 이 충돌은 이미 처리되었거나, 다시 시작한 뒤라서 다른 쪽으로 바꿀 수 없습니다.
sync_ui.error.conflict_stale:
  zh-CN: "这条记录在冲突之后又改过，不能再改用另一边。"
  en: "This item changed after the conflict, so the other side can no longer be used."
  zh-TW: "這筆資料在衝突之後又修改過，不能再改用另一邊。"
  ja: この項目は競合の後にさらに変更されたため、もう一方に切り替えられません。
  ko: 이 항목은 충돌 뒤에 다시 변경되어 다른 쪽으로 바꿀 수 없습니다.
sync_ui.error.conflict_not_applicable:
  zh-CN: "另一边的内容来自其他版本的 Termlet，本机无法写入。升级 Termlet 后再试。"
  en: "The other side comes from another version of Termlet and cannot be written here. Update Termlet and try again."
  zh-TW: "另一邊的內容來自其他版本的 Termlet，本機無法寫入。升級 Termlet 後再試。"
  ja: もう一方の内容は別のバージョンの Termlet からのもので、このコンピューターには書き込めません。Termlet を更新してからもう一度お試しください。
  ko: 다른 쪽 내용은 다른 버전의 Termlet에서 온 것이라 이 컴퓨터에 쓸 수 없습니다. Termlet을 업데이트한 후 다시 시도하세요.
sync_ui.error.profile_in_use:
  zh-CN: "这个凭据档案仍有主机在用，不能删除。"
  en: "This credential profile is still used by hosts, so it cannot be deleted."
  zh-TW: "這個認證資訊設定檔仍有主機在使用，不能刪除。"
  ja: この認証プロファイルはまだホストで使用されているため、削除できません。
  ko: 이 자격 증명 프로필을 아직 사용하는 호스트가 있어 삭제할 수 없습니다.
sync_ui.error.key_in_use:
  zh-CN: "这把密钥仍有主机或凭据档案在用，不能删除。"
  en: "This key is still used by hosts or credential profiles, so it cannot be deleted."
  zh-TW: "這把金鑰仍有主機或認證資訊設定檔在使用，不能刪除。"
  ja: この鍵はまだホストまたは認証プロファイルで使用されているため、削除できません。
  ko: 이 키를 아직 사용하는 호스트나 자격 증명 프로필이 있어 삭제할 수 없습니다.
sync_ui.error.invalid_other:
  zh-CN: "同步设置不合法：%{field}（%{reason}）。"
  en: "Invalid sync setting: %{field} (%{reason})."
  zh-TW: "同步設定無效：%{field}（%{reason}）。"
  ja: 同期の設定が正しくありません：%{field}（%{reason}）。
  ko: "동기화 설정이 올바르지 않습니다: %{field}(%{reason})."
sync_ui.error.folder_missing:
  zh-CN: "同步文件夹不存在或无法访问：%{path}。在 U 盘或网盘中时，插上或挂载后再试。"
  en: "The sync folder does not exist or cannot be accessed: %{path}. If it is on a USB drive or a cloud drive, connect it and try again."
  zh-TW: "同步資料夾不存在或無法存取：%{path}。位於 USB 隨身碟或雲端硬碟時，請插上或掛接後再試。"
  ja: 同期フォルダーが存在しないか、アクセスできません：%{path}。USB メモリやクラウドストレージ上にある場合は、接続またはマウントしてからもう一度お試しください。
  ko: "동기화 폴더가 없거나 접근할 수 없습니다: %{path}. USB 드라이브나 클라우드 드라이브에 있다면 연결하거나 마운트한 후 다시 시도하세요."
sync_ui.error.folder_not_writable:
  zh-CN: "同步文件夹不可写：%{path}。"
  en: "The sync folder is not writable: %{path}."
  zh-TW: "同步資料夾無法寫入：%{path}。"
  ja: 同期フォルダーに書き込めません：%{path}。
  ko: "동기화 폴더에 쓸 수 없습니다: %{path}."
sync_ui.error.network:
  zh-CN: "无法连接 WebDAV 服务器：%{message}"
  en: "Cannot reach the WebDAV server: %{message}"
  zh-TW: "無法連線到 WebDAV 伺服器：%{message}"
  ja: WebDAV サーバーに接続できません：%{message}
  ko: "WebDAV 서버에 연결할 수 없습니다: %{message}"
sync_ui.error.auth_failed:
  zh-CN: "WebDAV 账号或密码不正确，或没有访问这个目录的权限。"
  en: "The WebDAV user name or password is wrong, or you have no access to this folder."
  zh-TW: "WebDAV 帳號或密碼不正確，或沒有存取這個目錄的權限。"
  ja: WebDAV のアカウントまたはパスワードが正しくないか、このフォルダーへのアクセス権限がありません。
  ko: WebDAV 계정 또는 비밀번호가 올바르지 않거나 이 폴더에 접근할 권한이 없습니다.
sync_ui.error.redirected:
  zh-CN: "WebDAV 服务器要求跳转（%{status}）到 %{location}，请把地址改为跳转后的地址。"
  en: "The WebDAV server redirects (%{status}) to %{location}. Change the address to that one."
  zh-TW: "WebDAV 伺服器要求重新導向（%{status}）到 %{location}，請把位址改為重新導向後的位址。"
  ja: WebDAV サーバーが %{location} へのリダイレクト（%{status}）を要求しています。アドレスをリダイレクト先に変更してください。
  ko: WebDAV 서버가 %{location}(으)로 리디렉션(%{status})을 요구합니다. 주소를 리디렉션된 주소로 바꾸세요.
sync_ui.error.redirected_unknown:
  zh-CN: "WebDAV 服务器要求跳转（%{status}），请检查地址，例如是否应以 https:// 开头。"
  en: "The WebDAV server asks for a redirect (%{status}). Check the address, for example whether it should start with https://."
  zh-TW: "WebDAV 伺服器要求重新導向（%{status}），請檢查位址，例如是否應以 https:// 開頭。"
  ja: WebDAV サーバーがリダイレクト（%{status}）を要求しています。アドレスを確認してください（たとえば、https:// で始めるべきではないかなど）。
  ko: WebDAV 서버가 리디렉션(%{status})을 요구합니다. 주소를 확인하세요. 예를 들어 https://로 시작해야 하는지 확인하세요.
sync_ui.error.server:
  zh-CN: "WebDAV 服务器返回错误 %{status}。"
  en: "The WebDAV server returned error %{status}."
  zh-TW: "WebDAV 伺服器傳回錯誤 %{status}。"
  ja: WebDAV サーバーがエラー %{status} を返しました。
  ko: WebDAV 서버가 오류 %{status}을(를) 반환했습니다.
sync_ui.error.insufficient_storage:
  zh-CN: "存储空间不足。"
  en: "There is not enough storage space."
  zh-TW: "儲存空間不足。"
  ja: ストレージの空き容量が不足しています。
  ko: 저장 공간이 부족합니다.
sync_ui.error.wrong_password:
  zh-CN: "同步密码错误，或同步文件已被改动。"
  en: "The sync password is wrong, or the sync file has been altered."
  zh-TW: "同步密碼錯誤，或同步檔案已被改動。"
  ja: 同期パスワードが正しくないか、同期ファイルが改変されています。
  ko: 동기화 비밀번호가 올바르지 않거나 동기화 파일이 변경되었습니다.
sync_ui.error.corrupt:
  zh-CN: "同步位置中的文件已损坏，或不是 Termlet 的同步文件。"
  en: "The file at the sync location is damaged or is not a Termlet sync file."
  zh-TW: "同步位置中的檔案已損毀，或不是 Termlet 的同步檔案。"
  ja: 同期先のファイルが破損しているか、Termlet の同期ファイルではありません。
  ko: 동기화 위치의 파일이 손상되었거나 Termlet의 동기화 파일이 아닙니다.
sync_ui.error.too_large:
  zh-CN: "同步文件或要同步的数据过大。"
  en: "The sync file or the data to sync is too large."
  zh-TW: "同步檔案或要同步的資料過大。"
  ja: 同期ファイルまたは同期するデータが大きすぎます。
  ko: 동기화 파일이나 동기화할 데이터가 너무 큽니다.
sync_ui.error.too_new:
  zh-CN: "同步位置中的数据来自更新版本的 Termlet，请先升级本机的 Termlet。"
  en: "The data at the sync location comes from a newer version of Termlet. Update Termlet on this computer first."
  zh-TW: "同步位置中的資料來自較新版本的 Termlet，請先升級本機的 Termlet。"
  ja: 同期先のデータは新しいバージョンの Termlet で作成されています。先にこのコンピューターの Termlet を更新してください。
  ko: 동기화 위치의 데이터는 더 새로운 버전의 Termlet에서 만들어졌습니다. 먼저 이 컴퓨터의 Termlet을 업데이트하세요.
sync_ui.error.contended:
  zh-CN: "同步文件被其他设备频繁修改，请稍后再试。"
  en: "The sync file keeps being changed by other computers. Try again later."
  zh-TW: "同步檔案被其他裝置頻繁修改，請稍後再試。"
  ja: 同期ファイルがほかのデバイスによって頻繁に変更されています。しばらくしてからもう一度お試しください。
  ko: 다른 장치가 동기화 파일을 계속 변경하고 있습니다. 잠시 후 다시 시도하세요.
sync_ui.error.local_busy:
  zh-CN: "本机的数据在同步期间一直在修改，请稍后再试。"
  en: "The data on this computer kept changing during the sync. Try again later."
  zh-TW: "本機的資料在同步期間一直在修改，請稍後再試。"
  ja: 同期中にこのコンピューターのデータが変更され続けました。しばらくしてからもう一度お試しください。
  ko: 동기화하는 동안 이 컴퓨터의 데이터가 계속 변경되었습니다. 잠시 후 다시 시도하세요.
sync_ui.error.snapshot:
  zh-CN: "同步前保存本机快照失败，没有写入任何数据：%{message}"
  en: "Could not save a snapshot of this computer before syncing, so nothing was written: %{message}"
  zh-TW: "同步前儲存本機快照失敗，沒有寫入任何資料：%{message}"
  ja: 同期前にこのコンピューターのスナップショットを保存できなかったため、データは何も書き込んでいません：%{message}
  ko: "동기화 전에 이 컴퓨터의 스냅샷을 저장하지 못해 아무 데이터도 쓰지 않았습니다: %{message}"
sync_ui.error.io:
  zh-CN: "读写同步文件失败：%{message}"
  en: "Could not read or write the sync file: %{message}"
  zh-TW: "讀寫同步檔案失敗：%{message}"
  ja: 同期ファイルを読み書きできませんでした：%{message}
  ko: "동기화 파일을 읽거나 쓰지 못했습니다: %{message}"
sync_ui.error.local:
  zh-CN: "本机数据出错：%{message}"
  en: "Error in the data on this computer: %{message}"
  zh-TW: "本機資料出錯：%{message}"
  ja: このコンピューターのデータでエラーが発生しました：%{message}
  ko: "이 컴퓨터의 데이터에 오류가 있습니다: %{message}"
sync_ui.error.url_insecure:
  zh-CN: "WebDAV 地址以 http:// 开头，账号密码会以明文经过网络。请改用 https://；只在可信的局域网中使用时，勾选“允许不安全的 HTTP”。"
  en: "The WebDAV address starts with http://, so the user name and password would cross the network in plain text. Use https://, or check “Allow insecure HTTP” if you only use it on a trusted local network."
  zh-TW: "WebDAV 位址以 http:// 開頭，帳號密碼會以明文經過網路。請改用 https://；只在可信任的區域網路中使用時，勾選「允許不安全的 HTTP」。"
  ja: WebDAV のアドレスが http:// で始まっているため、アカウントとパスワードが平文でネットワークを流れます。https:// を使ってください。信頼できる LAN でのみ使う場合は、「安全でない HTTP を許可」をオンにしてください。
  ko: WebDAV 주소가 http://로 시작하므로 계정과 비밀번호가 평문으로 네트워크를 지나갑니다. https://를 사용하세요. 신뢰할 수 있는 LAN에서만 사용한다면 '안전하지 않은 HTTP 허용'을 선택하세요.
sync_ui.error.endpoint_required:
  zh-CN: "请填写 S3 的终端节点。"
  en: "Enter the S3 endpoint."
  zh-TW: "請填寫 S3 的端點。"
  ja: S3 のエンドポイントを入力してください。
  ko: S3 엔드포인트를 입력하세요.
sync_ui.error.endpoint_invalid:
  zh-CN: "S3 的终端节点不正确，应是 https://s3.amazonaws.com 这样的地址。"
  en: "The S3 endpoint is not valid. It should be an address like https://s3.amazonaws.com."
  zh-TW: "S3 的端點不正確，應是 https://s3.amazonaws.com 這樣的位址。"
  ja: S3 のエンドポイントが正しくありません。https://s3.amazonaws.com のようなアドレスを入力してください。
  ko: S3 엔드포인트가 올바르지 않습니다. https://s3.amazonaws.com 같은 주소여야 합니다.
sync_ui.error.endpoint_has_credentials:
  zh-CN: "S3 的终端节点中不能带账号密码，请填在访问密钥中。"
  en: "The S3 endpoint cannot contain an account. Enter the keys under Access key ID and Secret access key instead."
  zh-TW: "S3 的端點中不能帶帳號密碼，請填在存取金鑰中。"
  ja: S3 のエンドポイントにアカウントやパスワードを含めることはできません。アクセスキーの欄に入力してください。
  ko: S3 엔드포인트에는 계정이나 비밀번호를 넣을 수 없습니다. 액세스 키 칸에 입력하세요.
sync_ui.error.endpoint_insecure:
  zh-CN: "S3 的终端节点以 http:// 开头，请求可能被截获或篡改。请改用 https://；只在可信的局域网中使用时，勾选“允许不安全的 HTTP”。"
  en: "The S3 endpoint starts with http://, so requests could be intercepted or tampered with. Use https://, or check “Allow insecure HTTP” if you only use it on a trusted local network."
  zh-TW: "S3 的端點以 http:// 開頭，要求可能被攔截或竄改。請改用 https://；只在可信任的區域網路中使用時，勾選「允許不安全的 HTTP」。"
  ja: S3 のエンドポイントが http:// で始まっているため、リクエストを傍受されたり改ざんされたりするおそれがあります。https:// を使ってください。信頼できる LAN でのみ使う場合は、「安全でない HTTP を許可」をオンにしてください。
  ko: S3 엔드포인트가 http://로 시작하므로 요청이 가로채이거나 변조될 수 있습니다. https://를 사용하세요. 신뢰할 수 있는 LAN에서만 사용한다면 '안전하지 않은 HTTP 허용'을 선택하세요.
sync_ui.error.region_invalid:
  zh-CN: "区域只能用字母、数字与连字符，例如 %{default}。"
  en: "The region can only use letters, digits and hyphens, for example %{default}."
  zh-TW: "區域只能使用字母、數字與連字號，例如 %{default}。"
  ja: リージョンに使えるのは英字、数字、ハイフンだけです（例：%{default}）。
  ko: "리전에는 영문자, 숫자, 하이픈만 사용할 수 있습니다(예: %{default})."
sync_ui.error.region_mismatch:
  zh-CN: "区域与桶所在的区域不一致，请填写桶所在的区域。"
  en: "The region does not match the bucket's region. Enter the region the bucket is in."
  zh-TW: "區域與儲存貯體所在的區域不一致，請填寫儲存貯體所在的區域。"
  ja: リージョンがバケットのリージョンと一致しません。バケットがあるリージョンを入力してください。
  ko: 리전이 버킷의 리전과 일치하지 않습니다. 버킷이 있는 리전을 입력하세요.
sync_ui.error.bucket_required:
  zh-CN: "请填写桶的名称。"
  en: "Enter the bucket name."
  zh-TW: "請填寫儲存貯體的名稱。"
  ja: バケット名を入力してください。
  ko: 버킷 이름을 입력하세요.
sync_ui.error.bucket_invalid:
  zh-CN: "桶的名称不正确，只能用字母、数字、点、连字符与下划线。"
  en: "The bucket name is not valid. Use only letters, digits, dots, hyphens and underscores."
  zh-TW: "儲存貯體的名稱不正確，只能使用字母、數字、點、連字號與底線。"
  ja: バケット名が正しくありません。英字、数字、ドット、ハイフン、アンダースコアだけを使ってください。
  ko: 버킷 이름이 올바르지 않습니다. 영문자, 숫자, 점, 하이픈, 밑줄만 사용하세요.
sync_ui.error.bucket_not_found:
  zh-CN: "桶不存在，请先在存储服务中建好，或检查名称与终端节点。"
  en: "The bucket does not exist. Create it in the storage service first, or check the name and the endpoint."
  zh-TW: "儲存貯體不存在，請先在儲存服務中建立，或檢查名稱與端點。"
  ja: バケットが存在しません。先にストレージサービスで作成するか、名前とエンドポイントを確認してください。
  ko: 버킷이 없습니다. 먼저 스토리지 서비스에서 만들거나 이름과 엔드포인트를 확인하세요.
sync_ui.error.prefix_invalid:
  zh-CN: "路径前缀只能用字母、数字与 - _ . /，不能有 . 或 .. 这样的一段。"
  en: "The path prefix can only use letters, digits and - _ . /, and cannot contain a . or .. segment."
  zh-TW: "路徑前綴只能使用字母、數字與 - _ . /，不能有 . 或 .. 這樣的一段。"
  ja: パスのプレフィックスに使えるのは英字、数字、- _ . / だけで、. や .. だけの区切りは含められません。
  ko: 경로 접두사에는 영문자, 숫자와 - _ . /만 사용할 수 있으며, . 또는 .. 같은 구간은 넣을 수 없습니다.
sync_ui.error.access_key_required:
  zh-CN: "请填写访问密钥 ID。"
  en: "Enter the access key ID."
  zh-TW: "請填寫存取金鑰 ID。"
  ja: アクセスキー ID を入力してください。
  ko: 액세스 키 ID를 입력하세요.
sync_ui.error.access_key_invalid:
  zh-CN: "访问密钥 ID 不正确，其中不能有空格或斜杠。"
  en: "The access key ID is not valid. It cannot contain spaces or slashes."
  zh-TW: "存取金鑰 ID 不正確，其中不能有空格或斜線。"
  ja: アクセスキー ID が正しくありません。スペースやスラッシュは含められません。
  ko: 액세스 키 ID가 올바르지 않습니다. 공백이나 슬래시를 넣을 수 없습니다.
sync_ui.error.secret_key_required:
  zh-CN: "请填写秘密访问密钥。"
  en: "Enter the secret access key."
  zh-TW: "請填寫秘密存取金鑰。"
  ja: シークレットアクセスキーを入力してください。
  ko: 비밀 액세스 키를 입력하세요.
sync_ui.error.token_required:
  zh-CN: "请填写 GitHub 的个人访问令牌。"
  en: "Enter a GitHub personal access token."
  zh-TW: "請填寫 GitHub 的個人存取權杖。"
  ja: GitHub の個人用アクセストークンを入力してください。
  ko: GitHub 개인용 액세스 토큰을 입력하세요.
sync_ui.error.token_no_gist_scope:
  zh-CN: "这个令牌没有 Gist 的权限：经典令牌请勾选 gist，细粒度令牌请给 Gists 读写权限。"
  en: "This token has no access to Gists: give a classic token the gist scope, or a fine-grained token read and write access to Gists."
  zh-TW: "這個權杖沒有 Gist 的權限：傳統權杖請勾選 gist，細粒度權杖請給予 Gists 讀寫權限。"
  ja: このトークンには Gist の権限がありません。クラシックトークンなら gist スコープを、Fine-grained トークンなら Gists の読み取りと書き込みの権限を付けてください。
  ko: 이 토큰에는 Gist 권한이 없습니다. 클래식 토큰은 gist 범위를 선택하고, 세분화된(Fine-grained) 토큰은 Gists 읽기 및 쓰기 권한을 주세요.
sync_ui.error.gist_invalid:
  zh-CN: "Gist 的 ID 不正确，请填 Gist 网址最后的那串字母数字，或留空。"
  en: "The Gist ID is not valid. Enter the letters and digits at the end of the Gist's address, or leave it empty."
  zh-TW: "Gist 的 ID 不正確，請填 Gist 網址最後的那串英數字，或留空。"
  ja: Gist の ID が正しくありません。Gist の URL の末尾にある英数字を入力するか、空欄にしてください。
  ko: Gist ID가 올바르지 않습니다. Gist URL 끝의 영문자와 숫자를 입력하거나 비워 두세요.
sync_ui.error.gist_not_found:
  zh-CN: "找不到这个 Gist，或令牌所属的账号无权修改它。请检查 ID，或清空后让 Termlet 自动查找、新建。"
  en: "The Gist was not found, or the token's account cannot change it. Check the ID, or clear it to let Termlet find or create one."
  zh-TW: "找不到這個 Gist，或權杖所屬的帳號無權修改它。請檢查 ID，或清除後讓 Termlet 自動尋找、新增。"
  ja: この Gist が見つからないか、トークンのアカウントには変更する権限がありません。ID を確認するか、空欄にして Termlet に自動で検索・作成させてください。
  ko: 이 Gist를 찾을 수 없거나 토큰 계정에 변경 권한이 없습니다. ID를 확인하거나, 비워 두고 Termlet이 자동으로 찾거나 만들게 하세요.
sync_ui.error.gist_ambiguous:
  zh-CN: "这个账号中有多个 Termlet 的 Gist（%{ids}），请在 Gist 一栏填写要用的那个。"
  en: "This account has several Termlet Gists (%{ids}). Enter the one to use in the Gist field."
  zh-TW: "這個帳號中有多個 Termlet 的 Gist（%{ids}），請在 Gist 一欄填寫要使用的那個。"
  ja: このアカウントには Termlet の Gist が複数あります（%{ids}）。使用する Gist を「Gist」欄に入力してください。
  ko: 이 계정에 Termlet의 Gist가 여러 개 있습니다(%{ids}). 사용할 Gist를 'Gist' 칸에 입력하세요.
sync_ui.error.gist_too_large:
  zh-CN: "加密后的同步文件有 %{size} MB，超过 Gist 能存放的 %{limit} MB。请改用 WebDAV、S3 兼容存储或本机文件夹。"
  en: "The encrypted sync file is %{size} MB, more than the %{limit} MB a Gist can hold. Use WebDAV, S3-compatible storage or a local folder instead."
  zh-TW: "加密後的同步檔案有 %{size} MB，超過 Gist 能存放的 %{limit} MB。請改用 WebDAV、S3 相容儲存空間或本機資料夾。"
  ja: 暗号化後の同期ファイルは %{size} MB で、Gist に保存できる %{limit} MB を超えています。代わりに WebDAV、S3 互換ストレージ、ローカルフォルダーを使ってください。
  ko: 암호화한 동기화 파일이 %{size} MB로, Gist에 저장할 수 있는 %{limit} MB를 넘습니다. 대신 WebDAV, S3 호환 스토리지 또는 로컬 폴더를 사용하세요.
sync_ui.error.s3_network:
  zh-CN: "无法连接 S3 服务：%{message}"
  en: "Cannot reach the S3 service: %{message}"
  zh-TW: "無法連線到 S3 服務：%{message}"
  ja: S3 サービスに接続できません：%{message}
  ko: "S3 서비스에 연결할 수 없습니다: %{message}"
sync_ui.error.s3_auth_failed:
  zh-CN: "访问密钥 ID 或秘密访问密钥不正确，或没有读写这个桶的权限。"
  en: "The access key ID or secret access key is wrong, or the key cannot read and write this bucket."
  zh-TW: "存取金鑰 ID 或秘密存取金鑰不正確，或沒有讀寫這個儲存貯體的權限。"
  ja: アクセスキー ID またはシークレットアクセスキーが正しくないか、このバケットを読み書きする権限がありません。
  ko: 액세스 키 ID 또는 비밀 액세스 키가 올바르지 않거나 이 버킷을 읽고 쓸 권한이 없습니다.
sync_ui.error.s3_redirected:
  zh-CN: "S3 服务要求改用终端节点 %{location}（%{status}），区域或终端节点可能不对。"
  en: "The S3 service asks to use the endpoint %{location} (%{status}); the region or endpoint may be wrong."
  zh-TW: "S3 服務要求改用端點 %{location}（%{status}），區域或端點可能不對。"
  ja: S3 サービスがエンドポイント %{location} を使うよう求めています（%{status}）。リージョンまたはエンドポイントが正しくない可能性があります。
  ko: S3 서비스가 엔드포인트 %{location}을(를) 사용하라고 요구합니다(%{status}). 리전이나 엔드포인트가 잘못되었을 수 있습니다.
sync_ui.error.s3_redirected_unknown:
  zh-CN: "S3 服务要求跳转（%{status}），请检查区域与终端节点。"
  en: "The S3 service asks for a redirect (%{status}). Check the region and the endpoint."
  zh-TW: "S3 服務要求重新導向（%{status}），請檢查區域與端點。"
  ja: S3 サービスがリダイレクト（%{status}）を要求しています。リージョンとエンドポイントを確認してください。
  ko: S3 서비스가 리디렉션(%{status})을 요구합니다. 리전과 엔드포인트를 확인하세요.
sync_ui.error.s3_server:
  zh-CN: "S3 服务返回错误 %{status}。"
  en: "The S3 service returned error %{status}."
  zh-TW: "S3 服務傳回錯誤 %{status}。"
  ja: S3 サービスがエラー %{status} を返しました。
  ko: S3 서비스가 오류 %{status}을(를) 반환했습니다.
sync_ui.error.s3_code:
  zh-CN: "S3 服务返回错误 %{code}（%{status}）。"
  en: "The S3 service returned the error %{code} (%{status})."
  zh-TW: "S3 服務傳回錯誤 %{code}（%{status}）。"
  ja: S3 サービスがエラー %{code}（%{status}）を返しました。
  ko: S3 서비스가 오류 %{code}(%{status})을(를) 반환했습니다.
sync_ui.error.clock_skew:
  zh-CN: "本机时间与服务器相差太多，请求的签名无效。请校准系统时间后再试。"
  en: "This computer's clock is too far off from the server's, so the request signature is not accepted. Correct the system time and try again."
  zh-TW: "本機時間與伺服器相差太多，要求的簽章無效。請校正系統時間後再試。"
  ja: このコンピューターの時刻がサーバーと大きくずれているため、リクエストの署名が無効です。システムの時刻を合わせてから、もう一度お試しください。
  ko: 이 컴퓨터의 시간이 서버와 너무 많이 달라 요청 서명이 유효하지 않습니다. 시스템 시간을 맞춘 후 다시 시도하세요.
sync_ui.error.rate_limited:
  zh-CN: "请求太频繁，被服务暂时限制了，请稍后再试。"
  en: "Too many requests; the service is limiting them for now. Try again later."
  zh-TW: "要求太頻繁，暫時被服務限制了，請稍後再試。"
  ja: リクエストが多すぎるため、サービスによって一時的に制限されています。しばらくしてからもう一度お試しください。
  ko: 요청이 너무 많아 서비스에서 일시적으로 제한했습니다. 잠시 후 다시 시도하세요.
sync_ui.error.rate_limited_retry:
  zh-CN: "请求太频繁，被服务暂时限制了，请约 %{minutes} 分钟后再试。"
  en: "Too many requests; the service is limiting them for now. Try again in about %{minutes} min."
  zh-TW: "要求太頻繁，暫時被服務限制了，請約 %{minutes} 分鐘後再試。"
  ja: リクエストが多すぎるため、サービスによって一時的に制限されています。約 %{minutes} 分後にもう一度お試しください。
  ko: 요청이 너무 많아 서비스에서 일시적으로 제한했습니다. 약 %{minutes}분 후에 다시 시도하세요.
sync_ui.error.gist_network:
  zh-CN: "无法连接 GitHub：%{message}"
  en: "Cannot reach GitHub: %{message}"
  zh-TW: "無法連線到 GitHub：%{message}"
  ja: GitHub に接続できません：%{message}
  ko: "GitHub에 연결할 수 없습니다: %{message}"
sync_ui.error.gist_auth_failed:
  zh-CN: "GitHub 的个人访问令牌无效或已过期。"
  en: "The GitHub personal access token is not valid or has expired."
  zh-TW: "GitHub 的個人存取權杖無效或已過期。"
  ja: GitHub の個人用アクセストークンが無効か、期限切れです。
  ko: GitHub 개인용 액세스 토큰이 유효하지 않거나 만료되었습니다.
sync_ui.error.gist_redirected:
  zh-CN: "GitHub 要求跳转（%{status}），请稍后再试。"
  en: "GitHub asks for a redirect (%{status}). Try again later."
  zh-TW: "GitHub 要求重新導向（%{status}），請稍後再試。"
  ja: GitHub がリダイレクト（%{status}）を要求しています。しばらくしてからもう一度お試しください。
  ko: GitHub가 리디렉션(%{status})을 요구합니다. 잠시 후 다시 시도하세요.
sync_ui.error.gist_server:
  zh-CN: "GitHub 返回错误 %{status}。"
  en: "GitHub returned error %{status}."
  zh-TW: "GitHub 傳回錯誤 %{status}。"
  ja: GitHub がエラー %{status} を返しました。
  ko: GitHub가 오류 %{status}을(를) 반환했습니다.
