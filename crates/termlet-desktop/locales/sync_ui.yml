sync_ui.form.path_style:
  zh-CN: "使用路径风格的地址（MinIO 等需要）"
  en: "Use path-style addresses (needed by MinIO and similar)"
  zh-TW: "使用路徑樣式的位址（MinIO 等需要）"
  ja: パス形式のアドレスを使用（MinIO などで必要）
  ko: 경로 스타일 주소 사용(MinIO 등에서 필요)
sync_ui.form.path_style_hint:
  zh-CN: "不勾选时桶名放在主机名中（https://桶.终端节点/）；终端节点是 IP 地址时总是用路径风格。"
  en: "When unchecked, the bucket name goes into the host name (https://bucket.endpoint/); IP address endpoints always use path style."
  zh-TW: "不勾選時儲存貯體名稱放在主機名稱中（https://儲存貯體.端點/）；端點是 IP 位址時一律使用路徑樣式。"
  ja: オフのときはバケット名をホスト名に含めます（https://バケット.エンドポイント/）。エンドポイントが IP アドレスの場合は常にパス形式を使います。
  ko: 선택하지 않으면 버킷 이름을 호스트 이름에 넣습니다(https://버킷.엔드포인트/). 엔드포인트가 IP 주소이면 항상 경로 스타일을 사용합니다.
sync_ui.form.token:
  zh-CN: "个人访问令牌"
  en: "Personal access token"
  zh-TW: "個人存取權杖"
  ja: 個人用アクセストークン
  ko: 개인용 액세스 토큰
sync_ui.form.token_hint:
  zh-CN: "在 GitHub 的 Settings → Developer settings → Personal access tokens 中创建：经典令牌勾选 gist 权限，细粒度令牌给 Gists 读写权限。令牌保存在本机的保险库中。"
  en: "Create one on GitHub under Settings → Developer settings → Personal access tokens: give a classic token the gist scope, or a fine-grained token read and write access to Gists. The token is kept in this computer's vault."
  zh-TW: "在 GitHub 的 Settings → Developer settings → Personal access tokens 中建立：傳統權杖勾選 gist 權限，細粒度權杖給予 Gists 讀寫權限。權杖儲存在本機的保險庫中。"
  ja: GitHub の Settings → Developer settings → Personal access tokens で作成します。クラシックトークンなら gist スコープを、Fine-grained トークンなら Gists の読み取りと書き込みの権限を付けます。トークンはこのコンピューターの保管庫に保存されます。
  ko: GitHub의 Settings → Developer settings → Personal access tokens에서 만드세요. 클래식 토큰은 gist 범위를, 세분화된(Fine-grained) 토큰은 Gists 읽기 및 쓰기 권한을 주세요. 토큰은 이 컴퓨터의 보관함에 저장됩니다.
sync_ui.form.gist_id:
