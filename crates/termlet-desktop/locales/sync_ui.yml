  en: "These were resolved automatically: the newer change wins, and a change wins over a deletion. Replaced changes can be recovered from the snapshot taken before syncing, under “Backup”; after a restart the other side can no longer be used."
  zh-TW: "已自動處理：較新的變更優先；一邊刪除、一邊修改時保留變更。被取代的變更可以從「備份」中同步前的快照找回；重新啟動後不能再改用另一邊。"
  ja: 自動的に処理しました。新しいほうの変更を優先し、一方で削除、もう一方で変更された場合は変更を残します。置き換えられた変更は「バックアップ」の同期前のスナップショットから復元できます。再起動後はもう一方に切り替えることはできません。
  ko: 자동으로 처리했습니다. 더 최근의 변경 사항을 우선하며, 한쪽에서 삭제하고 다른 쪽에서 변경했으면 변경 사항을 남깁니다. 대체된 변경 사항은 '백업'에서 동기화 전 스냅샷으로 되찾을 수 있습니다. 다시 시작한 뒤에는 다른 쪽으로 바꿀 수 없습니다.
sync_ui.conflict.kept_local:
  zh-CN: "两边都修改了，采用了本机较新的修改"
  en: "Changed on both sides; kept the newer change from this computer"
  zh-TW: "兩邊都修改了，採用了本機較新的變更"
  ja: 両側で変更されたため、このコンピューターの新しいほうの変更を採用しました
  ko: 양쪽 모두 변경되어 이 컴퓨터의 더 최근 변경 사항을 사용했습니다
sync_ui.conflict.kept_remote:
  zh-CN: "两边都修改了，采用了其他设备较新的修改"
  en: "Changed on both sides; kept the newer change from another computer"
  zh-TW: "兩邊都修改了，採用了其他裝置較新的變更"
  ja: 両側で変更されたため、ほかのデバイスの新しいほうの変更を採用しました
  ko: 양쪽 모두 변경되어 다른 장치의 더 최근 변경 사항을 사용했습니다
sync_ui.conflict.remote_deleted:
  zh-CN: "其他设备删除了它，保留了本机的修改"
  en: "Deleted on another computer; kept the change from this computer"
  zh-TW: "其他裝置刪除了它，保留了本機的變更"
  ja: ほかのデバイスで削除されましたが、このコンピューターの変更を残しました
  ko: 다른 장치에서 삭제했지만 이 컴퓨터의 변경 사항을 남겼습니다
sync_ui.conflict.local_deleted:
  zh-CN: "本机删除了它，保留了其他设备的修改"
  en: "Deleted on this computer; kept the change from another computer"
  zh-TW: "本機刪除了它，保留了其他裝置的變更"
  ja: このコンピューターで削除されましたが、ほかのデバイスの変更を残しました
  ko: 이 컴퓨터에서 삭제했지만 다른 장치의 변경 사항을 남겼습니다
sync_ui.conflict.use_other:
  zh-CN: "改用另一边"
  en: "Use the other side"
  zh-TW: "改用另一邊"
  ja: もう一方を使用
  ko: 다른 쪽 사용
sync_ui.conflict.use_delete:
  zh-CN: "改为删除…"
  en: "Delete…"
  zh-TW: "改為刪除…"
  ja: 削除に変更…
  ko: 삭제로 변경…
sync_ui.conflict.dismiss:
  zh-CN: "全部忽略"
  en: "Dismiss all"
  zh-TW: "全部忽略"
  ja: すべて無視
  ko: 모두 무시
sync_ui.conflict.delete_title:
  zh-CN: "删除“%{name}”？"
  en: "Delete “%{name}”?"
  zh-TW: "刪除「%{name}」？"
  ja: 「%{name}」を削除しますか？
  ko: "'%{name}'을(를) 삭제하시겠습니까?"
sync_ui.conflict.delete_description:
  zh-CN: "另一边删除了它。在这里删除后，下次同步时其他设备上的也会删除。"
  en: "The other side deleted it. After you delete it here, it is also deleted on other computers at the next sync."
  zh-TW: "另一邊刪除了它。在這裡刪除後，下次同步時其他裝置上的也會刪除。"
  ja: もう一方では削除されています。ここで削除すると、次回の同期時にほかのデバイスでも削除されます。
  ko: 다른 쪽에서 삭제했습니다. 여기에서 삭제하면 다음 동기화 때 다른 장치에서도 삭제됩니다.
sync_ui.conflict.delete_ok:
  zh-CN: "删除"
  en: "Delete"
  zh-TW: "刪除"
  ja: 削除
  ko: 삭제
sync_ui.disable.title:
  zh-CN: "停止同步？"
  en: "Stop syncing?"
  zh-TW: "停止同步？"
  ja: 同期を停止しますか？
  ko: 동기화를 중지하시겠습니까?
sync_ui.disable.description:
  zh-CN: "只删除本机的同步设置与密码，本机与同步位置中的数据都保留，其他电脑照常同步。"
  en: "Only the sync settings and passwords on this computer are removed. The data here and at the sync location is kept, and other computers keep syncing."
  zh-TW: "只刪除本機的同步設定與密碼，本機與同步位置中的資料都保留，其他電腦照常同步。"
  ja: このコンピューターの同期設定とパスワードだけを削除します。このコンピューターと同期先のデータはどちらも残り、ほかのコンピューターはこれまでどおり同期します。
  ko: 이 컴퓨터의 동기화 설정과 비밀번호만 삭제합니다. 이 컴퓨터와 동기화 위치의 데이터는 모두 남으며, 다른 컴퓨터는 계속 동기화합니다.
sync_ui.disable.ok:
  zh-CN: "停止同步"
  en: "Stop syncing"
  zh-TW: "停止同步"
  ja: 同期を停止
  ko: 동기화 중지
sync_ui.pending.first_title:
  zh-CN: "本机与同步位置都有数据"
  en: "Both sides have data"
  zh-TW: "本機與同步位置都有資料"
  ja: このコンピューターと同期先の両方にデータがあります
  ko: 이 컴퓨터와 동기화 위치 모두에 데이터가 있습니다
sync_ui.pending.first_body:
  zh-CN: "同步位置中已有其他设备的数据，本机也有数据。选择怎样同步："
  en: "The sync location already has data from other computers, and this computer has data too. Choose how to sync them:"
  zh-TW: "同步位置中已有其他裝置的資料，本機也有資料。選擇如何同步："
  ja: 同期先にはすでにほかのデバイスのデータがあり、このコンピューターにもデータがあります。同期の方法を選択してください：
  ko: "동기화 위치에 이미 다른 장치의 데이터가 있고 이 컴퓨터에도 데이터가 있습니다. 동기화 방법을 선택하세요:"
sync_ui.pending.column_local:
  zh-CN: "本机"
  en: "This computer"
  zh-TW: "本機"
  ja: このコンピューター
  ko: 이 컴퓨터
sync_ui.pending.column_remote:
  zh-CN: "同步位置"
  en: "Sync location"
  zh-TW: "同步位置"
  ja: 同期先
  ko: 동기화 위치
sync_ui.pending.merge:
  zh-CN: "合并两边"
  en: "Merge both"
  zh-TW: "合併兩邊"
  ja: 両方を統合
  ko: 양쪽 병합
sync_ui.pending.merge_hint:
  zh-CN: "两边的数据都保留；同一条数据两边不同时采用较新的修改。"
  en: "Keeps the data from both sides; when the same item differs, the newer change wins."
  zh-TW: "兩邊的資料都保留；同一筆資料兩邊不同時，採用較新的變更。"
  ja: 両側のデータをすべて残します。同じデータが両側で異なる場合は、新しいほうの変更を採用します。
  ko: 양쪽 데이터를 모두 남깁니다. 같은 데이터가 양쪽에서 다르면 더 최근의 변경 사항을 사용합니다.
sync_ui.pending.use_remote:
  zh-CN: "以同步位置为准"
  en: "Use the sync location"
  zh-TW: "以同步位置為準"
  ja: 同期先に合わせる
  ko: 동기화 위치 기준
sync_ui.pending.use_remote_hint:
  zh-CN: "本机改为与同步位置相同，只在本机的数据会被删除。"
  en: "Makes this computer the same as the sync location; data that exists only on this computer is deleted."
  zh-TW: "本機改為與同步位置相同，只在本機的資料會被刪除。"
  ja: このコンピューターを同期先と同じ状態にします。このコンピューターにだけあるデータは削除されます。
  ko: 이 컴퓨터를 동기화 위치와 같게 만듭니다. 이 컴퓨터에만 있는 데이터는 삭제됩니다.
sync_ui.pending.use_local:
  zh-CN: "以本机为准"
  en: "Use this computer"
  zh-TW: "以本機為準"
  ja: このコンピューターに合わせる
  ko: 이 컴퓨터 기준
sync_ui.pending.use_local_hint:
  zh-CN: "同步位置改为与本机相同，其他电脑下次同步时也改为与本机相同。"
  en: "Makes the sync location the same as this computer; other computers follow at their next sync."
  zh-TW: "同步位置改為與本機相同，其他電腦下次同步時也改為與本機相同。"
  ja: 同期先をこのコンピューターと同じ状態にします。ほかのコンピューターも次回の同期時にこのコンピューターと同じ状態になります。
  ko: 동기화 위치를 이 컴퓨터와 같게 만듭니다. 다른 컴퓨터도 다음 동기화 때 이 컴퓨터와 같아집니다.
sync_ui.pending.duplicates:
  zh-CN: "本机有 %{count} 台主机与同步位置中的地址、端口、用户名相同（在两台电脑上各自添加的），合并后这些主机会有两份。如果两边的数据基本相同，建议选“以同步位置为准”。"
  en: "Hosts here with the same address, port and user as ones at the sync location: %{count}. They were added separately on each computer, so merging keeps two copies of each. If both sides hold mostly the same data, choose “Use the sync location”."
  zh-TW: "本機有 %{count} 台主機與同步位置中的位址、連接埠、使用者名稱相同（在兩台電腦上各自新增的），合併後這些主機會有兩份。如果兩邊的資料大致相同，建議選「以同步位置為準」。"
  ja: このコンピューターには、同期先のホストとアドレス、ポート、ユーザー名が同じホストが %{count} 台あります（それぞれのコンピューターで別々に追加したもの）。統合すると、これらのホストは 2 つずつになります。両側のデータがほぼ同じなら、「同期先に合わせる」を選ぶことをお勧めします。
  ko: 이 컴퓨터에 동기화 위치의 호스트와 주소, 포트, 사용자 이름이 같은 호스트가 %{count}대 있습니다(각 컴퓨터에서 따로 추가한 것). 병합하면 이 호스트들이 두 개씩 생깁니다. 양쪽 데이터가 거의 같다면 '동기화 위치 기준'을 선택하는 것이 좋습니다.
sync_ui.pending.snapshot_hint:
  zh-CN: "写入其他设备的数据之前会保存本机的快照，可以在“备份”中回退。"
  en: "A snapshot of this computer is saved before data from other computers is written, so you can roll back under “Backup”."
  zh-TW: "寫入其他裝置的資料之前會儲存本機的快照，可以在「備份」中回復。"
  ja: ほかのデバイスのデータを書き込む前にこのコンピューターのスナップショットを保存するので、「バックアップ」で元に戻せます。
  ko: 다른 장치의 데이터를 쓰기 전에 이 컴퓨터의 스냅샷을 저장하므로 '백업'에서 되돌릴 수 있습니다.
sync_ui.pending.deletes_title:
  zh-CN: "这次同步要删除较多数据"
  en: "This sync deletes a lot of data"
  zh-TW: "這次同步要刪除較多資料"
  ja: 今回の同期では多くのデータが削除されます
  ko: 이번 동기화에서 많은 데이터가 삭제됩니다
sync_ui.pending.deletes_body:
  zh-CN: "将删除本机 %{local} 项、同步位置 %{remote} 项数据。"
  en: "Items to delete: %{local} on this computer, %{remote} at the sync location."
  zh-TW: "將刪除本機 %{local} 項、同步位置 %{remote} 項資料。"
  ja: このコンピューターの %{local} 件、同期先の %{remote} 件のデータが削除されます。
  ko: 이 컴퓨터에서 %{local}개, 동기화 위치에서 %{remote}개 항목이 삭제됩니다.
sync_ui.pending.deletes_hint:
  zh-CN: "例如在一台电脑上删除了很多主机，或从较早的备份恢复过。同步前会保存本机的快照，可以在“备份”中回退；继续之前自动同步保持暂停。"
  en: "For example, many hosts were deleted on one computer, or an older backup was restored. A snapshot of this computer is saved before syncing, so you can roll back under “Backup”. Until you continue, automatic sync stays paused."
  zh-TW: "例如在一台電腦上刪除了很多主機，或從較早的備份還原過。同步前會儲存本機的快照，可以在「備份」中回復；繼續之前，自動同步保持暫停。"
  ja: たとえば、あるコンピューターで多くのホストを削除した場合や、古いバックアップから復元した場合などです。同期前にこのコンピューターのスナップショットを保存するので、「バックアップ」で元に戻せます。続行するまで自動同期は一時停止したままです。
  ko: 예를 들어 한 컴퓨터에서 호스트를 많이 삭제했거나 오래된 백업에서 복원한 경우입니다. 동기화 전에 이 컴퓨터의 스냅샷을 저장하므로 '백업'에서 되돌릴 수 있습니다. 계속하기 전까지 자동 동기화는 일시 중지된 상태로 유지됩니다.
