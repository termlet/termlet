sync_ui.form.password_hint:
  zh-CN: "所有电脑使用同一个同步密码：第一台电脑设置时确定，其他电脑输入同一个。它用来加密同步的数据，忘记后无法解开，请牢记。"
  en: "Every computer uses the same sync password: it is chosen on the first computer, and the others enter the same one. It encrypts the synced data and cannot be recovered if forgotten."
  zh-TW: "所有電腦使用同一個同步密碼：第一台電腦設定時決定，其他電腦輸入同一個。它用來加密同步的資料，忘記後無法解開，請牢記。"
  ja: すべてのコンピューターで同じ同期パスワードを使います。最初のコンピューターで設定時に決め、ほかのコンピューターでは同じものを入力します。同期するデータの暗号化に使われ、忘れると復号できないので、必ず覚えておいてください。
  ko: 모든 컴퓨터가 같은 동기화 비밀번호를 사용합니다. 첫 번째 컴퓨터에서 설정할 때 정하고, 다른 컴퓨터에서는 같은 비밀번호를 입력합니다. 동기화하는 데이터를 암호화하는 데 쓰이며 잊어버리면 풀 수 없으니 꼭 기억해 두세요.
