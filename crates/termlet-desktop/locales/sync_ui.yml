  zh-TW: "這次同步要刪除較多資料，同步已暫停，等你確認。"
  ja: 今回の同期では多くのデータが削除されるため、同期を一時停止しています。確認してください。
  ko: 이번 동기화에서 많은 데이터가 삭제되므로 동기화를 일시 중지했습니다. 확인해 주세요.
