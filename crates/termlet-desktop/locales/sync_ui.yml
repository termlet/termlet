  en: "For Nutstore, use https://dav.jianguoyun.com/dav/ followed by a folder name; for Nextcloud, Synology and others, use their WebDAV folder. Do not put the account in the address."
  zh-TW: "堅果雲請填 https://dav.jianguoyun.com/dav/ 加上目錄名稱，Nextcloud、群暉等請填對應的 WebDAV 目錄。位址中不要帶帳號密碼。"
  ja: Nutstore の場合は https://dav.jianguoyun.com/dav/ の後にフォルダー名を付けます。Nextcloud、Synology などはそれぞれの WebDAV フォルダーを入力します。アドレスにアカウントやパスワードを含めないでください。
  ko: Nutstore는 https://dav.jianguoyun.com/dav/ 뒤에 폴더 이름을 붙이고, Nextcloud, Synology 등은 해당 WebDAV 폴더를 입력하세요. 주소에 계정이나 비밀번호를 넣지 마세요.
