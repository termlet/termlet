sync_ui.form.prefix_hint:
  zh-CN: "同步文件放在桶中的这个目录下；留空则放在桶的根上。只能用字母、数字与 - _ . /。"
  en: "The sync file is stored under this folder in the bucket; leave empty to store it at the root. Use only letters, digits and - _ . /."
  zh-TW: "同步檔案放在儲存貯體中的這個目錄下；留空則放在儲存貯體的根目錄。只能使用字母、數字與 - _ . /。"
  ja: 同期ファイルはバケット内のこのフォルダーに置かれます。空欄にするとバケットのルートに置かれます。使えるのは英字、数字、- _ . / だけです。
  ko: 동기화 파일은 버킷 안의 이 폴더에 저장됩니다. 비워 두면 버킷의 루트에 저장됩니다. 영문자, 숫자와 - _ . /만 사용할 수 있습니다.
