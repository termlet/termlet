sync_ui.status.reuploaded:
  zh-CN: "上次同步时同步位置中没有同步文件（被删除，或网盘还没有下载下来），没有删除本机的数据，已用本机的数据重新上传。"
  en: "In the last sync there was no sync file at the sync location (it was deleted, or the cloud drive has not downloaded it yet). Nothing was deleted here; the data on this computer was uploaded again."
  zh-TW: "上次同步時同步位置中沒有同步檔案（被刪除，或雲端硬碟還沒有下載下來），沒有刪除本機的資料，已用本機的資料重新上傳。"
  ja: 前回の同期時、同期先に同期ファイルがありませんでした（削除されたか、クラウドストレージがまだダウンロードしていません）。このコンピューターのデータは削除せず、このコンピューターのデータを再アップロードしました。
  ko: 지난 동기화 때 동기화 위치에 동기화 파일이 없었습니다(삭제되었거나 클라우드 드라이브가 아직 내려받지 않음). 이 컴퓨터의 데이터는 삭제하지 않았고, 이 컴퓨터의 데이터를 다시 업로드했습니다.
sync_ui.status.lost_write:
  zh-CN: "上次同步时发现本机之前上传的修改不在同步文件中（被其他电脑的旧文件覆盖，或同步文件被恢复到了较早的版本），没有采纳其中的删除，本机删除过的已重新删除，并已重新上传本机的修改。"
  en: "In the last sync, changes uploaded earlier from this computer were missing from the sync file (it was overwritten by an older file from another computer, or restored to an earlier version). Deletions in it were not applied, items deleted on this computer were deleted again, and the changes from this computer were uploaded again."
  zh-TW: "上次同步時發現本機之前上傳的變更不在同步檔案中（被其他電腦的舊檔案覆寫，或同步檔案被還原到了較早的版本），沒有採納其中的刪除，本機刪除過的已重新刪除，並已重新上傳本機的變更。"
  ja: 前回の同期時、このコンピューターから以前アップロードした変更が同期ファイルにありませんでした（ほかのコンピューターの古いファイルで上書きされたか、同期ファイルが以前のバージョンに戻されました）。そこに含まれる削除は適用せず、このコンピューターで削除した項目を再度削除し、このコンピューターの変更を再アップロードしました。
  ko: 지난 동기화 때 이 컴퓨터에서 전에 업로드한 변경 사항이 동기화 파일에 없었습니다(다른 컴퓨터의 오래된 파일로 덮어썼거나 동기화 파일이 이전 버전으로 복원됨). 그 안의 삭제는 적용하지 않았고, 이 컴퓨터에서 삭제한 항목은 다시 삭제했으며, 이 컴퓨터의 변경 사항을 다시 업로드했습니다.
sync_ui.status.pending_first:
  zh-CN: "本机与同步位置都有数据，同步已暂停，等你选择怎样同步。"
  en: "Both this computer and the sync location have data. Syncing is paused until you choose how to sync them."
  zh-TW: "本機與同步位置都有資料，同步已暫停，等你選擇如何同步。"
  ja: このコンピューターと同期先の両方にデータがあるため、同期を一時停止しています。どのように同期するかを選択してください。
  ko: 이 컴퓨터와 동기화 위치 모두에 데이터가 있어 동기화를 일시 중지했습니다. 동기화 방법을 선택하세요.
sync_ui.status.pending_deletes:
  zh-CN: "这次同步要删除较多数据，同步已暂停，等你确认。"
