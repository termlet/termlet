sync_ui.form.allow_http:
  zh-CN: "允许不安全的 HTTP（仅限可信的局域网）"
  en: "Allow insecure HTTP (trusted local networks only)"
  zh-TW: "允許不安全的 HTTP（僅限可信任的區域網路）"
  ja: 安全でない HTTP を許可（信頼できる LAN のみ）
  ko: 안전하지 않은 HTTP 허용(신뢰할 수 있는 LAN에서만)
sync_ui.form.allow_http_hint_webdav:
  zh-CN: "使用 HTTP 时，WebDAV 的账号密码会以明文经过网络，同一网络中的人可以看到或篡改请求；同步的数据本身仍是加密的。只在家里、公司的 NAS 等可信的局域网中勾选。"
  en: "Over HTTP, the WebDAV user name and password cross the network in plain text, and anyone on the same network can read or tamper with the requests; the synced data itself stays encrypted. Only check this for a NAS or similar on a trusted local network."
  zh-TW: "使用 HTTP 時，WebDAV 的帳號密碼會以明文經過網路，同一網路中的人可以看到或竄改要求；同步的資料本身仍是加密的。只在家裡、公司的 NAS 等可信任的區域網路中勾選。"
  ja: HTTP を使うと、WebDAV のアカウントとパスワードが平文でネットワークを流れ、同じネットワーク上の人がリクエストを盗み見たり改ざんしたりできます。同期するデータ自体は暗号化されたままです。自宅や会社の NAS など、信頼できる LAN でのみオンにしてください。
  ko: HTTP를 사용하면 WebDAV 계정과 비밀번호가 평문으로 네트워크를 지나가므로 같은 네트워크에 있는 사람이 요청을 보거나 변조할 수 있습니다. 동기화하는 데이터 자체는 계속 암호화되어 있습니다. 집이나 회사의 NAS 등 신뢰할 수 있는 LAN에서만 선택하세요.
sync_ui.form.allow_http_hint_s3:
  zh-CN: "使用 HTTP 时，同一网络中的人可以看到访问的时间与数据量，或在几分钟内重放、篡改请求（秘密访问密钥本身不会发出）；同步的数据本身仍是加密的。只在 MinIO 等部署在可信局域网中的服务上勾选。"
  en: "Over HTTP, anyone on the same network can see when and how much you sync, or replay and tamper with requests for a few minutes (the secret access key itself is never sent); the synced data itself stays encrypted. Only check this for MinIO or similar running on a trusted local network."
  zh-TW: "使用 HTTP 時，同一網路中的人可以看到存取的時間與資料量，或在幾分鐘內重送、竄改要求（秘密存取金鑰本身不會送出）；同步的資料本身仍是加密的。只在 MinIO 等部署在可信任區域網路中的服務上勾選。"
  ja: HTTP を使うと、同じネットワーク上の人がアクセスの日時やデータ量を確認したり、数分以内にリクエストを再送・改ざんしたりできます（シークレットアクセスキー自体は送信されません）。同期するデータ自体は暗号化されたままです。信頼できる LAN 上で動いている MinIO などのサービスでのみオンにしてください。
  ko: HTTP를 사용하면 같은 네트워크에 있는 사람이 접근 시간과 데이터 양을 보거나 몇 분 안에 요청을 재전송·변조할 수 있습니다(비밀 액세스 키 자체는 보내지 않음). 동기화하는 데이터 자체는 계속 암호화되어 있습니다. 신뢰할 수 있는 LAN에서 실행 중인 MinIO 등의 서비스에서만 선택하세요.
