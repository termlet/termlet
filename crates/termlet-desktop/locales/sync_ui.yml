sync_ui.probe.first_device:
  zh-CN: "同步位置中还没有同步文件，这台电脑是第一台设备。同步密码由你在这里确定，请再次输入确认。"
  en: "There is no sync file at the sync location yet, so this is the first computer. The sync password is chosen here; enter it again to confirm."
  zh-TW: "同步位置中還沒有同步檔案，這台電腦是第一台裝置。同步密碼由你在這裡決定，請再次輸入確認。"
  ja: 同期先にはまだ同期ファイルがないため、このコンピューターが最初のデバイスになります。同期パスワードはここで決めます。確認のためもう一度入力してください。
  ko: 동기화 위치에 아직 동기화 파일이 없으므로 이 컴퓨터가 첫 번째 장치입니다. 동기화 비밀번호는 여기에서 정합니다. 확인을 위해 다시 입력하세요.
sync_ui.probe.first_device_gist:
  zh-CN: "这个账号中还没有 Termlet 的 Gist，这台电脑是第一台设备：开始同步时会新建一个私密 Gist。同步密码由你在这里确定，请再次输入确认。"
  en: "This account has no Termlet Gist yet, so this is the first computer: a secret Gist will be created when you start syncing. The sync password is chosen here; enter it again to confirm."
  zh-TW: "這個帳號中還沒有 Termlet 的 Gist，這台電腦是第一台裝置：開始同步時會新增一個私密 Gist。同步密碼由你在這裡決定，請再次輸入確認。"
  ja: このアカウントにはまだ Termlet の Gist がないため、このコンピューターが最初のデバイスになります。同期の開始時にシークレット Gist を新しく作成します。同期パスワードはここで決めます。確認のためもう一度入力してください。
  ko: 이 계정에는 아직 Termlet의 Gist가 없으므로 이 컴퓨터가 첫 번째 장치입니다. 동기화를 시작할 때 비밀 Gist를 새로 만듭니다. 동기화 비밀번호는 여기에서 정합니다. 확인을 위해 다시 입력하세요.
sync_ui.probe.existing:
