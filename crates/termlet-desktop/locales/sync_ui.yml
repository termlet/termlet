  en: "Gist (optional)"
  zh-TW: "Gist（選填）"
  ja: Gist（省略可）
  ko: Gist(선택 사항)
sync_ui.form.gist_id_hint:
  zh-CN: "留空时在这个账号中查找 Termlet 的 Gist，没有就在开始同步时新建一个私密 Gist。也可以填 Gist 的 ID 或网址。"
  en: "Leave empty to find Termlet's Gist in this account, or create a secret Gist when you start syncing if there is none. You can also enter a Gist ID or address."
  zh-TW: "留空時在這個帳號中尋找 Termlet 的 Gist，沒有就在開始同步時新增一個私密 Gist。也可以填 Gist 的 ID 或網址。"
  ja: 空欄にすると、このアカウントで Termlet の Gist を探し、なければ同期の開始時にシークレット Gist を新しく作成します。Gist の ID や URL を入力することもできます。
  ko: 비워 두면 이 계정에서 Termlet의 Gist를 찾고, 없으면 동기화를 시작할 때 비밀 Gist를 새로 만듭니다. Gist의 ID나 URL을 입력할 수도 있습니다.
sync_ui.form.gist_id_placeholder:
  zh-CN: "自动查找或新建"
  en: "Find or create automatically"
  zh-TW: "自動尋找或新增"
  ja: 自動的に検索または作成
  ko: 자동으로 찾거나 만들기
sync_ui.form.gist_limit:
  zh-CN: "Gist 适合数据不多的情况：加密后的同步文件不能超过 %{limit} MB。私密 Gist 不会公开列出，但知道网址的人能看到其中加密后的内容。"
  en: "A Gist suits small amounts of data: the encrypted sync file cannot exceed %{limit} MB. A secret Gist is not listed publicly, but anyone with its address can see the encrypted content."
  zh-TW: "Gist 適合資料不多的情況：加密後的同步檔案不能超過 %{limit} MB。私密 Gist 不會公開列出，但知道網址的人能看到其中加密後的內容。"
  ja: Gist はデータが少ない場合に向いています。暗号化後の同期ファイルは %{limit} MB を超えられません。シークレット Gist は公開の一覧には載りませんが、URL を知っている人は暗号化された内容を見ることができます。
  ko: Gist는 데이터가 많지 않을 때 적합합니다. 암호화한 동기화 파일은 %{limit} MB를 넘을 수 없습니다. 비밀 Gist는 공개 목록에 나타나지 않지만, URL을 아는 사람은 암호화된 내용을 볼 수 있습니다.
