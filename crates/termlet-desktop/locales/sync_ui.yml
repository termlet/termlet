sync_ui.form.edit_hint:
  zh-CN: "更改后按首次同步处理：本机与同步位置都有数据时，会请你选择怎样同步。"
  en: "After the change, the next sync is treated as a first sync: if both this computer and the sync location have data, you will be asked how to sync them."
  zh-TW: "變更後依首次同步處理：本機與同步位置都有資料時，會請你選擇如何同步。"
  ja: 変更後は初回の同期として扱います。このコンピューターと同期先の両方にデータがある場合は、どのように同期するかを選択してください。
  ko: 변경한 뒤에는 처음 동기화하는 것으로 처리합니다. 이 컴퓨터와 동기화 위치 모두에 데이터가 있으면 동기화 방법을 선택하라는 메시지가 표시됩니다.
