sync_ui.description:
  zh-CN: "在多台电脑之间同步主机、分组、凭据、密钥库、凭据档案、快捷命令、端口转发、工作区、终端配色与设置。数据放在你自己的位置（本机文件夹、WebDAV、S3 兼容存储或 GitHub Gist），用同步密码加密后才写入，存放的地方看不到任何内容。本地终端、应用锁、自动快照、检查更新、ssh-agent 地址、被堡垒机调起、会话日志等本机的设置，以及命令历史、审计日志、主机指纹不同步。"
  en: "Syncs hosts, groups, credentials, the key library, credential profiles, snippets, port forwards, workspaces, color schemes and settings between computers. The data stays in a place you choose (a local folder, WebDAV, S3-compatible storage or a GitHub Gist) and is encrypted with your sync password before it is written, so nothing can be read there. Settings that belong to this computer (local terminals, app lock, automatic snapshots, update checks, the ssh-agent address, launching from bastion hosts, session logs), command history, the audit log and host fingerprints are not synced."
  zh-TW: "在多台電腦之間同步主機、群組、認證資訊、金鑰庫、認證資訊設定檔、快速指令、連接埠轉送、工作區、終端機配色與設定。資料放在你自己的位置（本機資料夾、WebDAV、S3 相容儲存空間或 GitHub Gist），用同步密碼加密後才寫入，存放的地方看不到任何內容。本機終端機、應用程式鎖定、自動快照、檢查更新、ssh-agent 位址、由堡壘主機啟動、工作階段記錄等本機的設定，以及指令歷史記錄、稽核記錄、主機指紋不同步。"
  ja: ホスト、グループ、認証情報、鍵ライブラリ、認証プロファイル、スニペット、ポート転送、ワークスペース、ターミナルの配色、設定を複数のコンピューター間で同期します。データは自分で選んだ場所（ローカルフォルダー、WebDAV、S3 互換ストレージ、GitHub Gist）に置かれ、同期パスワードで暗号化してから書き込まれるため、保存先からは内容を一切読み取れません。ローカルターミナル、アプリロック、自動スナップショット、更新の確認、ssh-agent のアドレス、要塞ホストからの起動、セッションログなどこのコンピューター固有の設定と、コマンド履歴、監査ログ、ホストキーは同期されません。
  ko: 호스트, 그룹, 자격 증명, 키 라이브러리, 자격 증명 프로필, 스니펫, 포트 포워딩, 작업 영역, 터미널 색 구성표, 설정을 여러 컴퓨터 간에 동기화합니다. 데이터는 직접 정한 위치(로컬 폴더, WebDAV, S3 호환 스토리지, GitHub Gist)에 두며, 동기화 비밀번호로 암호화한 뒤에 쓰므로 저장 위치에서는 어떤 내용도 볼 수 없습니다. 로컬 터미널, 앱 잠금, 자동 스냅샷, 업데이트 확인, ssh-agent 주소, 배스천 호스트에서 시작, 세션 로그 등 이 컴퓨터의 설정과 명령 기록, 감사 로그, 호스트 키는 동기화하지 않습니다.
