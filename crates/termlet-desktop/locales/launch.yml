_version: 2
launch.confirm_title:
  zh-CN: 外部程序请求打开连接
  en: Another program wants to open a connection
  zh-TW: 外部程式要求開啟連線
  ja: 外部プログラムが接続を開くよう要求しています
  ko: 외부 프로그램이 연결 열기를 요청했습니다
launch.confirm_body:
  zh-CN: 堡垒机等程序以 Xshell、PuTTY、WinSCP 等的启动参数请求打开 %{target} 的%{kind}。作为临时连接打开：不保存到主机列表，密码只在内存中。可在“设置 → 连接”中设为不再询问。
  en: A bastion host or a similar program asked to open %{kind} for %{target} using Xshell, PuTTY, WinSCP or similar arguments. It opens as a temporary connection that isn't saved to the host list; the password stays in memory. You can stop asking under Settings → Connection.
  zh-TW: 堡壘主機等程式以 Xshell、PuTTY、WinSCP 等的啟動參數，要求開啟 %{target} 的%{kind}。將作為臨時連線開啟：不儲存到主機清單，密碼只保留在記憶體中。可在「設定 → 連線」中設為不再詢問。
  ja: 要塞ホストなどのプログラムが、Xshell、PuTTY、WinSCP などの起動引数で %{target} の%{kind}を開くよう要求しました。一時的な接続として開きます。ホスト一覧には保存せず、パスワードはメモリ内にのみ保持します。「設定 → 接続」で今後確認しないように設定できます。
  ko: 배스천 호스트 등의 프로그램이 Xshell, PuTTY, WinSCP 등의 시작 인수로 %{target}의 %{kind} 열기를 요청했습니다. 임시 연결로 열리며 호스트 목록에 저장되지 않고, 비밀번호는 메모리에만 보관됩니다. '설정 → 연결'에서 다시 묻지 않도록 설정할 수 있습니다.
