launch.ignored:
  zh-CN: 已忽略外部程序打开 %{target} 的请求，可在“设置 → 连接”中开启
  en: Ignored a request from another program to open %{target}. You can allow it under Settings → Connection.
  zh-TW: 已忽略外部程式開啟 %{target} 的要求，可在「設定 → 連線」中開啟
  ja: 外部プログラムからの %{target} を開く要求を無視しました。「設定 → 接続」で許可できます
  ko: 외부 프로그램의 %{target} 열기 요청을 무시했습니다. '설정 → 연결'에서 허용할 수 있습니다
launch.no_duplicate:
  zh-CN: 外部程序调起的临时连接只用一个通道，不能复制会话或分屏
  en: Temporary connections opened by another program use a single channel and can't be duplicated or split
  zh-TW: 由外部程式啟動的臨時連線只用一個通道，不能複製工作階段或分割畫面
  ja: 外部プログラムから起動した一時的な接続はチャネルを 1 つしか使わないため、セッションの複製や画面分割はできません
  ko: 외부 프로그램이 연 임시 연결은 채널을 하나만 사용하므로 세션을 복제하거나 화면을 분할할 수 없습니다
