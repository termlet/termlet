forward.any_warning:
  zh-CN: 监听 %{address} 时，局域网内的其他设备也能经本机访问该目标，且无需任何认证。请只在可信网络中使用。
  en: When listening on %{address}, other devices on your network can reach the target through this computer without any authentication. Use it only on trusted networks.
  zh-TW: 監聽 %{address} 時，區域網路內的其他裝置也能經本機存取該目標，且不需任何驗證。請只在受信任的網路中使用。
  ja: "%{address} で待ち受けると、LAN 内の他のデバイスもこのコンピューターを経由して転送先に、認証なしでアクセスできます。信頼できるネットワークでのみ使用してください。"
  ko: "%{address}에서 수신 대기하면 LAN의 다른 장치도 인증 없이 이 컴퓨터를 거쳐 대상에 접근할 수 있습니다. 신뢰할 수 있는 네트워크에서만 사용하세요."
forward.remote_any_warning:
  zh-CN: 监听服务器的所有网卡时，能访问服务器的设备都能经它连到本机的目标，且无需任何认证；服务器还需开启 GatewayPorts，否则仍只监听服务器本机。
  en: When listening on all server interfaces, anything that can reach the server can reach the target on this computer without any authentication. The server must also enable GatewayPorts; otherwise it still listens on loopback only.
  zh-TW: 監聽伺服器的所有網路介面時，能存取伺服器的裝置都能經由它連到本機的目標，且不需任何驗證；伺服器還需開啟 GatewayPorts，否則仍只監聽伺服器本身。
  ja: サーバーのすべてのネットワークインターフェイスで待ち受けると、サーバーにアクセスできるデバイスはすべて、サーバーを経由してこのコンピューターの転送先に認証なしで接続できます。また、サーバーで GatewayPorts を有効にする必要があり、そうでない場合はサーバー自身でのみ待ち受けます。
  ko: 서버의 모든 네트워크 인터페이스에서 수신 대기하면 서버에 접근할 수 있는 모든 장치가 인증 없이 서버를 거쳐 이 컴퓨터의 대상에 연결할 수 있습니다. 또한 서버에서 GatewayPorts를 켜야 하며, 그렇지 않으면 여전히 서버 자신에서만 수신 대기합니다.
