  en: Listening on all server interfaces; anything that can reach the server can reach the target through it
  zh-TW: 監聽伺服器的所有網路介面，能存取伺服器的裝置都能經由它連到本機的目標
  ja: サーバーのすべてのネットワークインターフェイスで待ち受け中。サーバーにアクセスできるデバイスはすべて、サーバー経由でこのコンピューターの転送先に接続できます
  ko: 서버의 모든 네트워크 인터페이스에서 수신 대기 중. 서버에 접근할 수 있는 모든 장치가 서버를 거쳐 이 컴퓨터의 대상에 연결할 수 있음
