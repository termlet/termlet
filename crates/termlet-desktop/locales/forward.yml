  zh-TW: 監聽 %{address}，區域網路內的其他裝置也能存取
  ja: "%{address} で待ち受け中。LAN 内の他のデバイスもアクセスできます"
  ko: "%{address}에서 수신 대기 중. LAN의 다른 장치도 접근할 수 있음"
forward.remote_any_badge:
