  zh-TW: "%{conns} 個連線 · ↓ %{bytes_in} ↑ %{bytes_out}"
  ja: "%{conns} 個の接続 · ↓ %{bytes_in} ↑ %{bytes_out}"
  ko: 연결 %{conns}개 · ↓ %{bytes_in} ↑ %{bytes_out}
forward.reconnecting:
  zh-CN: SSH 连接已断开，正在重连（第 %{attempt} 次）…
  en: The SSH connection was lost. Reconnecting (attempt %{attempt})…
  zh-TW: SSH 連線已中斷，正在重新連線（第 %{attempt} 次）…
  ja: SSH 接続が切断されました。再接続しています（%{attempt} 回目）…
  ko: SSH 연결이 끊어졌습니다. 다시 연결하는 중(%{attempt}번째)…
forward.target_failed:
  zh-CN: 最近一次连接目标失败：%{message}
  en: "The last connection to the target failed: %{message}"
  zh-TW: 最近一次連線到目標失敗：%{message}
  ja: 直近の転送先への接続に失敗しました：%{message}
  ko: "최근 대상 연결에 실패했습니다: %{message}"
forward.confirm_delete:
  zh-CN: 确定删除端口转发“%{name}”吗？
  en: Delete the port forward “%{name}”?
  zh-TW: 確定要刪除連接埠轉送「%{name}」嗎？
  ja: ポート転送「%{name}」を削除しますか？
  ko: "'%{name}' 포트 포워딩을 삭제하시겠습니까?"
forward.label_remote:
  zh-CN: 服务器 %{port} → %{target}
  en: Server %{port} → %{target}
  zh-TW: 伺服器 %{port} → %{target}
  ja: サーバー %{port} → %{target}
  ko: 서버 %{port} → %{target}
forward.route_remote:
  zh-CN: 服务器 %{bind} → 本机 %{target}
  en: Server %{bind} → local %{target}
  zh-TW: 伺服器 %{bind} → 本機 %{target}
  ja: サーバー %{bind} → ローカル %{target}
  ko: 서버 %{bind} → 로컬 %{target}
forward.add_for_host:
  zh-CN: 为此主机添加端口转发…
  en: Add a Port Forward for This Host…
  zh-TW: 為此主機新增連接埠轉送…
  ja: このホストにポート転送を追加…
  ko: 이 호스트에 포트 포워딩 추가…
forward.title_bar:
  zh-CN: "%{count} 个转发"
  en: "%{count} tunnels"
  zh-TW: "%{count} 個轉送"
  ja: "%{count} 件のポート転送"
  ko: 포트 포워딩 %{count}개
forward.title_bar_hint:
  zh-CN: 运行中的端口转发
  en: Running port forwards
  zh-TW: 執行中的連接埠轉送
  ja: 実行中のポート転送
  ko: 실행 중인 포트 포워딩
forward.started:
  zh-CN: 端口转发“%{name}”已启动
  en: Port forward “%{name}” started
  zh-TW: 連接埠轉送「%{name}」已啟動
  ja: ポート転送「%{name}」を開始しました
  ko: "'%{name}' 포트 포워딩을 시작했습니다"
forward.browser_opened:
  zh-CN: "已转发到本机 %{address}，正在浏览器中打开"
  en: "Forwarded to %{address} on this computer; opening in the browser"
  zh-TW: "已轉送到本機 %{address}，正在瀏覽器中開啟"
  ja: "このコンピューターの %{address} に転送しました。ブラウザーで開いています"
  ko: "이 컴퓨터의 %{address}(으)로 포워딩했습니다. 브라우저에서 여는 중입니다"
forward.browser_no_port:
  zh-CN: "本机没有空闲的端口可以转发"
  en: "No free port on this computer to forward to"
  zh-TW: "本機沒有空閒的連接埠可以轉送"
  ja: "このコンピューターに転送先の空きポートがありません"
  ko: "이 컴퓨터에 포워딩할 빈 포트가 없습니다"
forward.detect_ports:
  zh-CN: 检测服务器端口
  en: Detect Server Ports
  zh-TW: 偵測伺服器連接埠
  ja: サーバーのポートを検出
  ko: 서버 포트 검색
forward.no_ports:
  zh-CN: 没有检测到正在监听的端口
  en: No listening ports found
  zh-TW: 沒有偵測到正在監聽的連接埠
  ja: 待ち受け中のポートは見つかりませんでした
  ko: 수신 대기 중인 포트를 찾지 못했습니다
forward.error.rule_not_found:
  zh-CN: 这条转发规则已被删除
  en: This forward rule has been deleted
  zh-TW: 這條轉送規則已被刪除
  ja: このポート転送ルールは削除されました
  ko: 이 포워딩 규칙은 삭제되었습니다
forward.error.host_not_found:
  zh-CN: 转发经由的主机已被删除
  en: The host this forward goes through has been deleted
  zh-TW: 轉送經由的主機已被刪除
  ja: ポート転送が経由するホストは削除されました
  ko: 포워딩이 경유하는 호스트가 삭제되었습니다
forward.error.not_ssh:
  zh-CN: 转发经由的主机不是 SSH 主机
  en: The host this forward goes through isn't an SSH host
  zh-TW: 轉送經由的主機不是 SSH 主機
  ja: ポート転送が経由するホストは SSH ホストではありません
  ko: 포워딩이 경유하는 호스트가 SSH 호스트가 아닙니다
forward.error.port_in_use:
  zh-CN: 本地地址 %{address} 已被占用，请换一个端口
  en: The local address %{address} is already in use. Choose another port.
  zh-TW: 本機位址 %{address} 已被佔用，請換一個連接埠
  ja: ローカルアドレス %{address} は使用中です。別のポートを選んでください
  ko: 로컬 주소 %{address}은(는) 이미 사용 중입니다. 다른 포트를 선택하세요
forward.error.listen_denied:
  zh-CN: 无法监听 %{address}：端口被系统保留或没有权限，请换一个端口
  en: Can't listen on %{address}. The port is reserved by the system or not permitted; choose another port.
  zh-TW: 無法監聽 %{address}：連接埠被系統保留或沒有權限，請換一個連接埠
  ja: "%{address} で待ち受けできません：ポートがシステムで予約されているか、権限がありません。別のポートを選んでください"
  ko: "%{address}에서 수신 대기할 수 없습니다: 시스템에서 예약한 포트이거나 권한이 없습니다. 다른 포트를 선택하세요"
forward.error.address_unavailable:
  zh-CN: 本机没有地址 %{address}
  en: This computer doesn't have the address %{address}
  zh-TW: 本機沒有位址 %{address}
  ja: このコンピューターにアドレス %{address} はありません
  ko: 이 컴퓨터에 %{address} 주소가 없습니다
forward.error.listen:
  zh-CN: 无法监听 %{address}：%{reason}
  en: "Can't listen on %{address}: %{reason}"
  zh-TW: 無法監聽 %{address}：%{reason}
  ja: "%{address} で待ち受けできません：%{reason}"
  ko: "%{address}에서 수신 대기할 수 없습니다: %{reason}"
forward.error.remote_listen_denied:
  zh-CN: 服务器拒绝在 %{address} 监听：端口可能已被占用、低于 1024，或服务器不允许远程转发（AllowTcpForwarding）
  en: The server refused to listen on %{address}. The port may be in use or below 1024, or the server doesn't allow remote forwarding (AllowTcpForwarding).
  zh-TW: 伺服器拒絕在 %{address} 監聽：連接埠可能已被佔用、低於 1024，或伺服器不允許遠端轉送（AllowTcpForwarding）
  ja: サーバーが %{address} での待ち受けを拒否しました。ポートが使用中か 1024 未満であるか、サーバーがリモート転送を許可していません（AllowTcpForwarding）
  ko: 서버가 %{address}에서 수신 대기를 거부했습니다. 포트가 이미 사용 중이거나 1024 미만이거나, 서버에서 원격 포워딩을 허용하지 않습니다(AllowTcpForwarding)
forward.error.single_channel:
  zh-CN: 这台主机只用一个通道（堡垒机），不能共用终端的连接
  en: This host uses a single channel (bastion), so the terminal's connection can't be shared
  zh-TW: 這台主機只用一個通道（堡壘主機），無法共用終端機的連線
  ja: このホストはチャネルを 1 つだけ使用する（要塞ホスト）ため、ターミナルの接続を共有できません
  ko: 이 호스트는 채널 하나만 사용하므로(배스천 호스트) 터미널 연결을 공유할 수 없습니다
forward.error.stopped:
  zh-CN: 转发已被停止
  en: The forward was stopped
  zh-TW: 轉送已被停止
  ja: ポート転送は停止されました
  ko: 포워딩이 중지되었습니다
forward.target.unreachable:
  zh-CN: 服务器无法连接 %{target}（目标没有服务、不可达或域名解析失败）
  en: The server couldn't connect to %{target} (nothing listening, unreachable, or the name didn't resolve)
  zh-TW: 伺服器無法連線到 %{target}（目標沒有服務、無法到達或網域名稱解析失敗）
  ja: サーバーから %{target} に接続できません（転送先でサービスが動いていない、到達できない、またはドメイン名を解決できません）
  ko: 서버에서 %{target}에 연결할 수 없습니다(대상에 서비스가 없거나, 연결할 수 없거나, 도메인 이름을 확인하지 못함)
forward.target.prohibited:
  zh-CN: 服务器不允许转发到 %{target}
  en: The server doesn't allow forwarding to %{target}
  zh-TW: 伺服器不允許轉送到 %{target}
  ja: サーバーが %{target} への転送を許可していません
  ko: 서버에서 %{target}(으)로의 포워딩을 허용하지 않습니다
forward.target.channel:
  zh-CN: 经服务器连接 %{target} 失败：%{reason}
  en: "Connecting to %{target} through the server failed: %{reason}"
  zh-TW: 經伺服器連線到 %{target} 失敗：%{reason}
  ja: サーバー経由での %{target} への接続に失敗しました：%{reason}
  ko: "서버를 거쳐 %{target}에 연결하지 못했습니다: %{reason}"
forward.target.local_refused:
  zh-CN: 本机的 %{target} 拒绝连接
  en: "%{target} on this computer refused the connection"
  zh-TW: 本機的 %{target} 拒絕連線
  ja: このコンピューターの %{target} が接続を拒否しました
  ko: 이 컴퓨터의 %{target}에서 연결을 거부했습니다
forward.target.local:
  zh-CN: 连接本机的 %{target} 失败：%{reason}
  en: "Connecting to %{target} on this computer failed: %{reason}"
  zh-TW: 連線到本機的 %{target} 失敗：%{reason}
  ja: このコンピューターの %{target} への接続に失敗しました：%{reason}
  ko: "이 컴퓨터의 %{target}에 연결하지 못했습니다: %{reason}"
forward.socks.read:
  zh-CN: 读取 SOCKS 请求失败
  en: Couldn't read the SOCKS request
  zh-TW: 讀取 SOCKS 要求失敗
  ja: SOCKS リクエストを読み取れませんでした
  ko: SOCKS 요청을 읽지 못했습니다
forward.socks.timeout:
  zh-CN: SOCKS 握手超时
  en: The SOCKS handshake timed out
  zh-TW: SOCKS 交握逾時
  ja: SOCKS ハンドシェイクがタイムアウトしました
  ko: SOCKS 핸드셰이크 시간이 초과되었습니다
forward.socks.not_socks:
  zh-CN: 收到的不是 SOCKS 请求，请在客户端把代理类型设为 SOCKS5
  en: That wasn't a SOCKS request. Set the proxy type to SOCKS5 in the client.
  zh-TW: 收到的不是 SOCKS 要求，請在用戶端把代理伺服器類型設為 SOCKS5
  ja: 受信したのは SOCKS リクエストではありません。クライアントでプロキシの種類を SOCKS5 に設定してください
  ko: 받은 요청이 SOCKS 요청이 아닙니다. 클라이언트에서 프록시 유형을 SOCKS5로 설정하세요
forward.socks.auth_required:
  zh-CN: 客户端要求用户名密码认证；动态转发不需要认证，请在客户端去掉代理的用户名密码
  en: The client asked for user name and password authentication. Dynamic forwards don't need it; remove the proxy credentials in the client.
  zh-TW: 用戶端要求使用者名稱與密碼驗證；動態轉送不需要驗證，請在用戶端移除代理伺服器的使用者名稱與密碼
  ja: クライアントがユーザー名とパスワードによる認証を要求しました。ダイナミック転送では認証は不要なので、クライアントでプロキシのユーザー名とパスワードを削除してください
  ko: 클라이언트가 사용자 이름과 비밀번호 인증을 요청했습니다. 동적 포워딩은 인증이 필요 없으므로 클라이언트에서 프록시의 사용자 이름과 비밀번호를 제거하세요
forward.socks.unsupported_command:
  zh-CN: 不支持的 SOCKS 命令 %{command}，只支持 CONNECT
  en: SOCKS command %{command} isn't supported; only CONNECT is
  zh-TW: 不支援的 SOCKS 指令 %{command}，只支援 CONNECT
  ja: SOCKS コマンド %{command} には対応していません。対応しているのは CONNECT のみです
  ko: SOCKS 명령 %{command}은(는) 지원하지 않습니다. CONNECT만 지원합니다
forward.socks.unsupported_address:
  zh-CN: 不支持的 SOCKS 地址类型 %{kind}
  en: SOCKS address type %{kind} isn't supported
  zh-TW: 不支援的 SOCKS 位址類型 %{kind}
  ja: SOCKS のアドレスの種類 %{kind} には対応していません
  ko: SOCKS 주소 유형 %{kind}은(는) 지원하지 않습니다
forward.socks.bad_domain:
  zh-CN: SOCKS 请求中的域名格式不正确
  en: The domain name in the SOCKS request is malformed
  zh-TW: SOCKS 要求中的網域名稱格式不正確
  ja: SOCKS リクエスト内のドメイン名の形式が正しくありません
  ko: SOCKS 요청의 도메인 이름 형식이 올바르지 않습니다
forward.socks.malformed:
  zh-CN: SOCKS 请求格式错误
  en: The SOCKS request is malformed
  zh-TW: SOCKS 要求格式錯誤
  ja: SOCKS リクエストの形式が正しくありません
  ko: SOCKS 요청 형식이 올바르지 않습니다
