forward.empty:
  zh-CN: 还没有端口转发。本地转发让访问本机端口的连接经 SSH 到达服务器能访问的地址（等同 ssh -L）；动态转发在本机开一个 SOCKS5 代理（等同 ssh -D）。
  en: No port forwards yet. A local forward sends connections to a local port through SSH to an address the server can reach (like ssh -L); a dynamic forward opens a SOCKS5 proxy on this computer (like ssh -D).
  zh-TW: 還沒有連接埠轉送。本機轉送讓連到本機連接埠的連線經 SSH 到達伺服器能存取的位址（等同 ssh -L）；動態轉送在本機開啟一個 SOCKS5 代理伺服器（等同 ssh -D）。
  ja: ポート転送はまだありません。ローカル転送は、ローカルポートへの接続を SSH 経由でサーバーからアクセスできるアドレスに届けます（ssh -L と同等）。ダイナミック転送は、このコンピューターで SOCKS5 プロキシを開きます（ssh -D と同等）。
  ko: 아직 포트 포워딩이 없습니다. 로컬 포워딩은 로컬 포트로 들어오는 연결을 SSH를 통해 서버에서 접근할 수 있는 주소로 보냅니다(ssh -L과 같음). 동적 포워딩은 이 컴퓨터에 SOCKS5 프록시를 엽니다(ssh -D와 같음).
forward.dialog_hint:
  zh-CN: 访问本机的本地端口时，连接经所选主机的 SSH 转发到目标地址与端口。目标地址由服务器解析，127.0.0.1 表示服务器本机。
  en: Connections to the local port are forwarded over SSH through the selected host to the target address and port. The target is resolved by the server; 127.0.0.1 means the server itself.
  zh-TW: 連到本機連接埠時，連線會經所選主機的 SSH 轉送到目標位址與連接埠。目標位址由伺服器解析，127.0.0.1 表示伺服器本身。
  ja: このコンピューターのローカルポートへの接続は、選択したホストの SSH を経由して転送先のアドレスとポートに転送されます。転送先のアドレスはサーバー側で解決され、127.0.0.1 はサーバー自身を指します。
  ko: 이 컴퓨터의 로컬 포트로 들어오는 연결은 선택한 호스트의 SSH를 거쳐 대상 주소와 포트로 포워딩됩니다. 대상 주소는 서버에서 확인하며, 127.0.0.1은 서버 자신을 뜻합니다.
forward.dialog_hint_remote:
  zh-CN: 服务器在所选地址与端口上监听，连到这个端口的连接经 SSH 回到本机，再转到目标地址与端口。目标地址由本机解析，127.0.0.1 表示本机。
  en: The server listens on the chosen address and port; connections to it come back over SSH to this computer and on to the target. The target is resolved here, so 127.0.0.1 means this computer.
  zh-TW: 伺服器在所選位址與連接埠上監聽，連到這個連接埠的連線會經 SSH 回到本機，再轉到目標位址與連接埠。目標位址由本機解析，127.0.0.1 表示本機。
  ja: サーバーが選択したアドレスとポートで待ち受け、そのポートへの接続は SSH を経由してこのコンピューターに戻り、転送先のアドレスとポートに転送されます。転送先のアドレスはこのコンピューターで解決され、127.0.0.1 はこのコンピューターを指します。
  ko: 서버가 선택한 주소와 포트에서 수신 대기하며, 이 포트로 들어오는 연결은 SSH를 거쳐 이 컴퓨터로 돌아온 다음 대상 주소와 포트로 전달됩니다. 대상 주소는 이 컴퓨터에서 확인하며, 127.0.0.1은 이 컴퓨터를 뜻합니다.
forward.dialog_hint_dynamic:
  zh-CN: 在本机开一个 SOCKS5 代理（无需认证）。把浏览器等程序的代理设为它后，连接都经所选主机的 SSH 转出，域名由服务器解析，可以访问服务器所在的内网。
  en: Opens a SOCKS5 proxy (no authentication) on this computer. Point a browser or another program at it and its connections go out through SSH on the selected host; names are resolved by the server, so hosts on its internal network are reachable.
  zh-TW: 在本機開啟一個 SOCKS5 代理伺服器（不需驗證）。把瀏覽器等程式的代理伺服器設為它之後，連線都會經所選主機的 SSH 轉出，網域名稱由伺服器解析，可以存取伺服器所在的內部網路。
  ja: このコンピューターで SOCKS5 プロキシ（認証なし）を開きます。ブラウザーなどのプロキシにこれを設定すると、接続はすべて選択したホストの SSH を経由して外に出ます。ドメイン名はサーバー側で解決されるため、サーバーのある内部ネットワークにアクセスできます。
  ko: 이 컴퓨터에 SOCKS5 프록시(인증 없음)를 엽니다. 브라우저 등의 프로그램에서 이 프록시를 지정하면 연결이 모두 선택한 호스트의 SSH를 거쳐 나가며, 도메인 이름은 서버에서 확인하므로 서버가 있는 내부 네트워크에 접근할 수 있습니다.
