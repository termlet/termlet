toolbar.nav:
  zh-CN: 工具栏
  en: Toolbar
  zh-TW: 工具列
  ja: ツールバー
  ko: 도구 모음
toolbar.settings_hint:
  zh-CN: 标题栏右侧显示哪些按钮、按什么顺序（只在这台电脑上）。有的按钮只在需要时出现；隐藏的按钮对应的功能仍可从命令面板与快捷键使用。窗口放不下时，排在后面的按钮收进“更多”菜单。
  en: Choose which buttons appear on the right of the title bar, and in what order (on this computer only). Some buttons appear only when needed; hidden buttons stay available from the command palette and their shortcuts. When the window is too narrow, the last buttons move into the More menu.
  zh-TW: 標題列右側顯示哪些按鈕、按什麼順序（只在這台電腦上）。有的按鈕只在需要時出現；隱藏的按鈕對應的功能仍可從命令選擇區與快速鍵使用。視窗放不下時，排在後面的按鈕收進「更多」選單。
  ja: タイトルバーの右側に表示するボタンと順序を設定します（このコンピューターのみ）。必要なときだけ表示されるボタンもあります。非表示にしたボタンの機能は、コマンドパレットとショートカットキーから引き続き使用できます。ウィンドウに収まらないときは、後ろのボタンが「その他」メニューに入ります。
  ko: 제목 표시줄 오른쪽에 표시할 버튼과 순서를 정합니다(이 컴퓨터에만 적용). 필요할 때만 나타나는 버튼도 있습니다. 숨긴 버튼의 기능은 명령 팔레트와 바로 가기 키에서 계속 사용할 수 있습니다. 창에 다 들어가지 않으면 뒤쪽 버튼은 '더 보기' 메뉴로 들어갑니다.
