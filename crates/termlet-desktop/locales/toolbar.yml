toolbar.hidden:
  zh-CN: 已隐藏“%{name}”。可在设置的“工具栏”中重新显示，它的功能仍可从命令面板使用。
  en: Hid "%{name}". You can show it again in Settings > Toolbar; it's still available from the command palette.
  zh-TW: 已隱藏「%{name}」。可在設定的「工具列」中重新顯示，它的功能仍可從命令選擇區使用。
  ja: 「%{name}」を非表示にしました。設定の「ツールバー」で再び表示できます。機能はコマンドパレットから引き続き使用できます。
  ko: "'%{name}'을(를) 숨겼습니다. 설정의 '도구 모음'에서 다시 표시할 수 있으며, 기능은 명령 팔레트에서 계속 사용할 수 있습니다."
