_version: 2
profiles.hint:
  zh-CN: 多台主机共用的用户名与认证
  en: A user name and authentication shared by several hosts
  zh-TW: 多台主機共用的使用者名稱與驗證
  ja: 複数のホストで共有するユーザー名と認証
  ko: 여러 호스트가 함께 쓰는 사용자 이름과 인증
profiles.new:
  zh-CN: 新建凭据档案…
  en: New credential profile…
  zh-TW: 新增認證資訊設定檔…
  ja: 新しい認証プロファイル…
  ko: 새 자격 증명 프로필…
profiles.empty:
  zh-CN: 还没有凭据档案。编辑主机时可以选用，分组也可以设为默认值；改一处即对所有使用它的主机生效。
  en: No credential profiles yet. Hosts can use one, and groups can set one as their default. Changing it updates every host that uses it.
  zh-TW: 還沒有認證資訊設定檔。編輯主機時可以選用，群組也可以設為預設值；改一處即對所有使用它的主機生效。
  ja: 認証プロファイルはまだありません。ホストの編集時に選択でき、グループのデフォルトにも設定できます。1 か所を変更すると、それを使うすべてのホストに反映されます。
  ko: 아직 자격 증명 프로필이 없습니다. 호스트를 편집할 때 선택할 수 있고, 그룹의 기본값으로도 설정할 수 있습니다. 한 곳만 바꾸면 이 프로필을 쓰는 모든 호스트에 적용됩니다.
profiles.row.detail:
  zh-CN: "%{username} · %{auth} · %{hosts} 台主机、%{groups} 个分组"
  en: "%{username} · %{auth} · %{hosts} hosts, %{groups} groups"
  zh-TW: "%{username} · %{auth} · %{hosts} 台主機、%{groups} 個群組"
  ja: "%{username} · %{auth} · ホスト %{hosts} 台、グループ %{groups} 個"
  ko: "%{username} · %{auth} · 호스트 %{hosts}대, 그룹 %{groups}개"
