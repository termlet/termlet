lock_ui.diag.log_level.hint:
  zh-CN: 保存后立即生效。详细的日志可能很大，问题排查完请改回普通；日志中不记密码、私钥与命令内容。也可以用启动参数 --log-level detailed（或 --verbose）、--log-level full 指定。
  en: Takes effect as soon as you save. Detailed logs can grow large, so switch back to Normal when you're done; passwords, private keys and commands are never logged. You can also start Termlet with --log-level detailed (or --verbose) or --log-level full.
  zh-TW: 儲存後立即生效。詳細的記錄可能很大，問題排解完請改回一般；記錄中不會記下密碼、私密金鑰與指令內容。也可以用啟動參數 --log-level detailed（或 --verbose）、--log-level full 指定。
  ja: 保存するとすぐに反映されます。詳細なログはサイズが大きくなることがあるため、問題の調査が終わったら「標準」に戻してください。パスワード、秘密鍵、コマンドの内容はログに記録されません。起動オプション --log-level detailed（または --verbose）、--log-level full でも指定できます。
  ko: 저장하면 바로 적용됩니다. 자세한 로그는 크기가 커질 수 있으므로 문제 해결이 끝나면 '보통'으로 되돌리세요. 비밀번호, 개인 키, 명령 내용은 로그에 기록하지 않습니다. 시작 옵션 --log-level detailed(또는 --verbose), --log-level full로도 지정할 수 있습니다.
