lock_ui.security.description:
  zh-CN: "锁定后要输入锁定密码（或使用 Windows Hello）才能继续使用，已打开的会话在后台继续运行；锁定期间 termlet 命令行工具返回退出码 6。锁定密码只挡住界面，保存的密码与私钥由系统钥匙串或主密码加密。按 %{key} 立即锁定。"
  en: "When locked, enter the lock password (or use Windows Hello) to continue. Open sessions keep running in the background, and the termlet CLI returns exit code 6 while locked. The lock password only guards the window; saved passwords and private keys are encrypted by the system keychain or your master password. Press %{key} to lock now."
  zh-TW: "鎖定後要輸入鎖定密碼（或使用 Windows Hello）才能繼續使用，已開啟的工作階段會在背景繼續執行；鎖定期間 termlet 命令列工具會傳回結束代碼 6。鎖定密碼只擋住介面，儲存的密碼與私密金鑰由系統鑰匙圈或主密碼加密。按 %{key} 立即鎖定。"
  ja: ロック中は、ロックパスワードを入力する（または Windows Hello を使う）と使用を再開できます。開いているセッションはバックグラウンドで実行を続けます。ロック中、termlet コマンドラインツールは終了コード 6 を返します。ロックパスワードは画面を隠すだけで、保存したパスワードや秘密鍵はシステムのキーチェーンまたはマスターパスワードで暗号化されます。%{key} を押すとすぐにロックします。
  ko: 잠긴 동안에는 잠금 비밀번호를 입력하거나 Windows Hello를 사용해야 계속 쓸 수 있으며, 열려 있는 세션은 백그라운드에서 계속 실행됩니다. 잠긴 동안 termlet 명령줄 도구는 종료 코드 6을 반환합니다. 잠금 비밀번호는 화면만 가리며, 저장한 비밀번호와 개인 키는 시스템 키체인이나 마스터 비밀번호로 암호화됩니다. %{key}을(를) 누르면 바로 잠급니다.
lock_ui.security.description_no_key:
  zh-CN: "锁定后要输入锁定密码（或使用 Windows Hello）才能继续使用，已打开的会话在后台继续运行；锁定期间 termlet 命令行工具返回退出码 6。锁定密码只挡住界面，保存的密码与私钥由系统钥匙串或主密码加密。"
  en: "When locked, enter the lock password (or use Windows Hello) to continue. Open sessions keep running in the background, and the termlet CLI returns exit code 6 while locked. The lock password only guards the window; saved passwords and private keys are encrypted by the system keychain or your master password."
  zh-TW: "鎖定後要輸入鎖定密碼（或使用 Windows Hello）才能繼續使用，已開啟的工作階段會在背景繼續執行；鎖定期間 termlet 命令列工具會傳回結束代碼 6。鎖定密碼只擋住介面，儲存的密碼與私密金鑰由系統鑰匙圈或主密碼加密。"
  ja: ロック中は、ロックパスワードを入力する（または Windows Hello を使う）と使用を再開できます。開いているセッションはバックグラウンドで実行を続けます。ロック中、termlet コマンドラインツールは終了コード 6 を返します。ロックパスワードは画面を隠すだけで、保存したパスワードや秘密鍵はシステムのキーチェーンまたはマスターパスワードで暗号化されます。
  ko: 잠긴 동안에는 잠금 비밀번호를 입력하거나 Windows Hello를 사용해야 계속 쓸 수 있으며, 열려 있는 세션은 백그라운드에서 계속 실행됩니다. 잠긴 동안 termlet 명령줄 도구는 종료 코드 6을 반환합니다. 잠금 비밀번호는 화면만 가리며, 저장한 비밀번호와 개인 키는 시스템 키체인이나 마스터 비밀번호로 암호화됩니다.
