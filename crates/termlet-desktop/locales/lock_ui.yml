lock_ui.master.title:
  zh-CN: "主密码"
  en: "Master password"
  zh-TW: "主密碼"
  ja: マスターパスワード
  ko: 마스터 비밀번호
lock_ui.master.description:
  zh-CN: "这台电脑没有可用的系统钥匙串，保存的密码、私钥等用主密码加密，每次启动时输入；应用锁的锁定密码只挡住界面，与主密码无关。修改后用新的主密码解锁，保存的内容不用重新加密。只影响这台电脑：云同步用的是同步密码，其他电脑有各自的钥匙串或主密码，不用跟着改。"
  en: "No system keychain is available on this computer, so saved passwords, private keys and other secrets are encrypted with your master password, which you enter at each start; the app lock password only guards the window and is separate from it. After a change you unlock with the new one; saved secrets don't need to be encrypted again. This affects only this computer: sync uses your sync password, and your other computers have their own keychain or master password, so nothing needs to change there."
  zh-TW: "這台電腦沒有可用的系統鑰匙圈，儲存的密碼、私密金鑰等用主密碼加密，每次啟動時輸入；應用程式鎖定的鎖定密碼只擋住介面，與主密碼無關。修改後用新的主密碼解鎖，儲存的內容不用重新加密。只影響這台電腦：雲端同步用的是同步密碼，其他電腦有各自的鑰匙圈或主密碼，不用跟著改。"
  ja: このコンピューターには使用できるシステムのキーチェーンがないため、保存したパスワードや秘密鍵などはマスターパスワードで暗号化され、起動のたびに入力します。アプリロックのロックパスワードは画面を隠すだけで、マスターパスワードとは別のものです。変更後は新しいマスターパスワードでロックを解除します。保存した内容を暗号化し直す必要はありません。影響するのはこのコンピューターだけです。クラウド同期では同期パスワードを使い、ほかのコンピューターにはそれぞれのキーチェーンまたはマスターパスワードがあるため、変更は不要です。
  ko: 이 컴퓨터에는 사용할 수 있는 시스템 키체인이 없어 저장한 비밀번호, 개인 키 등을 마스터 비밀번호로 암호화하며, 시작할 때마다 입력해야 합니다. 앱 잠금의 잠금 비밀번호는 화면만 가리며 마스터 비밀번호와는 별개입니다. 변경한 뒤에는 새 마스터 비밀번호로 잠금을 해제하며, 저장한 내용을 다시 암호화할 필요는 없습니다. 이 컴퓨터에만 영향을 줍니다. 클라우드 동기화는 동기화 비밀번호를 쓰고, 다른 컴퓨터에는 각자의 키체인이나 마스터 비밀번호가 있으므로 함께 바꿀 필요가 없습니다.
