palette.placeholder:
  zh-CN: 搜索主机、Tab、操作，或输入 用户@地址 快速连接
  en: Search hosts, tabs, and commands, or type user@host to quick connect
  zh-TW: 搜尋主機、分頁、操作，或輸入 使用者@位址 快速連線
  ja: ホスト、タブ、操作を検索、または ユーザー@アドレス を入力してクイック接続
  ko: 호스트, 탭, 작업 검색 또는 사용자@주소를 입력하여 빠른 연결
palette.hint:
  zh-CN: "> 只搜操作 · @ 只搜已打开的 Tab · # 只搜主机 · Enter 执行 · Esc 关闭"
  en: "> commands only · @ open tabs only · # hosts only · Enter to run · Esc to close"
  zh-TW: "> 只搜尋操作 · @ 只搜尋已開啟的分頁 · # 只搜尋主機 · Enter 執行 · Esc 關閉"
  ja: "> 操作のみ · @ 開いているタブのみ · # ホストのみ · Enter で実行 · Esc で閉じる"
  ko: "> 작업만 · @ 열린 탭만 · # 호스트만 · Enter 실행 · Esc 닫기"
