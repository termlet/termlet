_version: 2
compose.send_to:
  zh-CN: 发送到：%{mode}（%{count}）
  en: "Send to: %{mode} (%{count})"
  zh-TW: 傳送到：%{mode}（%{count}）
  ja: 送信先：%{mode}（%{count}）
  ko: "보낼 대상: %{mode}(%{count})"
compose.mode_view:
  zh-CN: 当前 Tab
  en: Current tab
  zh-TW: 目前分頁
  ja: 現在のタブ
  ko: 현재 탭
compose.mode_host:
  zh-CN: 同一主机
  en: Same host
  zh-TW: 同一主機
  ja: 同じホスト
  ko: 같은 호스트
compose.mode_all:
  zh-CN: 全部终端
  en: All terminals
  zh-TW: 全部終端機
  ja: すべてのターミナル
  ko: 모든 터미널
compose.mode_custom:
  zh-CN: 自选
  en: Custom
  zh-TW: 自選
  ja: 個別に選択
  ko: 직접 선택
compose.pick:
  zh-CN: 选择终端
  en: Choose terminals
  zh-TW: 選擇終端機
  ja: ターミナルを選択
  ko: 터미널 선택
compose.placeholder:
  zh-CN: 输入命令，Enter 发送，Shift+Enter 换行，↑ ↓ 翻看发送过的命令
  en: Type a command. Enter sends it, Shift+Enter adds a line, ↑ ↓ recall sent commands
  zh-TW: 輸入指令，Enter 傳送，Shift+Enter 換行，↑ ↓ 瀏覽傳送過的指令
  ja: コマンドを入力（Enter で送信、Shift+Enter で改行、↑ ↓ で送信済みのコマンドを表示）
  ko: 명령을 입력하세요. Enter로 보내고 Shift+Enter로 줄을 바꾸며 ↑ ↓로 보낸 명령을 다시 불러옵니다
compose.send:
  zh-CN: 发送
  en: Send
  zh-TW: 傳送
  ja: 送信
  ko: 보내기
compose.danger_title:
  zh-CN: 确定把这条命令发送到 %{count} 个终端吗？
  en: Send this command to %{count} terminals?
  zh-TW: 確定要把這條指令傳送到 %{count} 個終端機嗎？
  ja: このコマンドを %{count} 個のターミナルに送信しますか？
  ko: 이 명령을 터미널 %{count}개에 보내시겠습니까?
compose.danger_hint:
  zh-CN: “%{command}”命中危险命令规则：%{rule}
  en: "“%{command}” matches a dangerous-command rule: %{rule}"
  zh-TW: 「%{command}」符合危險指令規則：%{rule}
  ja: 「%{command}」は危険なコマンドのルールに該当します：%{rule}
  ko: "'%{command}' 명령이 위험한 명령 규칙에 해당합니다: %{rule}"
compose.send_anyway:
  zh-CN: 仍然发送
  en: Send Anyway
  zh-TW: 仍要傳送
  ja: 送信する
  ko: 그래도 보내기
compose.compare:
  zh-CN: 执行并对比
  en: Run and Compare
  zh-TW: 執行並比對
  ja: 実行して比較
  ko: 실행 후 비교
compose.compare_hint:
  zh-CN: 在各终端中执行（需要 bash / sh），结果在“批量执行”Tab 中按输出分组对比
  en: Run in each terminal (needs bash / sh); the results open in a Batch run tab, grouped by output
  zh-TW: 在各終端機中執行（需要 bash / sh），結果在「批次執行」分頁中依輸出分組比對
  ja: 各ターミナルで実行し（bash / sh が必要）、結果は「一括実行」タブに出力ごとにまとめて表示します
  ko: 각 터미널에서 실행하고(bash / sh 필요) 결과는 '일괄 실행' 탭에 출력별로 묶어 표시합니다
