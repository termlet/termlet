  zh-CN: 默认跳板机
  en: Default jump host
  zh-TW: 預設跳板機
  ja: デフォルトの踏み台ホスト
  ko: 기본 점프 호스트
group.field.proxy_command:
  zh-CN: 代理命令
  en: Proxy command
  zh-TW: 代理指令
  ja: プロキシコマンド
  ko: 프록시 명령
group.field.proxy_command_hint:
  zh-CN: 分组中没有自己的代理、也没有选“不使用代理”的主机沿用，经跳板机连接的主机不用。写法与主机的代理命令相同（%h、%p、%r、%n），每台电脑第一次执行前都会先请你确认。
  en: Used by hosts in the group that have no proxy of their own and don't have "No proxy" selected. Hosts reached through a jump host don't use it. Written like a host's proxy command (%h, %p, %r, %n). You're asked to confirm before it first runs on each computer.
  zh-TW: 群組中沒有自己的代理伺服器、也沒有選「不使用代理伺服器」的主機會沿用，經由跳板機連線的主機不使用。寫法與主機的代理指令相同（%h、%p、%r、%n），每台電腦第一次執行前都會先請你確認。
  ja: グループ内で独自のプロキシがなく、「プロキシを使用しない」も選んでいないホストが使います。踏み台ホスト経由で接続するホストでは使いません。書き方はホストのプロキシコマンドと同じです（%h、%p、%r、%n）。コンピューターごとに、初めて実行する前に確認を求めます。
  ko: 그룹에서 자체 프록시가 없고 '프록시 사용 안 함'도 선택하지 않은 호스트가 사용합니다. 점프 호스트를 거쳐 연결하는 호스트는 사용하지 않습니다. 작성 방법은 호스트의 프록시 명령과 같습니다(%h, %p, %r, %n). 컴퓨터마다 처음 실행하기 전에 확인을 요청합니다.
