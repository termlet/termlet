group.field.profile_hint:
  zh-CN: 认证方式选“沿用分组”的主机使用它。
  en: Used by hosts whose authentication is set to use the group's.
  zh-TW: 驗證方式選「沿用群組」的主機會使用它。
  ja: 認証方法が「グループの設定を使用」のホストで使われます。
  ko: 인증 방법이 '그룹 설정 사용'인 호스트에서 사용합니다.
