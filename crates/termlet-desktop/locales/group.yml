group.delete.title:
  zh-CN: 删除分组“%{name}”？
  en: Delete group "%{name}"?
  zh-TW: 刪除群組「%{name}」？
  ja: グループ「%{name}」を削除しますか？
  ko: "'%{name}' 그룹을 삭제하시겠습니까?"
group.delete.description:
  zh-CN: 子分组一并删除；其中的主机移到最外层，不会被删除。
  en: Its subgroups are deleted too. The hosts in them move to the top level and aren't deleted.
  zh-TW: 子群組一併刪除；其中的主機會移到最上層，不會被刪除。
  ja: サブグループもまとめて削除されます。その中のホストは最上位に移動し、削除されません。
  ko: 하위 그룹도 함께 삭제됩니다. 그 안의 호스트는 최상위로 이동하며 삭제되지 않습니다.
