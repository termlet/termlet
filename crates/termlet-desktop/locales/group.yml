group.edit.hint:
  zh-CN: 分组及其子分组中没有设置这些项的主机沿用这里的值；留空则沿用上级分组的。
  en: Hosts in this group and its subgroups use these values when they don't set their own. Leave a field empty to use the parent group's value.
  zh-TW: 群組及其子群組中沒有設定這些項目的主機會沿用這裡的值；留空則沿用上層群組的。
  ja: このグループとサブグループ内のホストで、これらの項目を設定していないものはここの値を使います。空欄にすると親グループの値を使います。
  ko: 이 그룹과 하위 그룹의 호스트 중 이 항목을 직접 설정하지 않은 호스트는 여기의 값을 사용합니다. 비워 두면 상위 그룹의 값을 사용합니다.
