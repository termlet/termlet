  zh-TW: 命令列工具已在 /usr/bin/termlet（隨 deb、rpm 套件安裝），在終端機中直接執行 termlet 即可。
  ja: コマンドラインツールは /usr/bin/termlet にあります（deb、rpm パッケージと一緒にインストール済み）。ターミナルで termlet を直接実行してください。
