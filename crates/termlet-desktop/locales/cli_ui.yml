  zh-CN: MCP 服务
  en: MCP server
  zh-TW: MCP 服務
  ja: MCP サーバー
  ko: MCP 서버
cli_ui.mcp.hint:
  zh-CN: 让 Claude Desktop、Cursor 等 AI 工具把 Termlet 当作 MCP 服务直接调用：列出主机、执行命令、上传下载文件。接入类型有两种：标准输入输出由 AI 工具按下面的配置自己启动 termlet mcp，不开网络端口，推荐使用；HTTP 由 Termlet 在本机监听，AI 工具按地址与令牌连接，只在 Termlet 运行时可用。两种都经过最上面的开关、危险命令的批准与审计日志，与 termlet 命令相同。MCP 与 Agent Skill 装一种即可：Skill 让 AI 在终端中运行 termlet 命令；MCP 不需要终端，Claude Desktop 这类不能运行命令的工具也能用。
  en: "Lets AI tools such as Claude Desktop and Cursor call Termlet directly as an MCP server to list hosts, run commands and transfer files. There are two transports: with standard input and output (recommended), the AI tool starts termlet mcp itself from the configuration below and no network port is opened; with HTTP, Termlet listens on this computer and the AI tool connects with the address and a token, which only works while Termlet is running. Both go through the switch at the top of this page, approval of dangerous commands and the audit log, like the termlet command. You only need one of MCP and the Agent Skill: the skill has the AI run termlet commands in a terminal, while MCP needs no terminal, so tools like Claude Desktop that can't run commands can use it too."
  zh-TW: 讓 Claude Desktop、Cursor 等 AI 工具把 Termlet 當作 MCP 服務直接呼叫：列出主機、執行指令、上傳下載檔案。串接類型有兩種：標準輸入輸出由 AI 工具依下面的設定自行啟動 termlet mcp，不開網路連接埠，建議使用；HTTP 由 Termlet 在本機監聽，AI 工具依位址與權杖連線，只在 Termlet 執行時可用。兩種都經過最上面的開關、危險指令的核准與稽核記錄，與 termlet 指令相同。MCP 與 Agent Skill 裝一種即可：Skill 讓 AI 在終端機中執行 termlet 指令；MCP 不需要終端機，Claude Desktop 這類不能執行指令的工具也能用。
  ja: Claude Desktop、Cursor などの AI ツールが、Termlet を MCP サーバーとして直接呼び出せるようにします（ホストの一覧表示、コマンドの実行、ファイルのアップロード・ダウンロード）。接続方式は 2 つあります。標準入出力では AI ツールが下の設定に従って termlet mcp を自分で起動し、ネットワークポートは開きません（推奨）。HTTP では Termlet がこのコンピューターで待ち受け、AI ツールがアドレスとトークンで接続します。Termlet の実行中のみ使用できます。どちらもこのページ上部のオン・オフ、危険なコマンドの承認、監査ログを経由し、termlet コマンドと同じです。MCP と Agent Skill はどちらか一方をインストールすれば十分です。Skill は AI にターミナルで termlet コマンドを実行させます。MCP はターミナルが不要なので、Claude Desktop のようにコマンドを実行できないツールでも使えます。
  ko: Claude Desktop, Cursor 등 AI 도구가 Termlet을 MCP 서버로 직접 호출해 호스트 목록 보기, 명령 실행, 파일 업로드·다운로드를 할 수 있게 합니다. 연결 방식은 두 가지입니다. 표준 입출력은 AI 도구가 아래 구성에 따라 termlet mcp를 직접 시작하며 네트워크 포트를 열지 않습니다(권장). HTTP는 Termlet이 이 컴퓨터에서 수신 대기하고 AI 도구가 주소와 토큰으로 연결하며, Termlet이 실행 중일 때만 사용할 수 있습니다. 두 방식 모두 이 페이지 맨 위의 켜기/끄기, 위험한 명령 승인, 감사 로그를 거치며 termlet 명령과 같습니다. MCP와 Agent Skill 중 하나만 설치하면 됩니다. Skill은 AI가 터미널에서 termlet 명령을 실행하게 하고, MCP는 터미널이 필요 없어 Claude Desktop처럼 명령을 실행할 수 없는 도구에서도 사용할 수 있습니다.
