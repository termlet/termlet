cli_ui.http.status_in_use:
  zh-CN: 端口 %{port} 已被其他程序占用。换一个端口后保存，或者关掉占用它的程序后重试。
  en: Port %{port} is in use by another program. Choose another port and save, or close that program and retry.
  zh-TW: 連接埠 %{port} 已被其他程式占用。換一個連接埠後儲存，或者關閉占用它的程式後重試。
  ja: ポート %{port} はほかのプログラムが使用しています。別のポートに変えて保存するか、そのプログラムを終了してから再試行してください。
  ko: 포트 %{port}을(를) 다른 프로그램이 사용하고 있습니다. 다른 포트로 바꿔 저장하거나, 그 프로그램을 종료한 후 다시 시도하세요.
cli_ui.http.status_denied:
