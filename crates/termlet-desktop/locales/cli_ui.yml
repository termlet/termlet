  zh-TW: 沒有權限監聽連接埠 %{port}，它可能被系統保留（Hyper-V、WSL 會保留一些連接埠範圍）。請換一個連接埠後儲存。
  ja: ポート %{port} で待ち受ける権限がありません。システムに予約されている可能性があります（Hyper-V や WSL は一部のポート範囲を予約します）。別のポートに変えて保存してください。
  ko: 포트 %{port}에서 수신 대기할 권한이 없습니다. 시스템에서 예약한 포트일 수 있습니다(Hyper-V, WSL은 일부 포트 범위를 예약함). 다른 포트로 바꿔 저장하세요.
cli_ui.http.status_invalid:
