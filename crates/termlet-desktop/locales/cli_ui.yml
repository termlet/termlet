  zh-CN: 加到 ~/.codex/config.toml（设置了 CODEX_HOME 时是其中的 config.toml）。工具调用的超时放宽到 %{seconds} 秒，以免等你批准危险命令时超时：
  en: "Add this to ~/.codex/config.toml (or config.toml in CODEX_HOME if it's set). The tool timeout is raised to %{seconds} seconds so calls don't time out while you approve a dangerous command:"
  zh-TW: 加到 ~/.codex/config.toml（設定了 CODEX_HOME 時是其中的 config.toml）。工具呼叫的逾時放寬到 %{seconds} 秒，以免等你核准危險指令時逾時：
