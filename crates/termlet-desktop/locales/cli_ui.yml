  ja: この AppImage を termlet としてリンクすると、コマンドラインツールとして使用できます（~/.local/bin が PATH に含まれている必要があります。AppImage を移動したらリンクし直してください）。例：
  ko: "이 AppImage를 termlet으로 링크하면 명령줄 도구로 사용할 수 있습니다(~/.local/bin이 PATH에 있어야 하며, AppImage를 옮기면 다시 링크해야 함). 예:"
cli_ui.tool.portable:
  zh-CN: 便携版不修改 PATH：在命令行中用上面的完整路径运行，它会连到这个便携的 Termlet（与同时装着的安装版互不干扰）。需要时可以自己把这个 bin 文件夹加入 PATH；文件夹移动后要重新改。
  en: "The portable version doesn't change PATH: run the tool by its full path above, and it connects to this portable Termlet (separate from any installed copy). You can add this bin folder to PATH yourself if you like; update it if you move the folder."
  zh-TW: 可攜版不修改 PATH：在命令列中用上面的完整路徑執行，它會連到這個可攜的 Termlet（與同時安裝的版本互不干擾）。需要時可以自己把這個 bin 資料夾加入 PATH；資料夾移動後要重新修改。
  ja: ポータブル版は PATH を変更しません。コマンドラインでは上のフルパスで実行してください。このポータブル版の Termlet に接続します（同時にインストールされているインストール版とは干渉しません）。必要であれば、この bin フォルダーを自分で PATH に追加できます。フォルダーを移動したら設定し直してください。
  ko: 포터블 버전은 PATH를 변경하지 않습니다. 명령줄에서 위의 전체 경로로 실행하면 이 포터블 Termlet에 연결됩니다(함께 설치된 설치 버전과 서로 간섭하지 않음). 필요하면 이 bin 폴더를 직접 PATH에 추가할 수 있으며, 폴더를 옮기면 다시 설정해야 합니다.
