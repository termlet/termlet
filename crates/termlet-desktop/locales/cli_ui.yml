cli_ui.http.note_windows:
  zh-CN: HTTP 由 Termlet 自己监听，只在 Termlet 运行时可用，Termlet 退出后连不上。要在关掉窗口后仍能使用，可以在“通用”中打开“关闭窗口时最小化到托盘”，或者改用标准输入输出（Termlet 没有运行时由 AI 工具在后台启动它）。
  en: HTTP is served by Termlet itself, so it only works while Termlet is running. To keep it available after you close the window, turn on “Minimize to the system tray when closing the window” under General, or use standard input and output instead (the AI tool then starts Termlet in the background when it isn't running).
  zh-TW: HTTP 由 Termlet 自己監聽，只在 Termlet 執行時可用，Termlet 結束後就連不上。要在關閉視窗後仍能使用，可以在「一般」中開啟「關閉視窗時最小化到系統匣」，或者改用標準輸入輸出（Termlet 沒有執行時由 AI 工具在背景啟動它）。
  ja: HTTP は Termlet 自身が待ち受けるため、Termlet の実行中にしか使用できません。ウィンドウを閉じた後も使用するには、「一般」で「ウィンドウを閉じたら通知領域に最小化」をオンにするか、標準入出力を使ってください（Termlet が実行されていないときは AI ツールがバックグラウンドで起動します）。
  ko: HTTP는 Termlet이 직접 수신 대기하므로 Termlet이 실행 중일 때만 사용할 수 있습니다. 창을 닫은 후에도 사용하려면 '일반'에서 '창을 닫으면 알림 영역으로 최소화'를 켜거나, 표준 입출력을 사용하세요(Termlet이 실행 중이 아니면 AI 도구가 백그라운드에서 시작함).
cli_ui.http.note_other:
  zh-CN: HTTP 由 Termlet 自己监听，只在 Termlet 运行时可用，Termlet 退出后连不上。要在 Termlet 没有运行时也能使用，请改用标准输入输出（由 AI 工具在后台启动 Termlet）。
  en: HTTP is served by Termlet itself, so it only works while Termlet is running. To use MCP when Termlet isn't running, use standard input and output instead (the AI tool then starts Termlet in the background).
  zh-TW: HTTP 由 Termlet 自己監聽，只在 Termlet 執行時可用，Termlet 結束後就連不上。要在 Termlet 沒有執行時也能使用，請改用標準輸入輸出（由 AI 工具在背景啟動 Termlet）。
  ja: HTTP は Termlet 自身が待ち受けるため、Termlet の実行中にしか使用できません。Termlet が実行されていないときも使用するには、標準入出力を使ってください（AI ツールがバックグラウンドで Termlet を起動します）。
  ko: HTTP는 Termlet이 직접 수신 대기하므로 Termlet이 실행 중일 때만 사용할 수 있습니다. Termlet이 실행 중이 아닐 때도 사용하려면 표준 입출력을 사용하세요(AI 도구가 백그라운드에서 Termlet을 시작함).
cli_ui.rules.hint:
  zh-CN: 通过 termlet 命令与 MCP 服务执行的命令（包括 Claude Code 等 AI 工具发出的）命中以下规则时，先请你批准或直接拦截，并记入审计日志；粘贴、同步输入与撰写栏发送前也按这些规则检查。规则用于防止误操作，命令可以通过编码、脚本等方式绕过，不是安全边界；请为 AI 工具与脚本使用服务器上的低权限账号（编辑主机 → AI 与自动化 → AI 工具与脚本使用单独的凭据）。
  en: Commands run through the termlet command or the MCP server (including those from AI tools such as Claude Code) that match these rules need your approval or are blocked, and are recorded in the audit log. Pasting, synchronized input and the compose bar check these rules too. The rules prevent mistakes but can be bypassed with encoding or scripts, so they aren't a security boundary; use a low-privilege server account for AI tools and scripts (Edit host → AI & automation → Use a separate credential for AI tools and scripts).
  zh-TW: 透過 termlet 指令與 MCP 服務執行的指令（包括 Claude Code 等 AI 工具發出的）符合以下規則時，會先請你核准或直接阻擋，並記入稽核記錄；貼上、同步輸入與撰寫列傳送前也依這些規則檢查。規則用於防止誤操作，指令可以透過編碼、指令碼等方式繞過，不是安全邊界；請為 AI 工具與指令碼使用伺服器上的低權限帳號（編輯主機 → AI 與自動化 → AI 工具與指令碼使用單獨的認證資訊）。
  ja: termlet コマンドや MCP サーバーで実行するコマンド（Claude Code などの AI ツールからのものを含む）が以下のルールに該当すると、事前に承認を求めるか直接ブロックし、監査ログに記録します。貼り付け、同時入力、コンポーズバーからの送信前にもこれらのルールで確認します。ルールは誤操作を防ぐためのもので、エンコードやスクリプトなどで回避できるため、セキュリティ境界ではありません。AI ツールとスクリプトにはサーバー上の権限の低いアカウントを使用してください（ホストを編集 → AI と自動化 → AI ツールとスクリプトには別の認証情報を使用）。
  ko: termlet 명령이나 MCP 서버로 실행하는 명령(Claude Code 등 AI 도구가 보낸 것 포함)이 아래 규칙에 해당하면 먼저 승인을 요청하거나 바로 차단하고 감사 로그에 기록합니다. 붙여넣기, 동시 입력, 작성 표시줄에서 보내기 전에도 이 규칙으로 확인합니다. 규칙은 실수를 막기 위한 것이며 인코딩이나 스크립트 등으로 우회할 수 있으므로 보안 경계가 아닙니다. AI 도구와 스크립트에는 서버의 낮은 권한 계정을 사용하세요(호스트 편집 → AI 및 자동화 → AI 도구와 스크립트에 별도 자격 증명 사용).
