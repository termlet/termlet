_version: 2
cli_ui.nav:
  zh-CN: AI 与自动化
  en: AI & automation
  zh-TW: AI 與自動化
  ja: AI と自動化
  ko: AI 및 자동화
cli_ui.enabled:
  zh-CN: 允许 AI 工具与脚本访问
  en: Allow access from AI tools and scripts
  zh-TW: 允許 AI 工具與指令碼存取
  ja: AI ツールとスクリプトからのアクセスを許可
  ko: AI 도구와 스크립트의 액세스 허용
cli_ui.enabled_hint:
  zh-CN: AI 工具与脚本可以经 termlet 命令或 MCP 服务，在允许它们使用的主机上执行命令、上传下载文件。关闭时它们的全部请求都被拒绝（termlet 命令的退出码为 7）。
  en: AI tools and scripts can run commands and transfer files on hosts that allow them, through the termlet command or the MCP server. When this is off, all of their requests are refused (the termlet command exits with code 7).
  zh-TW: AI 工具與指令碼可以經由 termlet 指令或 MCP 服務，在允許它們使用的主機上執行指令、上傳下載檔案。關閉時它們的全部要求都會被拒絕（termlet 指令的結束代碼為 7）。
  ja: AI ツールやスクリプトが termlet コマンドまたは MCP サーバーを通じて、使用を許可したホストでコマンドを実行したり、ファイルをアップロード・ダウンロードしたりできます。オフにすると、これらからの要求はすべて拒否されます（termlet コマンドの終了コードは 7）。
  ko: AI 도구와 스크립트가 termlet 명령이나 MCP 서버를 통해 사용을 허용한 호스트에서 명령을 실행하고 파일을 업로드·다운로드할 수 있습니다. 끄면 이들의 모든 요청이 거부됩니다(termlet 명령의 종료 코드는 7).
cli_ui.auto_start:
  zh-CN: Termlet 没有打开时也能使用（自动在后台启动）
  en: Also works when Termlet isn't open (start it in the background)
  zh-TW: Termlet 沒有開啟時也能使用（自動在背景啟動）
  ja: Termlet を開いていないときも使用する（バックグラウンドで自動起動）
  ko: Termlet이 열려 있지 않을 때도 사용(백그라운드에서 자동 시작)
cli_ui.auto_start_hint:
  zh-CN: Termlet 没有运行时，termlet 命令在后台启动它（不显示窗口，10 分钟没有命令行请求后退出）。关闭后只在 Termlet 打开时可用，否则提示先打开 Termlet（退出码 7）。
  en: When Termlet isn't running, the termlet command starts it in the background (no window; it quits after 10 minutes without command-line requests). When this is off, the CLI only works while Termlet is open; otherwise it asks you to open Termlet first (exit code 7).
  zh-TW: Termlet 沒有執行時，termlet 指令會在背景啟動它（不顯示視窗，10 分鐘沒有命令列要求後結束）。關閉後只在 Termlet 開啟時可用，否則提示先開啟 Termlet（結束代碼 7）。
  ja: Termlet が実行されていないときは、termlet コマンドがバックグラウンドで起動します（ウィンドウは表示せず、コマンドラインからの要求が 10 分間ないと終了します）。オフにすると Termlet を開いているときだけ使用でき、それ以外のときは先に Termlet を開くよう案内します（終了コード 7）。
  ko: Termlet이 실행 중이 아니면 termlet 명령이 백그라운드에서 Termlet을 시작합니다(창은 표시하지 않으며, 명령줄 요청이 10분 동안 없으면 종료됨). 끄면 Termlet이 열려 있을 때만 사용할 수 있고, 그렇지 않으면 먼저 Termlet을 열라고 안내합니다(종료 코드 7).
cli_ui.intro:
  zh-CN: termlet 命令与 MCP 服务让你和 AI 工具（如 Claude Code）通过已保存的主机执行命令、上传下载文件，凭据始终留在 Termlet 中。主机需要在编辑时勾选“允许 AI 工具与脚本使用这台主机”，第一次使用前先在 Termlet 中连接一次，确认主机指纹。
  en: The termlet command and the MCP server let you and AI tools (such as Claude Code) run commands and transfer files through saved hosts, while credentials stay in Termlet. Turn on “Allow AI tools and scripts to use this host” when editing a host, and connect to it once in Termlet to confirm its host key.
  zh-TW: termlet 指令與 MCP 服務讓你和 AI 工具（如 Claude Code）透過已儲存的主機執行指令、上傳下載檔案，認證資訊始終留在 Termlet 中。主機需要在編輯時勾選「允許 AI 工具與指令碼使用這台主機」，第一次使用前先在 Termlet 中連線一次，確認主機指紋。
  ja: termlet コマンドと MCP サーバーを使うと、ユーザーや AI ツール（Claude Code など）が保存済みのホストを通じてコマンドを実行したり、ファイルをアップロード・ダウンロードしたりできます。認証情報は常に Termlet の中にとどまります。ホストの編集画面で「AI ツールとスクリプトにこのホストの使用を許可」をオンにし、初めて使う前に Termlet で一度接続してホストキーを確認してください。
  ko: termlet 명령과 MCP 서버를 사용하면 사용자와 AI 도구(Claude Code 등)가 저장된 호스트를 통해 명령을 실행하고 파일을 업로드·다운로드할 수 있으며, 자격 증명은 항상 Termlet 안에 남아 있습니다. 호스트를 편집할 때 'AI 도구와 스크립트가 이 호스트를 사용하도록 허용'을 켜고, 처음 사용하기 전에 Termlet에서 한 번 연결해 호스트 키를 확인하세요.
