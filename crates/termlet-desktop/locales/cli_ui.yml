cli_ui.mcp.http_where_claude_code:
  zh-CN: 在终端中运行。--scope user 写进你自己的配置 ~/.claude.json，所有项目都能用；其中有令牌，不要改为项目级（.mcp.json），以免随代码提交：
  en: "Run this in a terminal. --scope user puts it in your own configuration (~/.claude.json) for every project; it contains the token, so don't make it project-scoped (.mcp.json), where it could be committed with your code:"
  zh-TW: 在終端機中執行。--scope user 寫進你自己的設定 ~/.claude.json，所有專案都能用；其中有權杖，不要改為專案層級（.mcp.json），以免隨程式碼提交：
  ja: ターミナルで次のコマンドを実行します。--scope user を付けると自分の設定（~/.claude.json）に追加され、すべてのプロジェクトで使用できます。トークンが含まれるため、コードと一緒にコミットされないよう、プロジェクト単位（.mcp.json）にはしないでください：
  ko: "터미널에서 다음 명령을 실행하세요. --scope user를 지정하면 자신의 구성(~/.claude.json)에 추가되어 모든 프로젝트에서 사용할 수 있습니다. 토큰이 들어 있으므로 코드와 함께 커밋되지 않도록 프로젝트 범위(.mcp.json)로 바꾸지 마세요:"
cli_ui.mcp.http_where_cursor:
  zh-CN: 加到 ~/.cursor/mcp.json（已有 mcpServers 时只加其中的 termlet 一项）。其中有令牌，不要加到项目中的 .cursor/mcp.json：
  en: "Add this to ~/.cursor/mcp.json (if it already has mcpServers, add just the termlet entry). It contains the token, so don't add it to .cursor/mcp.json in a project:"
  zh-TW: 加到 ~/.cursor/mcp.json（已有 mcpServers 時只加其中的 termlet 一項）。其中有權杖，不要加到專案中的 .cursor/mcp.json：
  ja: ~/.cursor/mcp.json に追加します（mcpServers がすでにあれば termlet の項目だけを追加します）。トークンが含まれるため、プロジェクト内の .cursor/mcp.json には追加しないでください：
  ko: "~/.cursor/mcp.json에 추가하세요(mcpServers가 이미 있으면 termlet 항목만 추가). 토큰이 들어 있으므로 프로젝트의 .cursor/mcp.json에는 추가하지 마세요:"
cli_ui.mcp.http_where_vscode:
  zh-CN: "加到 ~/.copilot/mcp-config.json（设置了 COPILOT_HOME 时是其中的 mcp-config.json；已有 mcpServers 时只加其中的 termlet 一项）。其中有令牌，不要加到工作区的 .mcp.json。还在用旧的配置（命令面板中的 MCP: Open User Configuration）时，把最外层的 mcpServers 改为 servers："
  en: "Add this to ~/.copilot/mcp-config.json (or mcp-config.json in COPILOT_HOME if it's set; if it already has mcpServers, add just the termlet entry). It contains the token, so don't add it to .mcp.json in a workspace. If you still use the old configuration (MCP: Open User Configuration in the Command Palette), rename the top-level mcpServers to servers:"
  zh-TW: "加到 ~/.copilot/mcp-config.json（設定了 COPILOT_HOME 時是其中的 mcp-config.json；已有 mcpServers 時只加其中的 termlet 一項）。其中有權杖，不要加到工作區的 .mcp.json。還在用舊的設定（命令選擇區中的 MCP: Open User Configuration）時，把最外層的 mcpServers 改為 servers："
  ja: "~/.copilot/mcp-config.json（COPILOT_HOME を設定している場合はその中の mcp-config.json）に追加します（mcpServers がすでにあれば termlet の項目だけを追加します）。トークンが含まれるため、ワークスペースの .mcp.json には追加しないでください。古い設定（コマンドパレットの MCP: Open User Configuration）をまだ使っている場合は、最上位の mcpServers を servers に変えてください："
  ko: "~/.copilot/mcp-config.json(COPILOT_HOME을 설정한 경우 그 안의 mcp-config.json)에 추가하세요(mcpServers가 이미 있으면 termlet 항목만 추가). 토큰이 들어 있으므로 작업 영역의 .mcp.json에는 추가하지 마세요. 아직 이전 구성(명령 팔레트의 MCP: Open User Configuration)을 사용한다면 최상위의 mcpServers를 servers로 바꾸세요:"
cli_ui.mcp.http_where_gemini:
  zh-CN: 在终端中运行。-s user 写进你自己的配置 ~/.gemini/settings.json，所有项目都能用；不要去掉它，否则令牌会写进当前项目：
  en: "Run this in a terminal. -s user puts it in your own settings (~/.gemini/settings.json) for every project; keep it, or the token goes into the current project:"
  zh-TW: 在終端機中執行。-s user 寫進你自己的設定 ~/.gemini/settings.json，所有專案都能用；不要拿掉它，否則權杖會寫進目前的專案：
  ja: ターミナルで次のコマンドを実行します。-s user を付けると自分の設定（~/.gemini/settings.json）に追加され、すべてのプロジェクトで使用できます。付けないとトークンが現在のプロジェクトに書き込まれるため、外さないでください：
  ko: "터미널에서 다음 명령을 실행하세요. -s user를 지정하면 자신의 설정(~/.gemini/settings.json)에 추가되어 모든 프로젝트에서 사용할 수 있습니다. 빼면 토큰이 현재 프로젝트에 기록되므로 빼지 마세요:"
cli_ui.mcp.http_where_other:
  zh-CN: 多数 AI 工具认这种写法，只加到用户级的配置中，不要加到项目里。各家的字段名不同（地址可能叫 serverUrl、httpUrl，类型可能写 streamableHttp），照它们的文档填，保留地址与 Authorization 的值：
  en: "Most AI tools accept this format. Add it to your user-level configuration only, not to a project. Field names differ between tools (the address may be called serverUrl or httpUrl, and the type streamableHttp), so follow their documentation and keep the address and the Authorization value:"
  zh-TW: 多數 AI 工具接受這種寫法，只加到使用者層級的設定中，不要加到專案裡。各家的欄位名稱不同（位址可能叫 serverUrl、httpUrl，類型可能寫 streamableHttp），依它們的文件填寫，保留位址與 Authorization 的值：
  ja: 多くの AI ツールはこの形式を受け付けます。プロジェクトではなく、ユーザー単位の設定にだけ追加してください。フィールド名はツールによって異なる（アドレスが serverUrl や httpUrl、種類が streamableHttp など）ため、各ツールのドキュメントに従い、アドレスと Authorization の値はそのまま使ってください：
  ko: "대부분의 AI 도구는 이 형식을 사용합니다. 프로젝트가 아닌 사용자 수준의 구성에만 추가하세요. 필드 이름은 도구마다 다르므로(주소가 serverUrl이나 httpUrl, 유형이 streamableHttp 등) 각 도구의 문서를 따르고 주소와 Authorization 값은 그대로 두세요:"
cli_ui.mcp.http_claude_desktop:
  zh-CN: Claude Desktop 不能连接这台电脑上的 HTTP 服务：它的自定义连接器从 Anthropic 的服务器发起连接，只能连公网上的 HTTPS 地址。请在上面改用标准输入输出。
  en: "Claude Desktop can't connect to an HTTP server on this computer: its custom connectors connect from Anthropic's servers and can only reach public HTTPS addresses. Switch to standard input and output above instead."
  zh-TW: Claude Desktop 無法連線到這台電腦上的 HTTP 服務：它的自訂連接器從 Anthropic 的伺服器發起連線，只能連到公開網路上的 HTTPS 位址。請在上方改用標準輸入輸出。
  ja: Claude Desktop はこのコンピューター上の HTTP サーバーには接続できません。カスタムコネクタは Anthropic のサーバーから接続するため、インターネット上の HTTPS アドレスにしか接続できません。上で標準入出力に切り替えてください。
  ko: Claude Desktop은 이 컴퓨터의 HTTP 서버에 연결할 수 없습니다. 사용자 지정 커넥터는 Anthropic 서버에서 연결하므로 인터넷의 HTTPS 주소에만 연결할 수 있습니다. 위에서 표준 입출력으로 바꾸세요.
cli_ui.mcp.in_path:
  zh-CN: 配置中写的是 termlet 命令，它需要在 PATH 中（见上方的“termlet 命令”）。
  en: The configuration uses the termlet command, so it must be on PATH (see “termlet command” above).
  zh-TW: 設定中寫的是 termlet 指令，它需要在 PATH 中（見上方的「termlet 指令」）。
  ja: 設定では termlet コマンドを使うため、termlet が PATH に含まれている必要があります（上の「termlet コマンド」を参照）。
  ko: 구성에서 termlet 명령을 사용하므로 termlet이 PATH에 있어야 합니다(위의 'termlet 명령' 참고).
