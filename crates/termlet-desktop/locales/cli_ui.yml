cli_ui.audit.label:
  zh-CN: 审计日志
  en: Audit log
  zh-TW: 稽核記錄
  ja: 監査ログ
  ko: 감사 로그
cli_ui.audit.hint:
  zh-CN: 命令行工具的每次执行与传输（含被拦截、失败的），以及主机工具面板的写操作，都记在这台电脑上，不同步。
  en: Every command and transfer from the command-line tool (including blocked and failed ones), and every change made from the host tools panel, is recorded on this computer. The log isn't synced.
  zh-TW: 命令列工具的每次執行與傳輸（含被阻擋、失敗的），以及主機工具面板的寫入操作，都記錄在這台電腦上，不同步。
  ja: コマンドラインツールによる実行と転送（ブロックされたもの、失敗したものを含む）、およびホストツールパネルからの変更操作は、すべてこのコンピューターに記録されます。同期はされません。
  ko: 명령줄 도구의 모든 실행과 전송(차단되거나 실패한 것 포함), 그리고 호스트 도구 패널에서 한 변경 작업은 모두 이 컴퓨터에 기록되며 동기화되지 않습니다.
