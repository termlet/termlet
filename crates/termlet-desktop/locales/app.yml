  zh-TW: 按兩下左側的主機開啟終端機，或在搜尋方塊中輸入 使用者@位址 快速連線。
  ja: 左のホストをダブルクリックしてターミナルを開くか、検索ボックスに ユーザー@アドレス を入力してクイック接続します。
  ko: 왼쪽의 호스트를 더블클릭하여 터미널을 열거나, 검색 상자에 사용자@주소를 입력하여 빠르게 연결하세요.
