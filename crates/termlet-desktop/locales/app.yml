startup.error.title:
  zh-CN: Termlet 无法启动
  en: Termlet couldn't start
  zh-TW: Termlet 無法啟動
  ja: Termlet を起動できません
  ko: Termlet을 시작할 수 없습니다
startup.error.database_too_new:
  zh-CN: 数据来自更新版本的 Termlet。请安装最新版本后再打开。
  en: The data was created by a newer version of Termlet. Install the latest version and open it again.
  zh-TW: 資料來自較新版本的 Termlet。請安裝最新版本後再開啟。
  ja: データは新しいバージョンの Termlet で作成されています。最新バージョンをインストールしてから開いてください。
  ko: 데이터가 더 최신 버전의 Termlet에서 만들어졌습니다. 최신 버전을 설치한 후 다시 여세요.
startup.error.data_dir:
  zh-CN: 数据目录不可用：%{reason}
  en: "The data folder is unavailable: %{reason}"
  zh-TW: 資料目錄無法使用：%{reason}
  ja: データフォルダーを使用できません：%{reason}
  ko: "데이터 폴더를 사용할 수 없습니다: %{reason}"
startup.error.portable_not_writable:
  zh-CN: 便携版的数据保存在程序旁边的 data 文件夹，但无法写入 %{dir}（%{reason}）。请把 Termlet 文件夹放到可以写入的位置（例如桌面、文档或 U 盘）再打开；想让数据保存在系统的默认位置时，删除程序旁边的 portable.txt。
  en: "The portable version keeps its data in the data folder next to the program, but %{dir} can't be written to (%{reason}). Move the Termlet folder to a location you can write to (such as the desktop, Documents or a USB drive) and open it again, or delete portable.txt next to the program to keep the data in the system's default location."
  zh-TW: 可攜版的資料儲存在程式旁的 data 資料夾，但無法寫入 %{dir}（%{reason}）。請把 Termlet 資料夾放到可以寫入的位置（例如桌面、文件或隨身碟）再開啟；想讓資料儲存在系統的預設位置時，請刪除程式旁的 portable.txt。
  ja: ポータブル版のデータはプログラムと同じ場所の data フォルダーに保存されますが、%{dir} に書き込めません（%{reason}）。Termlet フォルダーを書き込める場所（デスクトップ、ドキュメント、USB メモリなど）に移動してから開いてください。データをシステムのデフォルトの場所に保存したい場合は、プログラムと同じ場所にある portable.txt を削除してください。
  ko: "포터블 버전은 데이터를 프로그램 옆의 data 폴더에 저장하지만 %{dir}에 쓸 수 없습니다(%{reason}). Termlet 폴더를 쓸 수 있는 위치(예: 바탕 화면, 문서, USB 드라이브)로 옮긴 후 다시 여세요. 데이터를 시스템의 기본 위치에 저장하려면 프로그램 옆의 portable.txt를 삭제하세요."
startup.error.forward_failed:
  zh-CN: Termlet 已经在运行，但没能把这次的启动参数（例如堡垒机调起的连接）交给它：%{reason}。请稍后再试，或退出正在运行的 Termlet 后重新打开。
  en: "Termlet is already running, but this launch's arguments (such as a connection opened by a bastion host) couldn't be handed to it: %{reason}. Try again later, or quit the running Termlet and open it again."
  zh-TW: Termlet 已經在執行，但無法把這次的啟動參數（例如由堡壘主機啟動的連線）交給它：%{reason}。請稍後再試，或結束正在執行的 Termlet 後重新開啟。
  ja: Termlet はすでに実行中ですが、今回の起動引数（要塞ホストから起動された接続など）を渡せませんでした：%{reason}。しばらくしてからもう一度試すか、実行中の Termlet を終了してから開き直してください。
  ko: "Termlet이 이미 실행 중이지만 이번 시작 인수(예: 배스천 호스트에서 시작한 연결)를 전달하지 못했습니다: %{reason}. 잠시 후 다시 시도하거나, 실행 중인 Termlet을 종료한 후 다시 여세요."
startup.error.old_instance:
  zh-CN: 正在运行的 Termlet %{version} 没有及时退出
  en: The running Termlet %{version} didn't quit in time
  zh-TW: 正在執行的 Termlet %{version} 沒有及時結束
  ja: 実行中の Termlet %{version} が時間内に終了しませんでした
  ko: 실행 중인 Termlet %{version}이(가) 제때 종료되지 않았습니다
startup.error.unexpected_reply:
  zh-CN: 正在运行的 Termlet 的回答不符合预期
  en: The running Termlet gave an unexpected reply
  zh-TW: 正在執行的 Termlet 回應不如預期
  ja: 実行中の Termlet から予期しない応答がありました
  ko: 실행 중인 Termlet에서 예기치 않은 응답이 왔습니다
startup.error.other:
  zh-CN: 打开数据时出错：%{error}
  en: "Couldn't open the data: %{error}"
  zh-TW: 開啟資料時發生錯誤：%{error}
  ja: データを開くときにエラーが発生しました：%{error}
  ko: "데이터를 여는 중 오류가 발생했습니다: %{error}"
name_dialog.required:
  zh-CN: 请填写名称。
  en: Enter a name.
  zh-TW: 請填寫名稱。
  ja: 名前を入力してください。
  ko: 이름을 입력하세요.
