tools.cleanup.volume_warning:
  zh-CN: 卷中的数据会永久删除，无法恢复；确认不再需要后再勾选。
  en: Data in these volumes is deleted permanently and cannot be recovered. Select only if you no longer need it.
  zh-TW: 磁碟區中的資料會永久刪除，無法復原；確認不再需要後再勾選。
  ja: ボリューム内のデータは完全に削除され、復元できません。不要であることを確認してから選択してください。
  ko: 볼륨의 데이터는 영구적으로 삭제되며 복원할 수 없습니다. 더 이상 필요하지 않은지 확인한 후 선택하세요.
tools.cleanup.named_volumes_one:
  zh-CN: 另有 1 个未使用的命名卷不在其中（Docker 23 起 volume prune 只清理匿名卷），需要时到“卷”页删除。
  en: 1 unused named volume is not included (since Docker 23, volume prune removes anonymous volumes only); remove it on the Volumes tab if needed.
  zh-TW: 另有 1 個未使用的具名磁碟區不在其中（Docker 23 起 volume prune 只清理匿名磁碟區），需要時到「磁碟區」頁刪除。
  ja: ほかに未使用の名前付きボリュームが 1 個ありますが、対象には含まれません（Docker 23 以降、volume prune は匿名ボリュームのみを削除します）。必要に応じて「ボリューム」ページで削除してください。
  ko: 사용하지 않는 이름 있는 볼륨 1개는 포함되지 않습니다(Docker 23부터 volume prune은 익명 볼륨만 정리합니다). 필요하면 '볼륨' 페이지에서 삭제하세요.
tools.cleanup.named_volumes:
  zh-CN: "另有 %{count} 个未使用的命名卷不在其中（Docker 23 起 volume prune 只清理匿名卷），需要时到“卷”页逐个删除。"
  en: "%{count} unused named volumes are not included (since Docker 23, volume prune removes anonymous volumes only); remove them on the Volumes tab if needed."
  zh-TW: "另有 %{count} 個未使用的具名磁碟區不在其中（Docker 23 起 volume prune 只清理匿名磁碟區），需要時到「磁碟區」頁逐一刪除。"
  ja: ほかに未使用の名前付きボリュームが %{count} 個ありますが、対象には含まれません（Docker 23 以降、volume prune は匿名ボリュームのみを削除します）。必要に応じて「ボリューム」ページで個別に削除してください。
  ko: 사용하지 않는 이름 있는 볼륨 %{count}개는 포함되지 않습니다(Docker 23부터 volume prune은 익명 볼륨만 정리합니다). 필요하면 '볼륨' 페이지에서 하나씩 삭제하세요.
