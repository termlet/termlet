tools.timer.hint_start:
  zh-CN: 启动后按计划触发它的服务，不会马上运行一次。
  en: Its service will run on schedule; it does not run right away.
  zh-TW: 啟動後依排程觸發它的服務，不會馬上執行一次。
  ja: 起動後はスケジュールに従ってサービスをトリガーします。すぐに 1 回実行することはありません。
  ko: 시작하면 일정에 따라 서비스를 트리거합니다. 바로 한 번 실행하지는 않습니다.
tools.timer.hint_stop:
  zh-CN: 停止后到点不再触发它的服务，正在运行的服务不受影响；开机启用的定时器下次开机后照常启动。
  en: Its service will no longer run on schedule; a run in progress is not affected. If enabled at boot, the timer starts again after the next boot.
  zh-TW: 停止後到點不再觸發它的服務，正在執行的服務不受影響；開機啟用的計時器下次開機後照常啟動。
  ja: 停止すると、時刻になってもサービスはトリガーされなくなります。実行中のサービスには影響しません。自動起動が有効なタイマーは、次回の起動時に通常どおり開始されます。
  ko: 중지하면 정해진 시간이 되어도 서비스를 트리거하지 않으며, 실행 중인 서비스에는 영향이 없습니다. 부팅 시 시작하도록 설정된 타이머는 다음 부팅 후 평소처럼 시작됩니다.
tools.timer.hint_enable:
  zh-CN: 下次开机后自动启动这个定时器，现在的状态不变。
  en: The timer will start automatically at boot; its current state is unchanged.
  zh-TW: 下次開機後自動啟動這個計時器，目前的狀態不變。
  ja: 次回の起動時からこのタイマーが自動的に開始されます。現在の状態は変わりません。
  ko: 다음 부팅부터 이 타이머가 자동으로 시작됩니다. 현재 상태는 바뀌지 않습니다.
tools.timer.hint_disable:
  zh-CN: 下次开机后不再自动启动这个定时器，现在的状态不变。
  en: The timer will no longer start at boot; its current state is unchanged.
  zh-TW: 下次開機後不再自動啟動這個計時器，目前的狀態不變。
  ja: 次回の起動時からこのタイマーは自動的に開始されなくなります。現在の状態は変わりません。
  ko: 다음 부팅부터 이 타이머가 자동으로 시작되지 않습니다. 현재 상태는 바뀌지 않습니다.
