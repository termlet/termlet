  en: This is PID 1 (the first process of the system). Ending it usually stops or reboots the system or container.
  zh-TW: 這是 PID 1（系統的第一個處理程序）。結束它通常會讓系統或容器停止、重新啟動。
  ja: これは PID 1（システムの最初のプロセス）です。終了すると通常、システムやコンテナーが停止または再起動します。
  ko: PID 1(시스템의 첫 번째 프로세스)입니다. 종료하면 보통 시스템이나 컨테이너가 중지되거나 다시 시작됩니다.
