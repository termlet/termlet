tools.notice.no_terminal:
  zh-CN: 打开一个 SSH 或 WSL 终端后，这里显示它所在主机的进程、服务、Docker 与网络连接。
  en: Open an SSH or WSL terminal to see the processes, services, Docker and network connections of its host here.
  zh-TW: 開啟一個 SSH 或 WSL 終端機後，這裡會顯示它所在主機的處理程序、服務、Docker 與網路連線。
  ja: SSH または WSL のターミナルを開くと、そのホストのプロセス、サービス、Docker、ネットワーク接続がここに表示されます。
  ko: SSH 또는 WSL 터미널을 열면 해당 호스트의 프로세스, 서비스, Docker, 네트워크 연결이 여기에 표시됩니다.
