tools.unavailable.unsupported:
  zh-CN: 主机工具只支持 Linux
  en: Host tools support Linux only
  zh-TW: 主機工具只支援 Linux
  ja: ホストツールは Linux のみに対応しています
  ko: 호스트 도구는 Linux만 지원합니다
tools.unavailable_hint.unsupported:
  zh-CN: 这台主机不是 Linux（或读不到 /proc），进程、服务、网络页不可用。
  en: This host is not Linux (or /proc is not readable), so processes, services and network are unavailable.
  zh-TW: 這台主機不是 Linux（或讀不到 /proc），處理程序、服務、網路頁無法使用。
  ja: このホストは Linux ではない（または /proc を読み取れない）ため、プロセス、サービス、ネットワークのページは使用できません。
  ko: 이 호스트는 Linux가 아니거나 /proc를 읽을 수 없으므로 프로세스, 서비스, 네트워크 페이지를 사용할 수 없습니다.
tools.unavailable.no_systemd:
  zh-CN: 这台主机没有使用 systemd
  en: This host does not use systemd
  zh-TW: 這台主機沒有使用 systemd
  ja: このホストは systemd を使用していません
  ko: 이 호스트는 systemd를 사용하지 않습니다
tools.unavailable_hint.no_systemd:
  zh-CN: 暂不支持管理它的服务。容器里通常没有 systemd，可以在终端中用 service、rc-service 等管理。
  en: Its services cannot be managed here. Containers usually have no systemd; use service, rc-service, etc. in the terminal.
  zh-TW: 暫不支援管理它的服務。容器裡通常沒有 systemd，可以在終端機中用 service、rc-service 等管理。
  ja: このホストのサービスの管理にはまだ対応していません。コンテナーには通常 systemd がないため、ターミナルで service や rc-service などを使って管理してください。
  ko: 이 호스트의 서비스 관리는 아직 지원하지 않습니다. 컨테이너에는 보통 systemd가 없으므로 터미널에서 service, rc-service 등으로 관리하세요.
tools.unavailable.no_docker:
  zh-CN: 这台主机没有安装 Docker 或 Podman
  en: Docker or Podman is not installed on this host
  zh-TW: 這台主機沒有安裝 Docker 或 Podman
  ja: このホストには Docker も Podman もインストールされていません
  ko: 이 호스트에는 Docker나 Podman이 설치되어 있지 않습니다
tools.unavailable_hint.no_docker:
  zh-CN: 安装后点“刷新”。也可能是 docker 不在执行命令时的 PATH 中。
  en: Click Refresh after installing it. docker may also be missing from the PATH used for commands.
  zh-TW: 安裝後按「重新整理」。也可能是 docker 不在執行指令時的 PATH 中。
  ja: インストール後に「更新」をクリックしてください。コマンド実行時の PATH に docker が含まれていない可能性もあります。
  ko: 설치한 후 '새로 고침'을 클릭하세요. 명령을 실행할 때의 PATH에 docker가 없을 수도 있습니다.
tools.unavailable.docker_down:
  zh-CN: Docker 没有运行
  en: Docker is not running
  zh-TW: Docker 沒有在執行
  ja: Docker が実行されていません
  ko: Docker가 실행되고 있지 않습니다
tools.docker_down_hint:
  zh-CN: 已安装 Docker，但连不上它的守护进程。启动后点“刷新”：
  en: "Docker is installed but its daemon is not reachable. Start it, then click Refresh:"
  zh-TW: 已安裝 Docker，但連不上它的常駐程式。啟動後按「重新整理」：
  ja: Docker はインストールされていますが、デーモンに接続できません。起動してから「更新」をクリックしてください：
  ko: "Docker는 설치되어 있지만 데몬에 연결할 수 없습니다. 시작한 후 '새로 고침'을 클릭하세요:"
tools.docker_desktop_hint:
  zh-CN: 启动 Docker Desktop，并在它的设置中为这个发行版打开 WSL 集成。
  en: Start Docker Desktop and turn on WSL integration for this distribution in its settings.
  zh-TW: 啟動 Docker Desktop，並在它的設定中為這個發行版開啟 WSL 整合。
  ja: Docker Desktop を起動し、その設定でこのディストリビューションの WSL 統合をオンにしてください。
  ko: "Docker Desktop을 시작하고 설정에서 이 배포판의 WSL 통합을 켜세요."
tools.unavailable.need_root:
  zh-CN: 需要 root 权限
  en: Root privileges required
  zh-TW: 需要 root 權限
  ja: root 権限が必要です
  ko: root 권한이 필요합니다
tools.unavailable.need_root_docker:
  zh-CN: 没有权限访问 Docker
  en: No permission to access Docker
  zh-TW: 沒有存取 Docker 的權限
  ja: Docker にアクセスする権限がありません
  ko: Docker에 액세스할 권한이 없습니다
tools.unavailable.single_channel:
  zh-CN: 这个连接只能使用一个通道
  en: This connection can use only one channel
  zh-TW: 這個連線只能使用一個通道
  ja: この接続ではチャネルを 1 つしか使用できません
  ko: 이 연결은 채널을 하나만 사용할 수 있습니다
tools.unavailable_hint.single_channel:
  zh-CN: 这个连接只能使用终端这一个通道（被堡垒机调起、主机设置了“只用一个通道”，或服务器拒绝另开通道）。主机工具需要另开通道执行命令，在这里不可用。
  en: This connection can only use the terminal channel (launched by a bastion host, the host is set to “Use a single channel”, or the server refused another channel). Host tools need another channel to run commands and are unavailable here.
  zh-TW: 這個連線只能使用終端機這一個通道（由堡壘主機啟動、主機設定了「只用一個通道」，或伺服器拒絕另開通道）。主機工具需要另開通道執行指令，在這裡無法使用。
  ja: この接続ではターミナルのチャネル 1 つしか使用できません（要塞ホストから起動された、ホストで「チャネルを 1 つだけ使用」が設定されている、またはサーバーが別のチャネルを拒否した）。ホストツールはコマンドの実行に別のチャネルが必要なため、ここでは使用できません。
  ko: 이 연결은 터미널 채널 하나만 사용할 수 있습니다(배스천 호스트에서 시작되었거나, 호스트에 '채널 하나만 사용'이 설정되어 있거나, 서버가 추가 채널을 거부했습니다). 호스트 도구는 명령을 실행하려면 별도의 채널이 필요하므로 여기서는 사용할 수 없습니다.
tools.sudo.password:
  zh-CN: 当前用户不是 root，sudo 需要密码（面板不会在后台传送密码）；也可能这个用户根本没有 sudo 权限（sudo 先要密码、之后才检查权限，事先无法区分）。
  en: "The current user is not root and sudo needs a password (passwords are never sent in the background). The user may also have no sudo rights at all: sudo asks for the password before checking, so this can't be told apart in advance."
  zh-TW: 目前的使用者不是 root，sudo 需要密碼（面板不會在背景傳送密碼）；也可能這個使用者根本沒有 sudo 權限（sudo 會先要求密碼、之後才檢查權限，無法事先區分）。
  ja: 現在のユーザーは root ではなく、sudo にパスワードが必要です（パネルはバックグラウンドでパスワードを送信しません）。このユーザーにそもそも sudo 権限がない可能性もあります（sudo はパスワードを求めてから権限を確認するため、事前には区別できません）。
  ko: 현재 사용자는 root가 아니며 sudo에 비밀번호가 필요합니다(패널은 백그라운드에서 비밀번호를 전송하지 않습니다). 이 사용자에게 sudo 권한이 아예 없을 수도 있습니다(sudo는 비밀번호를 먼저 묻고 나서 권한을 확인하므로 미리 구분할 수 없습니다).
tools.sudo.denied:
  zh-CN: 当前用户不能用 sudo 执行它。
  en: The current user is not allowed to run it with sudo.
  zh-TW: 目前的使用者不能用 sudo 執行它。
  ja: 現在のユーザーはこれを sudo で実行できません。
  ko: 현재 사용자는 이 작업을 sudo로 실행할 수 없습니다.
tools.sudo.none:
  zh-CN: 这台主机没有 sudo。
  en: sudo is not installed on this host.
  zh-TW: 這台主機沒有 sudo。
  ja: このホストには sudo がありません。
  ko: 이 호스트에는 sudo가 없습니다.
tools.root.title:
  zh-CN: 需要 root 权限
  en: Root Privileges Required
  zh-TW: 需要 root 權限
  ja: root 権限が必要です
  ko: root 권한 필요
tools.root.will_run:
  zh-CN: 在终端中执行：
  en: "Runs in the terminal:"
  zh-TW: 在終端機中執行：
  ja: ターミナルで実行するコマンド：
  ko: "터미널에서 실행할 명령:"
tools.root.will_run_su:
