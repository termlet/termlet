  ko: 비밀번호 없는 sudo로 읽으므로 모든 로그를 볼 수 있습니다
tools.logs.limited_none:
  zh-CN: "可能因为权限看不到这个服务的日志：把当前用户加入 systemd-journal 组（sudo usermod -aG systemd-journal $USER，重新登录后生效），或在终端中用 sudo journalctl 查看。"
  en: "You may not have permission to read this service's logs. Add the current user to the systemd-journal group (sudo usermod -aG systemd-journal $USER, then sign in again), or view them with sudo journalctl in a terminal."
  zh-TW: "可能因為權限看不到這個服務的記錄：把目前使用者加入 systemd-journal 群組（sudo usermod -aG systemd-journal $USER，重新登入後生效），或在終端機中用 sudo journalctl 查看。"
  ja: 権限がないため、このサービスのログを表示できない可能性があります。現在のユーザーを systemd-journal グループに追加する（sudo usermod -aG systemd-journal $USER、再ログイン後に有効）か、ターミナルで sudo journalctl を使って表示してください。
  ko: 권한이 없어 이 서비스의 로그를 볼 수 없을 수 있습니다. 현재 사용자를 systemd-journal 그룹에 추가하거나(sudo usermod -aG systemd-journal $USER, 다시 로그인한 후 적용) 터미널에서 sudo journalctl로 확인하세요.
tools.logs.limited_some:
  zh-CN: "可能因为权限只看到一部分日志：把当前用户加入 systemd-journal 组（sudo usermod -aG systemd-journal $USER，重新登录后生效），或在终端中用 sudo journalctl 查看。"
  en: "Permissions may be hiding some of these logs. Add the current user to the systemd-journal group (sudo usermod -aG systemd-journal $USER, then sign in again), or view them with sudo journalctl in a terminal."
  zh-TW: "可能因為權限只看到一部分記錄：把目前使用者加入 systemd-journal 群組（sudo usermod -aG systemd-journal $USER，重新登入後生效），或在終端機中用 sudo journalctl 查看。"
  ja: 権限がないため、ログの一部しか表示できていない可能性があります。現在のユーザーを systemd-journal グループに追加する（sudo usermod -aG systemd-journal $USER、再ログイン後に有効）か、ターミナルで sudo journalctl を使って表示してください。
  ko: 권한 때문에 로그의 일부만 보일 수 있습니다. 현재 사용자를 systemd-journal 그룹에 추가하거나(sudo usermod -aG systemd-journal $USER, 다시 로그인한 후 적용) 터미널에서 sudo journalctl로 확인하세요.
