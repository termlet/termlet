tools.cleanup.title:
  zh-CN: 清理 Docker
  en: Clean Up Docker
  zh-TW: 清理 Docker
  ja: Docker のクリーンアップ
  ko: Docker 정리
tools.cleanup.open:
  zh-CN: 清理…
  en: Clean up…
  zh-TW: 清理…
  ja: クリーンアップ…
  ko: 정리…
tools.cleanup.intro:
  zh-CN: 勾选要清理的内容。一并清理已停止的容器时，只被它们使用的网络、卷与镜像也会一起清理。
  en: Select what to clean up. When stopped containers are removed too, networks, volumes and images used only by them are cleaned up as well.
  zh-TW: 勾選要清理的內容。一併清理已停止的容器時，只被它們使用的網路、磁碟區與映像檔也會一起清理。
  ja: クリーンアップする項目を選択してください。停止中のコンテナーも一緒に削除する場合、それらだけが使用しているネットワーク、ボリューム、イメージも一緒にクリーンアップされます。
  ko: 정리할 항목을 선택하세요. 중지된 컨테이너도 함께 정리하면 그 컨테이너만 사용하는 네트워크, 볼륨, 이미지도 함께 정리됩니다.
tools.cleanup.loading:
