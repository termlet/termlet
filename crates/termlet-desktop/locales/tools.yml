  en: This is an SSH server process; ending it may disconnect SSH sessions (including this terminal) or even prevent logging in again.
  zh-TW: 這是 SSH 服務的處理程序，結束後可能中斷 SSH 連線（包括這個終端機），甚至無法再登入。
  ja: これは SSH サーバーのプロセスです。終了すると SSH 接続（このターミナルを含む）が切断され、再ログインできなくなる場合もあります。
  ko: SSH 서버 프로세스입니다. 종료하면 SSH 연결(이 터미널 포함)이 끊어지고 다시 로그인하지 못할 수도 있습니다.
