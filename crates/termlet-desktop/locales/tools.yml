tools.confirm.try_anyway_hint:
  zh-CN: "不经 sudo 在后台执行：polkit 等允许时会成功，不允许时说明原因"
  en: "Run in the background without sudo: succeeds if polkit or similar allows it, otherwise explains why"
  zh-TW: "不經由 sudo 在背景執行：polkit 等允許時會成功，不允許時說明原因"
  ja: "sudo を使わずにバックグラウンドで実行します。polkit などが許可すれば成功し、許可しなければ理由を表示します"
  ko: "sudo 없이 백그라운드에서 실행합니다. polkit 등이 허용하면 성공하고, 허용하지 않으면 이유를 알려 줍니다"
