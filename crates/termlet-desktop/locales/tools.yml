tools.confirm.root_first_sudo:
  zh-CN: "这条连接上没有免密码 sudo，将在新的 Tab 中执行，sudo 的密码在终端里输入（也可以用“填入密码”）。也可以仍然尝试在后台执行：polkit 等可能允许。"
  en: "There is no passwordless sudo on this connection, so this runs in a new tab where you enter the sudo password (or use “Fill password”). You can also try running it in the background anyway: polkit or similar may allow it."
  zh-TW: "這個連線上沒有免密碼 sudo，將在新的分頁中執行，sudo 的密碼在終端機裡輸入（也可以用「填入密碼」）。也可以仍然嘗試在背景執行：polkit 等可能允許。"
  ja: "この接続ではパスワードなしの sudo が使えないため、新しいタブで実行し、sudo のパスワードはターミナルで入力します（「パスワードを入力」も使えます）。それでもバックグラウンドで試すこともできます。polkit などが許可する場合があります。"
  ko: "이 연결에는 비밀번호 없는 sudo가 없으므로 새 탭에서 실행하며 sudo 비밀번호는 터미널에서 입력합니다('비밀번호 입력'도 사용할 수 있습니다). 그래도 백그라운드에서 시도할 수도 있습니다. polkit 등이 허용할 수 있습니다."
tools.confirm.root_first_su:
  zh-CN: "这个用户不能用 sudo 执行它，将在新的 Tab 中用 su 执行，需要输入 root 的密码。也可以仍然尝试在后台执行：polkit 等可能允许。"
  en: "This user can't run it with sudo, so it runs with su in a new tab and asks for the root password. You can also try running it in the background anyway: polkit or similar may allow it."
  zh-TW: "這個使用者不能用 sudo 執行它，將在新的分頁中用 su 執行，需要輸入 root 的密碼。也可以仍然嘗試在背景執行：polkit 等可能允許。"
  ja: "このユーザーは sudo で実行できないため、新しいタブで su を使って実行し、root のパスワードの入力が必要です。それでもバックグラウンドで試すこともできます。polkit などが許可する場合があります。"
  ko: "이 사용자는 sudo로 실행할 수 없으므로 새 탭에서 su로 실행하며 root 비밀번호를 입력해야 합니다. 그래도 백그라운드에서 시도할 수도 있습니다. polkit 등이 허용할 수 있습니다."
tools.confirm.try_anyway:
