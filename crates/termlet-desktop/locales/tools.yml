tools.privilege.sudo:
  zh-CN: 经免密码 sudo 执行需要 root 的操作
  en: Actions that need root run with passwordless sudo
  zh-TW: 需要 root 的操作經由免密碼 sudo 執行
  ja: root が必要な操作はパスワードなしの sudo で実行します
  ko: root 권한이 필요한 작업은 비밀번호 없는 sudo로 실행합니다
tools.privilege.sudo_network:
  zh-CN: 经免密码 sudo 读取，看得到全部进程的进程名
  en: Read with passwordless sudo, so every process name is shown
  zh-TW: 經由免密碼 sudo 讀取，看得到所有處理程序的名稱
  ja: パスワードなしの sudo で読み取るため、すべてのプロセス名が表示されます
  ko: 비밀번호 없는 sudo로 읽으므로 모든 프로세스 이름이 표시됩니다
tools.privilege.locked_processes:
  zh-CN: "不是 root，也没有免密码 sudo：结束别的用户的进程时在终端中执行。点击查看详情。"
  en: "Not root and no passwordless sudo: ending other users' processes runs in the terminal. Click for details."
  zh-TW: "不是 root，也沒有免密碼 sudo：結束其他使用者的處理程序時在終端機中執行。按一下查看詳細資訊。"
  ja: "root ではなく、パスワードなしの sudo もありません：ほかのユーザーのプロセスの終了はターミナルで実行します。クリックすると詳細を表示します。"
  ko: "root가 아니며 비밀번호 없는 sudo도 없습니다: 다른 사용자의 프로세스 종료는 터미널에서 실행합니다. 클릭하면 자세히 볼 수 있습니다."
tools.privilege.locked_services:
  zh-CN: "不是 root，也没有免密码 sudo：启停服务在终端中执行。点击查看详情。"
  en: "Not root and no passwordless sudo: starting and stopping services runs in the terminal. Click for details."
  zh-TW: "不是 root，也沒有免密碼 sudo：啟動、停止服務在終端機中執行。按一下查看詳細資訊。"
  ja: "root ではなく、パスワードなしの sudo もありません：サービスの起動や停止はターミナルで実行します。クリックすると詳細を表示します。"
  ko: "root가 아니며 비밀번호 없는 sudo도 없습니다: 서비스 시작과 중지는 터미널에서 실행합니다. 클릭하면 자세히 볼 수 있습니다."
tools.privilege.locked_network:
  zh-CN: 不是 root，也没有免密码 sudo：只看得到自己的进程的进程名。点击查看详情。
  en: "Not root and no passwordless sudo: process names are shown only for your own processes. Click for details."
  zh-TW: 不是 root，也沒有免密碼 sudo：只看得到自己的處理程序的名稱。按一下查看詳細資訊。
  ja: root ではなく、パスワードなしの sudo もありません：プロセス名は自分のプロセスのものしか表示されません。クリックすると詳細を表示します。
  ko: "root가 아니며 비밀번호 없는 sudo도 없습니다: 자신의 프로세스 이름만 볼 수 있습니다. 클릭하면 자세히 볼 수 있습니다."
tools.privilege.limited_processes:
  zh-CN: "当前用户不是 root，也没有免密码 sudo：在后台只能结束自己的进程。结束别的用户的进程时，确认框的主按钮是“在终端中执行”（菜单与按钮上的终端图标标出这些操作），也可以仍然尝试在后台执行。"
  en: "The current user is not root and has no passwordless sudo, so only your own processes can be ended in the background. For another user's process, the confirmation's main button is “Run in Terminal” (a terminal icon marks these actions in menus and buttons); you can also try it in the background anyway."
  zh-TW: "目前的使用者不是 root，也沒有免密碼 sudo：在背景只能結束自己的處理程序。結束其他使用者的處理程序時，確認框的主按鈕是「在終端機中執行」（選單與按鈕上的終端機圖示標出這些操作），也可以仍然嘗試在背景執行。"
  ja: "現在のユーザーは root ではなく、パスワードなしの sudo もないため、バックグラウンドでは自分のプロセスしか終了できません。ほかのユーザーのプロセスを終了するときは、確認ダイアログのメインボタンが「ターミナルで実行」になります（メニューやボタンのターミナルアイコンがこれらの操作を示します）。それでもバックグラウンドで試すこともできます。"
  ko: "현재 사용자는 root가 아니며 비밀번호 없는 sudo도 없으므로 백그라운드에서는 자신의 프로세스만 종료할 수 있습니다. 다른 사용자의 프로세스를 종료할 때는 확인 대화 상자의 기본 버튼이 '터미널에서 실행'입니다(메뉴와 버튼의 터미널 아이콘이 이러한 작업을 나타냅니다). 그래도 백그라운드에서 시도할 수도 있습니다."
tools.privilege.limited_services:
  zh-CN: "当前用户不是 root，也没有免密码 sudo：启动、停止、重启服务与开机启用 / 禁用都需要 root。这些操作的确认框以“在终端中执行”为主按钮（菜单与按钮上的终端图标标出它们），也可以仍然尝试在后台执行（polkit 等可能允许）。"
  en: "The current user is not root and has no passwordless sudo. Starting, stopping and restarting services, and enabling or disabling them at boot, need root: their confirmations have “Run in Terminal” as the main button (a terminal icon marks these actions in menus and buttons), and you can also try them in the background anyway (polkit or similar may allow it)."
  zh-TW: "目前的使用者不是 root，也沒有免密碼 sudo：啟動、停止、重新啟動服務與開機啟用 / 停用都需要 root。這些操作的確認框以「在終端機中執行」為主按鈕（選單與按鈕上的終端機圖示標出它們），也可以仍然嘗試在背景執行（polkit 等可能允許）。"
  ja: "現在のユーザーは root ではなく、パスワードなしの sudo もありません。サービスの起動、停止、再起動、および自動起動の有効化 / 無効化には root が必要です。これらの操作の確認ダイアログは「ターミナルで実行」がメインボタンになります（メニューやボタンのターミナルアイコンがこれらの操作を示します）。それでもバックグラウンドで試すこともできます（polkit などが許可する場合があります）。"
  ko: "현재 사용자는 root가 아니며 비밀번호 없는 sudo도 없습니다. 서비스 시작, 중지, 다시 시작과 부팅 시 시작 사용 / 사용 안 함 설정에는 root가 필요합니다. 이러한 작업의 확인 대화 상자는 '터미널에서 실행'이 기본 버튼입니다(메뉴와 버튼의 터미널 아이콘이 이러한 작업을 나타냅니다). 그래도 백그라운드에서 시도할 수도 있습니다(polkit 등이 허용할 수 있습니다)."
tools.privilege.limited_network:
  zh-CN: 当前用户不是 root，也没有免密码 sudo：只看得到自己的进程的进程名，别的用户的进程（包括 root 运行的服务）的连接只显示用户。
  en: The current user is not root and has no passwordless sudo, so process names are shown only for your own processes; connections of other users' processes (including services run by root) show only the user.
  zh-TW: 目前的使用者不是 root，也沒有免密碼 sudo：只看得到自己的處理程序的名稱，其他使用者的處理程序（包括 root 執行的服務）的連線只顯示使用者。
  ja: 現在のユーザーは root ではなく、パスワードなしの sudo もないため、プロセス名は自分のプロセスのものしか表示されません。ほかのユーザーのプロセス（root が実行するサービスを含む）の接続にはユーザーのみが表示されます。
  ko: 현재 사용자는 root가 아니며 비밀번호 없는 sudo도 없으므로 자신의 프로세스 이름만 볼 수 있습니다. 다른 사용자의 프로세스(root가 실행하는 서비스 포함) 연결에는 사용자만 표시됩니다.
