tools.service.connection_risk:
  zh-CN: "%{name} 是 SSH、网络或防火墙类服务：这个操作可能导致连接断开（包括这个终端），甚至无法再登录（例如防火墙启动或重新加载后的规则不放行 SSH）。请确认有其他办法登录（例如控制台）后再继续。"
  en: "%{name} is an SSH, network or firewall service: this may disconnect you (including this terminal) or even prevent logging in again (e.g. firewall rules that don't allow SSH after it starts or reloads). Make sure you have another way in (e.g. a console) before continuing."
  zh-TW: "%{name} 是 SSH、網路或防火牆類服務：這個操作可能導致連線中斷（包括這個終端機），甚至無法再登入（例如防火牆啟動或重新載入後的規則不允許 SSH 通過）。請確認有其他方法登入（例如主控台）後再繼續。"
  ja: "%{name} は SSH、ネットワーク、またはファイアウォール関連のサービスです。この操作により接続（このターミナルを含む）が切断されたり、再ログインできなくなったりする可能性があります（例：ファイアウォールの起動や再読み込み後のルールが SSH を許可しない場合）。ほかのログイン手段（コンソールなど）があることを確認してから続行してください。"
  ko: "'%{name}' 서비스는 SSH, 네트워크 또는 방화벽 관련 서비스입니다. 이 작업으로 연결(이 터미널 포함)이 끊어지거나 다시 로그인하지 못하게 될 수 있습니다(예: 방화벽이 시작되거나 다시 로드된 후의 규칙이 SSH를 허용하지 않는 경우). 다른 로그인 방법(예: 콘솔)이 있는지 확인한 후 계속하세요."
tools.service.power_risk:
  zh-CN: "%{name} 是关机、重启或休眠类单元：执行后这台主机会立即关机、重启或休眠，所有连接（包括这个终端）都会断开，正在运行的程序会被结束。"
  en: "%{name} is a power-off, reboot or sleep unit: this host will power off, reboot or go to sleep right away, every connection (including this terminal) will drop, and running programs will be stopped."
  zh-TW: "%{name} 是關機、重新啟動或休眠類單元：執行後這台主機會立即關機、重新啟動或休眠，所有連線（包括這個終端機）都會中斷，正在執行的程式會被結束。"
  ja: "%{name} は電源オフ、再起動、またはスリープ関連のユニットです。実行するとこのホストは直ちに電源オフ、再起動、またはスリープし、すべての接続（このターミナルを含む）が切断され、実行中のプログラムは終了します。"
  ko: "'%{name}' 유닛은 전원 끄기, 다시 시작 또는 절전 관련 유닛입니다. 실행하면 이 호스트는 즉시 전원이 꺼지거나 다시 시작되거나 절전 모드로 전환되며, 모든 연결(이 터미널 포함)이 끊어지고 실행 중인 프로그램은 종료됩니다."
