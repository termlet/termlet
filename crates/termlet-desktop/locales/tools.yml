  en: The process gets the termination signal (SIGTERM) and can clean up before it exits.
  zh-TW: 處理程序會收到結束訊號（SIGTERM），可以先做完收尾再結束。
  ja: プロセスに終了シグナル（SIGTERM）が送られ、後処理を済ませてから終了できます。
  ko: 프로세스에 종료 신호(SIGTERM)가 전송되며, 프로세스는 정리 작업을 마친 후 종료할 수 있습니다.
tools.process.kill_effect:
  zh-CN: 进程会被立即终止（SIGKILL），来不及保存数据；只在“结束”不起作用时使用。
  en: The process is stopped at once (SIGKILL) with no chance to save its data; use this only when End doesn't work.
  zh-TW: 處理程序會被立即終止（SIGKILL），來不及儲存資料；只在「結束」沒有作用時使用。
  ja: プロセスは直ちに停止され（SIGKILL）、データを保存する余裕がありません。「終了」で終わらない場合にのみ使用してください。
  ko: 프로세스가 즉시 중지되며(SIGKILL) 데이터를 저장할 틈이 없습니다. '종료'가 작동하지 않을 때만 사용하세요.
tools.process.risk_init:
