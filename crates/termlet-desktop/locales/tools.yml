  en: "With su:"
  zh-TW: 改用 su 時：
  ja: su を使う場合：
  ko: "su를 사용하는 경우:"
tools.root.description:
  zh-CN: "“%{action}”需要 root 权限。"
  en: "“%{action}” requires root privileges."
  zh-TW: "「%{action}」需要 root 權限。"
  ja: 「%{action}」には root 権限が必要です。
  ko: "'%{action}' 작업에는 root 권한이 필요합니다."
tools.root.terminal:
  zh-CN: 在终端中执行：在新的 Tab 中执行同一条命令，sudo 的密码提示出现在终端里，可以自己输入，或用“填入密码”填入已保存的密码。
  en: "Run in terminal: run the same command in a new tab. The sudo password prompt appears in the terminal; type it, or use “Fill password” to fill the saved one."
  zh-TW: 在終端機中執行：在新的分頁中執行同一條指令，sudo 的密碼提示會出現在終端機裡，可以自己輸入，或用「填入密碼」填入已儲存的密碼。
  ja: ターミナルで実行：新しいタブで同じコマンドを実行します。sudo のパスワード入力はターミナルに表示されるので、自分で入力するか、「パスワードを入力」で保存済みのパスワードを入力できます。
  ko: "터미널에서 실행: 새 탭에서 같은 명령을 실행합니다. sudo 비밀번호 프롬프트가 터미널에 표시되며 직접 입력하거나 '비밀번호 입력'으로 저장된 비밀번호를 입력할 수 있습니다."
tools.root.terminal_su:
  zh-CN: 在终端中执行：在新的 Tab 中用 su 执行同一条命令，需要输入 root 的密码。
  en: "Run in terminal: run the same command with su in a new tab; you will be asked for the root password."
  zh-TW: 在終端機中執行：在新的分頁中用 su 執行同一條指令，需要輸入 root 的密碼。
  ja: ターミナルで実行：新しいタブで su を使って同じコマンドを実行します。root のパスワードの入力が必要です。
  ko: "터미널에서 실행: 새 탭에서 su로 같은 명령을 실행합니다. root 비밀번호를 입력해야 합니다."
tools.root.terminal_su_alt:
  zh-CN: 这个用户没有 sudo 权限时：改用 su 执行，在新的 Tab 中输入 root 的密码。
  en: "If this user has no sudo rights: run it with su instead and enter the root password in the new tab."
  zh-TW: 這個使用者沒有 sudo 權限時：改用 su 執行，在新的分頁中輸入 root 的密碼。
  ja: このユーザーに sudo 権限がない場合：su で実行し、新しいタブで root のパスワードを入力します。
  ko: "이 사용자에게 sudo 권한이 없는 경우: su로 실행하고 새 탭에서 root 비밀번호를 입력합니다."
tools.root.docker_group:
  zh-CN: 把这个用户加入 docker 组（重新登录后生效）：
  en: "Add this user to the docker group (takes effect after logging in again):"
  zh-TW: 把這個使用者加入 docker 群組（重新登入後生效）：
  ja: このユーザーを docker グループに追加します（再ログイン後に有効になります）：
  ko: "이 사용자를 docker 그룹에 추가합니다(다시 로그인한 후 적용됩니다):"
tools.root.login:
  zh-CN: 以 root 登录这台主机。
  en: Log in to this host as root.
  zh-TW: 以 root 登入這台主機。
  ja: root でこのホストにログインします。
  ko: 이 호스트에 root로 로그인합니다.
tools.root.sudoers:
  zh-CN: 为这个用户配置免密码的 sudo（用 visudo 加上 NOPASSWD），面板会自动使用。
  en: Configure passwordless sudo for this user (add NOPASSWD with visudo); the panel uses it automatically.
  zh-TW: 為這個使用者設定免密碼的 sudo（用 visudo 加上 NOPASSWD），面板會自動使用。
  ja: このユーザーにパスワードなしの sudo を設定します（visudo で NOPASSWD を追加）。パネルが自動的に使用します。
  ko: 이 사용자에게 비밀번호 없는 sudo를 설정합니다(visudo로 NOPASSWD 추가). 패널이 자동으로 사용합니다.
tools.root.info_terminal:
  zh-CN: "在终端中执行：需要 root 的操作在新的 Tab 中执行同一条命令，sudo 的密码提示出现在终端里，可以自己输入或用“填入密码”填入已保存的密码。"
  en: "Run in terminal: actions that need root run the same command in a new tab, where the sudo password prompt appears; type it, or use “Fill password” to fill the saved one."
  zh-TW: "在終端機中執行：需要 root 的操作在新的分頁中執行同一條指令，sudo 的密碼提示會出現在終端機裡，可以自己輸入，或用「填入密碼」填入已儲存的密碼。"
  ja: "ターミナルで実行：root が必要な操作は、新しいタブで同じコマンドを実行します。sudo のパスワード入力はターミナルに表示されるので、自分で入力するか、「パスワードを入力」で保存済みのパスワードを入力できます。"
  ko: "터미널에서 실행: root 권한이 필요한 작업은 새 탭에서 같은 명령을 실행합니다. sudo 비밀번호 프롬프트가 터미널에 표시되며 직접 입력하거나 '비밀번호 입력'으로 저장된 비밀번호를 입력할 수 있습니다."
