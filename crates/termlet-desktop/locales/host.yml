host.jump.hint:
  zh-CN: 经另一台主机连接（相当于 ssh 的 ProxyJump），跳板机使用它自己的凭据，也可以再经跳板机连接。
  en: Connect through another host (like ssh ProxyJump). The jump host uses its own credentials and can itself use a jump host.
  zh-TW: 經由另一台主機連線（相當於 ssh 的 ProxyJump），跳板機使用它自己的認證資訊，也可以再經由跳板機連線。
  ja: 別のホストを経由して接続します（ssh の ProxyJump に相当）。踏み台ホストは自身の認証情報を使用し、さらに別の踏み台ホストを経由することもできます。
  ko: 다른 호스트를 거쳐 연결합니다(ssh의 ProxyJump와 같음). 점프 호스트는 자체 자격 증명을 사용하며, 다시 다른 점프 호스트를 거쳐 연결할 수도 있습니다.
