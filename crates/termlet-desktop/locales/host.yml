host.auth.agent_hint:
  zh-CN: 使用 ssh-agent 中的密钥。Windows 上先使用 OpenSSH Authentication Agent 服务（或 SSH_AUTH_SOCK 指定的管道），不可用或其中没有密钥时使用 Pageant；其他平台为 SSH_AUTH_SOCK。
  en: Uses keys from ssh-agent. On Windows, the OpenSSH Authentication Agent service (or the pipe in SSH_AUTH_SOCK) is used first, and Pageant when it isn't available or holds no keys. Elsewhere, SSH_AUTH_SOCK is used.
  zh-TW: 使用 ssh-agent 中的金鑰。Windows 上先使用 OpenSSH Authentication Agent 服務（或 SSH_AUTH_SOCK 指定的管道），無法使用或其中沒有金鑰時使用 Pageant；其他平台為 SSH_AUTH_SOCK。
  ja: ssh-agent の鍵を使用します。Windows では OpenSSH Authentication Agent サービス（または SSH_AUTH_SOCK で指定したパイプ）を優先し、使用できないか鍵がない場合は Pageant を使用します。その他のプラットフォームでは SSH_AUTH_SOCK を使用します。
  ko: ssh-agent의 키를 사용합니다. Windows에서는 OpenSSH Authentication Agent 서비스(또는 SSH_AUTH_SOCK에 지정된 파이프)를 먼저 사용하고, 사용할 수 없거나 키가 없으면 Pageant를 사용합니다. 다른 플랫폼에서는 SSH_AUTH_SOCK을 사용합니다.
host.auth.no_profiles:
  zh-CN: 还没有凭据档案，请先在侧边栏“密钥”页的“凭据档案”中添加。
  en: There are no credential profiles yet. Add one under Credential Profiles on the Keys page of the sidebar first.
  zh-TW: 還沒有認證資訊設定檔，請先在側邊欄「金鑰」頁的「認證資訊設定檔」中新增。
  ja: 認証プロファイルがまだありません。先にサイドバーの「鍵」ページにある「認証プロファイル」で追加してください。
  ko: 아직 자격 증명 프로필이 없습니다. 먼저 사이드바 '키' 페이지의 '자격 증명 프로필'에서 추가하세요.
host.auth.inherit_hint:
  zh-CN: 沿用分组“%{group}”默认的凭据档案“%{profile}”。
  en: Uses "%{profile}", the default credential profile of group "%{group}".
  zh-TW: 沿用群組「%{group}」預設的認證資訊設定檔「%{profile}」。
  ja: グループ「%{group}」のデフォルトの認証プロファイル「%{profile}」を使用します。
  ko: "'%{group}' 그룹의 기본 자격 증명 프로필 '%{profile}'을(를) 사용합니다."
