host.delete.description:
  zh-CN: 它保存的密码、私钥等凭据与端口转发规则也会删除。
  en: Its saved passwords, private keys, and port forwarding rules are deleted too.
  zh-TW: 它儲存的密碼、私密金鑰等認證資訊與連接埠轉送規則也會刪除。
  ja: 保存されているパスワードや秘密鍵などの認証情報、ポート転送ルールも削除されます。
  ko: 저장된 비밀번호, 개인 키 등의 자격 증명과 포트 포워딩 규칙도 삭제됩니다.
