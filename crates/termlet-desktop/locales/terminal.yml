  zh-CN: 终端中正在运行全屏程序，没有发送。
  en: A full-screen program is running in the terminal, so nothing was sent.
  zh-TW: 終端機中正在執行全螢幕程式，沒有傳送。
  ja: ターミナルで全画面プログラムが実行中のため、送信しませんでした。
  ko: 터미널에서 전체 화면 프로그램이 실행 중이라 보내지 않았습니다.
terminal.proxy.others:
  zh-CN: 服务器上的其他用户也能连这个端口，借用你的代理。用完请停止。
  en: Other users on the server can also connect to this port and use your proxy. Stop it when you're done.
  zh-TW: 伺服器上的其他使用者也能連到這個連接埠，借用你的代理。用完請停止。
  ja: サーバー上のほかのユーザーもこのポートに接続して、このプロキシを使用できます。使い終わったら停止してください。
  ko: 서버의 다른 사용자도 이 포트에 연결해 이 프록시를 빌려 쓸 수 있습니다. 다 쓰면 중지하세요.
terminal.proxy.bar:
  zh-CN: 代理 :%{port}
  en: Proxy :%{port}
  zh-TW: 代理 :%{port}
  ja: プロキシ :%{port}
  ko: 프록시 :%{port}
terminal.proxy.bar_tooltip:
  zh-CN: 本机代理借给服务器：服务器上的 127.0.0.1:%{port} → 本机的 %{local}
  en: "Lending the local proxy: 127.0.0.1:%{port} on the server → %{local} here"
  zh-TW: 本機代理借給伺服器：伺服器上的 127.0.0.1:%{port} → 本機的 %{local}
  ja: ローカルプロキシを共有中：サーバーの 127.0.0.1:%{port} → このコンピューターの %{local}
  ko: "로컬 프록시 공유 중: 서버의 127.0.0.1:%{port} → 이 컴퓨터의 %{local}"
terminal.proxy.error.address_empty:
  zh-CN: 请填写本机代理的地址，例如 127.0.0.1:7890。
  en: Enter the address of the local proxy, e.g. 127.0.0.1:7890.
  zh-TW: 請填寫本機代理的位址，例如 127.0.0.1:7890。
  ja: ローカルプロキシのアドレスを入力してください（例：127.0.0.1:7890）。
  ko: "로컬 프록시 주소를 입력하세요(예: 127.0.0.1:7890)."
terminal.proxy.error.address:
  zh-CN: 本机代理的地址不对：%{address}。请写成“主机:端口”（只支持 HTTP 代理）。
  en: "The local proxy address isn't valid: %{address}. Use \"host:port\" (HTTP proxies only)."
  zh-TW: 本機代理的位址不正確：%{address}。請寫成「主機:連接埠」（只支援 HTTP 代理）。
  ja: ローカルプロキシのアドレスが正しくありません：%{address}。「ホスト:ポート」の形式で入力してください（HTTP プロキシのみ対応）。
  ko: "로컬 프록시 주소가 올바르지 않습니다: %{address}. '호스트:포트' 형식으로 입력하세요(HTTP 프록시만 지원)."
terminal.proxy.error.port:
  zh-CN: 端口不对：%{port}。请填 1–65535，或者留空。
  en: "The port isn't valid: %{port}. Enter 1–65535 or leave it empty."
  zh-TW: 連接埠不正確：%{port}。請填 1–65535，或者留空。
  ja: ポートが正しくありません：%{port}。1～65535 を入力するか、空欄のままにしてください。
  ko: "포트가 올바르지 않습니다: %{port}. 1–65535 사이 값을 입력하거나 비워 두세요."
terminal.proxy.error.denied:
  zh-CN: 服务器不允许远程转发（sshd 设置了 AllowTcpForwarding no、DisableForwarding 或 PermitListen 等），不能把本机代理借给它。
  en: The server doesn't allow remote forwarding (sshd sets AllowTcpForwarding no, DisableForwarding, PermitListen or similar), so the local proxy can't be lent.
  zh-TW: 伺服器不允許遠端轉送（sshd 設定了 AllowTcpForwarding no、DisableForwarding 或 PermitListen 等），無法把本機代理借給它。
  ja: サーバーがリモート転送を許可していないため（sshd で AllowTcpForwarding no、DisableForwarding、PermitListen などが設定されています）、ローカルプロキシを共有できません。
  ko: 서버가 원격 포워딩을 허용하지 않아(sshd에 AllowTcpForwarding no, DisableForwarding, PermitListen 등이 설정됨) 로컬 프록시를 공유할 수 없습니다.
terminal.proxy.error.disconnected:
  zh-CN: 连接已断开。
  en: The connection was lost.
  zh-TW: 連線已中斷。
  ja: 接続が切断されました。
  ko: 연결이 끊겼습니다.
terminal.proxy.error.other:
  zh-CN: 开启失败：%{reason}
  en: "Couldn't turn it on: %{reason}"
  zh-TW: 開啟失敗：%{reason}
  ja: オンにできませんでした：%{reason}
  ko: "켜지 못했습니다: %{reason}"
