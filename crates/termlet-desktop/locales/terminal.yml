_version: 2
terminal.exited_with_code:
  zh-CN: 进程已退出，退出码 %{code}。
  en: The process exited with code %{code}.
  zh-TW: 處理程序已結束，結束代碼 %{code}。
  ja: プロセスが終了しました（終了コード %{code}）。
  ko: 프로세스가 종료되었습니다(종료 코드 %{code}).
terminal.exited:
  zh-CN: 进程已退出。
  en: The process exited.
  zh-TW: 處理程序已結束。
  ja: プロセスが終了しました。
  ko: 프로세스가 종료되었습니다.
terminal.failed:
  zh-CN: 会话已断开：%{reason}
  en: "The session ended: %{reason}"
  zh-TW: 工作階段已中斷：%{reason}
  ja: セッションが切断されました：%{reason}
  ko: "세션 연결이 끊겼습니다: %{reason}"
terminal.press_enter_to_restart:
  zh-CN: 按 Enter 重新打开。
  en: Press Enter to reopen.
  zh-TW: 按 Enter 重新開啟。
  ja: Enter キーを押すと開き直します。
  ko: Enter 키를 누르면 다시 엽니다.
terminal.press_enter_to_reconnect:
  zh-CN: 按 Enter 重新连接。
  en: Press Enter to reconnect.
  zh-TW: 按 Enter 重新連線。
  ja: Enter キーを押すと再接続します。
  ko: Enter 키를 누르면 다시 연결합니다.
terminal.session_ended_with_code:
  zh-CN: 会话已结束（退出码 %{code}）。
  en: The session ended (exit code %{code}).
  zh-TW: 工作階段已結束（結束代碼 %{code}）。
  ja: セッションが終了しました（終了コード %{code}）。
  ko: 세션이 종료되었습니다(종료 코드 %{code}).
terminal.session_ended:
  zh-CN: 会话已结束。
  en: The session ended.
  zh-TW: 工作階段已結束。
  ja: セッションが終了しました。
  ko: 세션이 종료되었습니다.
terminal.lost:
  zh-CN: 连接已断开。
  en: The connection was lost.
  zh-TW: 連線已中斷。
  ja: 接続が切断されました。
  ko: 연결이 끊겼습니다.
terminal.waiting:
  zh-CN: 连接已断开，正在重连（第 %{attempt} 次）…
  en: The connection was lost. Reconnecting (attempt %{attempt})…
  zh-TW: 連線已中斷，正在重新連線（第 %{attempt} 次）…
  ja: 接続が切断されました。再接続しています（%{attempt} 回目）…
  ko: 연결이 끊겼습니다. 다시 연결하는 중(%{attempt}번째)…
terminal.reconnect_now:
  zh-CN: 立即重连
  en: Reconnect now
  zh-TW: 立即重新連線
  ja: 今すぐ再接続
  ko: 지금 다시 연결
terminal.reconnect_failed:
  zh-CN: 重新连接失败，原来的会话保持不变：%{error}
  en: "Couldn't reconnect, so the current session was kept: %{error}"
  zh-TW: 重新連線失敗，原本的工作階段保持不變：%{error}
  ja: 再接続できなかったため、元のセッションをそのまま残しました：%{error}
  ko: "다시 연결하지 못해 기존 세션을 그대로 유지했습니다: %{error}"
terminal.restart_failed:
  zh-CN: 重新启动失败，原来的会话保持不变：%{error}
  en: "Couldn't restart, so the current session was kept: %{error}"
  zh-TW: 重新啟動失敗，原本的工作階段保持不變：%{error}
  ja: 再起動できなかったため、元のセッションをそのまま残しました：%{error}
  ko: "다시 시작하지 못해 기존 세션을 그대로 유지했습니다: %{error}"
terminal.stalled:
  zh-CN: 连接没有响应，正在等待恢复（会话没有断开，网络恢复后照常）
  en: The connection isn't responding. Waiting for it to recover (the session is still open and resumes when the network is back)
  zh-TW: 連線沒有回應，正在等待恢復（工作階段沒有中斷，網路恢復後照常運作）
  ja: 接続が応答していません。回復を待っています（セッションは切断されておらず、ネットワークが回復すれば通常どおり続行します）
  ko: 연결이 응답하지 않아 복구를 기다리는 중입니다(세션은 끊기지 않았으며 네트워크가 복구되면 그대로 계속됩니다)
terminal.notice.disconnected:
  zh-CN: 连接已断开，正在自动重连…
  en: The connection was lost. Reconnecting automatically…
  zh-TW: 連線已中斷，正在自動重新連線…
  ja: 接続が切断されました。自動的に再接続しています…
  ko: 연결이 끊겼습니다. 자동으로 다시 연결하는 중…
terminal.notice.certificate_expiring:
  zh-CN: 登录用的证书将于 %{time} 过期（还剩约 %{minutes} 分钟），过期后无法重新连接，请及时重新签发。
  en: The certificate used to log in expires at %{time} (about %{minutes} min left). After that you won't be able to reconnect, so get a new one issued in time.
  zh-TW: 登入用的憑證將於 %{time} 過期（剩約 %{minutes} 分鐘），過期後無法重新連線，請及時重新簽發。
  ja: ログインに使用した証明書は %{time} に期限切れになります（残り約 %{minutes} 分）。期限切れ後は再接続できないため、早めに新しい証明書を発行してください。
  ko: 로그인에 사용한 인증서가 %{time}에 만료됩니다(약 %{minutes}분 남음). 만료 후에는 다시 연결할 수 없으니 미리 인증서를 다시 발급받으세요.
terminal.notice.jump_certificate_expiring:
  zh-CN: 跳板机 %{jump} 登录用的证书将于 %{time} 过期（还剩约 %{minutes} 分钟），过期后无法经它重新连接，请及时重新签发。
  en: The certificate used to log in to the jump host %{jump} expires at %{time} (about %{minutes} min left). After that you won't be able to reconnect through it, so get a new one issued in time.
  zh-TW: 跳板機 %{jump} 登入用的憑證將於 %{time} 過期（剩約 %{minutes} 分鐘），過期後無法經由它重新連線，請及時重新簽發。
  ja: 踏み台ホスト %{jump} へのログインに使用した証明書は %{time} に期限切れになります（残り約 %{minutes} 分）。期限切れ後はこの踏み台ホスト経由で再接続できないため、早めに新しい証明書を発行してください。
  ko: 점프 호스트 %{jump} 로그인에 사용한 인증서가 %{time}에 만료됩니다(약 %{minutes}분 남음). 만료 후에는 이 점프 호스트를 거쳐 다시 연결할 수 없으니 미리 인증서를 다시 발급받으세요.
terminal.notice.reconnected:
  zh-CN: 已重新连接（新的 shell 会话）
  en: Reconnected (new shell session)
  zh-TW: 已重新連線（新的 shell 工作階段）
  ja: 再接続しました（新しいシェルセッション）
  ko: 다시 연결했습니다(새 셸 세션)
terminal.notice.restarted:
  zh-CN: 已重新启动（新的 shell 会话）
  en: Restarted (new shell session)
  zh-TW: 已重新啟動（新的 shell 工作階段）
  ja: 再起動しました（新しいシェルセッション）
  ko: 다시 시작했습니다(새 셸 세션)
terminal.notice.reconnected_tmux:
  zh-CN: 已重新连接，回到原来的 tmux 会话
  en: Reconnected to the same tmux session
  zh-TW: 已重新連線，回到原本的 tmux 工作階段
  ja: 再接続し、元の tmux セッションに戻りました
  ko: 다시 연결해 기존 tmux 세션으로 돌아왔습니다
terminal.notice.tmux_unavailable:
  zh-CN: 远端没有安装 tmux，已使用普通 shell（断线后无法恢复现场）
  en: tmux isn't installed on the server, so a plain shell is used (the session can't be restored after a disconnect)
  zh-TW: 遠端沒有安裝 tmux，已使用一般 shell（斷線後無法還原工作階段）
  ja: サーバーに tmux がインストールされていないため、通常のシェルを使用しています（切断後に作業状態を復元できません）
  ko: 서버에 tmux가 설치되어 있지 않아 일반 셸을 사용합니다(연결이 끊기면 작업 상태를 복원할 수 없음)
terminal.notice.tmux_unchecked:
  zh-CN: 没能检查服务器上是否安装了 tmux（连接繁忙或没有及时回应），这次使用普通 shell（断线后无法恢复现场），重新打开终端会再检查
  en: Couldn't check whether tmux is installed on the server (the connection was busy or didn't respond in time), so a plain shell is used this time (the session can't be restored after a disconnect). Reopen the terminal to check again
  zh-TW: 無法檢查伺服器上是否安裝了 tmux（連線忙碌或沒有及時回應），這次使用一般 shell（斷線後無法還原工作階段），重新開啟終端機時會再檢查
  ja: サーバーに tmux がインストールされているか確認できなかったため（接続が混雑していたか、時間内に応答がありませんでした）、今回は通常のシェルを使用しています（切断後に作業状態を復元できません）。ターミナルを開き直すと再確認します
  ko: 서버에 tmux가 설치되어 있는지 확인하지 못해(연결이 바쁘거나 제때 응답하지 않음) 이번에는 일반 셸을 사용합니다(연결이 끊기면 작업 상태를 복원할 수 없음). 터미널을 다시 열면 다시 확인합니다
terminal.notice.x11_refused:
  zh-CN: X11 转发：服务器拒绝了（sshd 没有开启 X11Forwarding，或服务器上没有安装 xauth），图形程序不能显示在本机
  en: "X11 forwarding: the server refused it (X11Forwarding is off in sshd, or xauth isn't installed on the server), so graphical programs can't show on this computer"
  zh-TW: X11 轉送：伺服器拒絕了（sshd 沒有開啟 X11Forwarding，或伺服器上沒有安裝 xauth），圖形程式無法顯示在本機
  ja: X11 転送：サーバーに拒否されました（sshd で X11Forwarding が有効になっていないか、サーバーに xauth がインストールされていません）。グラフィカルなプログラムをこのコンピューターに表示できません
  ko: "X11 포워딩: 서버가 거부했습니다(sshd에서 X11Forwarding이 꺼져 있거나 서버에 xauth가 설치되어 있지 않음). 그래픽 프로그램을 이 컴퓨터에 표시할 수 없습니다"
terminal.notice.x11_bad_display:
  zh-CN: X11 转发：本机 X 显示的写法不对（%{display}），请在设置的“连接”页中修改
  en: "X11 forwarding: the local X display (%{display}) isn't valid. Change it on the Connection page in Settings"
  zh-TW: X11 轉送：本機 X 顯示的寫法不對（%{display}），請在設定的「連線」頁中修改
  ja: X11 転送：ローカルの X ディスプレイの指定（%{display}）が正しくありません。設定の「接続」ページで変更してください
  ko: "X11 포워딩: 로컬 X 디스플레이 형식(%{display})이 올바르지 않습니다. 설정의 '연결' 페이지에서 변경하세요"
terminal.notice.x11_no_xauth:
  zh-CN: X11 转发：不受信任的转发需要本机的 xauth，没有找到。可以在主机设置中勾选“受信任”
  en: "X11 forwarding: untrusted forwarding needs xauth on this computer, and it wasn't found. You can select \"Trusted\" in the host settings"
  zh-TW: X11 轉送：不受信任的轉送需要本機的 xauth，沒有找到。可以在主機設定中勾選「受信任」
  ja: X11 転送：信頼されていない転送にはこのコンピューターの xauth が必要ですが、見つかりませんでした。ホストの設定で「信頼済み」をチェックすることもできます
  ko: "X11 포워딩: 신뢰할 수 없는 포워딩에는 이 컴퓨터의 xauth가 필요하지만 찾지 못했습니다. 호스트 설정에서 '신뢰함'을 선택할 수도 있습니다"
terminal.notice.x11_xauth_failed:
  zh-CN: X11 转发：本机的 xauth 没能申请到不受信任的权限（%{reason}）。请确认本机的 X 服务器在运行，或在主机设置中勾选“受信任”
  en: "X11 forwarding: xauth on this computer couldn't get untrusted access (%{reason}). Make sure the local X server is running, or select \"Trusted\" in the host settings"
  zh-TW: X11 轉送：本機的 xauth 無法申請到不受信任的權限（%{reason}）。請確認本機的 X 伺服器正在執行，或在主機設定中勾選「受信任」
  ja: X11 転送：このコンピューターの xauth で、信頼されていないアクセス権を取得できませんでした（%{reason}）。ローカルの X サーバーが実行中であることを確認するか、ホストの設定で「信頼済み」をチェックしてください
  ko: "X11 포워딩: 이 컴퓨터의 xauth가 신뢰할 수 없는 액세스 권한을 얻지 못했습니다(%{reason}). 로컬 X 서버가 실행 중인지 확인하거나 호스트 설정에서 '신뢰함'을 선택하세요"
terminal.notice.x11_no_server:
  zh-CN: X 程序要打开窗口，但连不上本机的 X 服务器 %{display}（%{reason}）。请先启动 X 服务器（Windows 上可用 VcXsrv、X410），或在设置的“连接”页中修改本机的 X 显示
  en: An X program tried to open a window, but the local X server %{display} couldn't be reached (%{reason}). Start an X server first (VcXsrv or X410 on Windows), or change the local X display on the Connection page in Settings
  zh-TW: X 程式要開啟視窗，但連不上本機的 X 伺服器 %{display}（%{reason}）。請先啟動 X 伺服器（Windows 上可用 VcXsrv、X410），或在設定的「連線」頁中修改本機的 X 顯示
  ja: X プログラムがウィンドウを開こうとしましたが、ローカルの X サーバー %{display} に接続できませんでした（%{reason}）。先に X サーバーを起動するか（Windows では VcXsrv、X410 などが使えます）、設定の「接続」ページでローカルの X ディスプレイを変更してください
  ko: X 프로그램이 창을 열려고 했지만 로컬 X 서버 %{display}에 연결할 수 없습니다(%{reason}). 먼저 X 서버를 시작하거나(Windows에서는 VcXsrv, X410 등 사용 가능) 설정의 '연결' 페이지에서 로컬 X 디스플레이를 변경하세요
terminal.confirm_reconnect.title:
  zh-CN: 重新连接“%{name}”？
  en: Reconnect "%{name}"?
  zh-TW: 重新連線「%{name}」？
  ja: 「%{name}」に再接続しますか？
  ko: "'%{name}'에 다시 연결하시겠습니까?"
terminal.confirm_reconnect.description:
  zh-CN: 当前会话将断开，用新的连接重新打开，其中运行的程序会结束。
  en: The current session will be closed and reopened over a new connection. Programs running in it will end.
  zh-TW: 目前的工作階段將會中斷，並以新的連線重新開啟，其中執行的程式會結束。
  ja: 現在のセッションは切断され、新しい接続で開き直されます。その中で実行中のプログラムは終了します。
  ko: 현재 세션이 끊기고 새 연결로 다시 열립니다. 세션에서 실행 중인 프로그램은 종료됩니다.
terminal.confirm_reconnect.description_tmux:
  zh-CN: 当前会话将断开并用新的连接重连，重连后回到原来的 tmux 会话，其中运行的程序不受影响。
  en: The current session will be closed and reopened over a new connection, back in the same tmux session. Programs running in it aren't affected.
  zh-TW: 目前的工作階段將會中斷並以新的連線重新連線，重新連線後回到原本的 tmux 工作階段，其中執行的程式不受影響。
  ja: 現在のセッションは切断され、新しい接続で再接続した後、元の tmux セッションに戻ります。その中で実行中のプログラムには影響しません。
  ko: 현재 세션이 끊기고 새 연결로 다시 연결된 후 기존 tmux 세션으로 돌아갑니다. 세션에서 실행 중인 프로그램은 영향을 받지 않습니다.
terminal.confirm_restart.title:
  zh-CN: 重新打开“%{name}”？
  en: Reopen "%{name}"?
  zh-TW: 重新開啟「%{name}」？
  ja: 「%{name}」を開き直しますか？
  ko: "'%{name}'을(를) 다시 여시겠습니까?"
terminal.confirm_restart.description:
  zh-CN: 当前的程序会结束，在这个 Tab 中重新打开。
  en: The current program will end and reopen in this tab.
  zh-TW: 目前的程式會結束，並在這個分頁中重新開啟。
  ja: 現在のプログラムは終了し、このタブで開き直されます。
  ko: 현재 프로그램이 종료되고 이 탭에서 다시 열립니다.
terminal.connecting:
  zh-CN: 正在连接 %{name}…
  en: Connecting to %{name}…
  zh-TW: 正在連線到 %{name}…
  ja: "%{name} に接続しています…"
  ko: "%{name}에 연결하는 중…"
terminal.reconnecting:
  zh-CN: 正在重新连接…
  en: Reconnecting…
  zh-TW: 正在重新連線…
  ja: 再接続しています…
  ko: 다시 연결하는 중…
terminal.connect_failed:
  zh-CN: 无法连接 %{name}
  en: Couldn't connect to %{name}
  zh-TW: 無法連線到 %{name}
  ja: "%{name} に接続できません"
  ko: "%{name}에 연결할 수 없습니다"
terminal.reconnect:
  zh-CN: 重新连接
  en: Reconnect
  zh-TW: 重新連線
  ja: 再接続
  ko: 다시 연결
terminal.forget_host_key:
  zh-CN: 删除旧记录并重新连接
  en: Remove old record and reconnect
  zh-TW: 刪除舊記錄並重新連線
  ja: 古い記録を削除して再接続
  ko: 이전 기록 삭제 후 다시 연결
terminal.open_failed:
  zh-CN: 无法打开终端：%{error}
  en: "Couldn't open the terminal: %{error}"
  zh-TW: 無法開啟終端機：%{error}
  ja: ターミナルを開けません：%{error}
  ko: "터미널을 열 수 없습니다: %{error}"
terminal.search.placeholder:
  zh-CN: 查找
  en: Find
  zh-TW: 尋找
  ja: 検索
  ko: 찾기
terminal.search.case_sensitive:
  zh-CN: 区分大小写
  en: Match case
  zh-TW: 區分大小寫
  ja: 大文字と小文字を区別
  ko: 대/소문자 구분
terminal.search.whole_word:
  zh-CN: 全词匹配
  en: Match whole word
  zh-TW: 全字比對
  ja: 単語単位
  ko: 단어 단위로
terminal.search.regex:
  zh-CN: 正则表达式
  en: Use regular expression
  zh-TW: 正規表示式
  ja: 正規表現
  ko: 정규식
terminal.search.previous:
  zh-CN: 上一处（Shift+Enter）
  en: Previous match (Shift+Enter)
  zh-TW: 上一個（Shift+Enter）
  ja: 前を検索（Shift+Enter）
  ko: 이전 항목(Shift+Enter)
terminal.search.next:
  zh-CN: 下一处（Enter）
  en: Next match (Enter)
