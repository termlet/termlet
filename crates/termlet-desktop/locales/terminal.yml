panel.menu.stop_record:
  zh-CN: "停止录制"
  en: "Stop Recording"
  zh-TW: "停止錄製"
  ja: "録画を停止"
  ko: "녹화 중지"
terminal.record.badge:
  zh-CN: "正在录制"
  en: "Recording"
  zh-TW: "正在錄製"
  ja: "録画中"
  ko: "녹화 중"
terminal.record.started:
  zh-CN: "开始录制。录制文件里有终端中显示的全部内容，可能包括密码、密钥等敏感信息，分享前请检查。"
  en: "Recording started. The recording contains everything shown in the terminal, which may include sensitive information such as passwords or keys. Check it before sharing."
  zh-TW: "開始錄製。錄製檔裡有終端機中顯示的全部內容，可能包含密碼、金鑰等敏感資訊，分享前請檢查。"
  ja: "録画を開始しました。録画ファイルにはターミナルに表示されたすべての内容が含まれ、パスワードや鍵などの機密情報が含まれている場合があります。共有する前に確認してください。"
  ko: "녹화를 시작했습니다. 녹화 파일에는 터미널에 표시된 모든 내용이 들어 있으며 비밀번호나 키 같은 민감한 정보가 포함될 수 있습니다. 공유하기 전에 확인하세요."
terminal.record.started_with_input:
  zh-CN: "开始录制，同时录制输入。录制文件里有你输入的全部内容（包括不显示在屏幕上的密码）与终端中显示的内容，请妥善保管。"
  en: "Recording started, including your input. The recording contains everything you type, including passwords that are not shown on screen, as well as everything shown in the terminal. Keep it safe."
  zh-TW: "開始錄製，同時錄製輸入。錄製檔裡有你輸入的全部內容（包括不顯示在畫面上的密碼）與終端機中顯示的內容，請妥善保管。"
  ja: "入力も含めて録画を開始しました。録画ファイルには入力したすべての内容（画面に表示されないパスワードを含む）とターミナルに表示された内容が含まれます。大切に保管してください。"
  ko: "입력을 포함해 녹화를 시작했습니다. 녹화 파일에는 입력한 모든 내용(화면에 표시되지 않는 비밀번호 포함)과 터미널에 표시된 내용이 들어 있습니다. 안전하게 보관하세요."
