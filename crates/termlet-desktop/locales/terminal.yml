terminal.proxy.title:
  zh-CN: 把本机代理借给服务器
  en: Lend Local Proxy to the Server
  zh-TW: 把本機代理借給伺服器
  ja: ローカルプロキシをサーバーと共有
  ko: 서버와 로컬 프록시 공유
terminal.proxy.intro:
  zh-CN: 把本机的 HTTP 代理借给服务器：服务器上只监听 127.0.0.1，那里的连接经 SSH 转回本机的代理。服务器连不上外网时可以用来装软件包、拉镜像。随这个终端的会话结束而停止。
  en: Lends this computer's HTTP proxy to the server. The server listens only on 127.0.0.1, and connections there come back over SSH to your local proxy. Useful for installing packages or pulling images when the server can't reach the internet. It stops when this terminal's session ends.
  zh-TW: 把本機的 HTTP 代理借給伺服器：伺服器上只監聽 127.0.0.1，那裡的連線經 SSH 轉回本機的代理。伺服器連不上外網時，可以用來安裝套件、拉取映像檔。隨這個終端機的工作階段結束而停止。
  ja: このコンピューターの HTTP プロキシをサーバーに貸し出します。サーバーでは 127.0.0.1 だけで待ち受け、そこへの接続は SSH を通じてローカルのプロキシに戻されます。サーバーがインターネットに接続できないときに、パッケージのインストールやイメージの取得に使えます。このターミナルのセッションが終了すると停止します。
  ko: 이 컴퓨터의 HTTP 프록시를 서버에 빌려줍니다. 서버에서는 127.0.0.1에서만 수신 대기하고, 그곳으로 들어온 연결은 SSH를 거쳐 로컬 프록시로 돌아옵니다. 서버가 외부 인터넷에 연결할 수 없을 때 패키지 설치나 이미지 받기에 쓸 수 있습니다. 이 터미널의 세션이 끝나면 함께 중지됩니다.
terminal.proxy.local:
  zh-CN: 本机代理
  en: Local proxy
  zh-TW: 本機代理
  ja: ローカルプロキシ
  ko: 로컬 프록시
terminal.proxy.local_placeholder:
  zh-CN: 例如 127.0.0.1:7890
  en: e.g. 127.0.0.1:7890
  zh-TW: 例如 127.0.0.1:7890
  ja: 例：127.0.0.1:7890
  ko: "예: 127.0.0.1:7890"
terminal.proxy.local_from_system:
  zh-CN: 已填入系统的代理设置。只支持 HTTP 代理。
  en: Filled in from the system proxy settings. Only HTTP proxies work.
  zh-TW: 已填入系統的 Proxy 設定。只支援 HTTP 代理。
  ja: システムのプロキシ設定を入力しました。HTTP プロキシのみ対応しています。
  ko: 시스템 프록시 설정을 입력했습니다. HTTP 프록시만 지원합니다.
terminal.proxy.local_from_env:
  zh-CN: 已填入环境变量中的代理。只支持 HTTP 代理。
  en: Filled in from the proxy environment variables. Only HTTP proxies work.
  zh-TW: 已填入環境變數中的代理。只支援 HTTP 代理。
  ja: 環境変数のプロキシを入力しました。HTTP プロキシのみ対応しています。
  ko: 환경 변수의 프록시를 입력했습니다. HTTP 프록시만 지원합니다.
terminal.proxy.local_from_settings:
  zh-CN: 上次用的本机代理，也可以在设置的“连接”中修改。只支持 HTTP 代理。
  en: The local proxy you used last time. You can also change it under Settings > Connection. Only HTTP proxies work.
  zh-TW: 上次使用的本機代理，也可以在設定的「連線」中修改。只支援 HTTP 代理。
  ja: 前回使用したローカルプロキシです。設定の「接続」でも変更できます。HTTP プロキシのみ対応しています。
  ko: 지난번에 사용한 로컬 프록시입니다. 설정의 '연결'에서도 변경할 수 있습니다. HTTP 프록시만 지원합니다.
terminal.proxy.local_not_found:
  zh-CN: 没有找到系统代理，请填写本机代理软件的 HTTP 端口，例如 127.0.0.1:7890。
  en: No system proxy was found. Enter the HTTP port of your local proxy app, e.g. 127.0.0.1:7890.
  zh-TW: 沒有找到系統代理，請填寫本機代理軟體的 HTTP 連接埠，例如 127.0.0.1:7890。
  ja: システムのプロキシが見つかりませんでした。ローカルのプロキシソフトウェアの HTTP ポートを入力してください（例：127.0.0.1:7890）。
  ko: "시스템 프록시를 찾지 못했습니다. 로컬 프록시 프로그램의 HTTP 포트를 입력하세요(예: 127.0.0.1:7890)."
terminal.proxy.port:
  zh-CN: 服务器上的端口
  en: Port on the server
  zh-TW: 伺服器上的連接埠
  ja: サーバー側のポート
  ko: 서버의 포트
terminal.proxy.port_placeholder:
  zh-CN: 留空时由服务器选
  en: Leave empty to let the server pick
  zh-TW: 留空時由伺服器選擇
  ja: 空欄の場合はサーバーが選択します
  ko: 비워 두면 서버가 선택합니다
terminal.proxy.port_hint:
  zh-CN: 端口每次开启可能不同；要把代理写进 apt、Docker 等的配置时，填一个固定的端口更方便。
  en: The port may differ each time. Use a fixed port if you write the proxy into apt, Docker or other settings.
  zh-TW: 連接埠每次開啟可能不同；要把代理寫進 apt、Docker 等的設定時，填一個固定的連接埠比較方便。
  ja: ポートはオンにするたびに変わる場合があります。apt や Docker などの設定にプロキシを書き込むときは、固定のポートを指定すると便利です。
  ko: 포트는 켤 때마다 달라질 수 있습니다. apt, Docker 등의 설정에 프록시를 적어 두려면 고정 포트를 지정하는 것이 편리합니다.
terminal.proxy.start:
  zh-CN: 开启
  en: Turn On
  zh-TW: 開啟
  ja: オンにする
  ko: 켜기
terminal.proxy.stop:
  zh-CN: 停止
  en: Stop
  zh-TW: 停止
  ja: 停止
  ko: 중지
terminal.proxy.running:
  zh-CN: 服务器上的 127.0.0.1:%{port} 已转到本机代理 %{local}。
  en: 127.0.0.1:%{port} on the server now goes to your local proxy %{local}.
  zh-TW: 伺服器上的 127.0.0.1:%{port} 已轉到本機代理 %{local}。
  ja: サーバーの 127.0.0.1:%{port} をローカルプロキシ %{local} に転送しています。
  ko: 서버의 127.0.0.1:%{port}이(가) 로컬 프록시 %{local}(으)로 연결되었습니다.
terminal.proxy.port_busy:
  zh-CN: 服务器上不能监听端口 %{wanted}（已被占用，或者低于 1024、要 root 才行），改用了 %{port}。
  en: The server can't listen on port %{wanted} (it's in use, or below 1024 and needs root), so %{port} is used instead.
  zh-TW: 伺服器上無法監聽連接埠 %{wanted}（已被佔用，或者低於 1024、要 root 才行），改用 %{port}。
  ja: サーバーでポート %{wanted} を待ち受けできないため（使用中か、1024 未満で root が必要）、代わりに %{port} を使用しています。
  ko: 서버에서 포트 %{wanted}에서 수신 대기할 수 없어(이미 사용 중이거나 1024 미만이라 root 권한 필요) 대신 %{port}을(를) 사용합니다.
terminal.proxy.connections:
  zh-CN: 当前 %{count} 个连接
  en: "%{count} connections now"
  zh-TW: 目前 %{count} 個連線
  ja: 現在 %{count} 個の接続
  ko: 현재 연결 %{count}개
terminal.proxy.local_failed:
  zh-CN: 连不上本机代理：%{error}
  en: "Can't reach the local proxy: %{error}"
  zh-TW: 連不上本機代理：%{error}
  ja: ローカルプロキシに接続できません：%{error}
  ko: "로컬 프록시에 연결할 수 없습니다: %{error}"
terminal.proxy.kind.shell:
  zh-CN: 环境变量
  en: Environment
  zh-TW: 環境變數
  ja: 環境変数
  ko: 환경 변수
terminal.proxy.hint.shell:
  zh-CN: 在当前 shell 中设置代理的环境变量，curl、wget、git、pip、npm 等都会用它；只对这个 shell 与其中启动的程序有效（sudo 默认不带这些变量）。
  en: Sets the proxy environment variables in the current shell. curl, wget, git, pip, npm and others use them. They only affect this shell and programs started from it (sudo drops them by default).
  zh-TW: 在目前的 shell 中設定代理的環境變數，curl、wget、git、pip、npm 等都會使用；只對這個 shell 與其中啟動的程式有效（sudo 預設不帶這些變數）。
  ja: 現在のシェルにプロキシの環境変数を設定します。curl、wget、git、pip、npm などがこれを使用します。このシェルと、そこから起動したプログラムにのみ有効です（sudo はデフォルトではこれらの変数を引き継ぎません）。
  ko: 현재 셸에 프록시 환경 변수를 설정합니다. curl, wget, git, pip, npm 등이 이를 사용하며, 이 셸과 여기서 시작한 프로그램에만 적용됩니다(sudo는 기본적으로 이 변수를 넘기지 않음).
terminal.proxy.hint.apt:
  zh-CN: 写入 apt 的配置文件，之后 apt update、apt install 经这个代理。用完请撤销，否则停止后 apt 连不上。
  en: Writes an apt configuration file so that apt update and apt install go through the proxy. Undo it when you're done, or apt can't connect after the proxy stops.
  zh-TW: 寫入 apt 的設定檔，之後 apt update、apt install 經過這個代理。用完請復原，否則停止後 apt 連不上。
  ja: apt の設定ファイルに書き込み、以降の apt update や apt install がこのプロキシを経由するようにします。使い終わったら元に戻してください。戻さないと、停止後に apt が接続できなくなります。
  ko: apt 구성 파일에 기록해 이후 apt update와 apt install이 이 프록시를 거치게 합니다. 다 쓰면 되돌리세요. 되돌리지 않으면 중지 후 apt가 연결하지 못합니다.
terminal.proxy.hint.dnf:
  zh-CN: 在 /etc/dnf/dnf.conf 中加一行代理设置（Fedora、RHEL 8 及以后）。用完请撤销。
  en: Adds a proxy line to /etc/dnf/dnf.conf (Fedora, RHEL 8 and later). Undo it when you're done.
  zh-TW: 在 /etc/dnf/dnf.conf 中加一行代理設定（Fedora、RHEL 8 及以後）。用完請復原。
  ja: /etc/dnf/dnf.conf にプロキシ設定を 1 行追加します（Fedora、RHEL 8 以降）。使い終わったら元に戻してください。
  ko: /etc/dnf/dnf.conf에 프록시 설정 한 줄을 추가합니다(Fedora, RHEL 8 이상). 다 쓰면 되돌리세요.
terminal.proxy.hint.yum:
  zh-CN: 在 /etc/yum.conf 中加一行代理设置（CentOS 7 等）。用完请撤销。
  en: Adds a proxy line to /etc/yum.conf (CentOS 7 and similar). Undo it when you're done.
  zh-TW: 在 /etc/yum.conf 中加一行代理設定（CentOS 7 等）。用完請復原。
  ja: /etc/yum.conf にプロキシ設定を 1 行追加します（CentOS 7 など）。使い終わったら元に戻してください。
  ko: /etc/yum.conf에 프록시 설정 한 줄을 추가합니다(CentOS 7 등). 다 쓰면 되돌리세요.
terminal.proxy.hint.docker_daemon:
  zh-CN: 让 Docker 拉取镜像时经这个代理（systemd 的 drop-in 配置）。会重启 Docker，运行中的容器随之重启（开启了 live-restore 的除外）。用完请撤销。
  en: Makes Docker pull images through the proxy (a systemd drop-in). This restarts Docker, and running containers restart with it unless live-restore is on. Undo it when you're done.
  zh-TW: 讓 Docker 拉取映像檔時經過這個代理（systemd 的 drop-in 設定）。會重新啟動 Docker，執行中的容器隨之重新啟動（開啟了 live-restore 的除外）。用完請復原。
  ja: Docker がイメージを取得するときにこのプロキシを経由するようにします（systemd の drop-in 設定）。Docker が再起動し、実行中のコンテナーも再起動します（live-restore を有効にしている場合を除く）。使い終わったら元に戻してください。
  ko: Docker가 이미지를 받을 때 이 프록시를 거치게 합니다(systemd drop-in 구성). Docker가 다시 시작되며 실행 중인 컨테이너도 함께 다시 시작됩니다(live-restore를 켠 경우 제외). 다 쓰면 되돌리세요.
terminal.proxy.hint.docker_build:
  zh-CN: 构建镜像时经这个代理：用主机网络，构建过程中才连得到服务器的 127.0.0.1。只对这一次构建有效，不用撤销。
  en: Builds an image through the proxy. Host networking lets the build reach 127.0.0.1 on the server. It only applies to this build, so there's nothing to undo.
  zh-TW: 建置映像檔時經過這個代理：使用主機網路，建置過程中才連得到伺服器的 127.0.0.1。只對這一次建置有效，不用復原。
  ja: このプロキシを経由してイメージをビルドします。ホストネットワークを使うことで、ビルド中にサーバーの 127.0.0.1 に接続できます。このビルドにのみ有効なので、元に戻す必要はありません。
  ko: 이 프록시를 거쳐 이미지를 빌드합니다. 호스트 네트워크를 사용해야 빌드 중에 서버의 127.0.0.1에 연결할 수 있습니다. 이번 빌드에만 적용되므로 되돌릴 필요가 없습니다.
