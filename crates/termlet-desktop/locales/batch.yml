  zh-TW: 已開啟的終端機
  ja: 開いているターミナル
  ko: 열려 있는 터미널
batch.hosts_hint:
  zh-CN: 不打开终端，新建连接执行
  en: Runs over new connections, without opening terminals
  zh-TW: 不開啟終端機，建立新連線執行
  ja: ターミナルを開かず、新しい接続で実行します
  ko: 터미널을 열지 않고 새 연결로 실행합니다
batch.terminals_hint:
  zh-CN: 在终端里执行（要 bash / sh），沿用当前目录与环境
  en: Runs in the terminals (needs bash / sh), with their current directory and environment
  zh-TW: 在終端機裡執行（需要 bash / sh），沿用目前的目錄與環境
  ja: ターミナル内で実行します（bash / sh が必要）。現在のディレクトリと環境がそのまま使われます
  ko: 터미널 안에서 실행합니다(bash / sh 필요). 현재 디렉터리와 환경을 그대로 사용합니다
batch.pick_hosts:
  zh-CN: 选择主机…
  en: Choose Hosts…
  zh-TW: 選擇主機…
  ja: ホストを選択…
  ko: 호스트 선택…
