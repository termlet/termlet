  zh-TW: 輸出過長，不顯示逐行差異
  ja: 出力が長すぎるため、行ごとの差分は表示しません
  ko: 출력이 너무 길어 줄 단위 차이를 표시하지 않습니다
batch.truncated:
  zh-CN: 输出超过 256 KB，只取回了开头
  en: The output is over 256 KB; only the beginning was kept
  zh-TW: 輸出超過 256 KB，只取回了開頭
  ja: 出力が 256 KB を超えたため、先頭部分だけを取得しました
  ko: 출력이 256KB를 넘어 앞부분만 가져왔습니다
