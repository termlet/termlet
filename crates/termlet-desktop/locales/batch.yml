  ko: "%{name} · 호스트 %{count}대"
batch.pick_terminals:
  zh-CN: 选择终端
  en: Choose Terminals
  zh-TW: 選擇終端機
  ja: ターミナルを選択
  ko: 터미널 선택
batch.no_terminals:
  zh-CN: 这个窗口里没有连接着的终端
  en: No connected terminals in this window
  zh-TW: 這個視窗裡沒有連線中的終端機
  ja: このウィンドウには接続中のターミナルがありません
  ko: 이 창에 연결된 터미널이 없습니다
batch.name_separator:
  zh-CN: 、
  en: ", "
  zh-TW: 、
  ja: 、
  ko: ", "
batch.placeholder:
  zh-CN: 输入要执行的命令，可以多行
  en: Type the command to run; it can span several lines
  zh-TW: 輸入要執行的指令，可以多行
  ja: 実行するコマンドを入力（複数行も可）
  ko: 실행할 명령을 입력하세요. 여러 줄도 됩니다
batch.insert_snippet:
  zh-CN: 插入快捷命令
  en: Insert Snippet
  zh-TW: 插入快速指令
  ja: スニペットを挿入
  ko: 스니펫 삽입
batch.command_hint:
  zh-CN: "%{key} 执行，在首行按 ↑、末行按 ↓ 翻看执行过的命令"
  en: "%{key} runs it; ↑ on the first line or ↓ on the last recalls earlier commands"
  zh-TW: "%{key} 執行，在第一行按 ↑、最後一行按 ↓ 瀏覽執行過的指令"
  ja: "%{key} で実行。先頭行で ↑、最終行で ↓ を押すと実行済みのコマンドを表示します"
  ko: "%{key}로 실행합니다. 첫 줄에서 ↑, 마지막 줄에서 ↓를 누르면 실행한 명령을 다시 불러옵니다"
batch.stop:
  zh-CN: 停止
  en: Stop
  zh-TW: 停止
  ja: 停止
  ko: 중지
batch.retry:
  zh-CN: 重试未成功的
  en: Retry Unsuccessful
  zh-TW: 重試未成功的
  ja: 成功しなかったものを再試行
  ko: 실패한 대상 다시 시도
batch.copy:
  zh-CN: 复制结果
  en: Copy Results
  zh-TW: 複製結果
  ja: 結果をコピー
  ko: 결과 복사
batch.copied:
  zh-CN: 已复制结果
  en: Results copied
  zh-TW: 已複製結果
  ja: 結果をコピーしました
  ko: 결과를 복사했습니다
batch.empty:
  zh-CN: 选好目标、写好命令后执行，结果按输出分组显示在这里。
  en: Choose the targets, type a command and run it. The results show up here, grouped by output.
  zh-TW: 選好目標、寫好指令後執行，結果會依輸出分組顯示在這裡。
  ja: 対象を選んでコマンドを入力し、実行してください。結果は出力ごとにまとめてここに表示されます。
  ko: 대상을 고르고 명령을 입력한 후 실행하세요. 결과는 출력별로 묶여 여기에 표시됩니다.
batch.danger_hosts:
  zh-CN: 确定在 %{count} 台主机上执行这条命令吗？
  en: Run this command on %{count} hosts?
  zh-TW: 確定要在 %{count} 台主機上執行這條指令嗎？
  ja: このコマンドをホスト %{count} 台で実行しますか？
  ko: 이 명령을 호스트 %{count}대에서 실행하시겠습니까?
batch.danger_terminals:
  zh-CN: 确定在 %{count} 个终端中执行这条命令吗？
  en: Run this command in %{count} terminals?
  zh-TW: 確定要在 %{count} 個終端機中執行這條指令嗎？
  ja: このコマンドをターミナル %{count} 個で実行しますか？
  ko: 이 명령을 터미널 %{count}개에서 실행하시겠습니까?
batch.close_running:
  zh-CN: 批量执行还没有结束，关闭这个 Tab 会停止它。
  en: The batch run hasn't finished. Closing this tab stops it.
  zh-TW: 批次執行還沒有結束，關閉這個分頁會停止它。
  ja: 一括実行はまだ終わっていません。このタブを閉じると停止します。
  ko: 일괄 실행이 아직 끝나지 않았습니다. 이 탭을 닫으면 중지됩니다.
batch.stop_and_close:
  zh-CN: 停止并关闭
  en: Stop and Close
  zh-TW: 停止並關閉
  ja: 停止して閉じる
  ko: 중지하고 닫기
