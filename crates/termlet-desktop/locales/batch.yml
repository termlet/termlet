  zh-CN: "%{reason}（%{detail}）"
  en: "%{reason} (%{detail})"
  zh-TW: "%{reason}（%{detail}）"
  ja: "%{reason}（%{detail}）"
  ko: "%{reason}(%{detail})"
batch.reason.not_ssh:
  zh-CN: 不是 SSH 主机（Telnet、串口不能批量执行）
  en: Not an SSH host (Telnet and serial hosts can't run batches)
  zh-TW: 不是 SSH 主機（Telnet、序列埠不能批次執行）
  ja: SSH ホストではありません（Telnet、シリアルポートは一括実行できません）
  ko: SSH 호스트가 아닙니다(Telnet, 직렬 포트는 일괄 실행할 수 없습니다)
batch.reason.connect_failed:
  zh-CN: 连接失败
  en: Couldn't connect
  zh-TW: 連線失敗
  ja: 接続できませんでした
  ko: 연결하지 못했습니다
batch.reason.algorithm:
  zh-CN: 与服务器没有共同的加密算法
  en: No encryption algorithm in common with the server
  zh-TW: 與伺服器沒有共同的加密演算法
  ja: サーバーと共通の暗号アルゴリズムがありません
  ko: 서버와 공통된 암호화 알고리즘이 없습니다
batch.reason.credential_missing:
  zh-CN: 没有保存密码或私钥，请在终端中连接
  en: No saved password or key; connect in a terminal
  zh-TW: 沒有儲存密碼或私鑰，請在終端機中連線
  ja: パスワードも秘密鍵も保存されていません。ターミナルで接続してください
  ko: 저장된 비밀번호나 개인 키가 없습니다. 터미널에서 연결하세요
batch.reason.hostkey_unknown:
  zh-CN: 第一次连接，要先在终端中确认指纹
  en: First connection; confirm the fingerprint in a terminal first
  zh-TW: 第一次連線，要先在終端機中確認指紋
  ja: 初めての接続です。先にターミナルでフィンガープリントを確認してください
  ko: 처음 연결하는 호스트입니다. 먼저 터미널에서 지문을 확인하세요
batch.reason.hostkey_mismatch:
  zh-CN: 主机指纹与记录的不一致
  en: The host fingerprint doesn't match the saved one
  zh-TW: 主機指紋與記錄的不一致
  ja: ホストのフィンガープリントが記録と一致しません
  ko: 호스트 지문이 기록과 일치하지 않습니다
batch.reason.hostkey_rejected:
  zh-CN: 主机指纹没有被接受
  en: The host fingerprint wasn't accepted
  zh-TW: 主機指紋沒有被接受
  ja: ホストのフィンガープリントが承認されていません
  ko: 호스트 지문이 승인되지 않았습니다
batch.reason.auth_failed:
  zh-CN: 认证失败
  en: Authentication failed
  zh-TW: 驗證失敗
  ja: 認証に失敗しました
  ko: 인증에 실패했습니다
batch.reason.interaction:
  zh-CN: 要输入验证码等，请在终端中连接
  en: Needs a verification code or similar; connect in a terminal
  zh-TW: 需要輸入驗證碼等，請在終端機中連線
  ja: 認証コードなどの入力が必要です。ターミナルで接続してください
  ko: 인증 코드 등을 입력해야 합니다. 터미널에서 연결하세요
batch.reason.proxy_command:
  zh-CN: 代理命令还没有确认，请先在终端中连接一次
  en: The proxy command hasn't been confirmed; connect in a terminal once first
  zh-TW: 代理指令還沒有確認，請先在終端機中連線一次
  ja: プロキシコマンドがまだ確認されていません。先にターミナルで一度接続してください
  ko: 프록시 명령이 아직 확인되지 않았습니다. 먼저 터미널에서 한 번 연결하세요
batch.reason.key_passphrase:
  zh-CN: 私钥有密码但没有保存，请在终端中连接
  en: The key has a passphrase that isn't saved; connect in a terminal
  zh-TW: 私鑰有密碼但沒有儲存，請在終端機中連線
  ja: 秘密鍵のパスフレーズが保存されていません。ターミナルで接続してください
  ko: 개인 키의 암호가 저장되어 있지 않습니다. 터미널에서 연결하세요
batch.reason.key_invalid:
  zh-CN: 私钥不能用
  en: The private key can't be used
  zh-TW: 私鑰無法使用
  ja: 秘密鍵を使用できません
  ko: 개인 키를 사용할 수 없습니다
batch.reason.vault:
  zh-CN: 保存的凭据已锁定
  en: Saved credentials are locked
  zh-TW: 儲存的憑證已鎖定
  ja: 保存された資格情報がロックされています
  ko: 저장된 자격 증명이 잠겨 있습니다
batch.reason.host_gone:
  zh-CN: 主机已删除
  en: The host was deleted
  zh-TW: 主機已刪除
  ja: ホストは削除されました
  ko: 호스트가 삭제되었습니다
batch.unsupported:
  zh-CN: 本地的 Windows 终端、Telnet、串口不支持（需要 bash / sh）
  en: Not supported in local Windows terminals, Telnet or serial connections (needs bash / sh)
  zh-TW: 本機的 Windows 終端機、Telnet、序列埠不支援（需要 bash / sh）
  ja: ローカルの Windows ターミナル、Telnet、シリアルポートには対応していません（bash / sh が必要）
  ko: 로컬 Windows 터미널, Telnet, 직렬 포트에서는 지원하지 않습니다(bash / sh 필요)
batch.not_connected:
  zh-CN: 终端没有连接
  en: The terminal isn't connected
  zh-TW: 終端機沒有連線
  ja: ターミナルが接続されていません
  ko: 터미널이 연결되어 있지 않습니다
batch.busy:
  zh-CN: 终端正忙（正在运行程序、全屏程序或传输文件），请回到 shell 提示符后重试
