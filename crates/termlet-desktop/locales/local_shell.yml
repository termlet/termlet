  ja: コマンドライン
  ko: 명령줄
local_shell.command_hint:
  zh-CN: 第一项是程序（完整路径，或在 PATH 中查找），其余是参数。
  en: The first item is the program (a full path, or a name looked up in PATH); the rest are arguments.
  zh-TW: 第一項是程式（完整路徑，或在 PATH 中尋找），其餘是參數。
  ja: 最初の項目はプログラム（フルパス、または PATH から検索する名前）、残りは引数です。
  ko: 첫 번째 항목은 프로그램(전체 경로 또는 PATH에서 찾을 이름)이고, 나머지는 인수입니다.
