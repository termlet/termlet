local_shell.delete:
  zh-CN: 删除
  en: Delete
  zh-TW: 刪除
  ja: 削除
  ko: 삭제
local_shell.settings_hint:
  zh-CN: 每次打开都读取系统最新的环境变量，修改 PATH 后不用重启 Termlet。关闭终端时，其中运行的命令行程序一并结束；从终端启动的窗口程序（例如 VS Code）不受影响。
  en: The latest system environment variables are read every time a terminal opens, so you don't need to restart Termlet after changing PATH. Closing a terminal ends the command-line programs running in it; windowed programs started from it, such as VS Code, keep running.
  zh-TW: 每次開啟都會讀取系統最新的環境變數，修改 PATH 後不用重新啟動 Termlet。關閉終端機時，其中執行的命令列程式會一併結束；從終端機啟動的視窗程式（例如 VS Code）不受影響。
  ja: ターミナルを開くたびにシステムの最新の環境変数を読み込むため、PATH を変更しても Termlet を再起動する必要はありません。ターミナルを閉じると、その中で実行中のコマンドラインプログラムも終了します。ターミナルから起動したウィンドウプログラム（VS Code など）は影響を受けません。
  ko: "터미널을 열 때마다 시스템의 최신 환경 변수를 읽으므로 PATH를 바꾼 후 Termlet을 다시 시작할 필요가 없습니다. 터미널을 닫으면 그 안에서 실행 중인 명령줄 프로그램도 함께 종료됩니다. 터미널에서 시작한 창 프로그램(예: VS Code)은 영향을 받지 않습니다."
