local_shell.dir_placeholder:
  zh-CN: 默认为用户主目录；可以写 ~ 或环境变量
  en: Your home folder by default; ~ and environment variables are allowed
  zh-TW: 預設為使用者主目錄；可以寫 ~ 或環境變數
  ja: デフォルトはユーザーのホームディレクトリ。~ や環境変数も使用できます
  ko: 기본값은 사용자 홈 디렉터리입니다. ~ 또는 환경 변수를 쓸 수 있습니다
local_shell.env:
  zh-CN: 环境变量（每行一个 名称=值）
  en: Environment variables (one NAME=value per line)
  zh-TW: 環境變數（每行一個 名稱=值）
  ja: 環境変数（1 行に 1 つ、名前=値）
  ko: 환경 변수(한 줄에 하나씩 이름=값)
local_shell.env_bad_line:
  zh-CN: 环境变量第 %{line} 行格式不对，应为 名称=值。
  en: Line %{line} of the environment variables should be NAME=value.
  zh-TW: 環境變數第 %{line} 行格式不正確，應為 名稱=值。
  ja: 環境変数の %{line} 行目の形式が正しくありません。名前=値 の形式で入力してください。
  ko: 환경 변수 %{line}번째 줄의 형식이 올바르지 않습니다. 이름=값 형식이어야 합니다.
