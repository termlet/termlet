cli.approval.title:
  zh-CN: 命令行工具要在“%{host}”上执行危险命令
  en: The command-line tool wants to run a dangerous command on “%{host}”
  zh-TW: 命令列工具要在「%{host}」上執行危險指令
  ja: コマンドラインツールが「%{host}」で危険なコマンドを実行しようとしています
  ko: 명령줄 도구가 '%{host}'에서 위험한 명령을 실행하려고 합니다
