cli.approval.hosts:
  zh-CN: "%{count} 台主机：%{names}"
  en: "%{count} hosts: %{names}"
  zh-TW: "%{count} 台主機：%{names}"
  ja: "%{count} 台のホスト：%{names}"
  ko: "호스트 %{count}대: %{names}"
cli.approval.hosts_separator:
  zh-CN: 、
  en: ", "
  zh-TW: 、
  ja: 、
  ko: ", "
cli.approval.description:
  zh-CN: 调用方：%{caller}。命令“%{command}”命中了危险命令规则：%{rule}。
  en: "Caller: %{caller}. The command “%{command}” matches a dangerous-command rule: %{rule}."
  zh-TW: 呼叫端：%{caller}。指令「%{command}」符合危險指令規則：%{rule}。
  ja: 呼び出し元：%{caller}。コマンド「%{command}」が危険なコマンドのルールに一致しました：%{rule}。
  ko: "호출자: %{caller}. 명령 \"%{command}\"이(가) 위험한 명령 규칙에 해당합니다: %{rule}."
cli.approval.countdown:
  zh-CN: "%{seconds} 秒后仍没有回应时拦截。"
  en: It's blocked if there's still no answer in %{seconds}s.
  zh-TW: "%{seconds} 秒後仍沒有回應時阻擋。"
  ja: "%{seconds} 秒後までに応答がない場合はブロックされます。"
  ko: "%{seconds}초 후에도 응답이 없으면 차단됩니다."
cli.approval.unknown_caller:
  zh-CN: 未知程序
  en: Unknown program
  zh-TW: 未知程式
  ja: 不明なプログラム
  ko: 알 수 없는 프로그램
cli.approval.allow:
  zh-CN: 允许执行
  en: Allow
  zh-TW: 允許執行
  ja: 実行を許可
  ko: 실행 허용
cli.approval.deny:
  zh-CN: 拒绝
  en: Deny
  zh-TW: 拒絕
  ja: 拒否
  ko: 거부
cli.approval.expired:
  zh-CN: 这条命令已不再等待批准（超时没有回应、命令行工具已退出或 Termlet 已锁定），已经拦截。
  en: This command is no longer waiting for approval (there was no answer in time, the command-line tool exited, or Termlet was locked), so it was blocked.
  zh-TW: 這個指令已不再等待核准（逾時沒有回應、命令列工具已結束或 Termlet 已鎖定），已經阻擋。
  ja: このコマンドは承認待ちではなくなったため（時間内に応答がなかった、コマンドラインツールが終了した、または Termlet がロックされた）、ブロックされました。
  ko: 이 명령은 더 이상 승인을 기다리지 않으므로(시간 안에 응답이 없었거나, 명령줄 도구가 종료되었거나, Termlet이 잠겼음) 차단되었습니다.
cli.quit.title:
  zh-CN: 重启并安装更新？
  en: Restart and install the update?
  zh-TW: 重新啟動並安裝更新？
  ja: 再起動して更新をインストールしますか？
  ko: 다시 시작하고 업데이트를 설치하시겠습니까?
cli.quit.description:
  zh-CN: 还有 %{unsaved} 个文件没有保存、%{transfers} 个传输没有完成，重启后会丢失。
  en: "%{unsaved} files aren't saved and %{transfers} transfers aren't finished; they'll be lost when Termlet restarts."
  zh-TW: 還有 %{unsaved} 個檔案沒有儲存、%{transfers} 個傳輸沒有完成，重新啟動後會遺失。
  ja: 保存されていないファイルが %{unsaved} 個、完了していない転送が %{transfers} 件あります。再起動すると失われます。
  ko: 저장하지 않은 파일 %{unsaved}개와 완료되지 않은 전송 %{transfers}개가 있습니다. 다시 시작하면 사라집니다.
cli.quit.ok:
  zh-CN: 仍然重启
  en: Restart Anyway
  zh-TW: 仍要重新啟動
  ja: 再起動する
  ko: 그래도 다시 시작
