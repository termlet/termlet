keys.generate_hint:
  zh-CN: 新密钥直接保存在本机密钥库（私钥加密存储），可被多台主机共用。推荐 Ed25519；只有不支持 Ed25519 的老旧服务器才需要 RSA。
  en: The new key is stored in the key library on this computer (private key encrypted) and can be shared by several hosts. Ed25519 is recommended; use RSA only for old servers that don't support Ed25519.
  zh-TW: 新金鑰直接儲存在本機金鑰庫（私密金鑰加密儲存），可供多台主機共用。推薦 Ed25519；只有不支援 Ed25519 的老舊伺服器才需要 RSA。
  ja: 新しい鍵はこのコンピューターの鍵ライブラリに保存され（秘密鍵は暗号化して保存）、複数のホストで共有できます。Ed25519 をお勧めします。RSA が必要なのは Ed25519 に対応していない古いサーバーだけです。
  ko: 새 키는 이 컴퓨터의 키 라이브러리에 저장되며(개인 키는 암호화하여 저장) 여러 호스트에서 공유할 수 있습니다. Ed25519를 권장합니다. RSA는 Ed25519를 지원하지 않는 오래된 서버에만 필요합니다.
