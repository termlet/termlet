keys.export_title:
  zh-CN: 导出私钥：%{name}
  en: "Export Private Key: %{name}"
  zh-TW: 匯出私密金鑰：%{name}
  ja: 秘密鍵をエクスポート：%{name}
  ko: "개인 키 내보내기: %{name}"
keys.export_warning:
  zh-CN: 私钥将离开 Termlet 的加密密钥库，以文件形式保存在本机。任何拿到这个文件的人都能登录部署了对应公钥的服务器。建议设置私钥密码，并妥善保管文件。
  en: The private key will leave Termlet's encrypted key library and be saved as a file on this computer. Anyone who gets the file can log in to the servers that trust this key. Setting a passphrase and keeping the file safe is recommended.
  zh-TW: 私密金鑰將離開 Termlet 的加密金鑰庫，以檔案形式儲存在本機。任何拿到這個檔案的人都能登入部署了對應公開金鑰的伺服器。建議設定私密金鑰密碼，並妥善保管檔案。
  ja: 秘密鍵は Termlet の暗号化された鍵ライブラリから出て、ファイルとしてこのコンピューターに保存されます。このファイルを手に入れた人は誰でも、対応する公開鍵を配置したサーバーにログインできます。パスフレーズを設定し、ファイルを安全に保管することをお勧めします。
  ko: 개인 키가 Termlet의 암호화된 키 라이브러리를 벗어나 파일로 이 컴퓨터에 저장됩니다. 이 파일을 얻은 사람은 누구나 해당 공개 키가 배포된 서버에 로그인할 수 있습니다. 암호 문구를 설정하고 파일을 안전하게 보관하는 것이 좋습니다.
