keys.import_hint:
  zh-CN: 支持 OpenSSH、PEM 与 PuTTY（.ppk）格式。私钥解密后加密保存在本机，之后连接不再需要私钥密码。
  en: OpenSSH, PEM and PuTTY (.ppk) formats are supported. The key is decrypted and stored encrypted on this computer, so no passphrase is needed when connecting.
  zh-TW: 支援 OpenSSH、PEM 與 PuTTY（.ppk）格式。私密金鑰解密後加密儲存在本機，之後連線不再需要私密金鑰密碼。
  ja: OpenSSH、PEM、PuTTY（.ppk）形式に対応しています。秘密鍵は復号した後に暗号化してこのコンピューターに保存されるため、以後の接続ではパスフレーズは不要です。
  ko: OpenSSH, PEM 및 PuTTY(.ppk) 형식을 지원합니다. 개인 키는 복호화한 후 암호화하여 이 컴퓨터에 저장하므로 이후 연결할 때 암호 문구가 필요하지 않습니다.
