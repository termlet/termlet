keys.deploy_hint:
  zh-CN: 用各主机已保存的凭据登录，把公钥追加到 ~/.ssh/authorized_keys（已存在时不重复添加），再只用这把密钥单独验证一次登录。
  en: Logs in with each host's saved credentials, appends the public key to ~/.ssh/authorized_keys (skipped if it's already there), then verifies a login using only this key.
  zh-TW: 用各主機已儲存的認證資訊登入，把公開金鑰附加到 ~/.ssh/authorized_keys（已存在時不重複新增），再只用這把金鑰單獨驗證一次登入。
  ja: 各ホストに保存されている認証情報でログインして公開鍵を ~/.ssh/authorized_keys に追加し（すでにある場合は追加しません）、続けてこの鍵だけでログインできるかを確認します。
  ko: 각 호스트에 저장된 자격 증명으로 로그인하여 공개 키를 ~/.ssh/authorized_keys에 추가한 후(이미 있으면 추가하지 않음), 이 키만으로 로그인되는지 한 번 확인합니다.
