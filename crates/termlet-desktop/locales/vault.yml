vault.reset_confirm.description:
  zh-CN: 保存的密码、私钥与验证码密钥将全部清空，主机、分组等数据保留。此操作无法撤销。
  en: All saved passwords, private keys and verification code secrets will be cleared. Hosts, groups and other data are kept. This can't be undone.
  zh-TW: 儲存的密碼、私密金鑰與驗證碼金鑰將全部清除，主機、群組等資料保留。此動作無法復原。
  ja: 保存したパスワード、秘密鍵、確認コードのシークレットはすべて消去され、ホストやグループなどのデータは残ります。この操作は元に戻せません。
  ko: 저장된 비밀번호, 개인 키, 인증 코드 비밀 키가 모두 지워지며 호스트, 그룹 등의 데이터는 유지됩니다. 이 작업은 되돌릴 수 없습니다.
