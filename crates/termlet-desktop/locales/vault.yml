vault.keyring_error.description:
  zh-CN: 读取主密钥时出错：%{reason}。可以稍后重试。
  en: "Reading the master key failed: %{reason}. You can try again."
  zh-TW: 讀取主金鑰時出錯：%{reason}。可以稍後重試。
  ja: マスターキーの読み取り中にエラーが発生しました：%{reason}。しばらくしてからやり直してください。
  ko: "마스터 키를 읽는 중 오류가 발생했습니다: %{reason}. 잠시 후 다시 시도할 수 있습니다."
