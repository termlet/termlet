  zh-TW: 自動快照保留的份數
  ja: 自動スナップショットの保持数
  ko: 보관할 자동 스냅샷 수
backup_ui.page.keep_hint:
  zh-CN: "%{min}–%{max} 份。手动保存的，以及导入、恢复、升级、云同步之前保存的快照另外各自保留最近的几份。"
  en: "%{min}–%{max}. Manual snapshots and those saved before importing, restoring, upgrading and cloud sync are kept separately."
  zh-TW: "%{min}–%{max} 份。手動儲存的，以及匯入、還原、升級、雲端同步之前儲存的快照另外各自保留最近的幾份。"
  ja: "%{min}～%{max} 個。手動で保存したスナップショットと、インポート、復元、アップグレード、クラウド同期の前に保存したスナップショットは、それぞれ別に最新のものをいくつか保持します。"
  ko: "%{min}~%{max}개. 수동으로 저장한 스냅샷과 가져오기, 복원, 업그레이드, 클라우드 동기화 전에 저장한 스냅샷은 각각 따로 최근 몇 개를 보관합니다."
backup_ui.page.keep_invalid:
  zh-CN: 自动快照保留的份数应为 %{min}–%{max}。
  en: Daily snapshots to keep must be %{min}–%{max}.
  zh-TW: 自動快照保留的份數應為 %{min}–%{max}。
  ja: 自動スナップショットの保持数は %{min}～%{max} にしてください。
  ko: 보관할 자동 스냅샷 수는 %{min}~%{max} 사이여야 합니다.
backup_ui.page.snapshot_hint:
  zh-CN: 快照保存在数据目录的 backups 文件夹中，内容没有变化时不重复保存；恢复、导入主机、升级到新版本之前也会自动保存一份。快照中的凭据仍由这台电脑的主密钥加密，只能在这台电脑上恢复，迁移到其他电脑请用上面的完整备份。
  en: Snapshots are stored in the backups folder of the data directory and aren’t saved again when nothing has changed. A snapshot is also saved before restoring, importing hosts and upgrading to a new version. Credentials in snapshots stay encrypted with this computer’s master key, so they can only be restored here. To move to another computer, use the full backup above.
  zh-TW: 快照儲存在資料目錄的 backups 資料夾中，內容沒有變化時不重複儲存；還原、匯入主機、升級到新版本之前也會自動儲存一份。快照中的認證資訊仍由這台電腦的主金鑰加密，只能在這台電腦上還原，移轉到其他電腦請用上面的完整備份。
  ja: スナップショットはデータフォルダーの backups フォルダーに保存され、内容が変わっていないときは重複して保存しません。復元、ホストのインポート、新しいバージョンへのアップグレードの前にも自動で保存されます。スナップショット内の認証情報は引き続きこのコンピューターのマスターキーで暗号化されているため、このコンピューターでしか復元できません。別のコンピューターへ移行するには、上の完全バックアップを使ってください。
  ko: 스냅샷은 데이터 폴더의 backups 폴더에 저장되며, 내용이 바뀌지 않았으면 다시 저장하지 않습니다. 복원, 호스트 가져오기, 새 버전으로 업그레이드하기 전에도 자동으로 저장됩니다. 스냅샷의 자격 증명은 계속 이 컴퓨터의 마스터 키로 암호화되어 있어 이 컴퓨터에서만 복원할 수 있습니다. 다른 컴퓨터로 옮기려면 위의 전체 백업을 사용하세요.
