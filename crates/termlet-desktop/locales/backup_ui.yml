  en: "With variables Termlet doesn’t recognize (such as {{.Names}}): %{count}. They’re sent as written, without asking for a value."
  zh-TW: "%{count} 條中有 Termlet 無法辨識的變數（如 {{.Names}}）：依原文傳送，傳送前不會要求填寫。"
  ja: "%{count} 件に Termlet が認識できない変数（{{.Names}} など）があります。そのまま送信し、送信前に入力は求めません。"
  ko: "%{count}개에 Termlet이 인식할 수 없는 변수({{.Names}} 등)가 있습니다. 그대로 보내며, 보내기 전에 값을 묻지 않습니다."
backup_ui.import.snippet_note.literal_params:
  zh-CN: "%{count} 条在 NyaTerm 中原样发送，其中的 {{…}} 在 Termlet 中会当作参数，发送前要填写。"
  en: "Sent as written in NyaTerm: %{count}. Termlet treats the {{…}} in them as parameters and asks for values before sending."
  zh-TW: "%{count} 條在 NyaTerm 中依原文傳送，其中的 {{…}} 在 Termlet 中會當作參數，傳送前要填寫。"
  ja: "%{count} 件は NyaTerm ではそのまま送信されますが、Termlet では中の {{…}} をパラメーターとして扱い、送信前に入力を求めます。"
  ko: "%{count}개는 NyaTerm에서 그대로 보내지만, Termlet에서는 그 안의 {{…}}를 매개 변수로 보고 보내기 전에 값을 묻습니다."
