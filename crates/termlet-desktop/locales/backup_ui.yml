  en: "With descriptions: %{count}. Descriptions aren’t imported (Termlet snippets have none)."
  zh-TW: "%{count} 條的說明不匯入（Termlet 的快速指令沒有說明）。"
  ja: "%{count} 件の説明はインポートしません（Termlet のスニペットには説明がありません）。"
  ko: "%{count}개의 설명은 가져오지 않습니다(Termlet 스니펫에는 설명이 없음)."
backup_ui.import.snippet_note.decorations:
  zh-CN: "%{count} 条的颜色、图标、置顶或风险等级不导入。"
  en: "With colors, icons, pinning or risk levels: %{count}. These aren’t imported."
  zh-TW: "%{count} 條的顏色、圖示、置頂或風險等級不匯入。"
  ja: "%{count} 件の色、アイコン、ピン留め、リスクレベルはインポートしません。"
  ko: "%{count}개의 색, 아이콘, 고정, 위험 수준은 가져오지 않습니다."
backup_ui.import.snippet_note.skipped:
  zh-CN: "%{count} 条为空、过长或格式不对，已跳过。"
  en: "Skipped because they’re empty, too long or not in the expected format: %{count}."
  zh-TW: "%{count} 條為空、過長或格式不對，已略過。"
  ja: "%{count} 件は空、長すぎる、または形式が正しくないためスキップしました。"
  ko: "%{count}개는 비어 있거나 너무 길거나 형식이 맞지 않아 건너뛰었습니다."
backup_ui.import.snippet_note.duplicates:
  zh-CN: 与已有快捷命令的名称、内容都相同的不重复导入；名称相同、内容不同的作为新的一条加入，不覆盖原来的。
  en: Snippets with the same name and content as existing ones aren’t imported again. Ones with the same name but different content are added as new snippets; existing ones aren’t replaced.
  zh-TW: 與現有快速指令名稱、內容都相同的不會重複匯入；名稱相同、內容不同的會作為新的一條加入，不覆寫原有的。
  ja: 既存のスニペットと名前、内容が同じものは重複してインポートしません。名前が同じで内容が異なるものは新しいスニペットとして追加し、既存のものは上書きしません。
  ko: 기존 스니펫과 이름, 내용이 모두 같은 것은 다시 가져오지 않습니다. 이름은 같고 내용이 다른 것은 새 스니펫으로 추가하며, 기존 스니펫을 덮어쓰지 않습니다.
backup_ui.import.import_secrets:
  zh-CN: 导入保存的密码
  en: Import saved passwords
  zh-TW: 匯入儲存的密碼
  ja: 保存されたパスワードをインポート
  ko: 저장된 비밀번호 가져오기
backup_ui.import.secrets_hint.electerm:
  zh-CN: Electerm 的书签导出中密码与私钥是明文（本机旧数据中的密码只是简单移位，任何人都能还原）。勾选后，登录密码、私钥密码与代理密码存进 Termlet 的保险库，私钥存进密钥库，已有的主机只补上还没保存的密码、不覆盖；不勾选时只导入主机，连接时再输入。导入后请删除导出的文件。
  en: Electerm’s bookmark export has passwords and private keys in plain text (passwords in its older local data are only shifted, which anyone can undo). When ticked, login, key and proxy passwords go into Termlet’s vault and private keys into the key library; existing hosts only get passwords they don’t have yet, nothing is overwritten. When not ticked, only the hosts are imported and you enter passwords when connecting. Delete the exported file afterwards.
  zh-TW: Electerm 的書籤匯出檔中密碼與私密金鑰是明文（本機舊資料中的密碼只是簡單位移，任何人都能還原）。勾選後，登入密碼、私密金鑰密碼與代理密碼存進 Termlet 的保險庫，私密金鑰存進金鑰庫，現有的主機只補上還沒儲存的密碼、不覆寫；不勾選時只匯入主機，連線時再輸入。匯入後請刪除匯出的檔案。
  ja: Electerm のブックマークのエクスポートでは、パスワードと秘密鍵が平文で入っています（このコンピューター上の古いデータのパスワードは文字をずらしただけなので、誰でも元に戻せます）。オンにすると、ログインパスワード、秘密鍵のパスワード、プロキシのパスワードを Termlet の保管庫に、秘密鍵を鍵ライブラリに保存します。既存のホストにはまだ保存されていないパスワードだけを補い、上書きはしません。オフの場合はホストだけをインポートし、パスワードは接続時に入力します。インポート後はエクスポートしたファイルを削除してください。
  ko: Electerm 북마크 내보내기 파일에는 비밀번호와 개인 키가 평문으로 들어 있습니다(이 컴퓨터의 예전 데이터에 있는 비밀번호는 글자를 밀어 놓은 것뿐이라 누구나 되돌릴 수 있음). 켜면 로그인 비밀번호, 개인 키 비밀번호, 프록시 비밀번호를 Termlet 보관함에, 개인 키를 키 라이브러리에 저장하며, 기존 호스트에는 아직 저장되지 않은 비밀번호만 채우고 덮어쓰지 않습니다. 끄면 호스트만 가져오고 비밀번호는 연결할 때 입력합니다. 가져온 후에는 내보낸 파일을 삭제하세요.
backup_ui.import.secrets_hint.netcatty:
  zh-CN: Netcatty 导出的 CSV 中密码是明文。勾选后，登录密码、私钥密码与代理密码存进 Termlet 的保险库，已有的主机只补上还没保存的密码、不覆盖；不勾选时只导入主机，连接时再输入。导入后请删除这份 CSV 文件。
  en: Netcatty’s CSV export has passwords in plain text. When ticked, login, key and proxy passwords go into Termlet’s vault; existing hosts only get passwords they don’t have yet, nothing is overwritten. When not ticked, only the hosts are imported and you enter passwords when connecting. Delete the CSV file afterwards.
  zh-TW: Netcatty 匯出的 CSV 中密碼是明文。勾選後，登入密碼、私密金鑰密碼與代理密碼存進 Termlet 的保險庫，現有的主機只補上還沒儲存的密碼、不覆寫；不勾選時只匯入主機，連線時再輸入。匯入後請刪除這份 CSV 檔案。
  ja: Netcatty からエクスポートした CSV では、パスワードが平文で入っています。オンにすると、ログインパスワード、秘密鍵のパスワード、プロキシのパスワードを Termlet の保管庫に保存します。既存のホストにはまだ保存されていないパスワードだけを補い、上書きはしません。オフの場合はホストだけをインポートし、パスワードは接続時に入力します。インポート後はこの CSV ファイルを削除してください。
  ko: Netcatty에서 내보낸 CSV에는 비밀번호가 평문으로 들어 있습니다. 켜면 로그인 비밀번호, 개인 키 비밀번호, 프록시 비밀번호를 Termlet 보관함에 저장하며, 기존 호스트에는 아직 저장되지 않은 비밀번호만 채우고 덮어쓰지 않습니다. 끄면 호스트만 가져오고 비밀번호는 연결할 때 입력합니다. 가져온 후에는 이 CSV 파일을 삭제하세요.
backup_ui.import.on_duplicate:
  zh-CN: 已存在的主机
