backup_ui.page.restore_warning:
  zh-CN: 恢复会替换当前的全部数据（主机、凭据、密钥、快捷命令、设置等），正在运行的端口转发会停止，已打开的终端不受影响。恢复前会自动保存一份当前数据的快照，可在下方的本机快照中回退。
  en: Restoring replaces all current data (hosts, credentials, keys, snippets, settings and more). Running port forwards are stopped; open terminals aren’t affected. A snapshot of the current data is saved first, so you can roll back from the local snapshots below.
  zh-TW: 還原會取代目前的全部資料（主機、認證資訊、金鑰、快速指令、設定等），執行中的連接埠轉送會停止，已開啟的終端機不受影響。還原前會自動儲存一份目前資料的快照，可在下方的本機快照中回復。
  ja: 復元すると現在のすべてのデータ（ホスト、認証情報、鍵、スニペット、設定など）が置き換えられ、実行中のポート転送は停止します。開いているターミナルには影響しません。復元の前に現在のデータのスナップショットが自動で保存されるため、下のローカルスナップショットから元に戻せます。
  ko: 복원하면 현재의 모든 데이터(호스트, 자격 증명, 키, 스니펫, 설정 등)가 바뀌고, 실행 중인 포트 포워딩은 중지됩니다. 열려 있는 터미널에는 영향이 없습니다. 복원 전에 현재 데이터의 스냅샷이 자동으로 저장되므로 아래의 로컬 스냅샷에서 되돌릴 수 있습니다.
backup_ui.page.restore_submit:
  zh-CN: 替换并恢复
  en: Replace and Restore
  zh-TW: 取代並還原
  ja: 置き換えて復元
  ko: 바꾸고 복원
backup_ui.page.restored:
  zh-CN: 已用 %{time} 的备份替换了全部数据，恢复前的数据已保存为快照。
  en: All data was replaced with the backup from %{time}. The previous data was saved as a snapshot.
  zh-TW: 已用 %{time} 的備份取代了全部資料，還原前的資料已儲存為快照。
  ja: "%{time} のバックアップですべてのデータを置き換えました。復元前のデータはスナップショットとして保存されています。"
  ko: "%{time}의 백업으로 모든 데이터를 바꿨습니다. 복원 전의 데이터는 스냅샷으로 저장되었습니다."
backup_ui.page.vault_reset:
  zh-CN: 这台电脑上的主密钥已丢失，恢复前重置了保险库，备份中的凭据已用新的主密钥保存。
  en: This computer’s master key was missing, so the vault was reset before restoring. The credentials from the backup are now protected by the new master key.
  zh-TW: 這台電腦上的主金鑰已遺失，還原前重設了保險庫，備份中的認證資訊已用新的主金鑰儲存。
  ja: このコンピューターのマスターキーが失われていたため、復元の前に保管庫をリセットしました。バックアップの認証情報は新しいマスターキーで保存されています。
  ko: 이 컴퓨터의 마스터 키가 없어져 복원 전에 보관함을 초기화했습니다. 백업의 자격 증명은 새 마스터 키로 저장되었습니다.
backup_ui.page.snapshots_title:
  zh-CN: 本机快照
  en: Local Snapshots
  zh-TW: 本機快照
  ja: ローカルスナップショット
  ko: 로컬 스냅샷
backup_ui.page.auto:
