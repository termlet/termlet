  zh-TW: 時間應寫成 03:00 這樣的格式（24 小時制）。
  ja: 時刻は 03:00 のような形式（24 時間表記）で入力してください。
  ko: 시간은 03:00 같은 형식(24시간제)으로 입력하세요.
