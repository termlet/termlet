  ja: "%{count} 件は入れ子のカテゴリにあります。Termlet のグループは 1 階層だけのため、「親 / 子」と書きます。"
  ko: "%{count}개는 중첩된 범주에 있습니다. Termlet의 그룹은 한 단계뿐이므로 '상위 / 하위'로 씁니다."
