_version: 2
backup_ui.password.new:
  zh-CN: 密码（至少 %{min} 个字符）
  en: Password (at least %{min} characters)
  zh-TW: 密碼（至少 %{min} 個字元）
  ja: パスワード（%{min} 文字以上）
  ko: 비밀번호(%{min}자 이상)
backup_ui.password.repeat:
  zh-CN: 再次输入密码
  en: Enter the password again
  zh-TW: 再次輸入密碼
  ja: パスワードをもう一度入力
  ko: 비밀번호 다시 입력
backup_ui.password.too_short:
  zh-CN: 密码至少 %{min} 个字符。
  en: The password must be at least %{min} characters.
  zh-TW: 密碼至少 %{min} 個字元。
  ja: パスワードは %{min} 文字以上にしてください。
  ko: 비밀번호는 %{min}자 이상이어야 합니다.
backup_ui.password.mismatch:
  zh-CN: 两次输入的密码不一致。
  en: The passwords don’t match.
  zh-TW: 兩次輸入的密碼不一致。
  ja: 入力した 2 つのパスワードが一致しません。
  ko: 두 번 입력한 비밀번호가 일치하지 않습니다.
backup_ui.counts:
  zh-CN: 主机 %{hosts} 台、密钥 %{keys} 把、凭据档案 %{profiles} 个、快捷命令 %{snippets} 条、端口转发 %{forwards} 条
  en: "%{hosts} hosts, %{keys} keys, %{profiles} credential profiles, %{snippets} snippets, %{forwards} port forwards"
  zh-TW: 主機 %{hosts} 台、金鑰 %{keys} 把、認證資訊設定檔 %{profiles} 個、快速指令 %{snippets} 條、連接埠轉送 %{forwards} 條
  ja: ホスト %{hosts} 台、鍵 %{keys} 個、認証プロファイル %{profiles} 個、スニペット %{snippets} 件、ポート転送 %{forwards} 件
  ko: 호스트 %{hosts}대, 키 %{keys}개, 자격 증명 프로필 %{profiles}개, 스니펫 %{snippets}개, 포트 포워딩 %{forwards}개
backup_ui.counts_more:
  zh-CN: 分组 %{groups} 个、工作区 %{workspaces} 个、自定义配色 %{schemes} 套、主机指纹 %{known_hosts} 个、命令历史 %{history} 条
  en: "%{groups} groups, %{workspaces} workspaces, %{schemes} custom color schemes, %{known_hosts} host keys, %{history} history entries"
  zh-TW: 群組 %{groups} 個、工作區 %{workspaces} 個、自訂配色 %{schemes} 套、主機指紋 %{known_hosts} 個、指令歷史記錄 %{history} 筆
  ja: グループ %{groups} 個、ワークスペース %{workspaces} 個、カスタム配色 %{schemes} 個、ホストキー %{known_hosts} 個、コマンド履歴 %{history} 件
  ko: 그룹 %{groups}개, 작업 영역 %{workspaces}개, 사용자 지정 색 구성표 %{schemes}개, 호스트 키 %{known_hosts}개, 명령 기록 %{history}건

backup_ui.error.password_required:
  zh-CN: 文件已加密，请输入密码。
  en: The file is encrypted. Enter its password.
  zh-TW: 檔案已加密，請輸入密碼。
  ja: ファイルは暗号化されています。パスワードを入力してください。
  ko: 파일이 암호화되어 있습니다. 비밀번호를 입력하세요.
backup_ui.error.wrong_password:
  zh-CN: 密码错误，或文件已损坏。
  en: Wrong password, or the file is damaged.
  zh-TW: 密碼錯誤，或檔案已損毀。
  ja: パスワードが間違っているか、ファイルが破損しています。
  ko: 비밀번호가 틀렸거나 파일이 손상되었습니다.
backup_ui.error.invalid:
  zh-CN: 不是 Termlet 的备份或导出文件，或文件已损坏。
  en: This isn’t a Termlet backup or export file, or the file is damaged.
  zh-TW: 不是 Termlet 的備份或匯出檔案，或檔案已損毀。
  ja: Termlet のバックアップまたはエクスポートファイルではないか、ファイルが破損しています。
  ko: Termlet 백업 또는 내보내기 파일이 아니거나 파일이 손상되었습니다.
backup_ui.error.too_new:
  zh-CN: 文件来自更新版本的 Termlet（版本 %{found}，这个版本最高支持 %{supported}），请先升级 Termlet。
  en: The file comes from a newer version of Termlet (version %{found}; this version supports up to %{supported}). Upgrade Termlet first.
  zh-TW: 檔案來自較新版本的 Termlet（版本 %{found}，這個版本最高支援 %{supported}），請先升級 Termlet。
  ja: このファイルは新しいバージョンの Termlet で作成されています（バージョン %{found}、このバージョンが対応するのは %{supported} まで）。先に Termlet をアップグレードしてください。
  ko: 이 파일은 더 새로운 버전의 Termlet에서 만들어졌습니다(버전 %{found}, 이 버전은 %{supported}까지 지원). 먼저 Termlet을 업그레이드하세요.
backup_ui.error.is_hosts_file:
  zh-CN: 这是导出的主机文件，请在侧边栏的“导入主机”中导入。
  en: This is an exported host file. Import it with “Import Hosts” in the sidebar.
  zh-TW: 這是匯出的主機檔案，請在側邊欄的「匯入主機」中匯入。
  ja: これはエクスポートしたホストファイルです。サイドバーの「ホストをインポート」からインポートしてください。
  ko: 내보낸 호스트 파일입니다. 사이드바의 '호스트 가져오기'에서 가져오세요.
backup_ui.error.is_full_backup:
  zh-CN: 这是完整备份，请在“设置 → 备份”中恢复。
  en: This is a full backup. Restore it in Settings → Backup.
  zh-TW: 這是完整備份，請在「設定 → 備份」中還原。
  ja: これは完全バックアップです。「設定 → バックアップ」で復元してください。
  ko: 전체 백업입니다. '설정 → 백업'에서 복원하세요.
backup_ui.error.foreign_snapshot:
  zh-CN: 快照中的凭据无法用这台电脑的主密钥解开：快照来自另一台电脑，或之后重置过保险库。
  en: The credentials in this snapshot can’t be opened with this computer’s master key. The snapshot comes from another computer, or the vault was reset afterwards.
  zh-TW: 快照中的認證資訊無法用這台電腦的主金鑰解開：快照來自另一台電腦，或之後重設過保險庫。
  ja: このスナップショットの認証情報は、このコンピューターのマスターキーでは復号できません。スナップショットが別のコンピューターで作成されたか、その後に保管庫がリセットされています。
  ko: 이 스냅샷의 자격 증명은 이 컴퓨터의 마스터 키로 열 수 없습니다. 스냅샷이 다른 컴퓨터에서 만들어졌거나, 그 후에 보관함을 초기화했습니다.
backup_ui.error.snapshot_not_found:
  zh-CN: 快照不存在，可能已被清理。
  en: The snapshot no longer exists. It may have been cleaned up.
  zh-TW: 快照不存在，可能已被清除。
  ja: スナップショットが存在しません。すでに整理された可能性があります。
  ko: 스냅샷이 없습니다. 이미 정리되었을 수 있습니다.
backup_ui.error.invalid_snapshot_name:
  zh-CN: 快照的名称不正确。
  en: The snapshot name isn’t valid.
  zh-TW: 快照的名稱不正確。
  ja: スナップショットの名前が正しくありません。
  ko: 스냅샷 이름이 올바르지 않습니다.
backup_ui.error.nothing_selected:
  zh-CN: 没有选择主机。
  en: No hosts are selected.
  zh-TW: 沒有選取主機。
  ja: ホストが選択されていません。
  ko: 선택한 호스트가 없습니다.
backup_ui.error.host_not_found:
  zh-CN: 要导出的主机已被删除。
  en: A host to export was deleted.
  zh-TW: 要匯出的主機已被刪除。
  ja: エクスポートするホストが削除されています。
  ko: 내보낼 호스트가 삭제되었습니다.
backup_ui.error.vault_locked:
  zh-CN: 保险库已锁定，解锁后再试。
  en: The vault is locked. Unlock it and try again.
  zh-TW: 保險庫已鎖定，解鎖後再試。
  ja: 保管庫がロックされています。ロックを解除してからやり直してください。
  ko: 보관함이 잠겨 있습니다. 잠금을 해제한 후 다시 시도하세요.
backup_ui.error.vault_unavailable:
  zh-CN: 系统钥匙串不可用：%{reason}
  en: "The system keychain isn’t available: %{reason}"
  zh-TW: 系統鑰匙圈無法使用：%{reason}
  ja: システムのキーチェーンを使用できません：%{reason}
  ko: "시스템 키체인을 사용할 수 없습니다: %{reason}"
backup_ui.error.file_not_found:
  zh-CN: 文件不存在：%{path}
  en: "File not found: %{path}"
  zh-TW: 檔案不存在：%{path}
  ja: ファイルが存在しません：%{path}
  ko: "파일이 없습니다: %{path}"
backup_ui.error.permission_denied:
  zh-CN: 没有权限访问 %{path}。
  en: No permission to access %{path}.
  zh-TW: 沒有權限存取 %{path}。
  ja: "%{path} にアクセスする権限がありません。"
  ko: "%{path}에 액세스할 권한이 없습니다."
backup_ui.error.read_failed:
  zh-CN: 读取 %{path} 失败：%{reason}
  en: "Couldn’t read %{path}: %{reason}"
  zh-TW: 讀取 %{path} 失敗：%{reason}
  ja: "%{path} を読み取れませんでした：%{reason}"
  ko: "%{path}을(를) 읽지 못했습니다: %{reason}"
backup_ui.error.write_failed:
  zh-CN: 写入 %{path} 失败：%{reason}
  en: "Couldn’t write %{path}: %{reason}"
  zh-TW: 寫入 %{path} 失敗：%{reason}
  ja: "%{path} に書き込めませんでした：%{reason}"
  ko: "%{path}에 쓰지 못했습니다: %{reason}"
backup_ui.error.not_absolute:
  zh-CN: 请填写完整的路径。
  en: Enter a full path.
  zh-TW: 請填寫完整的路徑。
  ja: 完全なパスを入力してください。
  ko: 전체 경로를 입력하세요.
backup_ui.error.is_directory:
  zh-CN: “%{path}”是一个文件夹，请选择文件。
  en: “%{path}” is a folder. Choose a file.
  zh-TW: 「%{path}」是一個資料夾，請選擇檔案。
  ja: 「%{path}」はフォルダーです。ファイルを選択してください。
  ko: "'%{path}'은(는) 폴더입니다. 파일을 선택하세요."
backup_ui.error.too_large:
  zh-CN: 文件过大，不是 Termlet 的备份或导出文件。
  en: The file is too large to be a Termlet backup or export file.
  zh-TW: 檔案過大，不是 Termlet 的備份或匯出檔案。
  ja: ファイルが大きすぎます。Termlet のバックアップまたはエクスポートファイルではありません。
  ko: 파일이 너무 큽니다. Termlet 백업 또는 내보내기 파일이 아닙니다.
backup_ui.error.folder_missing:
  zh-CN: 备份文件夹不存在或无法访问：%{path}。在 U 盘或网盘中时，插上或挂载后再试。
  en: "The backup folder doesn’t exist or can’t be accessed: %{path}. If it’s on a USB drive or a cloud drive, connect it and try again."
  zh-TW: 備份資料夾不存在或無法存取：%{path}。位於 USB 隨身碟或雲端硬碟時，請插上或掛接後再試。
  ja: バックアップフォルダーが存在しないか、アクセスできません：%{path}。USB メモリやクラウドストレージにある場合は、接続またはマウントしてからやり直してください。
  ko: "백업 폴더가 없거나 액세스할 수 없습니다: %{path}. USB 드라이브나 클라우드 드라이브에 있다면 연결하거나 마운트한 후 다시 시도하세요."
backup_ui.error.invalid_schedule:
  zh-CN: 定时备份的计划不正确，请检查时间与保留份数。
  en: The backup schedule isn’t valid. Check the time and the number of backups to keep.
  zh-TW: 定時備份的排程不正確，請檢查時間與保留份數。
  ja: 定期バックアップのスケジュールが正しくありません。時刻と保持する数を確認してください。
  ko: 예약 백업 일정이 올바르지 않습니다. 시간과 보관 개수를 확인하세요.
backup_ui.error.not_scheduled:
  zh-CN: 还没有设置定时备份。
  en: Scheduled backups aren’t set up.
  zh-TW: 還沒有設定定時備份。
  ja: 定期バックアップはまだ設定されていません。
  ko: 예약 백업이 아직 설정되지 않았습니다.
backup_ui.error.schedule_password_lost:
  zh-CN: 保险库重置过，定时备份的密码已无法解开，请在“更改设置”中重新输入。
  en: The vault was reset, so the scheduled backup password can’t be opened. Enter it again under “Change Settings”.
  zh-TW: 保險庫重設過，定時備份的密碼已無法解開，請在「變更設定」中重新輸入。
  ja: 保管庫がリセットされたため、定期バックアップのパスワードを復号できなくなりました。「設定を変更」でもう一度入力してください。
  ko: 보관함이 초기화되어 예약 백업 비밀번호를 열 수 없게 되었습니다. '설정 변경'에서 다시 입력하세요.
backup_ui.error.store:
  zh-CN: 操作失败：%{error}
  en: "The operation failed: %{error}"
  zh-TW: 操作失敗：%{error}
  ja: 操作に失敗しました：%{error}
  ko: "작업에 실패했습니다: %{error}"

backup_ui.import_error.not_found:
  zh-CN: 找不到 %{path}。
  en: "%{path} wasn’t found."
  zh-TW: 找不到 %{path}。
  ja: "%{path} が見つかりません。"
  ko: "%{path}을(를) 찾을 수 없습니다."
backup_ui.import_error.permission:
  zh-CN: 没有权限读取 %{path}。
  en: No permission to read %{path}.
  zh-TW: 沒有權限讀取 %{path}。
  ja: "%{path} を読み取る権限がありません。"
  ko: "%{path}을(를) 읽을 권한이 없습니다."
backup_ui.import_error.io:
  zh-CN: 读取 %{path} 失败：%{error}
  en: "Couldn’t read %{path}: %{error}"
  zh-TW: 讀取 %{path} 失敗：%{error}
  ja: "%{path} を読み取れませんでした：%{error}"
  ko: "%{path}을(를) 읽지 못했습니다: %{error}"
backup_ui.import_error.too_large:
  zh-CN: “%{path}”超过 %{limit} MB，不像是配置文件。
  en: “%{path}” is larger than %{limit} MB and doesn’t look like a configuration file.
  zh-TW: 「%{path}」超過 %{limit} MB，不像是設定檔。
  ja: 「%{path}」は %{limit} MB を超えており、設定ファイルとは思えません。
  ko: "'%{path}'은(는) %{limit} MB를 넘어 구성 파일로 보이지 않습니다."
backup_ui.import_error.syntax:
  zh-CN: 配置文件有语法错误：%{error}
  en: "The configuration file has a syntax error: %{error}"
  zh-TW: 設定檔有語法錯誤：%{error}
  ja: 設定ファイルに構文エラーがあります：%{error}
  ko: "구성 파일에 구문 오류가 있습니다: %{error}"
backup_ui.import_error.tabby_encrypted:
  zh-CN: 配置文件已被 Tabby 加密，请先在 Tabby 的设置中关闭配置加密。
  en: The configuration is encrypted by Tabby. Turn off config encryption in Tabby’s settings first.
  zh-TW: 設定檔已被 Tabby 加密，請先在 Tabby 的設定中關閉設定加密。
  ja: 設定ファイルは Tabby によって暗号化されています。先に Tabby の設定で設定の暗号化をオフにしてください。
  ko: 구성 파일이 Tabby에서 암호화되어 있습니다. 먼저 Tabby 설정에서 구성 암호화를 끄세요.
backup_ui.import_error.registry:
  zh-CN: 读取 MobaXterm 的注册表失败：%{error}
  en: "Couldn’t read MobaXterm’s registry entries: %{error}"
  zh-TW: 讀取 MobaXterm 的登錄檔失敗：%{error}
  ja: MobaXterm のレジストリを読み取れませんでした：%{error}
  ko: "MobaXterm의 레지스트리 항목을 읽지 못했습니다: %{error}"
backup_ui.import_error.termora_v1:
  zh-CN: 这是 Termora 1.x 的数据，请先用 Termora 2.x 打开一次完成数据迁移。
  en: This is Termora 1.x data. Open it once with Termora 2.x to migrate it first.
  zh-TW: 這是 Termora 1.x 的資料，請先用 Termora 2.x 開啟一次以完成資料移轉。
  ja: これは Termora 1.x のデータです。先に Termora 2.x で一度開いて、データの移行を済ませてください。
  ko: Termora 1.x의 데이터입니다. 먼저 Termora 2.x에서 한 번 열어 데이터 마이그레이션을 마치세요.
backup_ui.import_error.termora_not_found:
  zh-CN: 没有找到 Termora 的数据库（config/termora.db）。
  en: Termora’s database (config/termora.db) wasn’t found.
  zh-TW: 沒有找到 Termora 的資料庫（config/termora.db）。
  ja: Termora のデータベース（config/termora.db）が見つかりません。
  ko: Termora 데이터베이스(config/termora.db)를 찾을 수 없습니다.
backup_ui.import_error.not_termora:
  zh-CN: 不是 Termora 2.x 的数据库：%{error}
  en: "This isn’t a Termora 2.x database: %{error}"
  zh-TW: 不是 Termora 2.x 的資料庫：%{error}
  ja: Termora 2.x のデータベースではありません：%{error}
  ko: "Termora 2.x 데이터베이스가 아닙니다: %{error}"
backup_ui.import_error.termora_key_missing:
  zh-CN: Termora 的数据库中缺少解密所需的信息，可能是不支持的 Termora 版本。
  en: Termora’s database is missing what’s needed to decrypt it. This Termora version may not be supported.
  zh-TW: Termora 的資料庫中缺少解密所需的資訊，可能是不支援的 Termora 版本。
  ja: Termora のデータベースに復号に必要な情報がありません。対応していない Termora のバージョンの可能性があります。
  ko: Termora 데이터베이스에 복호화에 필요한 정보가 없습니다. 지원하지 않는 Termora 버전일 수 있습니다.
backup_ui.import_error.termora_decrypt:
  zh-CN: 无法解密 Termora 的数据，可能是不支持的 Termora 版本。
  en: Termora’s data couldn’t be decrypted. This Termora version may not be supported.
  zh-TW: 無法解密 Termora 的資料，可能是不支援的 Termora 版本。
  ja: Termora のデータを復号できません。対応していない Termora のバージョンの可能性があります。
  ko: Termora 데이터를 복호화할 수 없습니다. 지원하지 않는 Termora 버전일 수 있습니다.
backup_ui.import_error.windterm_not_found:
  zh-CN: 没有找到 WindTerm 的会话文件（.wind\profiles\default.v10\terminal\user.sessions）。请选择 WindTerm 的程序目录或数据目录 .wind。
  en: WindTerm’s session file (.wind\profiles\default.v10\terminal\user.sessions) wasn’t found. Choose WindTerm’s program folder or its .wind data folder.
  zh-TW: 沒有找到 WindTerm 的工作階段檔案（.wind\profiles\default.v10\terminal\user.sessions）。請選擇 WindTerm 的程式目錄或資料目錄 .wind。
  ja: 'WindTerm のセッションファイル（.wind\profiles\default.v10\terminal\user.sessions）が見つかりません。WindTerm のプログラムフォルダーまたはデータフォルダー .wind を選択してください。'
  ko: 'WindTerm 세션 파일(.wind\profiles\default.v10\terminal\user.sessions)을 찾을 수 없습니다. WindTerm 프로그램 폴더나 데이터 폴더 .wind를 선택하세요.'
backup_ui.import_error.windterm_password_required:
  zh-CN: WindTerm 设了主密码，请输入主密码。
  en: WindTerm has a master password. Enter it.
  zh-TW: WindTerm 設了主密碼，請輸入主密碼。
  ja: WindTerm にマスターパスワードが設定されています。マスターパスワードを入力してください。
  ko: WindTerm에 마스터 비밀번호가 설정되어 있습니다. 마스터 비밀번호를 입력하세요.
backup_ui.import_error.windterm_wrong_password:
  zh-CN: WindTerm 的主密码不对，解不开保存的密码。
  en: The WindTerm master password is wrong; the saved passwords can’t be decrypted.
  zh-TW: WindTerm 的主密碼不正確，無法解開儲存的密碼。
  ja: WindTerm のマスターパスワードが正しくないため、保存されたパスワードを復号できません。
  ko: WindTerm 마스터 비밀번호가 올바르지 않아 저장된 비밀번호를 열 수 없습니다.
backup_ui.import_error.not_electerm:
  zh-CN: 不是 Electerm 的书签导出或数据目录：%{error}
  en: "This isn’t an Electerm bookmark export or data folder: %{error}"
  zh-TW: 不是 Electerm 的書籤匯出檔或資料目錄：%{error}
  ja: Electerm のブックマークのエクスポートまたはデータフォルダーではありません：%{error}
  ko: "Electerm 북마크 내보내기 파일이나 데이터 폴더가 아닙니다: %{error}"
backup_ui.import_error.electerm_encrypted:
  zh-CN: Electerm 3.0 起用系统的加密保存书签，Termlet 读不了。请在 Electerm 中导出书签，再选择导出的 JSON 文件。
  en: Since 3.0, Electerm stores bookmarks with the system’s encryption, which Termlet can’t read. Export the bookmarks in Electerm, then choose the exported JSON file.
  zh-TW: Electerm 3.0 起用系統的加密儲存書籤，Termlet 讀不了。請在 Electerm 中匯出書籤，再選擇匯出的 JSON 檔案。
  ja: Electerm 3.0 以降はブックマークをシステムの暗号化で保存しているため、Termlet では読み取れません。Electerm でブックマークをエクスポートしてから、エクスポートした JSON ファイルを選択してください。
  ko: Electerm 3.0부터는 북마크를 시스템 암호화로 저장하므로 Termlet에서 읽을 수 없습니다. Electerm에서 북마크를 내보낸 다음 내보낸 JSON 파일을 선택하세요.
backup_ui.import_error.not_netcatty:
  zh-CN: 不是 Netcatty 导出的主机 CSV（缺少 Hostname/IP 列）。请在 Netcatty 的主机页点“导出”得到 CSV 文件。
  en: This isn’t a host CSV exported from Netcatty (it has no Hostname/IP column). Click “Export” on Netcatty’s hosts page to get the CSV file.
  zh-TW: 不是 Netcatty 匯出的主機 CSV（缺少 Hostname/IP 欄）。請在 Netcatty 的主機頁點「匯出」取得 CSV 檔案。
  ja: Netcatty からエクスポートしたホストの CSV ではありません（Hostname/IP 列がありません）。Netcatty のホストページで「エクスポート」をクリックして CSV ファイルを作成してください。
  ko: Netcatty에서 내보낸 호스트 CSV가 아닙니다(Hostname/IP 열이 없음). Netcatty의 호스트 페이지에서 '내보내기'를 클릭해 CSV 파일을 만드세요.
backup_ui.import_error.not_nyaterm:
  zh-CN: 不是 NyaTerm 导出的快捷命令（%{error}）。请在 NyaTerm 的快捷命令面板点“导出快捷命令”得到 JSON 文件。
  en: This isn’t a quick command file exported from NyaTerm (%{error}). Click “Export Commands” in NyaTerm’s Quick Commands panel to get the JSON file.
  zh-TW: 不是 NyaTerm 匯出的快捷命令（%{error}）。請在 NyaTerm 的快捷命令面板按一下「匯出快捷命令」取得 JSON 檔案。
  ja: NyaTerm からエクスポートしたクイックコマンドではありません（%{error}）。NyaTerm のクイックコマンドパネルで「コマンドをエクスポート」をクリックして JSON ファイルを作成してください。
  ko: NyaTerm에서 내보낸 빠른 명령 파일이 아닙니다(%{error}). NyaTerm의 빠른 명령 패널에서 '명령 내보내기'를 클릭해 JSON 파일을 만드세요.

backup_ui.failure.host:
  zh-CN: 主机“%{name}”没能导入：%{reason}
  en: "Host “%{name}” wasn’t imported: %{reason}"
  zh-TW: 主機「%{name}」未能匯入：%{reason}
  ja: ホスト「%{name}」をインポートできませんでした：%{reason}
  ko: "'%{name}' 호스트를 가져오지 못했습니다: %{reason}"
backup_ui.failure.secrets:
  zh-CN: 主机“%{host}”已导入，但它的密码等凭据没能保存：%{reason}
  en: "Host “%{host}” was imported, but its password and other credentials weren’t saved: %{reason}"
  zh-TW: 主機「%{host}」已匯入，但它的密碼等認證資訊未能儲存：%{reason}
  ja: ホスト「%{host}」はインポートしましたが、パスワードなどの認証情報を保存できませんでした：%{reason}
  ko: "'%{host}' 호스트는 가져왔지만 비밀번호 등 자격 증명을 저장하지 못했습니다: %{reason}"
backup_ui.failure.key:
  zh-CN: 私钥“%{name}”没能存入密钥库，用它的主机改用密码登录：%{reason}
  en: "Private key “%{name}” wasn’t added to the key library, so hosts using it log in with a password: %{reason}"
  zh-TW: 私密金鑰「%{name}」未能存入金鑰庫，使用它的主機改用密碼登入：%{reason}
  ja: 秘密鍵「%{name}」を鍵ライブラリに保存できなかったため、それを使うホストはパスワードでログインします：%{reason}
  ko: "'%{name}' 개인 키를 키 라이브러리에 저장하지 못해, 이 키를 쓰는 호스트는 비밀번호로 로그인합니다: %{reason}"
backup_ui.failure.profile:
  zh-CN: 凭据档案“%{name}”没能导入：%{reason}
  en: "Credential profile “%{name}” wasn’t imported: %{reason}"
  zh-TW: 認證資訊設定檔「%{name}」未能匯入：%{reason}
  ja: 認証プロファイル「%{name}」をインポートできませんでした：%{reason}
  ko: "'%{name}' 자격 증명 프로필을 가져오지 못했습니다: %{reason}"
backup_ui.failure.group:
  zh-CN: 分组“%{name}”的默认设置没能写入：%{reason}
  en: "The defaults of group “%{name}” weren’t saved: %{reason}"
  zh-TW: 群組「%{name}」的預設設定未能寫入：%{reason}
  ja: グループ「%{name}」のデフォルト設定を保存できませんでした：%{reason}
  ko: "'%{name}' 그룹의 기본 설정을 저장하지 못했습니다: %{reason}"
backup_ui.failure.forward:
  zh-CN: 主机“%{host}”的端口转发 %{label} 没能导入：%{reason}
  en: "Port forward %{label} of host “%{host}” wasn’t imported: %{reason}"
  zh-TW: 主機「%{host}」的連接埠轉送 %{label} 未能匯入：%{reason}
  ja: ホスト「%{host}」のポート転送 %{label} をインポートできませんでした：%{reason}
  ko: "'%{host}' 호스트의 포트 포워딩 %{label}을(를) 가져오지 못했습니다: %{reason}"
backup_ui.failure.jump:
  zh-CN: 主机“%{host}”的跳板机没能设置，保持原来的设置：%{reason}
  en: "The jump host of “%{host}” wasn’t set and its previous setting is kept: %{reason}"
  zh-TW: 主機「%{host}」的跳板機未能設定，保留原來的設定：%{reason}
  ja: ホスト「%{host}」の踏み台ホストを設定できなかったため、元の設定のままです：%{reason}
  ko: "'%{host}' 호스트의 점프 호스트를 설정하지 못해 기존 설정을 유지합니다: %{reason}"
backup_ui.failure.group_jump:
  zh-CN: 分组“%{group}”的默认跳板机没能设置：%{reason}
  en: "The default jump host of group “%{group}” wasn’t set: %{reason}"
  zh-TW: 群組「%{group}」的預設跳板機未能設定：%{reason}
  ja: グループ「%{group}」のデフォルトの踏み台ホストを設定できませんでした：%{reason}
  ko: "'%{group}' 그룹의 기본 점프 호스트를 설정하지 못했습니다: %{reason}"
backup_ui.failure.snippet:
  zh-CN: 快捷命令“%{name}”没能导入：%{reason}
  en: "Quick command “%{name}” wasn’t imported: %{reason}"
  zh-TW: 快速指令「%{name}」未能匯入：%{reason}
  ja: スニペット「%{name}」をインポートできませんでした：%{reason}
  ko: "'%{name}' 스니펫을 가져오지 못했습니다: %{reason}"
backup_ui.invalid.bind_conflict:
  zh-CN: 监听的地址与端口已被其他转发规则占用。
  en: Another port forward already listens on this address and port.
  zh-TW: 監聽的位址與連接埠已被其他轉送規則佔用。
  ja: 待ち受けアドレスとポートは、ほかのポート転送ですでに使われています。
  ko: 다른 포트 포워딩이 이미 이 주소와 포트에서 수신 대기 중입니다.
backup_ui.invalid.bind_port:
  zh-CN: 监听端口不正确。
  en: The listening port isn’t valid.
  zh-TW: 監聽連接埠不正確。
  ja: 待ち受けポートが正しくありません。
  ko: 수신 대기 포트가 올바르지 않습니다.
backup_ui.invalid.target_port:
  zh-CN: 目标端口不正确。
  en: The target port isn’t valid.
  zh-TW: 目標連接埠不正確。
  ja: 接続先ポートが正しくありません。
  ko: 대상 포트가 올바르지 않습니다.
backup_ui.invalid.bind_host:
  zh-CN: 监听地址不正确。
  en: The listening address isn’t valid.
  zh-TW: 監聽位址不正確。
  ja: 待ち受けアドレスが正しくありません。
  ko: 수신 대기 주소가 올바르지 않습니다.
backup_ui.invalid.target_host:
  zh-CN: 目标地址不正确。
  en: The target address isn’t valid.
  zh-TW: 目標位址不正確。
  ja: 接続先アドレスが正しくありません。
  ko: 대상 주소가 올바르지 않습니다.

backup_ui.hint.missing_username:
  zh-CN: 来源中没有用户名，导入后请补充。
  en: The source has no user name. Fill it in after importing.
  zh-TW: 來源中沒有使用者名稱，匯入後請補上。
  ja: インポート元にユーザー名がありません。インポート後に入力してください。
  ko: 원본에 사용자 이름이 없습니다. 가져온 후 입력하세요.
backup_ui.hint.private_key_not_imported:
  zh-CN: “%{source}”使用它自己保存的私钥，导入后请重新选择私钥文件。
  en: “%{source}” uses a private key stored in its own key manager. Choose the key file again after importing.
  zh-TW: 「%{source}」使用它自己儲存的私密金鑰，匯入後請重新選擇私密金鑰檔案。
  ja: 「%{source}」は独自に保存した秘密鍵を使っています。インポート後に秘密鍵ファイルを選び直してください。
  ko: "'%{source}'은(는) 자체적으로 저장한 개인 키를 사용합니다. 가져온 후 개인 키 파일을 다시 선택하세요."
backup_ui.hint.private_key_not_imported_named:
  zh-CN: “%{source}”使用它自己保存的私钥“%{name}”，导入后请重新选择私钥文件。
  en: “%{source}” uses the private key “%{name}” stored in its own key manager. Choose the key file again after importing.
  zh-TW: 「%{source}」使用它自己儲存的私密金鑰「%{name}」，匯入後請重新選擇私密金鑰檔案。
  ja: 「%{source}」は独自に保存した秘密鍵「%{name}」を使っています。インポート後に秘密鍵ファイルを選び直してください。
  ko: "'%{source}'은(는) 자체적으로 저장한 개인 키 '%{name}'을(를) 사용합니다. 가져온 후 개인 키 파일을 다시 선택하세요."
backup_ui.hint.private_key_file_missing:
  zh-CN: “%{source}”中设为私钥登录，但没有指定私钥文件，导入后请选择私钥。
  en: “%{source}” uses key authentication without a key file. Choose a private key after importing.
  zh-TW: 「%{source}」中設為私密金鑰登入，但沒有指定私密金鑰檔案，匯入後請選擇私密金鑰。
  ja: 「%{source}」は秘密鍵によるログインに設定されていますが、秘密鍵ファイルが指定されていません。インポート後に秘密鍵を選択してください。
  ko: "'%{source}'은(는) 개인 키 로그인으로 설정되어 있지만 개인 키 파일이 지정되지 않았습니다. 가져온 후 개인 키를 선택하세요."
backup_ui.hint.extra_private_keys:
  zh-CN: “%{source}”中配置了 %{total} 个私钥，只导入了第一个。
  en: “%{source}” has %{total} private keys configured; only the first one was imported.
  zh-TW: 「%{source}」中設定了 %{total} 個私密金鑰，只匯入了第一個。
  ja: 「%{source}」には秘密鍵が %{total} 個設定されていますが、最初の 1 つだけをインポートしました。
  ko: "'%{source}'에 개인 키가 %{total}개 설정되어 있지만 첫 번째 키만 가져왔습니다."
backup_ui.hint.library_key_missing:
  zh-CN: “%{source}”中使用的密钥已不存在，请重新选择私钥。
  en: The key used in “%{source}” no longer exists. Choose a private key again.
  zh-TW: 「%{source}」中使用的金鑰已不存在，請重新選擇私密金鑰。
  ja: 「%{source}」で使われている鍵はもう存在しません。秘密鍵を選び直してください。
  ko: "'%{source}'에서 사용하는 키가 더 이상 없습니다. 개인 키를 다시 선택하세요."
backup_ui.hint.library_key_unusable:
  zh-CN: “%{source}”中的密钥“%{name}”无法导入（格式不支持或已损坏），请重新选择私钥。
  en: The key “%{name}” in “%{source}” can’t be imported (unsupported or damaged). Choose a private key again.
  zh-TW: 「%{source}」中的金鑰「%{name}」無法匯入（格式不受支援或已損毀），請重新選擇私密金鑰。
  ja: 「%{source}」の鍵「%{name}」はインポートできません（形式に対応していないか、破損しています）。秘密鍵を選び直してください。
  ko: "'%{source}'의 '%{name}' 키를 가져올 수 없습니다(지원하지 않는 형식이거나 손상됨). 개인 키를 다시 선택하세요."
backup_ui.hint.unknown_path_placeholder:
  zh-CN: 私钥路径中有无法识别的占位符 %{placeholder}，导入后请确认私钥路径。
  en: The key path has an unknown placeholder %{placeholder}. Check the key path after importing.
  zh-TW: 私密金鑰路徑中有無法辨識的佔位符 %{placeholder}，匯入後請確認私密金鑰路徑。
  ja: 秘密鍵のパスに認識できないプレースホルダー %{placeholder} があります。インポート後に秘密鍵のパスを確認してください。
  ko: 개인 키 경로에 인식할 수 없는 자리 표시자 %{placeholder}이(가) 있습니다. 가져온 후 개인 키 경로를 확인하세요.
backup_ui.hint.multi_hop_jump:
  zh-CN: 来源中经多级跳板机连接（%{chain}），只导入了最后一跳作为跳板机，请检查那台跳板机自己的跳板设置。
  en: The source connects through several jump hosts (%{chain}). Only the last one was imported as the jump host; check that host’s own jump setting.
  zh-TW: 來源中經多層跳板機連線（%{chain}），只匯入了最後一跳作為跳板機，請檢查那台跳板機本身的跳板設定。
  ja: インポート元は複数の踏み台ホストを経由して接続しています（%{chain}）。最後のホストだけを踏み台ホストとしてインポートしたので、その踏み台ホスト自身の踏み台設定を確認してください。
  ko: 원본은 여러 단계의 점프 호스트를 거쳐 연결합니다(%{chain}). 마지막 호스트만 점프 호스트로 가져왔으니, 그 점프 호스트 자체의 점프 설정을 확인하세요.
backup_ui.hint.jump_not_found:
  zh-CN: “%{source}”中引用的跳板机不存在，导入后直连。
  en: The jump host referenced in “%{source}” doesn’t exist, so the host connects directly.
  zh-TW: 「%{source}」中參照的跳板機不存在，匯入後直接連線。
  ja: 「%{source}」で参照されている踏み台ホストが存在しないため、インポート後は直接接続します。
  ko: "'%{source}'에서 참조하는 점프 호스트가 없어 가져온 후 직접 연결합니다."
backup_ui.hint.jump_missing_username:
  zh-CN: 跳板机 %{name} 没有用户名，导入后请手动设置跳板机。
  en: Jump host %{name} has no user name. Set the jump host manually after importing.
  zh-TW: 跳板機 %{name} 沒有使用者名稱，匯入後請手動設定跳板機。
  ja: 踏み台ホスト %{name} にユーザー名がありません。インポート後に踏み台ホストを手動で設定してください。
  ko: 점프 호스트 %{name}에 사용자 이름이 없습니다. 가져온 후 점프 호스트를 직접 설정하세요.
backup_ui.hint.proxy_command_ignored:
  zh-CN: 同时配置了 ProxyJump 与 ProxyCommand，只导入了 ProxyJump。
  en: Both ProxyJump and ProxyCommand are configured; only ProxyJump was imported.
  zh-TW: 同時設定了 ProxyJump 與 ProxyCommand，只匯入了 ProxyJump。
  ja: ProxyJump と ProxyCommand の両方が設定されていたため、ProxyJump だけをインポートしました。
  ko: ProxyJump와 ProxyCommand가 모두 설정되어 있어 ProxyJump만 가져왔습니다.
backup_ui.hint.proxy_command_imported:
  zh-CN: 导入了代理命令，连接时会在本机执行。
  en: A proxy command was imported. It runs on this computer when connecting.
  zh-TW: 匯入了代理指令，連線時會在本機執行。
  ja: プロキシコマンドをインポートしました。接続時にこのコンピューターで実行されます。
  ko: 프록시 명령을 가져왔습니다. 연결할 때 이 컴퓨터에서 실행됩니다.
backup_ui.hint.proxy_port_defaulted:
  zh-CN: 来源中没有设置代理端口，按 %{port} 导入，请确认。
  en: The source has no proxy port, so %{port} was used. Check it.
  zh-TW: 來源中沒有設定代理連接埠，以 %{port} 匯入，請確認。
  ja: インポート元にプロキシのポートが設定されていないため、%{port} としてインポートしました。確認してください。
  ko: 원본에 프록시 포트가 설정되어 있지 않아 %{port}(으)로 가져왔습니다. 확인하세요.
backup_ui.hint.proxy_password_required:
  zh-CN: 代理需要密码，导入后请在主机的代理设置中填写。
  en: The proxy needs a password. Enter it in the host’s proxy settings after importing.
  zh-TW: 代理需要密碼，匯入後請在主機的代理設定中填寫。
  ja: プロキシにはパスワードが必要です。インポート後にホストのプロキシ設定で入力してください。
  ko: 프록시에 비밀번호가 필요합니다. 가져온 후 호스트의 프록시 설정에서 입력하세요.
backup_ui.hint.unsupported_proxy:
  zh-CN: “%{source}”中的代理类型不支持，导入后直连。
  en: The proxy type used in “%{source}” isn’t supported, so the host connects directly.
  zh-TW: 「%{source}」中的代理類型不受支援，匯入後直接連線。
  ja: 「%{source}」のプロキシの種類には対応していないため、インポート後は直接接続します。
  ko: "'%{source}'의 프록시 유형은 지원하지 않아 가져온 후 직접 연결합니다."
backup_ui.hint.gateway_for:
  zh-CN: 为“%{source}”会话“%{session}”的 SSH 网关新建的主机。
  en: Created for the SSH gateway of the “%{source}” session “%{session}”.
  zh-TW: 為「%{source}」工作階段「%{session}」的 SSH 閘道新增的主機。
  ja: 「%{source}」のセッション「%{session}」の SSH ゲートウェイ用に作成したホストです。
  ko: "'%{source}' 세션 '%{session}'의 SSH 게이트웨이용으로 만든 호스트입니다."
backup_ui.hint.forwards_not_imported:
  zh-CN: “%{source}”中的 %{count} 条端口转发没有导入。
  en: "%{count} port forwards in “%{source}” weren’t imported."
  zh-TW: 「%{source}」中的 %{count} 條連接埠轉送沒有匯入。
  ja: 「%{source}」のポート転送 %{count} 件はインポートされていません。
  ko: "'%{source}'의 포트 포워딩 %{count}개를 가져오지 않았습니다."
backup_ui.hint.agent_forward_disabled:
  zh-CN: 文件中开启了 agent 转发，导入后已关闭：开着时对方的服务器可以借用本机的 SSH agent 登录别的服务器。确实需要时在主机设置中打开。
  en: Agent forwarding was on in the file and has been turned off, since it lets the server use your local SSH agent to sign in elsewhere. Turn it back on in the host settings if you need it.
  zh-TW: 檔案中開啟了 agent 轉送，匯入後已關閉：開啟時對方的伺服器可以借用本機的 SSH agent 登入其他伺服器。確實需要時在主機設定中開啟。
  ja: ファイルではエージェント転送がオンになっていましたが、インポート時にオフにしました。オンのままだと、接続先のサーバーがこのコンピューターの SSH agent を使ってほかのサーバーにログインできてしまいます。本当に必要な場合はホストの設定でオンにしてください。
  ko: 파일에서는 에이전트 포워딩이 켜져 있었지만 가져올 때 껐습니다. 켜 두면 상대 서버가 이 컴퓨터의 SSH agent를 빌려 다른 서버에 로그인할 수 있습니다. 꼭 필요하면 호스트 설정에서 켜세요.
backup_ui.hint.unsupported_encoding:
  zh-CN: 来源中的编码 %{name} 不支持，导入后按 UTF-8，请在主机设置中确认编码。
  en: The encoding %{name} isn’t supported, so UTF-8 is used. Check the encoding in the host settings.
  zh-TW: 來源中的編碼 %{name} 不受支援，匯入後使用 UTF-8，請在主機設定中確認編碼。
  ja: インポート元のエンコード %{name} には対応していないため、UTF-8 としてインポートしました。ホストの設定でエンコードを確認してください。
  ko: 원본의 인코딩 %{name}은(는) 지원하지 않아 UTF-8로 가져왔습니다. 호스트 설정에서 인코딩을 확인하세요.
backup_ui.hint.proxy_not_imported:
  zh-CN: “%{source}”中的代理“%{name}”保存在它自己的代理列表中，没有导入，导入后直连。
  en: The proxy “%{name}” is kept in “%{source}”’s own proxy list and wasn’t imported, so the host connects directly.
  zh-TW: 「%{source}」中的代理「%{name}」儲存在它自己的代理清單中，沒有匯入，匯入後直接連線。
  ja: 「%{source}」のプロキシ「%{name}」は独自のプロキシ一覧に保存されているためインポートされず、インポート後は直接接続します。
  ko: "'%{source}'의 '%{name}' 프록시는 자체 프록시 목록에 저장되어 있어 가져오지 않았으며, 가져온 후 직접 연결합니다."
backup_ui.hint.jump_not_imported:
  zh-CN: “%{source}”中设置的跳板机没有导入，导入后直连，需要时请手动设置跳板机。
  en: The jump host set in “%{source}” wasn’t imported, so the host connects directly. Set a jump host manually if needed.
  zh-TW: 「%{source}」中設定的跳板機沒有匯入，匯入後直接連線，需要時請手動設定跳板機。
  ja: 「%{source}」で設定された踏み台ホストはインポートされていないため、インポート後は直接接続します。必要な場合は踏み台ホストを手動で設定してください。
  ko: "'%{source}'에 설정된 점프 호스트는 가져오지 않아 가져온 후 직접 연결합니다. 필요하면 점프 호스트를 직접 설정하세요."
backup_ui.hint.login_script_not_imported:
  zh-CN: “%{source}”中的登录脚本（等待提示后自动发送）没有导入。
  en: The login script in “%{source}” (wait for a prompt, then send) wasn’t imported.
  zh-TW: 「%{source}」中的登入指令碼（等待提示後自動傳送）沒有匯入。
  ja: 「%{source}」のログインスクリプト（プロンプトを待ってから自動送信）はインポートされていません。
  ko: "'%{source}'의 로그인 스크립트(프롬프트를 기다린 후 자동 전송)는 가져오지 않았습니다."
backup_ui.hint.serial_settings_unverified:
  zh-CN: 串口参数是按“%{source}”保存的编号换算的，导入后请核对波特率、数据位、校验、停止位与流控。
  en: The serial settings were converted from the numbers “%{source}” saves. Check the baud rate, data bits, parity, stop bits and flow control after importing.
  zh-TW: 序列埠參數是依「%{source}」儲存的編號換算的，匯入後請核對鮑率、資料位元、同位檢查、停止位元與流量控制。
  ja: シリアルポートのパラメーターは「%{source}」が保存している番号から換算したものです。インポート後にボーレート、データビット、パリティ、ストップビット、フロー制御を確認してください。
  ko: 직렬 포트 매개 변수는 '%{source}'에 저장된 번호를 변환한 것입니다. 가져온 후 보드 레이트, 데이터 비트, 패리티, 정지 비트, 흐름 제어를 확인하세요.
backup_ui.hint.saved_password_unreadable:
  zh-CN: “%{source}”中保存的密码没能解开（可能是用以前的主密码保存的），连接时再输入。
  en: The password saved in “%{source}” couldn’t be decrypted (it may have been saved with an earlier master password). Enter it when connecting.
  zh-TW: 「%{source}」中儲存的密碼未能解開（可能是用先前的主密碼儲存的），連線時再輸入。
  ja: 「%{source}」に保存されたパスワードを復号できませんでした（以前のマスターパスワードで保存された可能性があります）。接続時に入力してください。
  ko: "'%{source}'에 저장된 비밀번호를 열지 못했습니다(이전 마스터 비밀번호로 저장되었을 수 있습니다). 연결할 때 입력하세요."
backup_ui.hint.saved_password_encrypted:
  zh-CN: “%{source}”导出时没能解开这台主机的密码（文件中是密文），没有导入，连接时再输入。
  en: “%{source}” couldn’t decrypt this host’s password when exporting (the file has it encrypted), so it wasn’t imported. Enter it when connecting.
  zh-TW: 「%{source}」匯出時未能解開這台主機的密碼（檔案中是密文），沒有匯入，連線時再輸入。
  ja: 「%{source}」がエクスポート時にこのホストのパスワードを復号できなかったため（ファイルには暗号化されたまま入っています）、インポートしていません。接続時に入力してください。
  ko: "'%{source}'에서 내보낼 때 이 호스트의 비밀번호를 열지 못해(파일에는 암호화된 채로 들어 있음) 가져오지 않았습니다. 연결할 때 입력하세요."
backup_ui.hint.credential_profile_missing:
  zh-CN: “%{source}”中这台主机用凭据档案登录，文件中没有这个档案（“导出全部数据”的文件中才有），导入后请设置登录方式。
  en: This host signs in with a credential profile in “%{source}”, but the file doesn’t include it (only an “export all data” file does). Set how it signs in after importing.
  zh-TW: 「%{source}」中這台主機用認證資訊設定檔登入，檔案中沒有這個設定檔（「匯出全部資料」的檔案中才有），匯入後請設定登入方式。
  ja: 「%{source}」ではこのホストは認証プロファイルでログインしますが、ファイルにそのプロファイルが含まれていません（「全データのエクスポート」のファイルにだけ含まれます）。インポート後にログイン方法を設定してください。
  ko: "'%{source}'에서 이 호스트는 자격 증명 프로필로 로그인하지만 파일에 그 프로필이 없습니다('모든 데이터 내보내기' 파일에만 들어 있음). 가져온 후 로그인 방식을 설정하세요."
backup_ui.hint.jump_host_for:
  zh-CN: 为“%{source}”中“%{session}”的跳板机新建的主机。
  en: A new host created for the jump host of “%{session}” in “%{source}”.
  zh-TW: 為「%{source}」中「%{session}」的跳板機新增的主機。
  ja: 「%{source}」の「%{session}」の踏み台ホストとして新しく作成したホストです。
  ko: "'%{source}'에 있는 '%{session}'의 점프 호스트로 새로 만든 호스트입니다."

backup_ui.import.title:
  zh-CN: 导入主机
  en: Import Hosts
  zh-TW: 匯入主機
  ja: ホストをインポート
  ko: 호스트 가져오기
backup_ui.import.title_snippets:
  zh-CN: 导入快捷命令
  en: Import Snippets
  zh-TW: 匯入快速指令
  ja: スニペットをインポート
  ko: 스니펫 가져오기
backup_ui.import.hint:
  zh-CN: 只导入主机信息（名称、地址、端口、用户名、分组、私钥路径、代理），不导入密码（Termora、WindTerm 除外；Electerm、Netcatty 的密码要勾选“导入保存的密码”）。导入后，用密码登录的主机需要编辑补填密码。
  en: Only host information is imported (name, address, port, user name, group, key path, proxy), not passwords (except from Termora and WindTerm; for Electerm and Netcatty, tick “Import saved passwords”). Edit password-based hosts afterwards to fill in their passwords.
  zh-TW: 只匯入主機資訊（名稱、位址、連接埠、使用者名稱、群組、私密金鑰路徑、代理），不匯入密碼（Termora、WindTerm 除外；Electerm、Netcatty 的密碼要勾選「匯入儲存的密碼」）。匯入後，以密碼登入的主機需要編輯補填密碼。
  ja: インポートするのはホストの情報（名前、アドレス、ポート、ユーザー名、グループ、秘密鍵のパス、プロキシ）だけで、パスワードはインポートしません（Termora、WindTerm を除く。Electerm、Netcatty のパスワードは「保存されたパスワードをインポート」をオンにした場合だけインポートします）。インポート後、パスワードでログインするホストは編集してパスワードを入力してください。
  ko: 호스트 정보(이름, 주소, 포트, 사용자 이름, 그룹, 개인 키 경로, 프록시)만 가져오고 비밀번호는 가져오지 않습니다(Termora, WindTerm 제외. Electerm, Netcatty의 비밀번호는 '저장된 비밀번호 가져오기'를 켠 경우에만 가져옴). 가져온 후 비밀번호로 로그인하는 호스트는 편집해서 비밀번호를 입력하세요.
backup_ui.import.hint_snippets:
  zh-CN: 导入其他程序导出的快捷命令：分组、名称与内容按 Termlet 的写法转换，转换时丢掉或改动的内容在预览中列出。与已有快捷命令的名称、内容都相同的不重复导入。
  en: Imports snippets exported from another program. Groups, names and contents are converted to Termlet’s format, and anything dropped or changed is listed in the preview. Snippets with the same name and content as existing ones aren’t imported again.
  zh-TW: 匯入其他程式匯出的快速指令：群組、名稱與內容依 Termlet 的寫法轉換，轉換時捨棄或改動的內容會在預覽中列出。與現有快速指令名稱、內容都相同的不會重複匯入。
  ja: ほかのプログラムからエクスポートしたスニペットをインポートします。グループ、名前、内容は Termlet の形式に変換され、変換で失われる内容や変更される内容はプレビューに表示されます。既存のスニペットと名前、内容が同じものは重複してインポートしません。
  ko: 다른 프로그램에서 내보낸 스니펫을 가져옵니다. 그룹, 이름, 내용은 Termlet 형식으로 변환되며, 변환 중에 빠지거나 바뀌는 내용은 미리 보기에 표시됩니다. 기존 스니펫과 이름, 내용이 모두 같은 것은 다시 가져오지 않습니다.
backup_ui.import.hint_hostfile:
  zh-CN: 导入另一台电脑或其他人的 Termlet 导出的主机。导入的主机不允许 AI 工具与脚本使用，需要时在主机设置中勾选；预览中标出了连接时在本机执行的代理命令、登录后在服务器上执行的命令与随主机导入的端口转发（导入的转发不会自动启动），导入前请确认来源可信。
  en: Import hosts exported from Termlet on another computer or by someone else. Imported hosts can’t be used by AI tools and scripts; enable it in the host settings if needed. The preview marks proxy commands (run on this computer when connecting), startup commands (run on the server after login) and port forwards imported with the hosts (they aren’t started automatically). Make sure the file comes from a trusted source.
  zh-TW: 匯入另一台電腦或其他人的 Termlet 匯出的主機。匯入的主機不允許 AI 工具與指令碼使用，需要時在主機設定中勾選；預覽中標出了連線時在本機執行的代理指令、登入後在伺服器上執行的指令與隨主機匯入的連接埠轉送（匯入的轉送不會自動啟動），匯入前請確認來源可信。
  ja: 別のコンピューターやほかの人の Termlet からエクスポートしたホストをインポートします。インポートしたホストは AI ツールやスクリプトから使用できません。必要な場合はホストの設定でオンにしてください。プレビューには、接続時にこのコンピューターで実行されるプロキシコマンド、ログイン後にサーバーで実行されるコマンド、ホストと一緒にインポートされるポート転送（インポートしたポート転送は自動では開始されません）が示されます。インポートする前に、ファイルの入手元が信頼できることを確認してください。
  ko: 다른 컴퓨터나 다른 사람의 Termlet에서 내보낸 호스트를 가져옵니다. 가져온 호스트는 AI 도구와 스크립트가 사용할 수 없으며, 필요하면 호스트 설정에서 켜세요. 미리 보기에는 연결할 때 이 컴퓨터에서 실행되는 프록시 명령, 로그인 후 서버에서 실행되는 명령, 호스트와 함께 가져오는 포트 포워딩(가져온 포트 포워딩은 자동으로 시작되지 않음)이 표시됩니다. 가져오기 전에 파일 출처를 신뢰할 수 있는지 확인하세요.
backup_ui.import.source.hostfile:
  zh-CN: Termlet 主机文件（.termlet-hosts）
  en: Termlet host file (.termlet-hosts)
  zh-TW: Termlet 主機檔案（.termlet-hosts）
  ja: Termlet ホストファイル（.termlet-hosts）
  ko: Termlet 호스트 파일(.termlet-hosts)
backup_ui.import.source.ssh_config:
  zh-CN: OpenSSH 配置（~/.ssh/config）
  en: OpenSSH config (~/.ssh/config)
  zh-TW: OpenSSH 設定（~/.ssh/config）
  ja: OpenSSH の設定（~/.ssh/config）
  ko: OpenSSH 구성(~/.ssh/config)
backup_ui.import.source.xshell:
  zh-CN: Xshell 会话目录（Sessions）
  en: Xshell sessions folder (Sessions)
  zh-TW: Xshell 工作階段目錄（Sessions）
  ja: Xshell のセッションフォルダー（Sessions）
  ko: Xshell 세션 폴더(Sessions)
backup_ui.import.source.finalshell:
  zh-CN: FinalShell 连接目录（conn）
  en: FinalShell connections folder (conn)
  zh-TW: FinalShell 連線目錄（conn）
  ja: FinalShell の接続フォルダー（conn）
  ko: FinalShell 연결 폴더(conn)
backup_ui.import.source.mobaxterm:
  zh-CN: MobaXterm 书签（MobaXterm.ini 或 .mxtsessions）
  en: MobaXterm bookmarks (MobaXterm.ini or .mxtsessions)
  zh-TW: MobaXterm 書籤（MobaXterm.ini 或 .mxtsessions）
  ja: MobaXterm のブックマーク（MobaXterm.ini または .mxtsessions）
  ko: MobaXterm 북마크(MobaXterm.ini 또는 .mxtsessions)
backup_ui.import.source.tabby:
  zh-CN: Tabby 配置（config.yaml）
  en: Tabby config (config.yaml)
  zh-TW: Tabby 設定（config.yaml）
  ja: Tabby の設定（config.yaml）
  ko: Tabby 구성(config.yaml)
backup_ui.import.source.termora:
  zh-CN: Termora 数据目录（.termora）
  en: Termora data folder (.termora)
  zh-TW: Termora 資料目錄（.termora）
