backup_ui.page.full_title:
  zh-CN: 完整备份
  en: Full Backup
  zh-TW: 完整備份
  ja: 完全バックアップ
  ko: 전체 백업
backup_ui.page.full_description:
  zh-CN: 完整备份把主机、分组、凭据、密钥、凭据档案、快捷命令、端口转发、工作区、终端配色、设置、主机指纹与命令历史导出为一个用密码加密的文件，可在另一台电脑上恢复（换机或重装后迁移）。
  en: A full backup exports hosts, groups, credentials, keys, credential profiles, snippets, port forwards, workspaces, color schemes, settings, host keys and command history into one password-encrypted file that can be restored on another computer (when moving or reinstalling).
  zh-TW: 完整備份把主機、群組、認證資訊、金鑰、認證資訊設定檔、快速指令、連接埠轉送、工作區、終端機配色、設定、主機指紋與指令歷史記錄匯出為一個用密碼加密的檔案，可在另一台電腦上還原（換電腦或重新安裝後移轉）。
  ja: 完全バックアップでは、ホスト、グループ、認証情報、鍵、認証プロファイル、スニペット、ポート転送、ワークスペース、ターミナルの配色、設定、ホストキー、コマンド履歴を、パスワードで暗号化した 1 つのファイルにエクスポートします。別のコンピューターで復元できます（コンピューターの買い替えや再インストール後の移行に）。
  ko: 전체 백업은 호스트, 그룹, 자격 증명, 키, 자격 증명 프로필, 스니펫, 포트 포워딩, 작업 영역, 터미널 색 구성표, 설정, 호스트 키, 명령 기록을 비밀번호로 암호화한 하나의 파일로 내보냅니다. 다른 컴퓨터에서 복원할 수 있습니다(컴퓨터를 바꾸거나 다시 설치한 후 옮길 때).
