  en: "With pauses (\\p): %{count}. Termlet has no pauses, so they were removed and the text is sent without waiting."
  zh-TW: "%{count} 條含暫停（\\p）：Termlet 沒有暫停，已移除，匯入後連續傳送。"
  ja: "%{count} 件に一時停止（\\p）があります。Termlet には一時停止がないため削除し、待たずに続けて送信します。"
  ko: "%{count}개에 일시 정지(\\p)가 있습니다. Termlet에는 일시 정지가 없으므로 제거되며, 기다리지 않고 이어서 보냅니다."
