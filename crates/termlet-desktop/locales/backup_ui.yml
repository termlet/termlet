  en: Without it, the audit log already on the target computer is kept when restoring.
  zh-TW: 不含時，還原後保留目標電腦上原有的稽核記錄。
  ja: 含めない場合、復元後も復元先のコンピューターにある監査ログはそのまま残ります。
  ko: 포함하지 않으면 복원한 후에도 대상 컴퓨터에 있던 감사 로그가 그대로 유지됩니다.
backup_ui.page.password_hint:
  zh-CN: 恢复时需要输入这个密码，忘记后无法解开备份，请牢记。
  en: You’ll need this password to restore. The backup can’t be opened without it.
  zh-TW: 還原時需要輸入這個密碼，忘記後無法解開備份，請牢記。
