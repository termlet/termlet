backup_ui.schedule.folder_placeholder:
  zh-CN: 选择或填写文件夹的完整路径
  en: Choose a folder or enter its full path
  zh-TW: 選擇或填寫資料夾的完整路徑
  ja: フォルダーを選択するか、完全なパスを入力
  ko: 폴더를 선택하거나 전체 경로 입력
backup_ui.schedule.folder_hint:
  zh-CN: 备份的文件名为 termlet-auto-日期-时间.termlet-backup；清理旧备份时只删这样的文件，手动保存的备份与其他文件都不动。
  en: Backups are named termlet-auto-date-time.termlet-backup; only such files are removed when old backups are cleaned up, never manual backups or other files.
  zh-TW: 備份的檔名為 termlet-auto-日期-時間.termlet-backup；清除舊備份時只刪除這樣的檔案，手動儲存的備份與其他檔案都不動。
  ja: バックアップのファイル名は termlet-auto-日付-時刻.termlet-backup です。古いバックアップを整理するときはこの名前のファイルだけを削除し、手動で保存したバックアップやほかのファイルには触れません。
  ko: 백업 파일 이름은 termlet-auto-날짜-시간.termlet-backup입니다. 오래된 백업을 정리할 때는 이런 이름의 파일만 삭제하며, 수동으로 저장한 백업이나 다른 파일은 건드리지 않습니다.
