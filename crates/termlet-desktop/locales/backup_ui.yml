backup_ui.import.source_hint.xshell:
  zh-CN: 选择 Xshell 的会话目录 Sessions（在 Xshell 的“工具 → 选项 → 常规”中可以看到会话的保存位置）。导入 SSH、Telnet 与串口会话，会话所在的子目录成为分组，编码、备注与端口转发一并导入（转发不会自动启动）；Xshell 自己加密的密码、用户密钥库中的私钥与代理不导入。
  en: Choose Xshell’s Sessions folder (Xshell shows where sessions are stored in Tools → Options → General). SSH, Telnet and serial sessions are imported; subfolders become groups, and encodings, descriptions and port forwards are kept (forwards aren’t started automatically). Passwords encrypted by Xshell, keys in its user key store and proxies aren’t imported.
  zh-TW: 選擇 Xshell 的工作階段目錄 Sessions（在 Xshell 的「工具 → 選項 → 一般」中可以看到工作階段的儲存位置）。匯入 SSH、Telnet 與序列埠工作階段，工作階段所在的子目錄成為群組，編碼、備註與連接埠轉送一併匯入（轉送不會自動啟動）；Xshell 自己加密的密碼、使用者金鑰庫中的私密金鑰與代理不匯入。
  ja: Xshell のセッションフォルダー Sessions を選択してください（セッションの保存場所は Xshell の「ツール → オプション → 全般」で確認できます）。SSH、Telnet、シリアルポートのセッションをインポートし、セッションがあるサブフォルダーはグループになります。エンコード、説明、ポート転送も一緒にインポートします（ポート転送は自動では開始されません）。Xshell が独自に暗号化したパスワード、ユーザーキーストアの秘密鍵、プロキシはインポートしません。
  ko: Xshell의 세션 폴더 Sessions를 선택하세요(세션 저장 위치는 Xshell의 '도구 → 옵션 → 일반'에서 확인할 수 있습니다). SSH, Telnet, 직렬 포트 세션을 가져오며, 세션이 있는 하위 폴더는 그룹이 되고 인코딩, 설명, 포트 포워딩도 함께 가져옵니다(포트 포워딩은 자동으로 시작되지 않음). Xshell이 자체적으로 암호화한 비밀번호, 사용자 키 저장소의 개인 키, 프록시는 가져오지 않습니다.
backup_ui.import.source_hint.mobaxterm:
  zh-CN: '便携版请选择程序目录下的 MobaXterm.ini；安装版的书签可能保存在注册表中，路径为 HKEY_CURRENT_USER\Software\Mobatek\MobaXterm。导入 SSH、Telnet 与串口会话，SSH 网关作为跳板机导入，编码与登录后执行的命令一并导入。'
  en: 'For the portable edition, choose MobaXterm.ini in its program folder. The installer edition may keep bookmarks in the registry at HKEY_CURRENT_USER\Software\Mobatek\MobaXterm. SSH, Telnet and serial sessions are imported; SSH gateways become jump hosts, and encodings and commands run after login are kept.'
  zh-TW: '可攜版請選擇程式目錄下的 MobaXterm.ini；安裝版的書籤可能儲存在登錄檔中，路徑為 HKEY_CURRENT_USER\Software\Mobatek\MobaXterm。匯入 SSH、Telnet 與序列埠工作階段，SSH 閘道作為跳板機匯入，編碼與登入後執行的指令一併匯入。'
  ja: 'ポータブル版の場合はプログラムフォルダーにある MobaXterm.ini を選択してください。インストール版のブックマークはレジストリの HKEY_CURRENT_USER\Software\Mobatek\MobaXterm に保存されている場合があります。SSH、Telnet、シリアルポートのセッションをインポートし、SSH ゲートウェイは踏み台ホストとしてインポートします。エンコードとログイン後に実行するコマンドも一緒にインポートします。'
  ko: '포터블 버전은 프로그램 폴더의 MobaXterm.ini를 선택하세요. 설치 버전의 북마크는 레지스트리의 HKEY_CURRENT_USER\Software\Mobatek\MobaXterm에 저장되어 있을 수 있습니다. SSH, Telnet, 직렬 포트 세션을 가져오며, SSH 게이트웨이는 점프 호스트로 가져오고 인코딩과 로그인 후 실행할 명령도 함께 가져옵니다.'
backup_ui.import.source_hint.tabby:
  zh-CN: '便携版的配置在程序目录下的 data\config.yaml。在 Tabby 中开启了配置加密时，需要先关闭加密。'
  en: 'The portable edition keeps its config in data\config.yaml under the program folder. If config encryption is on in Tabby, turn it off first.'
  zh-TW: '可攜版的設定在程式目錄下的 data\config.yaml。在 Tabby 中開啟了設定加密時，需要先關閉加密。'
  ja: 'ポータブル版の設定はプログラムフォルダーの data\config.yaml にあります。Tabby で設定の暗号化をオンにしている場合は、先に暗号化をオフにしてください。'
  ko: '포터블 버전의 구성은 프로그램 폴더의 data\config.yaml에 있습니다. Tabby에서 구성 암호화를 켠 경우 먼저 암호화를 끄세요.'
backup_ui.import.source_hint.termora:
  zh-CN: '支持 Termora 2.x：选择数据目录（默认是用户目录下的 .termora，绿色版为程序目录下的 data）或其中的 config\termora.db。只导入 SSH 主机，文件夹成为分组，备注、标签、登录密码、代理密码一并导入，钥匙管理器中的私钥存入密钥库。Termora 的数据只用保存在同一文件中的密钥加密，本机任何程序都能读出其中的密码。'
  en: 'Supports Termora 2.x: choose its data folder (by default .termora in your home folder; data under the program folder for the portable edition) or config\termora.db inside it. Only SSH hosts are imported; folders become groups, and notes, tags, login passwords and proxy passwords are kept; private keys from the Termora key manager go to the key library. Termora encrypts its data with a key stored in the same file, so any program on this computer can read the passwords in it.'
  zh-TW: '支援 Termora 2.x：選擇資料目錄（預設是使用者目錄下的 .termora，免安裝版為程式目錄下的 data）或其中的 config\termora.db。只匯入 SSH 主機，資料夾成為群組，備註、標籤、登入密碼、代理密碼一併匯入，金鑰管理員中的私密金鑰存入金鑰庫。Termora 的資料只用儲存在同一檔案中的金鑰加密，本機任何程式都能讀出其中的密碼。'
  ja: 'Termora 2.x に対応しています。データフォルダー（デフォルトはユーザーフォルダーの .termora、ポータブル版はプログラムフォルダーの data）またはその中の config\termora.db を選択してください。SSH ホストだけをインポートし、フォルダーはグループになります。メモ、タグ、ログインパスワード、プロキシのパスワードも一緒にインポートし、キーマネージャーの秘密鍵は鍵ライブラリに保存します。Termora のデータは同じファイルに保存された鍵だけで暗号化されているため、このコンピューター上のどのプログラムでもパスワードを読み出せます。'
  ko: 'Termora 2.x를 지원합니다. 데이터 폴더(기본값은 사용자 폴더의 .termora, 포터블 버전은 프로그램 폴더의 data)나 그 안의 config\termora.db를 선택하세요. SSH 호스트만 가져오며, 폴더는 그룹이 되고 메모, 태그, 로그인 비밀번호, 프록시 비밀번호도 함께 가져옵니다. 키 관리자의 개인 키는 키 라이브러리에 저장합니다. Termora의 데이터는 같은 파일에 저장된 키로만 암호화되어 있어, 이 컴퓨터의 어떤 프로그램이든 그 안의 비밀번호를 읽을 수 있습니다.'
backup_ui.import.source_hint.windterm:
  zh-CN: '选择 WindTerm 的程序目录或数据目录 .wind（用户目录下，或程序目录下），也可以选其中的 profiles\default.v10。导入 SSH、Telnet 与串口会话，分组、备注、编码、私钥文件、登录后执行的命令、登录密码与快捷命令一并导入；设了主密码时需要输入主密码。代理、跳板机与隧道不导入。'
  en: 'Choose WindTerm’s program folder or its .wind data folder (in your home folder or the program folder), or profiles\default.v10 inside it. SSH, Telnet and serial sessions are imported with their groups, descriptions, encodings, key files, startup commands and saved passwords, along with quick commands. If WindTerm has a master password, you’ll be asked for it. Proxies, jump hosts and tunnels aren’t imported.'
  zh-TW: '選擇 WindTerm 的程式目錄或資料目錄 .wind（使用者目錄下，或程式目錄下），也可以選其中的 profiles\default.v10。匯入 SSH、Telnet 與序列埠工作階段，群組、備註、編碼、私密金鑰檔案、登入後執行的指令、登入密碼與快速指令一併匯入；設了主密碼時需要輸入主密碼。代理、跳板機與通道不匯入。'
  ja: 'WindTerm のプログラムフォルダーまたはデータフォルダー .wind（ユーザーフォルダーまたはプログラムフォルダーにあります）を選択してください。その中の profiles\default.v10 も選択できます。SSH、Telnet、シリアルポートのセッションをインポートし、グループ、説明、エンコード、秘密鍵ファイル、ログイン後に実行するコマンド、ログインパスワード、スニペットも一緒にインポートします。マスターパスワードが設定されている場合は入力が必要です。プロキシ、踏み台ホスト、トンネルはインポートしません。'
  ko: 'WindTerm 프로그램 폴더나 데이터 폴더 .wind(사용자 폴더 또는 프로그램 폴더에 있음)를 선택하세요. 그 안의 profiles\default.v10도 선택할 수 있습니다. SSH, Telnet, 직렬 포트 세션을 가져오며 그룹, 설명, 인코딩, 개인 키 파일, 로그인 후 실행할 명령, 로그인 비밀번호와 스니펫도 함께 가져옵니다. 마스터 비밀번호가 설정되어 있으면 입력해야 합니다. 프록시, 점프 호스트, 터널은 가져오지 않습니다.'
backup_ui.import.source_hint.electerm:
  zh-CN: 选择在 Electerm 中导出的书签文件（bookmarks-….json；“导出全部数据”的文件还带凭据档案）。Electerm 3.0 起本机的书签用系统加密保存，Termlet 读不了，请先导出；更早的版本也可以直接选它的数据目录（electerm\users\default_user）。导入 SSH、Telnet 与串口书签，分组、跳板机（写在书签里的跳板机会新建主机）、代理、私钥、端口转发、起始目录与登录脚本一并导入。
  en: Choose a bookmark file exported from Electerm (bookmarks-….json; an “export all data” file also has the credential profiles). Since 3.0, Electerm stores bookmarks on this computer with the system’s encryption, which Termlet can’t read, so export them first; for earlier versions you can also choose the data folder (electerm\users\default_user). SSH, Telnet and serial bookmarks are imported with their groups, jump hosts (new hosts are created for jump hosts written inside bookmarks), proxies, private keys, port forwards, start folders and login scripts.
  zh-TW: 選擇在 Electerm 中匯出的書籤檔案（bookmarks-….json；「匯出全部資料」的檔案還帶有認證資訊設定檔）。Electerm 3.0 起本機的書籤用系統加密儲存，Termlet 讀不了，請先匯出；更早的版本也可以直接選它的資料目錄（electerm\users\default_user）。匯入 SSH、Telnet 與序列埠書籤，群組、跳板機（寫在書籤裡的跳板機會新增主機）、代理、私密金鑰、連接埠轉送、起始目錄與登入指令碼一併匯入。
  ja: Electerm でエクスポートしたブックマークファイル（bookmarks-….json。「全データのエクスポート」のファイルには認証プロファイルも含まれます）を選択してください。Electerm 3.0 以降はこのコンピューター上のブックマークをシステムの暗号化で保存しており、Termlet では読み取れないため、先にエクスポートしてください。それより前のバージョンでは、データフォルダー（electerm\users\default_user）を直接選択することもできます。SSH、Telnet、シリアルポートのブックマークをインポートし、グループ、踏み台ホスト（ブックマーク内に書かれた踏み台ホストは新しいホストとして作成します）、プロキシ、秘密鍵、ポート転送、開始フォルダー、ログインスクリプトも一緒にインポートします。
  ko: Electerm에서 내보낸 북마크 파일(bookmarks-….json. '모든 데이터 내보내기' 파일에는 자격 증명 프로필도 들어 있음)을 선택하세요. Electerm 3.0부터는 이 컴퓨터의 북마크를 시스템 암호화로 저장해 Termlet에서 읽을 수 없으므로 먼저 내보내세요. 그 이전 버전은 데이터 폴더(electerm\users\default_user)를 직접 선택할 수도 있습니다. SSH, Telnet, 직렬 포트 북마크를 가져오며 그룹, 점프 호스트(북마크 안에 적힌 점프 호스트는 새 호스트로 만듦), 프록시, 개인 키, 포트 포워딩, 시작 폴더, 로그인 스크립트도 함께 가져옵니다.
backup_ui.import.source_hint.netcatty:
  zh-CN: 在 Netcatty 的主机页点“导出”，再选择导出的 CSV 文件（hosts_export_….csv）。Netcatty 本机的数据用系统加密保存，只能读导出的文件。导入 SSH 与 Telnet 主机，分组、标签、备注、私钥文件路径、代理与跳板机一并导入；Netcatty 密钥库中的私钥、身份与端口转发不在导出的文件中。
  en: Click “Export” on Netcatty’s hosts page, then choose the exported CSV file (hosts_export_….csv). Netcatty stores its data on this computer with the system’s encryption, so only the export can be read. SSH and Telnet hosts are imported with their groups, tags, notes, key file paths, proxies and jump hosts; keys in Netcatty’s key library, identities and port forwards aren’t in the export.
  zh-TW: 在 Netcatty 的主機頁點「匯出」，再選擇匯出的 CSV 檔案（hosts_export_….csv）。Netcatty 本機的資料用系統加密儲存，只能讀匯出的檔案。匯入 SSH 與 Telnet 主機，群組、標籤、備註、私密金鑰檔案路徑、代理與跳板機一併匯入；Netcatty 金鑰庫中的私密金鑰、身分與連接埠轉送不在匯出的檔案中。
  ja: Netcatty のホストページで「エクスポート」をクリックし、エクスポートした CSV ファイル（hosts_export_….csv）を選択してください。Netcatty はこのコンピューター上のデータをシステムの暗号化で保存しているため、読み取れるのはエクスポートしたファイルだけです。SSH と Telnet のホストをインポートし、グループ、タグ、メモ、秘密鍵ファイルのパス、プロキシ、踏み台ホストも一緒にインポートします。Netcatty の鍵ライブラリにある秘密鍵、ID、ポート転送はエクスポートしたファイルに含まれません。
  ko: Netcatty의 호스트 페이지에서 '내보내기'를 클릭한 다음 내보낸 CSV 파일(hosts_export_….csv)을 선택하세요. Netcatty는 이 컴퓨터의 데이터를 시스템 암호화로 저장하므로 내보낸 파일만 읽을 수 있습니다. SSH와 Telnet 호스트를 가져오며 그룹, 태그, 메모, 개인 키 파일 경로, 프록시, 점프 호스트도 함께 가져옵니다. Netcatty 키 라이브러리의 개인 키, ID, 포트 포워딩은 내보낸 파일에 들어 있지 않습니다.
backup_ui.import.source_hint.nyaterm:
  zh-CN: 在 NyaTerm 的快捷命令面板右上角点“导出快捷命令”，再选择导出的 JSON 文件（nyaterm-quick-commands.json，默认保存在 NyaTerm 的配置目录 ~/.nyaterm 中）。NyaTerm 不导出主机，这里只导入快捷命令与它们的分类。
  en: In NyaTerm, click “Export Commands” at the top right of the Quick Commands panel, then choose the exported JSON file (nyaterm-quick-commands.json, saved in NyaTerm’s config folder ~/.nyaterm by default). NyaTerm doesn’t export hosts, so only the quick commands and their categories are imported.
  zh-TW: 在 NyaTerm 的快捷命令面板右上角按一下「匯出快捷命令」，再選擇匯出的 JSON 檔案（nyaterm-quick-commands.json，預設儲存在 NyaTerm 的設定目錄 ~/.nyaterm 中）。NyaTerm 不匯出主機，這裡只匯入快捷命令與它們的分類。
  ja: NyaTerm のクイックコマンドパネル右上の「コマンドをエクスポート」をクリックし、エクスポートした JSON ファイル（nyaterm-quick-commands.json。既定では NyaTerm の設定フォルダー ~/.nyaterm に保存されます）を選択してください。NyaTerm はホストをエクスポートしないため、クイックコマンドとそのカテゴリだけをインポートします。
  ko: NyaTerm의 빠른 명령 패널 오른쪽 위에서 '명령 내보내기'를 클릭한 후 내보낸 JSON 파일(nyaterm-quick-commands.json, 기본적으로 NyaTerm 설정 폴더 ~/.nyaterm에 저장됨)을 선택하세요. NyaTerm은 호스트를 내보내지 않으므로 빠른 명령과 그 범주만 가져옵니다.
