  zh-CN: "%{count} 条的变量有下拉选项：Termlet 没有下拉选项，只保留第一个作为默认值。"
  en: "With variables that have a list of options: %{count}. Termlet has no option lists, so only the first option is kept, as the default value."
  zh-TW: "%{count} 條的變數有下拉選項：Termlet 沒有下拉選項，只保留第一個作為預設值。"
  ja: "%{count} 件の変数に選択肢があります。Termlet には選択肢がないため、最初の選択肢だけを既定値として残します。"
  ko: "%{count}개의 변수에 선택 목록이 있습니다. Termlet에는 선택 목록이 없으므로 첫 번째 항목만 기본값으로 남깁니다."
backup_ui.import.snippet_note.unknown_params:
