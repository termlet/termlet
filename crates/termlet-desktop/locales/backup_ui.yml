backup_ui.schedule.title:
  zh-CN: 定时备份
  en: Scheduled Backups
  zh-TW: 定時備份
  ja: 定期バックアップ
  ko: 예약 백업
backup_ui.schedule.description:
  zh-CN: 按计划自动创建完整备份，存到指定的文件夹（可以是网盘的同步目录），保留最近几份。Termlet 运行时到点备份；到点时没有运行的，下次启动后补做一次。
  en: Creates full backups automatically on a schedule and keeps the latest few in a folder you choose (which can be a cloud drive's synced folder). Backups run on time while Termlet is running; a missed one is made once after the next start.
  zh-TW: 依排程自動建立完整備份，存到指定的資料夾（可以是雲端硬碟的同步目錄），保留最近幾份。Termlet 執行時到點備份；到點時沒有執行的，下次啟動後補做一次。
  ja: スケジュールに従って完全バックアップを自動で作成し、指定したフォルダー（クラウドストレージの同期フォルダーでも可）に保存して、最新のいくつかを保持します。Termlet の実行中は予定の時刻にバックアップし、その時刻に実行していなかった場合は次回の起動後に一度だけ実行します。
  ko: 일정에 따라 전체 백업을 자동으로 만들어 지정한 폴더(클라우드 드라이브의 동기화 폴더도 가능)에 저장하고 최근 몇 개를 보관합니다. Termlet이 실행 중이면 예정된 시간에 백업하고, 그 시간에 실행 중이 아니었다면 다음에 시작한 후 한 번 백업합니다.
backup_ui.schedule.setup:
  zh-CN: 设置定时备份…
  en: Set Up Scheduled Backups…
  zh-TW: 設定定時備份…
  ja: 定期バックアップを設定…
  ko: 예약 백업 설정…
