backup_ui.export.title:
  zh-CN: 导出主机
  en: Export Hosts
  zh-TW: 匯出主機
  ja: ホストをエクスポート
  ko: 호스트 내보내기
backup_ui.export.hint.termlet:
  zh-CN: 导出为 Termlet 的主机文件，可在另一台电脑或其他人的 Termlet 中导入。用到的跳板机、凭据档案、密钥库中的密钥、分组默认值会一并导出。
  en: Export as a Termlet host file that can be imported into Termlet on another computer or by someone else. Jump hosts, credential profiles, library keys and group defaults that the hosts use are exported with them.
  zh-TW: 匯出為 Termlet 的主機檔案，可在另一台電腦或其他人的 Termlet 中匯入。用到的跳板機、認證資訊設定檔、金鑰庫中的金鑰、群組預設值會一併匯出。
  ja: Termlet のホストファイルとしてエクスポートします。別のコンピューターやほかの人の Termlet でインポートできます。使用している踏み台ホスト、認証プロファイル、鍵ライブラリの鍵、グループのデフォルト値も一緒にエクスポートされます。
  ko: Termlet 호스트 파일로 내보냅니다. 다른 컴퓨터나 다른 사람의 Termlet에서 가져올 수 있습니다. 사용하는 점프 호스트, 자격 증명 프로필, 키 라이브러리의 키, 그룹 기본값도 함께 내보냅니다.
backup_ui.export.hint.ssh_config:
  zh-CN: 导出为 OpenSSH 的配置文件（ssh_config），只含 SSH 主机的地址、端口、用户名、私钥文件、跳板机与端口转发，不含密码；Telnet、串口主机不导出。
  en: Export as an OpenSSH config file (ssh_config) with the address, port, user name, key file, jump host and port forwards of SSH hosts. Passwords aren’t included, and Telnet and serial hosts are skipped.
  zh-TW: 匯出為 OpenSSH 的設定檔（ssh_config），只含 SSH 主機的位址、連接埠、使用者名稱、私密金鑰檔案、跳板機與連接埠轉送，不含密碼；Telnet、序列埠主機不匯出。
  ja: OpenSSH の設定ファイル（ssh_config）としてエクスポートします。含まれるのは SSH ホストのアドレス、ポート、ユーザー名、秘密鍵ファイル、踏み台ホスト、ポート転送だけで、パスワードは含みません。Telnet、シリアルポートのホストはエクスポートされません。
  ko: OpenSSH 구성 파일(ssh_config)로 내보냅니다. SSH 호스트의 주소, 포트, 사용자 이름, 개인 키 파일, 점프 호스트, 포트 포워딩만 포함하며 비밀번호는 포함하지 않습니다. Telnet, 직렬 포트 호스트는 내보내지 않습니다.
backup_ui.export.format.termlet:
  zh-CN: Termlet 主机文件
  en: Termlet host file
  zh-TW: Termlet 主機檔案
  ja: Termlet ホストファイル
  ko: Termlet 호스트 파일
backup_ui.export.format.ssh_config:
  zh-CN: OpenSSH 配置（ssh_config）
  en: OpenSSH config (ssh_config)
  zh-TW: OpenSSH 設定（ssh_config）
  ja: OpenSSH の設定（ssh_config）
  ko: OpenSSH 구성(ssh_config)
