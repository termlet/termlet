  zh-TW: 包含密碼、私密金鑰等認證資訊
  ja: パスワード、秘密鍵などの認証情報を含める
  ko: 비밀번호, 개인 키 등 자격 증명 포함
backup_ui.export.secrets_off:
  zh-CN: 不含凭据时文件是可以直接阅读、编辑的 JSON，导入后用密码登录的主机需要补填密码。
  en: Without credentials the file is plain JSON that you can read and edit. Hosts that log in with a password need it filled in after import.
  zh-TW: 不含認證資訊時，檔案是可以直接閱讀、編輯的 JSON，匯入後以密碼登入的主機需要補填密碼。
  ja: 認証情報を含めない場合、ファイルはそのまま読んだり編集したりできる JSON になります。インポート後、パスワードでログインするホストにはパスワードの入力が必要です。
  ko: 자격 증명을 포함하지 않으면 파일은 그대로 읽고 편집할 수 있는 JSON이 됩니다. 가져온 후 비밀번호로 로그인하는 호스트는 비밀번호를 입력해야 합니다.
backup_ui.export.secrets_on:
  zh-CN: 文件将用下面的密码整体加密，导入时需要输入。文件中有可以直接登录服务器的凭据，请妥善保管。
  en: The whole file is encrypted with the password below, which is needed to import it. It contains credentials that can log in to your servers, so keep it safe.
  zh-TW: 檔案將用下面的密碼整體加密，匯入時需要輸入。檔案中有可以直接登入伺服器的認證資訊，請妥善保管。
  ja: ファイル全体が下のパスワードで暗号化され、インポート時に入力が必要です。ファイルにはサーバーに直接ログインできる認証情報が含まれるため、大切に保管してください。
  ko: 파일 전체가 아래 비밀번호로 암호화되며, 가져올 때 입력해야 합니다. 파일에는 서버에 바로 로그인할 수 있는 자격 증명이 들어 있으니 안전하게 보관하세요.
backup_ui.export.summary.termlet:
  zh-CN: 将导出主机 %{hosts} 台、分组 %{groups} 个、凭据档案 %{profiles} 个、密钥 %{keys} 把、端口转发 %{forwards} 条。
  en: "To export: %{hosts} hosts, %{groups} groups, %{profiles} credential profiles, %{keys} keys, %{forwards} port forwards."
  zh-TW: 將匯出主機 %{hosts} 台、群組 %{groups} 個、認證資訊設定檔 %{profiles} 個、金鑰 %{keys} 把、連接埠轉送 %{forwards} 條。
  ja: ホスト %{hosts} 台、グループ %{groups} 個、認証プロファイル %{profiles} 個、鍵 %{keys} 個、ポート転送 %{forwards} 件をエクスポートします。
  ko: 호스트 %{hosts}대, 그룹 %{groups}개, 자격 증명 프로필 %{profiles}개, 키 %{keys}개, 포트 포워딩 %{forwards}개를 내보냅니다.
backup_ui.export.summary.ssh_config:
  zh-CN: 将导出 SSH 主机 %{hosts} 台、端口转发 %{forwards} 条。
  en: "To export: %{hosts} SSH hosts, %{forwards} port forwards."
  zh-TW: 將匯出 SSH 主機 %{hosts} 台、連接埠轉送 %{forwards} 條。
  ja: SSH ホスト %{hosts} 台、ポート転送 %{forwards} 件をエクスポートします。
  ko: SSH 호스트 %{hosts}대, 포트 포워딩 %{forwards}개를 내보냅니다.
backup_ui.export.summary.added:
  zh-CN: 其中 %{count} 台是一并导出的跳板机。
  en: "%{count} of them are jump hosts exported along with the selection."
  zh-TW: 其中 %{count} 台是一併匯出的跳板機。
  ja: そのうち %{count} 台は一緒にエクスポートされる踏み台ホストです。
  ko: 그중 %{count}대는 함께 내보내는 점프 호스트입니다.
