backup_ui.schedule.password_lost:
  zh-CN: 保险库重置过，备份密码已无法解开，定时备份已暂停。请点“更改设置”重新输入密码。
  en: The vault was reset, so the backup password can’t be opened and scheduled backups are paused. Click “Change Settings” to enter the password again.
  zh-TW: 保險庫重設過，備份密碼已無法解開，定時備份已暫停。請按一下「變更設定」重新輸入密碼。
  ja: 保管庫がリセットされたため、バックアップのパスワードを復号できなくなり、定期バックアップを一時停止しました。「設定を変更」をクリックしてパスワードをもう一度入力してください。
  ko: 보관함이 초기화되어 백업 비밀번호를 열 수 없게 되었고 예약 백업이 일시 중지되었습니다. '설정 변경'을 클릭해 비밀번호를 다시 입력하세요.
