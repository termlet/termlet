  en: "Set to be sent line by line or character by character: %{count}. The interval isn’t kept; they’re sent all at once."
  zh-TW: "%{count} 條設定了逐行或逐字傳送：間隔不保留，匯入後一次傳送。"
  ja: "%{count} 件は 1 行ずつまたは 1 文字ずつ送信する設定です。間隔は保持されず、まとめて送信します。"
  ko: "%{count}개는 한 줄씩 또는 한 글자씩 보내도록 설정되어 있습니다. 간격은 유지되지 않으며 한 번에 보냅니다."
backup_ui.import.snippet_note.nested_groups:
  zh-CN: "%{count} 条在嵌套的分类中：Termlet 的分组只有一层，写成“上级 / 下级”。"
  en: "In nested categories: %{count}. Termlet groups have only one level, so they’re written as “Parent / Child”."
