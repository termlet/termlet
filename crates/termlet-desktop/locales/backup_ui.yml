backup_ui.schedule.keep_hint:
  zh-CN: 可保留 %{min}–%{max} 份；超出的旧备份自动删除。
  en: Keep %{min}–%{max} backups; older ones are removed automatically.
  zh-TW: 可保留 %{min}–%{max} 份；超出的舊備份自動刪除。
  ja: "%{min}～%{max} 個まで保持できます。超えた古いバックアップは自動的に削除されます。"
  ko: "%{min}~%{max}개까지 보관할 수 있습니다. 초과한 오래된 백업은 자동으로 삭제됩니다."
backup_ui.schedule.keep_invalid:
  zh-CN: 保留份数应在 %{min} 到 %{max} 之间。
  en: The number of backups to keep must be between %{min} and %{max}.
  zh-TW: 保留份數應在 %{min} 到 %{max} 之間。
  ja: 保持数は %{min}～%{max} の範囲で指定してください。
  ko: 보관 개수는 %{min}에서 %{max} 사이여야 합니다.
backup_ui.schedule.password:
  zh-CN: 备份密码
  en: Backup password
  zh-TW: 備份密碼
  ja: バックアップのパスワード
  ko: 백업 비밀번호
backup_ui.schedule.password_hint:
  zh-CN: 定时备份的文件用这个密码加密，恢复时需要输入，忘记后无法解开。它经保险库加密后保存在这台电脑上。
  en: Scheduled backups are encrypted with this password, which you’ll need to restore them and can’t be recovered if forgotten. It’s kept on this computer, encrypted by the vault.
  zh-TW: 定時備份的檔案用這個密碼加密，還原時需要輸入，忘記後無法解開。它經保險庫加密後儲存在這台電腦上。
  ja: 定期バックアップのファイルはこのパスワードで暗号化され、復元時に入力が必要です。忘れると復号できません。パスワードは保管庫で暗号化してこのコンピューターに保存されます。
  ko: 예약 백업 파일은 이 비밀번호로 암호화되며, 복원할 때 입력해야 합니다. 잊어버리면 열 수 없습니다. 비밀번호는 보관함으로 암호화되어 이 컴퓨터에 저장됩니다.
backup_ui.schedule.password_keep_hint:
  zh-CN: 留空则沿用原来的密码；填写则之后的备份改用新密码（已有的备份仍用原来的密码）。
  en: Leave empty to keep the current password; a new one applies to later backups (existing backups keep the old password).
  zh-TW: 留空則沿用原來的密碼；填寫則之後的備份改用新密碼（已有的備份仍使用原來的密碼）。
  ja: 空欄にすると現在のパスワードをそのまま使います。入力すると、以降のバックアップは新しいパスワードを使います（既存のバックアップは元のパスワードのままです）。
  ko: 비워 두면 현재 비밀번호를 그대로 사용합니다. 입력하면 이후 백업부터 새 비밀번호를 사용합니다(기존 백업은 원래 비밀번호 그대로).
backup_ui.schedule.password_repeat:
  zh-CN: 请再次输入备份密码。
  en: Enter the backup password again.
  zh-TW: 請再次輸入備份密碼。
  ja: バックアップのパスワードをもう一度入力してください。
  ko: 백업 비밀번호를 다시 입력하세요.
backup_ui.schedule.folder_required:
