settings.shell_integration:
  zh-CN: 让命令历史更准确（可选）
  en: Make command history more accurate (optional)
  zh-TW: 讓指令歷史記錄更準確（選用）
  ja: コマンド履歴をより正確にする（省略可）
  ko: 명령 기록을 더 정확하게(선택 사항)
settings.shell_integration_hint:
  zh-CN: 服务器的 shell 输出 OSC 133 提示符标记时，按标记记录命令，不再根据屏幕推断：提前输入的命令也能记下，命令执行中的回答（例如 yes）不会被当成命令。同时输出 OSC 7 当前目录时，SFTP 跟随终端目录会立即切换。fish 4 起默认输出；bash（4.4 起）、zsh 可把下面的片段加到服务器上的配置文件，重新登录后生效。Termlet 不会修改服务器。
  en: When the server's shell emits OSC 133 prompt marks, commands are recorded from the marks instead of being guessed from the screen, so commands typed ahead are kept and answers like "yes" aren't taken for commands. If it also emits OSC 7 with the current folder, SFTP follows the terminal's folder right away. fish 4 and later do this by default. For bash (4.4 and later) or zsh, add the snippet below to the shell's config file on the server and sign in again. Termlet never changes your server.
  zh-TW: 伺服器的 shell 輸出 OSC 133 提示字元標記時，依標記記錄指令，不再根據畫面推斷：提前輸入的指令也能記下，指令執行中的回答（例如 yes）不會被當成指令。同時輸出 OSC 7 目前目錄時，SFTP 跟隨終端機目錄會立即切換。fish 4 起預設輸出；bash（4.4 起）、zsh 可把下面的片段加到伺服器上的設定檔，重新登入後生效。Termlet 不會修改伺服器。
  ja: サーバーのシェルが OSC 133 のプロンプトマークを出力する場合、画面から推測せずにマークに基づいてコマンドを記録します。先行入力したコマンドも記録でき、コマンド実行中の応答（yes など）がコマンドとして扱われることもありません。OSC 7 で現在のディレクトリも出力すると、SFTP がターミナルのディレクトリにすぐ追従します。fish 4 以降はデフォルトで出力します。bash（4.4 以降）や zsh では、下のスニペットをサーバーの設定ファイルに追加し、ログインし直すと有効になります。Termlet がサーバーを変更することはありません。
  ko: 서버의 셸이 OSC 133 프롬프트 표시를 출력하면 화면으로 추측하지 않고 표시를 기준으로 명령을 기록합니다. 미리 입력한 명령도 기록되며, 명령 실행 중의 응답(예를 들어 yes)이 명령으로 기록되지 않습니다. OSC 7로 현재 디렉터리도 출력하면 SFTP가 터미널 디렉터리를 바로 따라갑니다. fish 4부터는 기본으로 출력합니다. bash(4.4 이상)나 zsh는 아래 코드를 서버의 설정 파일에 추가하고 다시 로그인하면 적용됩니다. Termlet은 서버를 변경하지 않습니다.
