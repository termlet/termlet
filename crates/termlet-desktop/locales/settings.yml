settings.keys.preset_hint:
  zh-CN: 换成这一套：先恢复默认，再改成它的习惯（它没有的功能用默认值）；保存前可以取消。
  en: Switching first restores all defaults, then applies that client's keys (actions it has no key for keep the defaults). Nothing changes until you save.
  zh-TW: 換成這一套：先還原預設值，再改成它的習慣（它沒有的功能使用預設值）；儲存前可以取消。
  ja: 切り替えると、いったんすべてデフォルトに戻してから、そのクライアントのキー割り当てに変更します（そのクライアントにない機能はデフォルトのまま）。保存するまではキャンセルできます。
  ko: 전환하면 먼저 모두 기본값으로 복원한 후 그 클라이언트의 키 배치로 바꿉니다(그 클라이언트에 없는 기능은 기본값 유지). 저장하기 전에는 취소할 수 있습니다.
