  ko: 터미널의 글꼴 크기는 '터미널'에서 따로 설정합니다.
settings.ui_scale_hint_windows:
  zh-CN: 跟随系统时与 Windows 设置中的“文字大小”一致；终端的字号在“终端”中另外设置。
  en: Use system setting follows Text size in Windows Settings. The terminal font size is set separately under Terminal.
  zh-TW: 跟隨系統時與 Windows 設定中的「文字大小」一致；終端機的字型大小在「終端機」中另外設定。
  ja: 「システムに合わせる」では Windows の設定の「テキストのサイズ」に合わせます。ターミナルのフォントサイズは「ターミナル」で別に設定します。
  ko: "'시스템 설정 따르기'는 Windows 설정의 '텍스트 크기'를 따릅니다. 터미널의 글꼴 크기는 '터미널'에서 따로 설정합니다."
