  zh-CN: 连接后识别远程系统
  en: Identify the remote system after connecting
  zh-TW: 連線後識別遠端系統
  ja: 接続後にリモートの OS を識別
  ko: 연결 후 원격 시스템 식별
settings.detect_os_hint:
  zh-CN: SSH 连接成功后在这条连接上另开通道执行一次只读命令（uname 与读取 /etc/os-release），主机列表与 Tab 显示系统的标志。不经过终端，不在服务器上留下任何东西；只用一个通道的主机不识别。
  en: After an SSH connection is made, runs one read-only command on it in a separate channel (uname and reading /etc/os-release) so the host list and tabs can show the system's logo. Nothing goes through the terminal or is left on the server; hosts that use a single channel are skipped.
  zh-TW: SSH 連線成功後在這條連線上另開通道執行一次唯讀指令（uname 與讀取 /etc/os-release），主機清單與分頁顯示系統的標誌。不經過終端機，不在伺服器上留下任何東西；只用一個通道的主機不識別。
  ja: SSH 接続に成功すると、その接続上の別チャネルで読み取り専用のコマンドを 1 回実行し（uname と /etc/os-release の読み取り）、ホスト一覧とタブに OS のロゴを表示します。ターミナルは経由せず、サーバーには何も残しません。チャネルを 1 つしか使えないホストでは識別しません。
  ko: SSH 연결에 성공하면 그 연결에서 별도의 채널을 열어 읽기 전용 명령을 한 번 실행하고(uname 및 /etc/os-release 읽기), 호스트 목록과 탭에 시스템 로고를 표시합니다. 터미널을 거치지 않으며 서버에 아무것도 남기지 않습니다. 채널을 하나만 쓰는 호스트는 식별하지 않습니다.
settings.agent_path:
  zh-CN: ssh-agent 地址
  en: ssh-agent address
  zh-TW: ssh-agent 位址
  ja: ssh-agent のアドレス
  ko: ssh-agent 주소
settings.agent_path_hint:
  zh-CN: 留空时自动查找（SSH_AUTH_SOCK、Windows 的 OpenSSH agent 服务、Pageant）。使用 1Password、Bitwarden 等的 agent 时填写它们的管道或套接字。
  en: Leave empty to find one automatically (SSH_AUTH_SOCK, the Windows OpenSSH agent service, Pageant). For agents such as 1Password or Bitwarden, enter their pipe or socket.
  zh-TW: 留空時自動尋找（SSH_AUTH_SOCK、Windows 的 OpenSSH agent 服務、Pageant）。使用 1Password、Bitwarden 等的 agent 時填寫它們的管道或通訊端。
  ja: 空欄の場合は自動的に探します（SSH_AUTH_SOCK、Windows の OpenSSH agent サービス、Pageant）。1Password や Bitwarden などの agent を使う場合は、そのパイプまたはソケットを入力します。
  ko: 비워 두면 자동으로 찾습니다(SSH_AUTH_SOCK, Windows의 OpenSSH agent 서비스, Pageant). 1Password, Bitwarden 등의 agent를 사용하려면 해당 파이프나 소켓을 입력하세요.
