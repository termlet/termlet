settings.confirm_close:
  zh-CN: 关闭终端、文件管理的 Tab 或窗口前确认
  en: Confirm before closing a tab or window with open terminals or file managers
  zh-TW: 關閉終端機、檔案管理的分頁或視窗前確認
  ja: ターミナルやファイル管理のタブ、ウィンドウを閉じる前に確認する
  ko: 터미널이나 파일 관리 탭, 창을 닫기 전에 확인
settings.confirm_close_hint:
  zh-CN: 远程文件有未保存的修改、或有未完成的传输时总会确认。
  en: You're always asked when a remote file has unsaved changes or a transfer is still running.
  zh-TW: 遠端檔案有未儲存的變更、或有未完成的傳輸時一律會確認。
  ja: リモートファイルに未保存の変更があるときや、転送が終わっていないときは常に確認します。
  ko: 원격 파일에 저장하지 않은 변경 사항이 있거나 전송이 끝나지 않았으면 항상 확인합니다.
settings.show_host_address:
  zh-CN: 在主机列表中显示地址
  en: Show addresses in the host list
  zh-TW: 在主機清單中顯示位址
  ja: ホスト一覧にアドレスを表示
  ko: 호스트 목록에 주소 표시
settings.show_host_address_hint:
  zh-CN: 主机名下方显示 用户名@地址；关闭后列表更紧凑，截图时也不会露出地址。
  en: Shows user@address under each host name. Turn it off for a more compact list that keeps addresses out of screenshots.
  zh-TW: 主機名稱下方顯示 使用者名稱@位址；關閉後清單更緊湊，螢幕截圖時也不會露出位址。
  ja: ホスト名の下に ユーザー名@アドレス を表示します。オフにすると一覧がコンパクトになり、スクリーンショットにもアドレスが写りません。
  ko: 호스트 이름 아래에 사용자 이름@주소를 표시합니다. 끄면 목록이 더 간결해지고 스크린샷에도 주소가 나오지 않습니다.
settings.tab_position:
  zh-CN: Tab 的位置
  en: Tab position
  zh-TW: 分頁的位置
  ja: タブの位置
  ko: 탭 위치
settings.tab_position_top:
  zh-CN: 顶部
  en: Top
  zh-TW: 頂部
  ja: 上
  ko: 위쪽
settings.tab_position_left:
  zh-CN: 左侧
  en: Left
  zh-TW: 左側
  ja: 左
  ko: 왼쪽
settings.tab_position_hint:
  zh-CN: 只对这台电脑生效。
  en: Applies to this computer only.
  zh-TW: 只對這台電腦生效。
  ja: このコンピューターだけに適用されます。
  ko: 이 컴퓨터에만 적용됩니다.
settings.group_tabs_by_host:
  zh-CN: 竖排时按主机分组
  en: Group tabs by host in the side list
  zh-TW: 直排時依主機分組
  ja: 縦に並べるときはホストごとにまとめる
  ko: 세로로 표시할 때 호스트별로 묶기
settings.group_tabs_by_host_hint:
  zh-CN: 同一窗格中连同一台主机的几个 Tab 归到可折叠的主机标题下，带数量；只影响显示，会话照旧各自独立。
  en: Tabs in the same pane that connect to the same host go under a collapsible host heading with a count. This only changes the display; each session stays separate.
  zh-TW: 同一窗格中連到同一台主機的幾個分頁歸到可摺疊的主機標題下，附上數量；只影響顯示，工作階段照舊各自獨立。
  ja: 同じペインで同じホストに接続しているタブを、件数付きの折りたためるホストの見出しの下にまとめます。表示が変わるだけで、セッションはそれぞれ独立したままです。
  ko: 같은 창에서 같은 호스트에 연결된 탭을 개수가 표시된 접을 수 있는 호스트 제목 아래로 묶습니다. 표시만 바뀌며 세션은 각각 그대로 독립적입니다.
settings.close_to_tray:
  zh-CN: 关闭窗口时最小化到托盘
  en: Minimize to the system tray when closing the window
  zh-TW: 關閉視窗時最小化到系統匣
  ja: ウィンドウを閉じたら通知領域に最小化
  ko: 창을 닫으면 알림 영역으로 최소화
settings.close_to_tray_hint:
  zh-CN: 关闭最后一个窗口时 Termlet 留在托盘中运行，连接、传输与端口转发照常进行；单击托盘图标恢复窗口，从它的菜单退出 Termlet。
  en: When you close the last window, Termlet keeps running in the system tray with connections, transfers and port forwards intact. Click the tray icon to bring the window back, or quit Termlet from its menu.
  zh-TW: 關閉最後一個視窗時 Termlet 留在系統匣中執行，連線、傳輸與連接埠轉送照常進行；按一下系統匣圖示還原視窗，從它的選單結束 Termlet。
  ja: 最後のウィンドウを閉じても Termlet は通知領域で実行を続け、接続、転送、ポート転送はそのまま継続します。トレイアイコンをクリックするとウィンドウが戻り、そのメニューから Termlet を終了できます。
  ko: 마지막 창을 닫아도 Termlet은 알림 영역에서 계속 실행되며 연결, 전송, 포트 포워딩도 그대로 유지됩니다. 트레이 아이콘을 클릭하면 창이 다시 열리고, 해당 메뉴에서 Termlet을 종료할 수 있습니다.
settings.taskbar_progress:
  zh-CN: 在任务栏按钮上显示传输进度
  en: Show transfer progress on the taskbar button
  zh-TW: 在工作列按鈕上顯示傳輸進度
  ja: タスクバーのボタンに転送の進行状況を表示
  ko: 작업 표시줄 단추에 전송 진행률 표시
settings.taskbar_progress_mac:
  zh-CN: 在程序坞图标上显示传输进度
  en: Show transfer progress on the Dock icon
  zh-TW: 在 Dock 圖示上顯示傳輸進度
  ja: Dock のアイコンに転送の進行状況を表示
  ko: Dock 아이콘에 전송 진행률 표시
settings.taskbar_progress_linux:
  zh-CN: 在程序图标上显示传输进度
  en: Show transfer progress on the app icon
  zh-TW: 在程式圖示上顯示傳輸進度
  ja: アプリのアイコンに転送の進行状況を表示
  ko: 앱 아이콘에 전송 진행률 표시
settings.taskbar_progress_linux_hint:
  zh-CN: 需要桌面环境支持（GNOME 的 Dash to Dock、Ubuntu Dock、KDE Plasma 等）。
  en: Requires desktop support (GNOME's Dash to Dock, Ubuntu Dock, KDE Plasma and others).
  zh-TW: 需要桌面環境支援（GNOME 的 Dash to Dock、Ubuntu Dock、KDE Plasma 等）。
  ja: デスクトップ環境の対応が必要です（GNOME の Dash to Dock、Ubuntu Dock、KDE Plasma など）。
  ko: 데스크톱 환경이 지원해야 합니다(GNOME의 Dash to Dock, Ubuntu Dock, KDE Plasma 등).
settings.remote_editor:
  zh-CN: 在编辑器中打开远程目录
  en: Open remote folders in an editor
  zh-TW: 在編輯器中開啟遠端目錄
  ja: リモートディレクトリをエディターで開く
  ko: 편집기에서 원격 디렉터리 열기
settings.remote_editor.auto:
  zh-CN: 显示装了的编辑器
  en: Installed editors
  zh-TW: 顯示已安裝的編輯器
  ja: インストール済みのエディター
  ko: 설치된 편집기
settings.remote_editor.vscode:
  zh-CN: 只用 VS Code
  en: VS Code only
  zh-TW: 只用 VS Code
  ja: VS Code のみ
  ko: VS Code만
settings.remote_editor.zed:
  zh-CN: 只用 Zed
  en: Zed only
  zh-TW: 只用 Zed
  ja: Zed のみ
  ko: Zed만
settings.remote_editor.off:
  zh-CN: 不显示
  en: Don't show
  zh-TW: 不顯示
  ja: 表示しない
  ko: 표시 안 함
settings.remote_editor_hint:
  zh-CN: 文件管理的菜单中的“在 VS Code 中打开”“在 Zed 中打开”。编辑器用它自己的 ssh 连接服务器，VS Code 需要装有 Remote - SSH 扩展。
  en: The "Open in VS Code" and "Open in Zed" items in the file manager's menus. The editor connects to the server with its own ssh; VS Code needs the Remote - SSH extension.
  zh-TW: 檔案管理選單中的「在 VS Code 中開啟」「在 Zed 中開啟」。編輯器用它自己的 ssh 連線伺服器，VS Code 需要安裝 Remote - SSH 擴充功能。
  ja: ファイル管理のメニューの「VS Code で開く」「Zed で開く」です。エディターは独自の ssh でサーバーに接続します。VS Code には Remote - SSH 拡張機能が必要です。
  ko: 파일 관리 메뉴의 'VS Code에서 열기', 'Zed에서 열기' 항목입니다. 편집기는 자체 ssh로 서버에 연결하며, VS Code에는 Remote - SSH 확장이 필요합니다.
