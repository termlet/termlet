settings.keys.needs_modifier:
  zh-CN: "%{key} 不能作为快捷键：需要带 Ctrl 或 Alt，否则会影响输入。"
  en: "%{key} can't be a shortcut. Add Ctrl or Alt so it doesn't get in the way of typing."
  zh-TW: "%{key} 不能作為快速鍵：需要搭配 Ctrl 或 Alt，否則會影響輸入。"
  ja: "%{key} はショートカットキーにできません：入力の妨げにならないよう Ctrl または Alt と組み合わせてください。"
  ko: "%{key}은(는) 바로 가기 키로 쓸 수 없습니다. 입력에 방해가 되지 않도록 Ctrl 또는 Alt와 함께 지정하세요."
settings.keys.hint_mac:
  zh-CN: 点“+”后按下新的按键。快捷键由 Termlet 处理，不再发给远端；需要带 ⌘ 或 Control（F1–F24，以及 Shift 加 Delete、Home、End、PageUp、PageDown 除外）。Option 用来输入字符，不能单独作为修饰键。
  en: Click + and press the new keys. Shortcuts are handled by Termlet and no longer sent to the server. They need ⌘ or Control, except F1–F24 and Shift with Delete, Home, End, Page Up or Page Down. Option is for typing characters and can't be the only modifier.
  zh-TW: 按「+」後按下新的按鍵。快速鍵由 Termlet 處理，不再傳送給遠端；需要搭配 ⌘ 或 Control（F1–F24，以及 Shift 加 Delete、Home、End、PageUp、PageDown 除外）。Option 用來輸入字元，不能單獨作為修飾鍵。
  ja: 「+」をクリックしてから新しいキーを押します。ショートカットキーは Termlet が処理し、リモートには送られません。⌘ または Control との組み合わせが必要です（F1～F24 と、Shift と Delete、Home、End、PageUp、PageDown の組み合わせを除く）。Option は文字の入力に使うため、Option だけを修飾キーにすることはできません。
  ko: +를 클릭한 후 새 키를 누르세요. 바로 가기 키는 Termlet이 처리하며 원격으로 보내지 않습니다. ⌘ 또는 Control과 함께 눌러야 합니다(F1~F24, 그리고 Shift와 Delete, Home, End, PageUp, PageDown의 조합은 예외). Option은 문자 입력에 쓰이므로 단독 보조 키로 쓸 수 없습니다.
settings.keys.needs_modifier_mac:
  zh-CN: "%{key} 不能作为快捷键：需要带 ⌘ 或 Control，否则会影响输入（Option 用来输入字符）。"
  en: "%{key} can't be a shortcut. Add ⌘ or Control so it doesn't get in the way of typing (Option is for typing characters)."
  zh-TW: "%{key} 不能作為快速鍵：需要搭配 ⌘ 或 Control，否則會影響輸入（Option 用來輸入字元）。"
  ja: "%{key} はショートカットキーにできません：入力の妨げにならないよう ⌘ または Control と組み合わせてください（Option は文字の入力に使います）。"
  ko: "%{key}은(는) 바로 가기 키로 쓸 수 없습니다. 입력에 방해가 되지 않도록 ⌘ 또는 Control과 함께 지정하세요(Option은 문자 입력에 쓰임)."
