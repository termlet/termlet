  zh-CN: 默认（JetBrains Mono，内置）
  en: Default (JetBrains Mono, built in)
  zh-TW: 預設（JetBrains Mono，內建）
  ja: デフォルト（JetBrains Mono、内蔵）
  ko: 기본값(JetBrains Mono, 기본 제공)
settings.font.loading:
  zh-CN: 正在读取本机字体…
  en: Reading installed fonts…
  zh-TW: 正在讀取本機字型…
  ja: インストール済みのフォントを読み込んでいます…
  ko: 설치된 글꼴을 읽는 중…
settings.font.hint:
  zh-CN: 只列出本机已安装的等宽字体；所选字体缺少的字符（如中文）用默认字体显示。
  en: Only installed monospace fonts are listed. Characters missing from the chosen font, such as CJK, use the default font.
  zh-TW: 只列出本機已安裝的等寬字型；所選字型缺少的字元（如中文）以預設字型顯示。
  ja: このコンピューターにインストールされている等幅フォントだけを表示します。選んだフォントにない文字（日本語など）はデフォルトのフォントで表示します。
  ko: 이 컴퓨터에 설치된 고정 폭 글꼴만 표시합니다. 선택한 글꼴에 없는 문자(한글 등)는 기본 글꼴로 표시합니다.
settings.font.recommended:
  zh-CN: "%{name}（推荐：%{note}）"
  en: "%{name} (recommended: %{note})"
  zh-TW: "%{name}（推薦：%{note}）"
  ja: "%{name}（おすすめ：%{note}）"
  ko: "%{name}(추천: %{note})"
settings.font.more:
  zh-CN: 还可以安装：
  en: "You can also install:"
  zh-TW: 還可以安裝：
  ja: ほかにインストールできるフォント：
  ko: "추가로 설치할 수 있는 글꼴:"
settings.font.note_nerd:
  zh-CN: 带图标，适合 oh-my-zsh、starship 等主题
  en: includes icons for themes like oh-my-zsh and starship
  zh-TW: 含圖示，適合 oh-my-zsh、starship 等主題
  ja: アイコン入り、oh-my-zsh や starship などのテーマ向け
  ko: 아이콘 포함, oh-my-zsh, starship 등의 테마에 적합
settings.font.note_cjk:
  zh-CN: 中英文对齐
  en: aligns CJK and Latin text
  zh-TW: 中英文對齊
  ja: 和文と英字の幅がそろう
  ko: 한글과 영문 폭이 맞음
settings.font.note_all:
  zh-CN: 带图标，中英文对齐
  en: icons and aligned CJK text
  zh-TW: 含圖示，中英文對齊
  ja: アイコン入り、和文と英字の幅がそろう
  ko: 아이콘 포함, 한글과 영문 폭이 맞음
settings.font.note_windows:
  zh-CN: Windows 11 自带
  en: included with Windows 11
  zh-TW: Windows 11 內建
  ja: Windows 11 に付属
  ko: Windows 11 기본 제공
settings.cursor.label:
  zh-CN: 光标样式
  en: Cursor style
  zh-TW: 游標樣式
  ja: カーソルのスタイル
  ko: 커서 모양
settings.cursor.hint:
  zh-CN: 程序（如 vim）自己设置的光标样式与闪烁优先。
  en: Cursor styles and blinking set by programs such as vim take precedence.
  zh-TW: 程式（例如 vim）自行設定的游標樣式與閃爍優先。
  ja: プログラム（vim など）が設定したカーソルのスタイルと点滅が優先されます。
  ko: 프로그램(vim 등)이 직접 설정한 커서 모양과 깜박임이 우선합니다.
settings.cursor.block:
  zh-CN: 方块
  en: Block
  zh-TW: 方塊
  ja: ブロック
  ko: 블록
settings.cursor.bar:
  zh-CN: 竖线
  en: Bar
  zh-TW: 垂直線
  ja: 縦線
  ko: 세로 막대
settings.cursor.underline:
  zh-CN: 下划线
  en: Underline
  zh-TW: 底線
  ja: 下線
  ko: 밑줄
settings.cursor_blink:
  zh-CN: 光标闪烁
  en: Blinking cursor
  zh-TW: 游標閃爍
  ja: カーソルを点滅
  ko: 커서 깜박임
settings.copy_on_select:
  zh-CN: 选中即复制
  en: Copy on select
  zh-TW: 選取即複製
  ja: 選択したらコピー
  ko: 선택하면 복사
settings.clipboard_write:
  zh-CN: 允许程序写入剪贴板
  en: Let programs write to the clipboard
  zh-TW: 允許程式寫入剪貼簿
  ja: プログラムによるクリップボードへの書き込みを許可
  ko: 프로그램이 클립보드에 쓰도록 허용
settings.clipboard_write_hint:
  zh-CN: 服务器上的程序（如 tmux、Neovim）可复制到本机并提示；不能读剪贴板。
  en: Programs on the server (such as tmux and Neovim) can copy to this computer, with a notice each time. They can't read the clipboard.
  zh-TW: 伺服器上的程式（如 tmux、Neovim）可複製到本機並提示；不能讀剪貼簿。
  ja: サーバー上のプログラム（tmux、Neovim など）がこのコンピューターにコピーでき、そのたびに通知します。クリップボードは読み取れません。
  ko: 서버의 프로그램(tmux, Neovim 등)이 이 컴퓨터로 복사할 수 있으며 그때마다 알립니다. 클립보드는 읽을 수 없습니다.
settings.right_click.label:
  zh-CN: 终端中右键
  en: Right-click in the terminal
  zh-TW: 在終端機中按右鍵
  ja: ターミナルでの右クリック
  ko: 터미널에서 오른쪽 클릭
settings.right_click.auto:
  zh-CN: 有选中内容时复制，否则粘贴
  en: Copy when text is selected, otherwise paste
  zh-TW: 有選取內容時複製，否則貼上
  ja: 選択範囲があればコピー、なければ貼り付け
  ko: 선택한 내용이 있으면 복사, 없으면 붙여넣기
settings.right_click.paste:
  zh-CN: 粘贴
  en: Paste
  zh-TW: 貼上
  ja: 貼り付け
  ko: 붙여넣기
settings.right_click.menu:
  zh-CN: 弹出菜单（复制、粘贴、查找、清屏、编码）
  en: Show a menu (copy, paste, find, clear, encoding)
  zh-TW: 彈出選單（複製、貼上、尋找、清除畫面、編碼）
  ja: メニューを表示（コピー、貼り付け、検索、画面のクリア、エンコード）
  ko: 메뉴 표시(복사, 붙여넣기, 찾기, 화면 지우기, 인코딩)
settings.option_as_meta:
  zh-CN: Option 键作为 Meta 键
  en: Use Option as Meta key
  zh-TW: Option 鍵作為 Meta 鍵
  ja: Option キーを Meta キーとして使う
  ko: Option 키를 Meta 키로 사용
settings.option_as_meta_hint:
  zh-CN: 开启后 Option 加其他键发送 ESC 前缀，可以用 shell、Emacs 中 Alt 的快捷键（如 Option+B 后退一个单词），不再输入 å、é 等特殊字符。左右两个 Option 键都一样。
  en: Option plus a key sends an ESC prefix, so Alt shortcuts in the shell and Emacs work (such as Option+B to move back a word), instead of typing special characters like å and é. Both Option keys work the same way.
  zh-TW: 開啟後 Option 加其他鍵會送出 ESC 前綴，可以使用 shell、Emacs 中 Alt 的快速鍵（例如 Option+B 往回移動一個單字），不再輸入 å、é 等特殊字元。左右兩個 Option 鍵都一樣。
  ja: オンにすると、Option とほかのキーの組み合わせで ESC プレフィックスが送られ、シェルや Emacs の Alt のショートカット（Option+B で 1 単語戻るなど）が使えます。å や é などの特殊文字は入力されなくなります。左右どちらの Option キーも同じです。
  ko: 켜면 Option과 다른 키를 함께 누를 때 ESC 접두사를 보내므로 셸이나 Emacs에서 Alt 바로 가기 키(예를 들어 Option+B로 한 단어 뒤로 이동)를 사용할 수 있으며, å, é 같은 특수 문자는 입력되지 않습니다. 왼쪽과 오른쪽 Option 키 모두 같습니다.
settings.latency:
  zh-CN: 在终端底部显示网络延迟
  en: Show network latency at the bottom of the terminal
  zh-TW: 在終端機底部顯示網路延遲
  ja: ターミナルの下部にネットワーク遅延を表示
  ko: 터미널 하단에 네트워크 지연 시간 표시
settings.paste_warning:
  zh-CN: 粘贴前检查
  en: Check before pasting
  zh-TW: 貼上前檢查
  ja: 貼り付け前に確認
  ko: 붙여넣기 전에 확인
settings.paste_warning_hint:
  zh-CN: 控制字符一律去掉；会立即执行的多行内容、危险命令、下载后交给 shell，以及看不见的字符、同形字先确认。危险命令的规则在“AI 与自动化”中设置。
  en: Control characters are always removed. You're asked first about multi-line text that would run right away, dangerous commands, downloads piped to a shell, and invisible or look-alike characters. Dangerous command rules are set in AI & automation.
  zh-TW: 控制字元一律移除；會立即執行的多行內容、危險指令、下載後交給 shell，以及看不見的字元、同形字先確認。危險指令的規則在「AI 與自動化」中設定。
  ja: 制御文字は常に取り除きます。すぐに実行される複数行の内容、危険なコマンド、ダウンロードしてシェルに渡す内容、見えない文字や形の似た文字は、先に確認します。危険なコマンドのルールは「AI と自動化」で設定します。
  ko: 제어 문자는 항상 제거합니다. 바로 실행되는 여러 줄 내용, 위험한 명령, 다운로드 후 셸에 넘기는 내용, 보이지 않는 문자나 모양이 비슷한 문자는 먼저 확인합니다. 위험한 명령 규칙은 'AI 및 자동화'에서 설정합니다.
settings.tab_activity:
  zh-CN: 后台终端有新输出时在 Tab 上标出
  en: Mark tabs that have new output in the background
  zh-TW: 背景終端機有新輸出時在分頁上標示
  ja: バックグラウンドのターミナルに新しい出力があればタブに表示
  ko: 백그라운드 터미널에 새 출력이 있으면 탭에 표시
settings.tab_activity_hint:
  zh-CN: 蓝点为新输出，铃铛为响铃；切换过去后清除。
  en: A blue dot means new output and a bell means the terminal rang. Both clear when you switch to the tab.
  zh-TW: 藍點表示有新輸出，鈴鐺表示響鈴；切換過去後清除。
  ja: 青い点は新しい出力、ベルはベル音を示します。タブに切り替えると消えます。
  ko: 파란 점은 새 출력, 종은 벨 소리를 뜻합니다. 해당 탭으로 전환하면 사라집니다.
settings.notify_command_done:
  zh-CN: 耗时较长的命令或传输结束时发通知
  en: Notify when a long command or transfer finishes
  zh-TW: 耗時較長的指令或傳輸結束時發出通知
  ja: 時間のかかるコマンドや転送が終わったら通知
  ko: 오래 걸리는 명령이나 전송이 끝나면 알림
settings.transfer_auto_clear:
  zh-CN: 传输完成后自动清除
  en: Clear transfers when they finish
  zh-TW: 傳輸完成後自動清除
  ja: 転送が完了したら自動的にクリア
  ko: 전송이 완료되면 자동으로 지우기
settings.transfer_auto_clear_hint:
  zh-CN: SFTP 传输列表中成功与已取消的传输 3 秒后移除，失败的保留以便继续；终端中 rz / sz、trzsz 成功的提示 5 秒后关闭。每批传输结束时另有一条汇总提示。
  en: Successful and canceled SFTP transfers leave the list after 3 seconds; failed ones stay so you can resume them. Success notices for rz / sz and trzsz in the terminal close after 5 seconds. A summary appears when each batch finishes.
  zh-TW: SFTP 傳輸清單中成功與已取消的傳輸 3 秒後移除，失敗的保留以便繼續；終端機中 rz / sz、trzsz 成功的提示 5 秒後關閉。每批傳輸結束時另有一則摘要提示。
  ja: SFTP の転送一覧では、成功した転送とキャンセルした転送は 3 秒後に消え、失敗したものは再開できるよう残ります。ターミナルの rz / sz、trzsz の成功通知は 5 秒後に閉じます。転送のまとまりごとに、終了時に概要の通知も表示します。
  ko: SFTP 전송 목록에서 성공한 전송과 취소한 전송은 3초 후 제거되고, 실패한 전송은 이어서 할 수 있도록 남습니다. 터미널의 rz / sz, trzsz 성공 알림은 5초 후 닫힙니다. 전송 묶음이 끝날 때마다 요약 알림도 표시됩니다.
settings.file_transfer:
  zh-CN: 识别终端中的文件传输（ZModem、trzsz）
  en: Detect file transfers in the terminal (ZModem, trzsz)
  zh-TW: 辨識終端機中的檔案傳輸（ZModem、trzsz）
  ja: ターミナルでのファイル転送（ZModem、trzsz）を検出
  ko: 터미널의 파일 전송(ZModem, trzsz) 감지
settings.file_transfer_hint:
  zh-CN: 在服务器上运行 rz / sz、trz / tsz 时弹出提示，选择要上传的文件或保存的位置，文件由 Termlet 直接读写。tmux 中请用 trz / tsz。
  en: When you run rz / sz or trz / tsz on the server, Termlet asks which files to upload or where to save them and reads and writes them directly. Inside tmux, use trz / tsz.
  zh-TW: 在伺服器上執行 rz / sz、trz / tsz 時彈出提示，選擇要上傳的檔案或儲存的位置，檔案由 Termlet 直接讀寫。tmux 中請用 trz / tsz。
  ja: サーバーで rz / sz、trz / tsz を実行すると、アップロードするファイルや保存先を選ぶダイアログが表示され、ファイルは Termlet が直接読み書きします。tmux の中では trz / tsz を使ってください。
  ko: 서버에서 rz / sz, trz / tsz를 실행하면 업로드할 파일이나 저장 위치를 선택하는 창이 표시되며, 파일은 Termlet이 직접 읽고 씁니다. tmux 안에서는 trz / tsz를 사용하세요.
settings.notify_command_done_hint:
  zh-CN: 超过 10 秒的命令（需要 shell 集成）或 SFTP 传输结束、而窗口不在眼前时发系统通知。
  en: Sends a system notification when a command (needs shell integration) or an SFTP transfer that took over 10 seconds finishes while it's out of view.
  zh-TW: 超過 10 秒的指令（需要 shell 整合）或 SFTP 傳輸結束、而視窗不在眼前時發出系統通知。
  ja: 10 秒を超えたコマンド（シェル統合が必要）や SFTP 転送が終わったとき、見えていなければシステム通知を送ります。
  ko: 10초가 넘게 걸린 명령(셸 통합 필요)이나 SFTP 전송이 끝났을 때 보이지 않으면 시스템 알림을 보냅니다.
settings.password_fill:
  zh-CN: sudo 提示时填入保存的密码
  en: Fill in the saved password at sudo prompts
  zh-TW: sudo 提示時填入儲存的密碼
  ja: sudo のプロンプトで保存したパスワードを入力
  ko: sudo 프롬프트에서 저장된 비밀번호 입력
settings.password_fill_hint:
  zh-CN: 终端中出现登录用户的 sudo 密码提示时，按 Enter 填入这台主机保存的密码。
  en: When the terminal shows a sudo password prompt for the login user, press Enter to fill in the password saved for this host.
  zh-TW: 終端機中出現登入使用者的 sudo 密碼提示時，按 Enter 填入這台主機儲存的密碼。
  ja: ターミナルにログインユーザーの sudo パスワードのプロンプトが表示されたとき、Enter を押すとこのホストに保存したパスワードを入力します。
  ko: 터미널에 로그인 사용자의 sudo 비밀번호 프롬프트가 나타나면 Enter를 눌러 이 호스트에 저장된 비밀번호를 입력합니다.
settings.session_log:
  zh-CN: 自动记录会话日志
  en: Record session logs automatically
  zh-TW: 自動記錄工作階段
  ja: セッションログを自動的に記録
  ko: 세션 로그 자동 기록
settings.session_log_hint:
  zh-CN: 把每个终端的输出存为纯文本（去掉控制序列，每行带时间，全屏程序的画面不记录，单个文件最大 100MB）；也可以在 Tab 的菜单中手动开始、停止。
  en: Saves each terminal's output as plain text, without control sequences, with a timestamp on every line. Full-screen programs aren't recorded, and each file is capped at 100 MB. You can also start and stop recording from the tab menu.
  zh-TW: 把每個終端機的輸出存為純文字（移除控制序列，每行附上時間，全螢幕程式的畫面不記錄，單一檔案最大 100MB）；也可以在分頁的選單中手動開始、停止。
  ja: 各ターミナルの出力をプレーンテキストで保存します（制御シーケンスを取り除き、各行に時刻を付けます。フルスクリーンのプログラムの画面は記録せず、1 ファイルの上限は 100 MB）。タブのメニューから手動で開始・停止することもできます。
  ko: 각 터미널의 출력을 일반 텍스트로 저장합니다(제어 시퀀스를 제거하고 줄마다 시간을 붙이며, 전체 화면 프로그램의 화면은 기록하지 않고, 파일 하나는 최대 100 MB). 탭 메뉴에서 직접 시작하거나 중지할 수도 있습니다.
settings.session_log_dir:
  zh-CN: 会话日志的目录
  en: Session log folder
  zh-TW: 工作階段記錄的目錄
  ja: セッションログのフォルダー
  ko: 세션 로그 폴더
settings.session_log_dir_hint:
  zh-CN: 按主机名分子目录，文件名为开始的时间。
  en: Logs are grouped in a subfolder per host and named after their start time.
  zh-TW: 依主機名稱分子目錄，檔名為開始的時間。
  ja: ホスト名ごとにサブフォルダーに分け、ファイル名は開始時刻になります。
  ko: 호스트 이름별로 하위 폴더를 나누며, 파일 이름은 시작 시간입니다.
settings.session_log_dir_default:
  zh-CN: 数据目录下的 session-logs
  en: session-logs in the data folder
  zh-TW: 資料目錄下的 session-logs
  ja: データフォルダー内の session-logs
  ko: 데이터 폴더의 session-logs
settings.browse:
  zh-CN: 浏览…
  en: Browse…
  zh-TW: 瀏覽…
  ja: 参照…
  ko: 찾아보기…
settings.command_history:
  zh-CN: 记录命令历史
  en: Keep command history
  zh-TW: 保留指令歷史記錄
  ja: コマンド履歴を記録
  ko: 명령 기록 저장
settings.command_history_hint:
  zh-CN: 在终端按回车时记录这一行命令，加密保存在本机，每台主机最近 1000 条；全屏程序中的输入、不显示的密码输入、以空格开头的命令不记录。命令行工具与 AI 看不到。
  en: Records the command line when you press Enter, encrypted on this computer, keeping the latest 1,000 per host. Input in full-screen programs, hidden password input, and commands that start with a space aren't recorded. The command-line tool and AI can't see it.
  zh-TW: 在終端機按 Enter 時記錄這一行指令，加密儲存在本機，每台主機保留最近 1000 筆；全螢幕程式中的輸入、不顯示的密碼輸入、以空格開頭的指令不記錄。命令列工具與 AI 看不到。
  ja: ターミナルで Enter を押したときにその行のコマンドを記録し、暗号化してこのコンピューターに保存します（ホストごとに最新 1000 件）。フルスクリーンのプログラムでの入力、表示されないパスワードの入力、スペースで始まるコマンドは記録しません。コマンドラインツールと AI からは見えません。
  ko: 터미널에서 Enter를 누를 때 그 줄의 명령을 기록하여 암호화한 후 이 컴퓨터에 저장합니다(호스트마다 최근 1000건). 전체 화면 프로그램에서의 입력, 표시되지 않는 비밀번호 입력, 공백으로 시작하는 명령은 기록하지 않습니다. 명령줄 도구와 AI는 볼 수 없습니다.
settings.command_suggest:
  zh-CN: 按命令历史给出补全提示
  en: Suggest commands from history
  zh-TW: 依指令歷史記錄提供補全建議
  ja: コマンド履歴から補完候補を表示
  ko: 명령 기록으로 자동 완성 제안
settings.command_suggest_hint:
  zh-CN: → 或 End 接受整条，%{word} 接受一个词；需要 shell 集成，只用本机保存的命令历史。
  en: → or End accepts the whole suggestion, %{word} accepts one word. Requires shell integration and uses only the history saved on this computer.
  zh-TW: → 或 End 接受整筆，%{word} 接受一個詞；需要 shell 整合，只使用本機儲存的指令歷史記錄。
  ja: → または End で全体を、%{word} で 1 語ずつ確定します。シェル統合が必要で、このコンピューターに保存されたコマンド履歴だけを使います。
  ko: → 또는 End로 전체를, %{word}로 한 단어씩 받아들입니다. 셸 통합이 필요하며 이 컴퓨터에 저장된 명령 기록만 사용합니다.
