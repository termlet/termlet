settings.keys.hint:
  zh-CN: 点“+”后按下新的按键。快捷键由 Termlet 处理，不再发给远端；需要带 Ctrl 或 Alt（F1–F24，以及 Shift 加 Insert、Delete、Home、End、PageUp、PageDown 除外）。
  en: Click + and press the new keys. Shortcuts are handled by Termlet and no longer sent to the server. They need Ctrl or Alt, except F1–F24 and Shift with Insert, Delete, Home, End, Page Up or Page Down.
  zh-TW: 按「+」後按下新的按鍵。快速鍵由 Termlet 處理，不再傳送給遠端；需要搭配 Ctrl 或 Alt（F1–F24，以及 Shift 加 Insert、Delete、Home、End、PageUp、PageDown 除外）。
  ja: 「+」をクリックしてから新しいキーを押します。ショートカットキーは Termlet が処理し、リモートには送られません。Ctrl または Alt との組み合わせが必要です（F1～F24 と、Shift と Insert、Delete、Home、End、PageUp、PageDown の組み合わせを除く）。
  ko: +를 클릭한 후 새 키를 누르세요. 바로 가기 키는 Termlet이 처리하며 원격으로 보내지 않습니다. Ctrl 또는 Alt와 함께 눌러야 합니다(F1~F24, 그리고 Shift와 Insert, Delete, Home, End, PageUp, PageDown의 조합은 예외).
