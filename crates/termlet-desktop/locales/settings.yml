settings.nav.known_hosts:
  zh-CN: 主机指纹
  en: Host Keys
  zh-TW: 主機指紋
  ja: ホストキー
  ko: 호스트 키
known_hosts.description:
  zh-CN: 首次连接一台服务器时会请你确认它的指纹并记录在这里；之后指纹不一致会阻断连接，防止中间人攻击。只有在确认服务器确实重装或更换了密钥后才删除记录，下次连接时会再次请你确认。
  en: The first time you connect to a server you're asked to confirm its key fingerprint, which is recorded here. A different fingerprint later blocks the connection to prevent man-in-the-middle attacks. Only delete a record after confirming the server was reinstalled or its key changed; you'll be asked to confirm again next time.
  zh-TW: 首次連線到一台伺服器時會請你確認它的指紋並記錄在這裡；之後指紋不一致會阻擋連線，防止中間人攻擊。只有在確認伺服器確實重新安裝或更換了金鑰後才刪除記錄，下次連線時會再次請你確認。
  ja: サーバーに初めて接続するときにフィンガープリントの確認を求め、ここに記録します。以後フィンガープリントが一致しない場合は接続を遮断し、中間者攻撃を防ぎます。記録を削除するのは、サーバーが再インストールされたり鍵が変更されたりしたことを確認した場合だけにしてください。次回の接続時にもう一度確認を求めます。
  ko: 서버에 처음 연결할 때 지문을 확인하도록 요청하고 여기에 기록합니다. 이후 지문이 일치하지 않으면 연결을 차단하여 중간자 공격을 막습니다. 서버를 다시 설치했거나 키를 바꾼 것이 확실할 때만 기록을 삭제하세요. 다음 연결 시 다시 확인을 요청합니다.
known_hosts.search:
  zh-CN: 搜索地址、主机名或指纹
  en: Search addresses, host names or fingerprints
  zh-TW: 搜尋位址、主機名稱或指紋
  ja: アドレス、ホスト名、フィンガープリントを検索
  ko: 주소, 호스트 이름 또는 지문 검색
known_hosts.empty:
  zh-CN: 还没有记录任何主机指纹。
  en: No host keys recorded yet.
  zh-TW: 還沒有記錄任何主機指紋。
  ja: 記録されたホストキーはまだありません。
  ko: 아직 기록된 호스트 키가 없습니다.
known_hosts.used_by:
  zh-CN: 用于：%{names}
  en: "Used by: %{names}"
  zh-TW: 用於：%{names}
  ja: 使用中：%{names}
  ko: "사용 중: %{names}"
known_hosts.unused:
  zh-CN: 没有主机使用这个地址
  en: No host uses this address
  zh-TW: 沒有主機使用這個位址
  ja: このアドレスを使っているホストはありません
  ko: 이 주소를 사용하는 호스트가 없습니다
known_hosts.delete:
  zh-CN: 删除记录
  en: Delete record
  zh-TW: 刪除記錄
  ja: 記録を削除
  ko: 기록 삭제
known_hosts.delete_title:
  zh-CN: 删除 %{host} 的这条指纹记录吗？
  en: Delete this host key record for %{host}?
  zh-TW: 要刪除 %{host} 的這筆指紋記錄嗎？
  ja: "%{host} のこのホストキーの記録を削除しますか？"
  ko: "%{host}의 이 호스트 키 기록을 삭제하시겠습니까?"
known_hosts.delete_description:
  zh-CN: 下次连接时会重新请你确认指纹。如果服务器并没有更换密钥、指纹却变了，可能是中间人攻击，请不要删除。
  en: You'll be asked to confirm the fingerprint again next time. If the server didn't change its key but the fingerprint changed, it may be a man-in-the-middle attack, so don't delete it.
  zh-TW: 下次連線時會重新請你確認指紋。如果伺服器並沒有更換金鑰、指紋卻變了，可能是中間人攻擊，請不要刪除。
  ja: 次回の接続時にフィンガープリントの確認をもう一度求めます。サーバーの鍵を変更していないのにフィンガープリントが変わった場合は、中間者攻撃の可能性があるため削除しないでください。
  ko: 다음 연결 시 지문을 다시 확인하도록 요청합니다. 서버가 키를 바꾸지 않았는데 지문이 바뀌었다면 중간자 공격일 수 있으니 삭제하지 마세요.
known_hosts.ca_title:
  zh-CN: 信任的主机 CA
  en: Trusted Host CAs
  zh-TW: 信任的主機 CA
  ja: 信頼するホスト CA
  ko: 신뢰하는 호스트 CA
known_hosts.ca_description:
  zh-CN: 这些 CA 签发的主机证书在第一次连接时不再询问指纹（与 OpenSSH known_hosts 中的 @cert-authority 相同）；其他 CA 的证书照常按指纹询问。只在这台电脑上，不同步。
  en: Host certificates issued by these CAs are accepted on first connection without asking about the fingerprint (like @cert-authority in OpenSSH known_hosts); certificates from other CAs are confirmed by fingerprint as usual. Stored on this computer only and not synced.
  zh-TW: 這些 CA 簽發的主機憑證在第一次連線時不再詢問指紋（與 OpenSSH known_hosts 中的 @cert-authority 相同）；其他 CA 的憑證照常依指紋詢問。只存在這台電腦上，不同步。
  ja: これらの CA が発行したホスト証明書は、初回接続時にフィンガープリントを確認せずに受け入れます（OpenSSH の known_hosts の @cert-authority と同じ）。ほかの CA の証明書は通常どおりフィンガープリントで確認します。このコンピューターにのみ保存され、同期されません。
  ko: 이 CA가 발급한 호스트 인증서는 처음 연결할 때 지문을 묻지 않고 받아들입니다(OpenSSH known_hosts의 @cert-authority와 같음). 다른 CA의 인증서는 평소처럼 지문으로 확인합니다. 이 컴퓨터에만 저장되며 동기화되지 않습니다.
known_hosts.ca_empty:
  zh-CN: 没有信任的主机 CA。
  en: No trusted host CAs.
  zh-TW: 沒有信任的主機 CA。
  ja: 信頼するホスト CA はありません。
  ko: 신뢰하는 호스트 CA가 없습니다.
known_hosts.ca_add:
  zh-CN: 添加
  en: Add
  zh-TW: 新增
  ja: 追加
  ko: 추가
known_hosts.ca_import:
  zh-CN: 从 known_hosts 导入
  en: Import from known_hosts
  zh-TW: 從 known_hosts 匯入
  ja: known_hosts からインポート
  ko: known_hosts에서 가져오기
known_hosts.ca_hosts:
  zh-CN: 适用的主机：%{hosts}
  en: "Applies to: %{hosts}"
  zh-TW: 適用的主機：%{hosts}
  ja: 対象ホスト：%{hosts}
  ko: "적용 대상 호스트: %{hosts}"
known_hosts.ca_delete:
  zh-CN: 不再信任
  en: Stop Trusting
  zh-TW: 不再信任
  ja: 信頼を解除
  ko: 신뢰 해제
known_hosts.ca_delete_title:
  zh-CN: 不再信任适用于 %{hosts} 的主机 CA 吗？
  en: Stop trusting the host CA for %{hosts}?
  zh-TW: 要不再信任適用於 %{hosts} 的主機 CA 嗎？
  ja: "%{hosts} に適用されるホスト CA の信頼を解除しますか？"
  ko: "%{hosts}에 적용되는 호스트 CA의 신뢰를 해제하시겠습니까?"
known_hosts.ca_delete_description:
  zh-CN: 之后这些主机出示的证书不再免去指纹确认；已记录的主机指纹不受影响。
  en: Certificates from these hosts will no longer skip fingerprint confirmation. Recorded host keys aren't affected.
  zh-TW: 之後這些主機出示的憑證不再免去指紋確認；已記錄的主機指紋不受影響。
  ja: 以後、これらのホストが提示する証明書でもフィンガープリントの確認を求めます。記録済みのホストキーには影響しません。
  ko: 이후 이 호스트가 제시하는 인증서도 지문 확인을 거칩니다. 기록된 호스트 키에는 영향이 없습니다.
known_hosts.ca_add_title:
  zh-CN: 信任主机 CA
  en: Trust a Host CA
  zh-TW: 信任主機 CA
  ja: ホスト CA を信頼
  ko: 호스트 CA 신뢰
known_hosts.ca_add_hint:
  zh-CN: 填写适用的主机名模式（逗号分隔，可用 * 与 ?，22 以外的端口写 [host]:port），粘贴 CA 的公钥；也可以直接粘贴 known_hosts 中的一整行 @cert-authority。
  en: "Enter the host patterns it applies to (comma-separated, * and ? allowed, write [host]:port for ports other than 22) and paste the CA's public key, or paste a whole @cert-authority line from known_hosts."
  zh-TW: 填寫適用的主機名稱模式（以逗號分隔，可用 * 與 ?，22 以外的連接埠寫 [host]:port），貼上 CA 的公開金鑰；也可以直接貼上 known_hosts 中的一整行 @cert-authority。
  ja: 対象とするホスト名のパターン（カンマ区切り、* と ? を使用可、22 以外のポートは [host]:port）を入力し、CA の公開鍵を貼り付けてください。known_hosts の @cert-authority 行をそのまま貼り付けることもできます。
  ko: "적용할 호스트 이름 패턴(쉼표로 구분, *와 ? 사용 가능, 22 이외의 포트는 [host]:port)을 입력하고 CA의 공개 키를 붙여넣으세요. known_hosts의 @cert-authority 줄 전체를 그대로 붙여넣을 수도 있습니다."
known_hosts.ca_hosts_placeholder:
  zh-CN: 主机名模式，例如 *.example.com,[10.0.0.5]:2222
  en: Host patterns, e.g. *.example.com,[10.0.0.5]:2222
  zh-TW: 主機名稱模式，例如 *.example.com,[10.0.0.5]:2222
  ja: ホスト名のパターン（例：*.example.com,[10.0.0.5]:2222）
  ko: "호스트 이름 패턴(예: *.example.com,[10.0.0.5]:2222)"
known_hosts.ca_key_placeholder:
  zh-CN: CA 的公钥（ssh-ed25519 AAAA…），或一整行 @cert-authority
  en: The CA's public key (ssh-ed25519 AAAA…) or a whole @cert-authority line
  zh-TW: CA 的公開金鑰（ssh-ed25519 AAAA…），或一整行 @cert-authority
  ja: CA の公開鍵（ssh-ed25519 AAAA…）、または @cert-authority の行全体
  ko: CA의 공개 키(ssh-ed25519 AAAA…) 또는 @cert-authority 줄 전체
known_hosts.ca_invalid_hosts:
  zh-CN: 请填写主机名模式（不能含空格）。
  en: Enter the host patterns (without spaces).
  zh-TW: 請填寫主機名稱模式（不能含空格）。
  ja: ホスト名のパターンを入力してください（空白は使用できません）。
  ko: 호스트 이름 패턴을 입력하세요(공백은 사용할 수 없습니다).
known_hosts.ca_invalid_key:
  zh-CN: 不是有效的公钥。
  en: That isn't a valid public key.
  zh-TW: 不是有效的公開金鑰。
  ja: 有効な公開鍵ではありません。
  ko: 올바른 공개 키가 아닙니다.
known_hosts.ca_trust:
  zh-CN: 信任
  en: Trust
  zh-TW: 信任
  ja: 信頼
  ko: 신뢰
known_hosts.ca_imported:
  zh-CN: 导入了 %{added} 个 CA（已有 %{existing} 个，%{invalid} 行无法识别）。
  en: Imported %{added} CAs (%{existing} already present, %{invalid} lines not recognized).
  zh-TW: 匯入了 %{added} 個 CA（已有 %{existing} 個，%{invalid} 行無法識別）。
  ja: CA を %{added} 個インポートしました（既存 %{existing} 個、認識できない行 %{invalid} 行）。
  ko: CA %{added}개를 가져왔습니다(이미 있음 %{existing}개, 인식할 수 없는 줄 %{invalid}줄).
known_hosts.ca_import_none:
  zh-CN: 这个文件中没有 @cert-authority 行。
  en: This file has no @cert-authority lines.
  zh-TW: 這個檔案中沒有 @cert-authority 行。
  ja: このファイルには @cert-authority 行がありません。
  ko: 이 파일에는 @cert-authority 줄이 없습니다.
known_hosts.ca_import_failed:
  zh-CN: 读取 known_hosts 失败：%{error}
  en: "Couldn't read known_hosts: %{error}"
  zh-TW: 讀取 known_hosts 失敗：%{error}
  ja: known_hosts を読み込めませんでした：%{error}
  ko: "known_hosts를 읽지 못했습니다: %{error}"
known_hosts.ca_file_too_large:
  zh-CN: 文件过大
  en: the file is too large
  zh-TW: 檔案過大
  ja: ファイルが大きすぎます
  ko: 파일이 너무 큽니다
settings.external_launch:
  zh-CN: 被堡垒机等外部程序调起
  en: Opened by bastion hosts and other programs
  zh-TW: 由堡壘主機等外部程式啟動
  ja: 要塞ホストなどの外部プログラムからの起動
  ko: 배스천 호스트 등 외부 프로그램에서 시작
settings.external_launch_hint:
  zh-CN: JumpServer、绿盟 OSMS 等堡垒机用 Xshell、PuTTY、SecureCRT、MobaXterm、WinSCP、Xftp 的启动参数调起本地客户端：在堡垒机的本地客户端设置中把其中一个软件的路径换成 Termlet 即可。打开的是临时连接，不保存到主机列表。
  en: Bastion hosts such as JumpServer and NSFOCUS OSMS launch local clients with Xshell, PuTTY, SecureCRT, MobaXterm, WinSCP or Xftp arguments. Point one of those client paths in the bastion host's settings to Termlet. The connection opens as a temporary one and isn't saved to the host list.
  zh-TW: JumpServer、綠盟 OSMS 等堡壘主機用 Xshell、PuTTY、SecureCRT、MobaXterm、WinSCP、Xftp 的啟動參數呼叫本機用戶端：在堡壘主機的本機用戶端設定中把其中一個軟體的路徑換成 Termlet 即可。開啟的是臨時連線，不會儲存到主機清單。
  ja: JumpServer や NSFOCUS OSMS などの要塞ホストは、Xshell、PuTTY、SecureCRT、MobaXterm、WinSCP、Xftp の起動引数でローカルのクライアントを起動します。要塞ホストのローカルクライアント設定で、いずれかのソフトウェアのパスを Termlet に置き換えてください。開かれるのは一時的な接続で、ホスト一覧には保存されません。
  ko: JumpServer, NSFOCUS OSMS 등의 배스천 호스트는 Xshell, PuTTY, SecureCRT, MobaXterm, WinSCP, Xftp의 시작 인수로 로컬 클라이언트를 실행합니다. 배스천 호스트의 로컬 클라이언트 설정에서 이 중 하나의 경로를 Termlet으로 바꾸면 됩니다. 열리는 연결은 임시 연결이며 호스트 목록에 저장되지 않습니다.
settings.x11_display:
  zh-CN: 本机的 X 显示（X11 转发）
  en: Local X display (X11 forwarding)
  zh-TW: 本機的 X 顯示（X11 轉送）
  ja: ローカルの X ディスプレイ（X11 転送）
  ko: 로컬 X 디스플레이(X11 포워딩)
settings.x11_display_placeholder:
  zh-CN: 留空时用 %{display}
  en: Leave empty to use %{display}
  zh-TW: 留空時使用 %{display}
  ja: 空欄の場合は %{display} を使用
  ko: 비워 두면 %{display} 사용
settings.x11_display_hint:
  zh-CN: 开启了 X11 转发的主机把图形程序显示到这里，只对这台电脑生效。localhost:0 是本机的 TCP 6000 端口（VcXsrv、X410 的默认）；Linux、macOS 上也可以写 :0。
  en: Hosts with X11 forwarding show their graphical programs here. This applies to this computer only. localhost:0 is TCP port 6000 on this computer (the default for VcXsrv and X410); on Linux and macOS you can also use :0.
  zh-TW: 開啟了 X11 轉送的主機把圖形程式顯示到這裡，只對這台電腦生效。localhost:0 是本機的 TCP 6000 連接埠（VcXsrv、X410 的預設）；Linux、macOS 上也可以寫 :0。
  ja: X11 転送を有効にしたホストのグラフィカルなプログラムをここに表示します。このコンピューターだけに適用されます。localhost:0 はこのコンピューターの TCP 6000 番ポートです（VcXsrv、X410 のデフォルト）。Linux や macOS では :0 とも書けます。
  ko: X11 포워딩을 켠 호스트의 그래픽 프로그램을 여기에 표시합니다. 이 컴퓨터에만 적용됩니다. localhost:0은 이 컴퓨터의 TCP 6000번 포트입니다(VcXsrv, X410의 기본값). Linux, macOS에서는 :0이라고 써도 됩니다.
settings.proxy_commands:
  zh-CN: 代理命令
  en: Proxy commands
  zh-TW: 代理指令
  ja: プロキシコマンド
  ko: 프록시 명령
settings.proxy_commands_hint:
  zh-CN: 主机的代理命令在这台电脑上第一次执行前要你确认；确认过的记在这台电脑上，不随云同步。
  en: You're asked to confirm a host's proxy command before it first runs on this computer. Confirmations are kept on this computer and aren't synced.
  zh-TW: 主機的代理指令在這台電腦上第一次執行前要你確認；確認過的記在這台電腦上，不隨雲端同步。
  ja: ホストのプロキシコマンドは、このコンピューターで初めて実行する前に確認を求めます。確認済みの記録はこのコンピューターに保存され、クラウド同期の対象にはなりません。
  ko: 호스트의 프록시 명령은 이 컴퓨터에서 처음 실행하기 전에 확인을 요청합니다. 확인한 기록은 이 컴퓨터에 저장되며 클라우드 동기화되지 않습니다.
settings.proxy_commands_none:
  zh-CN: 还没有确认过代理命令
  en: No proxy commands confirmed yet
  zh-TW: 還沒有確認過代理指令
  ja: 確認済みのプロキシコマンドはまだありません
  ko: 아직 확인한 프록시 명령이 없습니다
settings.proxy_commands_count:
  zh-CN: 这台电脑上确认过 %{count} 条
  en: "%{count} confirmed on this computer"
  zh-TW: 這台電腦上確認過 %{count} 條
  ja: このコンピューターで %{count} 件を確認済み
  ko: 이 컴퓨터에서 %{count}개 확인함
settings.proxy_commands_forget:
  zh-CN: 全部重新询问
  en: Ask again for all
  zh-TW: 全部重新詢問
  ja: すべて再確認する
  ko: 모두 다시 묻기
settings.proxy_commands_forgotten:
  zh-CN: 已清除：代理命令下次执行前会重新询问。
  en: Cleared. Proxy commands will be confirmed again before they next run.
  zh-TW: 已清除：代理指令下次執行前會重新詢問。
  ja: クリアしました。プロキシコマンドは次回の実行前にもう一度確認します。
  ko: 지웠습니다. 프록시 명령은 다음 실행 전에 다시 확인합니다.
settings.external_launch_ask:
  zh-CN: 每次询问
  en: Ask each time
  zh-TW: 每次詢問
  ja: 毎回確認
  ko: 매번 묻기
settings.external_launch_allow:
  zh-CN: 直接打开
  en: Open directly
  zh-TW: 直接開啟
  ja: そのまま開く
  ko: 바로 열기
settings.external_launch_off:
  zh-CN: 忽略
  en: Ignore
  zh-TW: 忽略
  ja: 無視
  ko: 무시
settings.monitor:
  zh-CN: 在终端底部显示服务器的资源使用情况
  en: Show the server's resource usage at the bottom of the terminal
  zh-TW: 在終端機底部顯示伺服器的資源使用狀況
  ja: ターミナルの下部にサーバーのリソース使用状況を表示
  ko: 터미널 하단에 서버의 리소스 사용 현황 표시
settings.monitor_hint:
  zh-CN: Linux 服务器与 WSL；只读取，不在服务器上留下任何东西。
  en: Linux servers and WSL. Read-only; nothing is left on the server.
  zh-TW: Linux 伺服器與 WSL；只讀取，不在伺服器上留下任何東西。
  ja: Linux サーバーと WSL が対象です。読み取るだけで、サーバーには何も残しません。
  ko: Linux 서버와 WSL이 대상입니다. 읽기만 하며 서버에 아무것도 남기지 않습니다.
settings.monitor_bar.label:
  zh-CN: 状态条
  en: Status bar
  zh-TW: 狀態列
  ja: ステータスバー
  ko: 상태 표시줄
settings.monitor_bar.hint:
  zh-CN: 精简时平时只显示延迟、CPU 与内存，磁盘或负载偏高时才出现；在状态条上右键也可以切换
  en: Compact shows only latency, CPU and memory, adding disk or load when they run high. You can also switch by right-clicking the status bar
  zh-TW: 精簡時平時只顯示延遲、CPU 與記憶體，磁碟或負載偏高時才出現；在狀態列上按右鍵也可以切換
  ja: 「簡易」では普段は遅延、CPU、メモリだけを表示し、ディスクや負荷が高いときにだけそれらも表示します。ステータスバーを右クリックしても切り替えられます
  ko: "'간단히'에서는 평소에 지연 시간, CPU, 메모리만 표시하고 디스크나 부하가 높을 때만 함께 표시합니다. 상태 표시줄을 오른쪽 클릭해도 전환할 수 있습니다"
settings.nav.backup:
  zh-CN: 备份
  en: Backup
  zh-TW: 備份
  ja: バックアップ
  ko: 백업
settings.local_proxy:
  zh-CN: 本机代理（借给服务器）
  en: Local proxy (to lend to servers)
  zh-TW: 本機代理（借給伺服器）
  ja: ローカルプロキシ（サーバーと共有）
  ko: 로컬 프록시(서버와 공유)
settings.local_proxy_hint:
  zh-CN: 终端 Tab 菜单中的“把本机代理借给服务器”借出的就是这个 HTTP 代理。只对这台电脑生效；留空时用系统代理（现在是：%{system}）。
  en: "\"Lend Local Proxy to the Server\" in the terminal tab menu lends this HTTP proxy. Applies to this computer only; leave empty to use the system proxy (currently: %{system})."
  zh-TW: 終端機分頁選單中的「把本機代理借給伺服器」借出的就是這個 HTTP 代理。只對這台電腦生效；留空時使用系統代理（目前是：%{system}）。
  ja: ターミナルのタブメニューの「ローカルプロキシをサーバーと共有」で、この HTTP プロキシをサーバーに貸し出します。このコンピューターだけに適用されます。空欄の場合はシステムのプロキシを使います（現在：%{system}）。
  ko: "터미널 탭 메뉴의 '서버와 로컬 프록시 공유'로 이 HTTP 프록시를 서버에 빌려줍니다. 이 컴퓨터에만 적용됩니다. 비워 두면 시스템 프록시를 사용합니다(현재: %{system})."
settings.local_proxy_none:
  zh-CN: 没有
  en: none
  zh-TW: 沒有
  ja: なし
  ko: 없음
settings.local_proxy_placeholder:
  zh-CN: 例如 127.0.0.1:7890
  en: e.g. 127.0.0.1:7890
  zh-TW: 例如 127.0.0.1:7890
  ja: 例：127.0.0.1:7890
  ko: "예: 127.0.0.1:7890"
settings.local_proxy_port:
  zh-CN: 借给服务器时服务器上的端口
  en: Server port for the lent proxy
  zh-TW: 借給伺服器時伺服器上的連接埠
  ja: 共有時のサーバー側のポート
  ko: 공유할 때 서버의 포트
settings.local_proxy_port_placeholder:
  zh-CN: 留空时由服务器选
  en: Leave empty to let the server pick
  zh-TW: 留空時由伺服器選擇
  ja: 空欄の場合はサーバーが選択
  ko: 비워 두면 서버가 선택
settings.local_proxy_port_hint:
  zh-CN: 服务器上监听在 127.0.0.1 的这个端口。要把代理写进 apt、Docker 等的配置时，填一个固定的端口更方便。
  en: The server listens on this port at 127.0.0.1. Use a fixed port if you write the proxy into apt, Docker or other settings.
  zh-TW: 伺服器在 127.0.0.1 上監聽這個連接埠。要把代理寫進 apt、Docker 等的設定時，填一個固定的連接埠比較方便。
  ja: サーバーは 127.0.0.1 のこのポートで待ち受けます。apt や Docker などの設定にプロキシを書き込む場合は、固定のポートを指定すると便利です。
  ko: 서버가 127.0.0.1의 이 포트에서 수신 대기합니다. apt, Docker 등의 설정에 프록시를 적어 두려면 고정 포트를 지정하는 것이 편리합니다.
settings.error.local_proxy:
  zh-CN: 本机代理的地址不对：%{address}。请写成“主机:端口”（只支持 HTTP 代理），或者留空。
  en: "The local proxy address isn't valid: %{address}. Use \"host:port\" (HTTP proxies only) or leave it empty."
  zh-TW: 本機代理的位址不正確：%{address}。請寫成「主機:連接埠」（只支援 HTTP 代理），或者留空。
  ja: ローカルプロキシのアドレスが正しくありません：%{address}。「ホスト:ポート」の形式で入力するか（HTTP プロキシのみ対応）、空欄にしてください。
  ko: "로컬 프록시 주소가 올바르지 않습니다: %{address}. '호스트:포트' 형식으로 입력하거나(HTTP 프록시만 지원) 비워 두세요."
settings.error.local_proxy_port:
  zh-CN: 借给服务器的代理端口不对：%{port}。请填 1–65535，或者留空。
  en: "The port for lending the local proxy isn't valid: %{port}. Enter 1–65535 or leave it empty."
  zh-TW: 借給伺服器的代理連接埠不正確：%{port}。請填 1–65535，或者留空。
  ja: 共有時のポートが正しくありません：%{port}。1～65535 を入力するか、空欄にしてください。
  ko: "공유할 때 사용할 포트가 올바르지 않습니다: %{port}. 1~65535를 입력하거나 비워 두세요."
settings.record_input:
  zh-CN: "会话录制同时录制输入"
  en: "Also record input in session recordings"
  zh-TW: "工作階段錄製同時錄製輸入"
  ja: "セッションの録画で入力も記録"
  ko: "세션 녹화 시 입력도 녹화"
settings.record_input_hint:
  zh-CN: "会话录制默认只记终端的输出（Tab 的菜单中开始、停止）；开启后连同键入与粘贴的内容一起记下。应用代填的 sudo 密码不记。"
  en: "Session recordings capture only the terminal's output by default (start and stop them from the tab menu). When this is on, what you type and paste is recorded too. Saved sudo passwords filled in by the app are not recorded."
  zh-TW: "工作階段錄製預設只記終端機的輸出（在分頁的選單中開始、停止）；開啟後連同鍵入與貼上的內容一起記下。應用程式代填的 sudo 密碼不記。"
  ja: "セッションの録画は既定ではターミナルの出力だけを記録します（タブのメニューから開始・停止）。オンにすると、入力や貼り付けた内容も記録します。アプリが入力した sudo のパスワードは記録しません。"
  ko: "세션 녹화는 기본적으로 터미널의 출력만 기록합니다(탭 메뉴에서 시작, 중지). 켜면 입력하고 붙여 넣은 내용도 함께 기록합니다. 앱이 대신 입력한 sudo 비밀번호는 기록하지 않습니다."
settings.record_input_warning:
  zh-CN: "录制文件中会有你输入的全部内容，包括不显示在屏幕上的密码。只在需要时开启，并妥善保管录制文件。"
  en: "Recordings will contain everything you type, including passwords that are not shown on screen. Turn this on only when needed and keep the recordings safe."
  zh-TW: "錄製檔中會有你輸入的全部內容，包括不顯示在畫面上的密碼。只在需要時開啟，並妥善保管錄製檔。"
  ja: "録画ファイルには入力したすべての内容（画面に表示されないパスワードを含む）が記録されます。必要なときだけオンにし、録画ファイルは大切に保管してください。"
  ko: "녹화 파일에는 화면에 표시되지 않는 비밀번호를 포함해 입력한 모든 내용이 기록됩니다. 필요할 때만 켜고 녹화 파일을 안전하게 보관하세요."
settings.record_dir:
  zh-CN: "录制文件的目录"
  en: "Recordings folder"
  zh-TW: "錄製檔的目錄"
  ja: "録画ファイルのフォルダー"
  ko: "녹화 파일 폴더"
settings.record_dir_hint:
  zh-CN: "保存为 asciicast（.cast）文件，文件名为主机名与开始的时间；可以在 Termlet 中回放，也可以用 asciinema 播放。"
  en: "Recordings are saved as asciicast (.cast) files named after the host and the start time. Play them in Termlet or with asciinema."
  zh-TW: "儲存為 asciicast（.cast）檔案，檔名為主機名稱與開始的時間；可以在 Termlet 中重播，也可以用 asciinema 播放。"
  ja: "asciicast（.cast）ファイルとして保存し、ファイル名はホスト名と開始時刻になります。Termlet や asciinema で再生できます。"
  ko: "asciicast(.cast) 파일로 저장하며 파일 이름은 호스트 이름과 시작 시간입니다. Termlet이나 asciinema로 재생할 수 있습니다."
settings.record_dir_default:
  zh-CN: "数据目录下的 recordings"
  en: "recordings in the data folder"
  zh-TW: "資料目錄下的 recordings"
  ja: "データフォルダー内の recordings"
  ko: "데이터 폴더의 recordings"
