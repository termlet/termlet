  zh-CN: 便携版的数据保存在程序旁边的 data 文件夹，整个 Termlet 文件夹可以一起带走。删除程序旁边的 portable.txt 后，数据改为保存在系统的默认位置（不会自动搬过去）。
  en: The portable version keeps its data in the data folder next to the program, so you can take the whole Termlet folder with you. If you delete portable.txt next to the program, data is kept in the system's default location instead (existing data isn't moved).
  zh-TW: 可攜版的資料儲存在程式旁的 data 資料夾，整個 Termlet 資料夾可以一起帶走。刪除程式旁的 portable.txt 後，資料改為儲存在系統的預設位置（不會自動搬移過去）。
  ja: ポータブル版のデータはプログラムと同じ場所の data フォルダーに保存されるため、Termlet フォルダーごと持ち運べます。プログラムと同じ場所にある portable.txt を削除すると、データはシステムのデフォルトの場所に保存されるようになります（既存のデータは自動では移動しません）。
