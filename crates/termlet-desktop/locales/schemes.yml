  ko: "'%{name}' 색 구성표를 삭제하시겠습니까?"
schemes.delete_in_use:
  zh-CN: 有 %{hosts} 台主机、%{groups} 个分组使用这套配色，保存设置后它们改回跟随全局设置。
  en: "%{hosts} host(s) and %{groups} group(s) use this scheme. After you save the settings, they follow the global setting again."
  zh-TW: 有 %{hosts} 台主機、%{groups} 個群組使用這套配色，儲存設定後它們會改回跟隨全域設定。
  ja: "%{hosts} 台のホストと %{groups} 個のグループがこの配色を使用しています。設定を保存すると、これらは全体の設定に従うように戻ります。"
  ko: 호스트 %{hosts}대와 그룹 %{groups}개가 이 색 구성표를 사용하고 있습니다. 설정을 저장하면 이들은 다시 전역 설정을 따릅니다.
schemes.delete_unsaved:
  zh-CN: 保存设置后才会真正删除。
  en: It's deleted when you save the settings.
  zh-TW: 儲存設定後才會真正刪除。
  ja: 設定を保存したときに削除されます。
  ko: 설정을 저장해야 실제로 삭제됩니다.
schemes.imported:
  zh-CN: 已导入 %{count} 套配色，保存设置后生效
  en: "Schemes imported: %{count}. They take effect when you save the settings."
  zh-TW: 已匯入 %{count} 套配色，儲存設定後生效
  ja: "%{count} 個の配色をインポートしました。設定を保存すると適用されます"
  ko: 색 구성표 %{count}개를 가져왔습니다. 설정을 저장하면 적용됩니다
schemes.unreadable_builtin:
  zh-CN: "%{colors}在背景上看不清。可以打开“保证文字可读”，或复制为自定义配色后调整。"
  en: "Hard to read on the background: %{colors}. Turn on “Keep text readable”, or copy the scheme as a custom one and adjust its colors."
  zh-TW: "%{colors}在背景上看不清楚。可以開啟「確保文字可讀」，或複製為自訂配色後調整。"
  ja: "%{colors}は背景上で見えにくくなっています。「文字を読みやすく保つ」をオンにするか、カスタム配色として複製して調整してください。"
  ko: "%{colors} 색이 배경에서 잘 보이지 않습니다. '텍스트 가독성 유지'를 켜거나, 사용자 지정 색 구성표로 복제한 후 조정하세요."
schemes.unreadable_custom:
  zh-CN: "%{colors}在背景上看不清。可以打开“保证文字可读”，或编辑这套配色调整颜色。"
  en: "Hard to read on the background: %{colors}. Turn on “Keep text readable”, or edit the scheme to adjust its colors."
  zh-TW: "%{colors}在背景上看不清楚。可以開啟「確保文字可讀」，或編輯這套配色調整顏色。"
  ja: "%{colors}は背景上で見えにくくなっています。「文字を読みやすく保つ」をオンにするか、この配色を編集して色を調整してください。"
  ko: "%{colors} 색이 배경에서 잘 보이지 않습니다. '텍스트 가독성 유지'를 켜거나, 이 색 구성표를 편집해 색을 조정하세요."
