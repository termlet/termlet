schemes.picker.note_host:
  zh-CN: 这个终端使用主机设置的配色，修改全局配色不会改变它；可以勾选“只用于这个 Tab”
  en: This terminal uses its host's scheme, so changing the global scheme won't affect it. Check “Only this tab” instead.
