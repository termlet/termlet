  zh-TW: 這個終端機使用群組設定的配色，變更全域配色不會改變它；可以勾選「只用於這個分頁」
  ja: このターミナルはグループで設定した配色を使用しているため、全体の配色を変更しても変わりません。「このタブのみ」をチェックしてください
