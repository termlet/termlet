schemes.terminal_field_hint:
  zh-CN: 在“终端配色”中设置浅色、深色界面各用哪套配色。
  en: Choose the schemes for light and dark mode in Color Schemes.
  zh-TW: 在「終端機配色」中設定淺色、深色介面各用哪套配色。
  ja: ライトモードとダークモードでそれぞれ使う配色は「ターミナルの配色」で設定します。
  ko: 라이트 모드와 다크 모드에서 각각 사용할 색 구성표는 '터미널 색 구성표'에서 설정합니다.
