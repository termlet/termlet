schemes.editor.hint:
  zh-CN: "每种颜色可以用色块选择，或填写 #rrggbb。右侧的示例实时显示效果，并标出看不清的颜色。"
  en: "Pick each color from its swatch or enter #rrggbb. The sample on the right updates as you edit and marks hard-to-read colors."
  zh-TW: "每種顏色可以用色塊選擇，或填寫 #rrggbb。右側的範例即時顯示效果，並標出看不清楚的顏色。"
  ja: 各色は色見本から選ぶか、#rrggbb で入力します。右側の例に結果がすぐに表示され、見えにくい色には印が付きます。
  ko: "각 색은 색 견본에서 고르거나 #rrggbb로 입력합니다. 오른쪽 예시에 결과가 바로 표시되고, 잘 보이지 않는 색이 표시됩니다."
