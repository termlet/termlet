schemes.slots_hint:
  zh-CN: 界面在浅色、深色之间切换时，终端跟着换成对应的配色。主机、分组可以另外指定固定的配色。
  en: When the interface switches between light and dark, terminals switch to the matching scheme. Hosts and groups can set a fixed scheme of their own.
  zh-TW: 介面在淺色、深色之間切換時，終端機隨之換成對應的配色。主機、群組可以另外指定固定的配色。
  ja: 画面がライトとダークで切り替わると、ターミナルも対応する配色に切り替わります。ホストやグループには固定の配色を別に指定できます。
  ko: 화면이 라이트와 다크 사이에서 전환되면 터미널도 해당 색 구성표로 바뀝니다. 호스트와 그룹에는 고정 색 구성표를 따로 지정할 수 있습니다.
schemes.unknown:
  zh-CN: 不认识的配色（%{id}），使用默认配色
  en: Unknown scheme (%{id}), using the default
  zh-TW: 無法辨識的配色（%{id}），使用預設配色
  ja: 不明な配色（%{id}）のため、デフォルトの配色を使用します
  ko: 알 수 없는 색 구성표(%{id})이므로 기본 색 구성표를 사용합니다
schemes.min_contrast:
  zh-CN: 保证文字可读
  en: Keep text readable
  zh-TW: 確保文字可讀
  ja: 文字を読みやすく保つ
  ko: 텍스트 가독성 유지
schemes.min_contrast_hint:
  zh-CN: 自动调亮或调暗与背景对比度不足的文字（至少 4.5:1）。导入的配色有看不清的颜色时打开。
  en: Automatically lightens or darkens text that has too little contrast with the background (at least 4.5:1). Turn it on when an imported scheme has hard-to-read colors.
  zh-TW: 自動調亮或調暗與背景對比度不足的文字（至少 4.5:1）。匯入的配色有看不清楚的顏色時開啟。
  ja: 背景とのコントラストが足りない文字を自動的に明るく、または暗くします（4.5:1 以上）。インポートした配色に見えにくい色があるときにオンにします。
  ko: 배경과의 대비가 부족한 텍스트를 자동으로 밝게 또는 어둡게 조정합니다(최소 4.5:1). 가져온 색 구성표에 잘 보이지 않는 색이 있을 때 켜세요.
