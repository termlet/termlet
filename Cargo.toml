[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/termlet-desktop"]

[workspace.package]
version = "0.3.3"
edition = "2024"
authors = ["ruan"]
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
termlet-proto = { path = "crates/termlet-proto" }
termlet-mcp = { path = "crates/termlet-mcp" }
termlet-core = { path = "crates/termlet-core" }
termlet-terminal = { path = "crates/termlet-terminal" }
termlet-io = { path = "crates/termlet-io" }

# 界面：gpui-kit 一个依赖带来 GPUI、gpui-base、gpui-component 与默认图标。
# gpui-kit 每个版本都精确固定了 gpui-pre 快照，升级时整体一起升，不要单独 cargo update。
gpui-kit = "=0.8.1"
# 与 gpui-kit 用同一个多语言库（版本一致才共用同一个全局语言设置）
rust-i18n = "4.2"
sys-locale = "0.3"

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 内置 SQLite，不依赖系统库
rusqlite = { version = "0.41", features = ["bundled"] }
aes-gcm = "0.11"
argon2 = "0.6"
zeroize = { version = "1", features = ["derive"] }
keyring = "4"
dirs = "6"
data-encoding = "2"
getrandom = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tokio = "1"
# 设置 TCP keepalive（tokio 的 TcpStream 没有这项设置）
socket2 = "0.6"
windows-sys = "0.61"
windows-registry = "0.6"
# 取窗口的 HWND（GPUI 的 Window 实现了 HasWindowHandle）；与 GPUI 用同一个版本
raw-window-handle = "0.6"
# macOS 的 Objective-C 运行时（给 GPUI 的应用委托补回调、设置窗口菜单）；与 GPUI 用同一个版本
objc2 = "0.6"
# Linux 的 D-Bus（任务栏进度）；与 GPUI（ashpd）、系统凭据管理器用同一个版本，锁定版本以免引入新的包
zbus = "=5.19.0"
tempfile = "3"
# 测试中解析 Codex 的 MCP 配置片段（config.toml）；锁文件中已有这个版本（embed-resource 用），不引入新的包
toml = "1.1"

# SSH：用 ring 作加密后端（aws-lc-rs 在 Windows 上构建需要 NASM）；des 提供 3des-cbc（兼容旧设备）
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa", "des", "dsa"] }
russh-sftp = "3"
# 与 russh 精确一致的版本（russh 重导出它的类型）；getrandom 用于生成密钥
ssh-key = { version = "=0.7.0-rc.11", features = ["getrandom", "encryption", "ed25519", "rsa", "p256", "p384", "p521", "ppk"] }
# 旧格式私钥（ppk、传统加密 PEM）与 Termora 导入的解密；都与 ssh-key / russh 用的版本一致
sha1 = { version = "0.11", default-features = false }
hmac = "0.13"
md-5 = "0.11"
des = "0.9"
cbc = "0.2"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha2 = "0.11"
url = "2"
# 连接 HTTPS 代理（SSH、Telnet 经代理时）：rustls + 系统证书，不依赖 OpenSSL；更新、WebDAV 等 HTTP 请求用 reqwest
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
regex = "1"
# 本地时间（会话日志的时间戳、粘贴截图的文件名）；只开取当前时间所需的特性
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 剪贴板中的 BMP 截图转 PNG（GPUI 已依赖它，不引入新的包）
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
encoding_rs = "0.8"
# YAML（Tabby 的配置、更新的版本描述文件）：纯 Rust，没有 unsafe；与 rust-i18n 用同一个版本，只开解析
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
plist = "1"
futures = "0.3"
async-io = "2"
parking_lot = "0.12"
async-channel = "2"
unicode-width = "0.2"
alacritty_terminal = "0.26"
portable-pty = "0.9"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
type_complexity = "allow"
too_many_arguments = "allow"

[profile.dev]
debug = "limited"

# 界面渲染栈在调试构建中也开优化（gpui-kit 安装说明的建议），Termlet 自己的代码保持可调试。
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
gpui-base = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
ropey = { opt-level = 3 }
# 主密码、备份密码的 Argon2id（64MB）在未优化时要好几秒
argon2 = { opt-level = 3 }
blake2 = { opt-level = 3 }
# 导入 WindTerm 时的 PBKDF2-HMAC-SHA3-512（10 万次）在未优化时要好几秒
sha3 = { opt-level = 3 }
keccak = { opt-level = 3 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
